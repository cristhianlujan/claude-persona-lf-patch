name: LF Pack Validation Core

on:
  workflow_call:
    inputs:
      base_sha:
        description: "Exact diff base already authorized by CI Governance"
        required: true
        type: string
      head_sha:
        description: "Exact candidate head"
        required: true
        type: string
      changed_paths_json:
        description: "JSON array of repository-relative changed paths from the authorized CI plan"
        required: true
        type: string
      timeout_seconds:
        description: "Per-pack local validator timeout"
        required: false
        default: 120
        type: number

permissions:
  contents: read

jobs:
  pack-validation:
    name: Execute PACK_VALIDATION
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic pack-validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Execute clean Pack Validation flow
        env:
          LF_CHANGED_PATHS_JSON: ${{ inputs.changed_paths_json }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${{ inputs.base_sha }}" "${{ inputs.head_sha }}"
          python sandbox/lf_contract_gate_test/pack_validation_contract/run_pack_validation_flow_v1.py \
            --repo-root . \
            --validation-contract gobernanza/contratos/pack_validation_define_contract_v1.json \
            --discovery-contract gobernanza/contratos/pack_discovery_resolve_affected_packs_v1.json \
            --base-sha "${{ inputs.base_sha }}" \
            --head-sha "${{ inputs.head_sha }}" \
            --changed-paths-env LF_CHANGED_PATHS_JSON \
            --timeout-seconds "${{ inputs.timeout_seconds }}" \
            --output-dir .lf_pack_validation

      - name: Persist bounded Pack Validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-pack-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lf_pack_validation
          if-no-files-found: error
          retention-days: 30
