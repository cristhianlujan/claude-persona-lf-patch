registration_rule: >-
  This source package can be validated and sandbox-tested before the generic
  operation factory is active, but durable registration of
  LEARNING_BRIDGE_EXPERIENCE_CARD_LF remains blocked until CREACION_OPERACION_LF
  is independently approved and an OPERATION_CREATE Router binding exists. Any
  execution of the Experience bridge additionally requires the explicit
  EXPERIENCE / EXPERIENCE_LEARNING_BRIDGE Router binding; candidate validation
  never authorizes that route to become ACTIVE or write-enabled. The CARD_CREADA
  transition is separate: it is blocked until the receiver factory returns an
  exact CARD id and the same Experience execution records EKB(codigo) -> CARD(id_card)
  lineage as TRANSFORMED_TO through the governed common recorder.
claim_ceiling: >-
  PASS means only that Experience-to-Card semantics, invocation routing, evidence
  gates and future lineage handoff are coherent as a candidate source package.
  It does not authorize operation registration, Card creation, lineage DDL,
  recomposition, approval, impact, runtime activation or production.
