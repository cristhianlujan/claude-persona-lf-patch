version: v1
status: CANDIDATO_READ_ONLY
purpose: Preserve upstream product authority before downstream UI consumes competitive learning context.
chain:
  - stage: PRODUCT_DIRECTION
    consumer_id: PERFIL-PRODUCT-DIRECTOR-LF
    learning_mode: DIRECT_READ_ONLY_CONTEXT
    exact_binding_required: true
    required_before_next_stage:
      - governed_profile_runtime_receipt
      - semantic_obligation_manifest_sha256
      - product_direction_ref
      - product_direction_current
      - authority_pass
    production_impact: false
  - stage: UI_SPECIFICATION
    consumer_id: PERFIL-UI-ARCHITECT
    learning_mode: PRODUCT_DIRECTION_FIRST_COMPETITIVE_CONTEXT_SECOND
    upstream_required_consumer_id: PERFIL-PRODUCT-DIRECTOR-LF
    upstream_required_artifact: product_direction_ref
    upstream_current_required: true
    exact_binding_required: true
    competitive_context_authority_type: UPSTREAM_CONSTRAINTS
    must_not_invoke_when:
      - product_direction_missing_or_stale
      - product_scope_decision_required
      - learning_evidence_ungrounded_or_stale
      - no_exact_ui_binding
    production_impact: false
prohibitions:
  - direct_learning_to_frontend_without_product_and_ui_authority
  - direct_learning_to_gamification_without_authorized_product_or_ux_objective
  - learning_context_as_product_truth
  - automatic_promotion
  - profile_source_mutation_for_context_injection
fallback:
  product_director: NO_COMPETITIVE_CONTEXT
  ui_architect: PRODUCT_CONTEXT_ONLY_NO_COMPETITIVE_UI_PATTERN
behavioral_gate:
  required: true
  status: BENCHMARK_REQUIRED_PROFILE_RUNTIME
  same_input_runtime_model_judges: true
  champion_preserved_until_pass: true
rollback:
  action: remove learning UPSTREAM_CONSTRAINTS and retain canonical upstream authorities
