version: v1
status: CANDIDATE_READ_ONLY
operation_code: ORQUESTACION_PIPELINE_LF
source_main: 17903f544c5e53e1d94b08664a4fb6704c0dc087
principles:
  deterministic_first: true
  llm_required: false
  automatic_impact: false
  production_authorized: false
  exact_contract_binding_required: true
judges:
  - step_order: 5
    step_id: init_execution
    judge_code: MINI_JUDGE_ACT0058_INIT_EXECUTION
    pass_if: [operation_execution_exists, operation_code_matches, status_initialized]
    fail_if: [execution_missing, operation_code_mismatch]
    result_values: [EXECUTION_INITIALIZED, BLOCKED]
  - step_order: 20
    step_id: init_run
    judge_code: MINI_JUDGE_ACT0058_INIT
    pass_if: [pipeline_run_created, source_url_nonempty, dedup_24h_clear, stage_pending_capture]
    fail_if: [source_url_empty, completed_duplicate_within_24h]
    result_values: [RUN_INITIALIZED, DEDUP_BLOCKED, BLOCKED]
  - step_order: 30
    step_id: scope_filter
    judge_code: MINI_JUDGE_ACT0058_SCOPE
    pass_if: [source_domain_allowed]
    fail_if: [source_domain_out_of_scope]
    result_values: [SCOPE_ALLOWED, OUT_OF_SCOPE]
  - step_order: 50
    step_id: stage_captura
    judge_code: MINI_JUDGE_ACT0058_CAPTURA
    pass_if: [capture_run_id_present, capture_status_completed]
    fail_if: [capture_run_id_missing, capture_status_not_completed]
    result_values: [CAPTURE_COMPLETED, CAPTURE_BLOCKED]
  - step_order: 60
    step_id: stage_homolog
    judge_code: MINI_JUDGE_ACT0058_HOMOLOG
    pass_if: [homolog_record_id_present, homolog_status_aprobado]
    fail_if: [homolog_record_id_missing, homolog_status_rejected_or_null]
    result_values: [HOMOLOG_APPROVED, HOMOLOG_BLOCKED]
  - step_order: 70
    step_id: stage_analisis
    judge_code: MINI_JUDGE_ACT0058_ANALISIS
    pass_if: [decision_id_present, consumer_gate_passed_true]
    fail_if: [decision_id_missing, high_risk_gate_not_passed]
    result_values: [ANALYSIS_ALLOWED, ANALYSIS_BLOCKED]
  - step_order: 90
    step_id: stage_kb_write
    judge_code: MINI_JUDGE_ACT0058_KB_WRITE
    pass_if: [kb_id_present, consumer_gate_passed_true, hitl_triggered_false]
    fail_if: [consumer_gate_not_passed, hitl_triggered_true, kb_id_missing]
    result_values: [KB_WRITE_CONFIRMED, KB_WRITE_BLOCKED]
  - step_order: 100
    step_id: completed
    judge_code: MINI_JUDGE_ACT0058_COMPLETED
    pass_if: [stage_completed, closing_event_present]
    fail_if: [pipeline_update_failed, closing_event_missing]
    result_values: [COMPLETED_CONFIRMED, COMPLETION_BLOCKED]
  - step_order: 105
    step_id: restock_queue
    judge_code: MINI_JUDGE_ACT0058_RESTOCK
    pass_if: [new_allowed_url_inserted, queue_state_pending]
    fail_if: [no_new_allowed_url, insert_failed]
    result_values: [QUEUE_RESTOCKED, RESTOCK_NOOP, RESTOCK_BLOCKED]
  - step_order: 110
    step_id: failed_retry
    judge_code: MINI_JUDGE_ACT0058_RETRY
    pass_if: [retry_count_lte_3, error_detail_present, retry_state_recorded]
    fail_if: [retry_count_gt_3]
    result_values: [RETRY_ALLOWED, MAX_RETRY_BLOCKED]
