name: LF Migration Source Parity Core

on:
  workflow_call:
    inputs:
      base_sha:
        description: "Exact PR/pass base already resolved by CI Governance"
        required: true
        type: string
      head_sha:
        description: "Exact candidate head"
        required: true
        type: string
      base_ref:
        description: "Base branch ref used only for live currentness readback"
        required: false
        default: "main"
        type: string
      event_name:
        description: "Original pass event semantics for source-first handling"
        required: false
        default: "pull_request"
        type: string
    secrets:
      LF_SUPABASE_DB_PASSWORD:
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  migration-source-parity:
    name: Execute MIGRATION_SOURCE_PARITY
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute focal canonical Migration Source Parity flow
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/migration_source_parity/run_migration_source_parity_focal_v1.py \
            --repo-root . \
            --base-sha "${{ inputs.base_sha }}" \
            --head-sha "${{ inputs.head_sha }}" \
            --base-ref "${{ inputs.base_ref }}" \
            --event-name "${{ inputs.event_name }}" \
            --output-dir .lf_migration_source_parity

      - name: Persist bounded Migration Source Parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-migration-source-parity-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lf_migration_source_parity
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
