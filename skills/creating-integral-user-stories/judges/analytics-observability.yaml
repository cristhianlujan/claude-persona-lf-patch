judge_code: J09_ANALYTICS_OBSERVABILITY
version: v0.4
status: CANDIDATO_READ_ONLY
scope: Verifica analytics y observabilidad no vacíos, separación de auditoría, ausencia de PII, correlación y decisión
  de alertas para fallas críticas.
independence:
  author_must_not_execute_final_judge: true
  executor_identity_required: true
  accepted_executor_types:
  - DETERMINISTIC_RUNNER
  - INDEPENDENT_AGENT
  - CI_RUNNER
  self_approval_forbidden: true
retry_limit: 2
required_inputs:
- story_pack
preflight:
- check_id: input_present
  condition: story_pack is a readable UTF-8 JSON object
  on_fail: BLOCKED
- check_id: judge_version_present
  condition: --judge-version is non-empty
  on_fail: BLOCKED
- check_id: executor_identity_present
  condition: --executor-identity is non-empty
  on_fail: BLOCKED
- check_id: evidence_ref_resolvable
  condition: at least one evidence_ref is resolvable
  on_fail: BLOCKED
- check_id: independent_executor
  condition: executor_identity differs from artifact author identity
  on_fail: BLOCKED
validator:
  entrypoint: scripts/detect_pii_telemetry.py
  git_blob_sha1: 5dd42d313a6e615544f32295023943612f309e3d
  command_template: python scripts/detect_pii_telemetry.py <story_pack.json> --judge-version <git_blob_sha1> --executor-identity
    <actor> --evidence-ref <resolvable_ref>
  exit_codes:
    PASS_WITH_EVIDENCE: 0
    RETURN_TO_WORKER: 1
    FAIL: 1
    BLOCKED: 2
schema:
  ref: schemas/judge-result.schema.json
  version: v0.4
  git_blob_sha1: 80d525342ed3099dffbe2cf946b54f0b1c1e4417
  additional_properties: false
deterministic_procedure:
- order: 1
  action: Resolve and hash the input JSON; stop with BLOCKED on unreadable or invalid input.
  evidence: input_sha256
- order: 2
  action: Resolve judge version, executor identity and evidence references; stop with structured BLOCKED when absent.
  evidence: blocking_assertions
- order: 3
  action: Execute every declared check exactly once; empty critical sections are findings, never vacuous PASS.
  evidence: evidence.checks
- order: 4
  action: Map findings to result and deterministic exit code without lowering assertions or thresholds.
  evidence: result+exit_code
- order: 5
  action: Emit strict evidence envelope and calculate evidence/output SHA-256.
  evidence: evidence_sha256+output_sha256
- order: 6
  action: Validate emitted JSON against judge-result.schema.json and persist/read back evidence.
  evidence: schema_validation+readback
assertions:
- assertion_id: analytics_section_missing
  target: analytics
  pass_condition: analytics_section_missing = 0
  critical: true
  evidence_required: true
- assertion_id: analytics_events_missing
  target: analytics
  pass_condition: analytics_events_missing = 0
  critical: true
  evidence_required: true
- assertion_id: analytics_events_without_code
  target: analytics
  pass_condition: analytics_events_without_code = 0
  critical: true
  evidence_required: true
- assertion_id: observability_contract_missing
  target: observability
  pass_condition: observability_contract_missing = 0
  critical: true
  evidence_required: true
- assertion_id: analytics_events_with_pii
  target: fields+analytics
  pass_condition: analytics_events_with_pii = 0
  critical: true
  evidence_required: true
- assertion_id: logs_with_pii_without_contract
  target: fields+observability
  pass_condition: logs_with_pii_without_contract = 0
  critical: true
  evidence_required: true
- assertion_id: operations_without_correlation_id
  target: analytics
  pass_condition: operations_without_correlation_id = 0
  critical: true
  evidence_required: true
- assertion_id: audit_events_mixed_with_analytics
  target: analytics
  pass_condition: audit_events_mixed_with_analytics = 0
  critical: true
  evidence_required: true
- assertion_id: critical_failures_without_alert_decision
  target: errors+observability.alerts
  pass_condition: critical_failures_without_alert_decision = 0
  critical: true
  evidence_required: true
pass_if:
- all declared checks are empty
- blocking_assertions is empty
- compliance_bit = 1
- exit_code = 0
- evidence_refs is non-empty and resolvable
- input_sha256, evidence_sha256 and output_sha256 are valid 64-hex values
- output validates against schemas/judge-result.schema.json v0.4
return_to_worker_if:
- one or more repairable assertions fail
- repairs are actionable
- exit_code = 1
block_if:
- input or required metadata is missing
- executor is not independent
- evidence reference is unresolvable
- schema validation cannot execute
fail_if:
- evidence proves an unrecoverable contract violation
- output hash or evidence hash is forged or inconsistent
result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL
required_evidence:
- sensitive_field_codes
- analytics_event_count
- log_count
- metric_count
- alert_count
- checks
- input_path
- judge_code
- judge_version
- executor_identity
- command
- started_at
- completed_at
- exit_code
- result
- compliance_bit
- assertions_total
- assertions_passed
- failed_assertions
- blocking_assertions
- repairs
- repair_instructions
- evidence_refs
- evidence
- evidence_sha256
- input_sha256
- output_sha256
- retry_count
output:
  schema_ref: schemas/judge-result.schema.json
  schema_version: v0.4
  required_fields:
  - judge_code
  - judge_version
  - executor_identity
  - command
  - started_at
  - completed_at
  - exit_code
  - result
  - compliance_bit
  - assertions_total
  - assertions_passed
  - failed_assertions
  - blocking_assertions
  - repairs
  - repair_instructions
  - evidence_refs
  - evidence
  - evidence_sha256
  - input_sha256
  - output_sha256
  - retry_count
  invariants:
  - assertions_passed <= assertions_total
  - PASS_WITH_EVIDENCE requires exit_code=0, compliance_bit=1 and no failed/blocking assertions
  - RETURN_TO_WORKER requires exit_code=1, failed_assertions and repairs
  - BLOCKED requires exit_code=2 and blocking_assertions
  - repairs and repair_instructions contain equivalent actionable items
  - output_sha256 is calculated over the canonical output before adding output_sha256
positive_behavior:
  case_id: J09-P01
  input_summary: Evento analytics sin PII con event_code y correlation_id_required=true; observability presente
    y alertas definidas cuando aplica.
  expected_result: PASS_WITH_EVIDENCE
  expected_exit_code: 0
negative_behavior:
- case_id: J09-N01
  input_patch:
    analytics: []
  expected_result: RETURN_TO_WORKER
  expected_exit_code: 1
  must_fail:
  - analytics_events_missing
- case_id: J09-N02
  input_summary: Evento analytics con campo PII, sin correlación o mezclado con auditoría; error CRITICAL sin alerta.
  expected_result: RETURN_TO_WORKER
  expected_exit_code: 1
  must_fail:
  - analytics_events_with_pii
  - operations_without_correlation_id
  - audit_events_mixed_with_analytics
  - critical_failures_without_alert_decision
- case_id: J09-N03
  omit_cli:
  - --judge-version
  - --executor-identity
  expected_result: BLOCKED
  expected_exit_code: 2
  must_block:
  - judge_version_missing
  - executor_identity_missing
repair_matrix:
- assertion_id: analytics_events_missing
  instruction: Declarar al menos un evento analytics verificable; no aceptar lista vacía.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: analytics_events_with_pii
  instruction: Eliminar propiedades sensibles del evento; no enmascararlas dentro de analytics.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: critical_failures_without_alert_decision
  instruction: Definir alerta o razón explícita de no alerta respaldada por política.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
prohibitions:
- worker_self_approval
- vacuous_pass_on_empty_section
- assertion_deletion_to_obtain_pass
- threshold_reduction_to_obtain_pass
- unresolved_evidence_reference
- pass_without_strict_evidence_envelope
design_sources:
- anthropics/claude-code
- anthropics/skills
- github/docs:actions-exit-codes
- HANDOFF_REMEDIACION_TOTAL_STORY_CREATOR_LF_v0.1.md
