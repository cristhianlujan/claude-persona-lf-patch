judge_code: J11_SKILL_PACKAGE
version: v0.3
status: CANDIDATO_READ_ONLY
scope: Verifica inventario exacto, estructura, schemas, referencias, contenido, scripts, evaluaciones y manifest
  del paquete.
independence: worker_must_not_execute_own_judge
retry_limit: 2
required_inputs:
- manifest
- package_inventory
- schema_validation_results
- script_compilation_results
- eval_results
preflight:
- all_required_inputs_are_present
- input_versions_are_compatible
- source_and_evidence_refs_are_resolvable
- judge_is_not_executed_by_the_worker_under_review
assertions:
- assertion_id: expected_actual_files
  target: package_inventory
  pass_condition: expected_files = actual_files
  critical: true
  evidence_required: true
- assertion_id: missing_required_files
  target: package_inventory
  pass_condition: missing_required_files = 0
  critical: true
  evidence_required: true
- assertion_id: unexpected_files
  target: package_inventory
  pass_condition: unexpected_files = 0
  critical: true
  evidence_required: true
- assertion_id: schema_validation_errors
  target: schemas
  pass_condition: schema_validation_errors = 0
  critical: true
  evidence_required: true
- assertion_id: broken_internal_references
  target: package
  pass_condition: broken_internal_references = 0
  critical: true
  evidence_required: true
- assertion_id: placeholder_count
  target: package
  pass_condition: placeholder_count = 0
  critical: true
  evidence_required: true
- assertion_id: empty_required_sections
  target: package
  pass_condition: empty_required_sections = 0
  critical: true
  evidence_required: true
- assertion_id: script_compilation_errors
  target: scripts
  pass_condition: script_compilation_errors = 0
  critical: true
  evidence_required: true
- assertion_id: invalid_manifest_references
  target: manifest
  pass_condition: invalid_manifest_references = 0
  critical: true
  evidence_required: true
- assertion_id: required_evals_failed
  target: evals
  pass_condition: required_evals_failed = 0
  critical: true
  evidence_required: true
fail_if:
- missing_required_file = true
- schema_validation_error = true
- broken_internal_reference = true
- placeholder_detected = true
- script_compilation_error = true
block_if:
- manifest_missing = true
- package_inventory_unavailable = true
result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL
result_rules:
  PASS_WITH_EVIDENCE: all applicable assertions pass; compliance_bit=1; evidence_refs non-empty
  RETURN_TO_WORKER: one or more repairable assertions fail; compliance_bit=0; repairs are actionable
  BLOCKED: a blocking condition is true or retry_limit is exhausted; compliance_bit=0
  FAIL: evidence proves an unrecoverable contract violation within this execution; compliance_bit=0
required_evidence:
- expected_files
- actual_files
- schema_validation_results
- broken_internal_references
- placeholder_hits
- script_compilation_results
- eval_results
- failed_assertions
- blocking_assertions
- repair_instructions
repair_matrix:
- assertion_id: missing_required_files
  instruction: Restaurar ruta exacta declarada o corregir manifest con evidencia de cambio.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: schema_validation_errors
  instruction: Corregir schema o instancia; nunca desactivar validación para obtener PASS.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
validator_ref: scripts/validate_package.py
output:
  schema_ref: schemas/judge-result.schema.json
  required_fields:
  - judge_code
  - result
  - compliance_bit
  - failed_assertions
  - blocking_assertions
  - evidence_refs
  - evidence
  - repair_instructions
  - retry_count
  - judged_at
prohibitions:
- worker_self_approval
- assertion_deletion_to_obtain_pass
- threshold_reduction_to_obtain_pass
- unresolved_evidence_reference
- pass_without_evidence
design_sources:
- huggingface/transformers
- freeCodeCamp/freeCodeCamp
- Significant-Gravitas/AutoGPT
