judge_code: J05_OBSERVATIONS_ERRORS
version: v0.5
status: CANDIDATO_READ_ONLY
scope: Verifica observaciones accionables y errores con código, mensaje, correlación, reintento y detalle técnico protegido.
independence:
  worker_must_not_execute_own_judge: true
  executor_identity_required: true
retry_limit: 2
required_inputs:
- story_pack
- observations
- errors
- message_catalog
- references/observations-errors-contract.md
preflight:
- all_required_inputs_are_present
- input_versions_are_compatible
- source_and_evidence_refs_are_resolvable
- judge_is_not_executed_by_worker
- judge_version_and_executor_identity_are_present
assertions:
- blocking_conditions_without_error_code
- observations_without_user_action
- retryable_errors_without_retry_policy
- errors_without_correlation_strategy
- technical_errors_exposed_to_user
- duplicate_error_codes
- errors_without_message_code
pass_if:
- all 7 assertion result collections are empty
- assertions_passed = assertions_total
- output validates against judge-result v0.5
block_if:
- error_catalog_required_but_unavailable = true
- severity_policy_conflict = true
- metadata_or_evidence_unavailable = true
- retry_limit_exhausted = true
result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL
required_evidence:
- observation_count
- error_count
- error_code_count
- retry_policy_count
- correlation_strategy_count
- checks
- failed_assertions
- repair_instructions
validator:
  entrypoint: scripts/validate_field_coverage.py
  command_template: LF_JUDGE_VERSION=<git_blob_sha1> LF_EXECUTOR_IDENTITY=<actor> python scripts/validate_field_coverage.py
    <story_pack.json> --judge J05_OBSERVATIONS_ERRORS --evidence-ref <resolvable_ref>
  positive_case: E23_FIELD_CONTRACTS_POSITIVE
  negative_case: E24_FIELD_CONTRACTS_NEGATIVE
  negative_must_be_rejected: true
output:
  schema_ref: schemas/judge-result.schema.json
  schema_version: v0.5
  required_fields:
  - schema_version
  - judge_code
  - judge_version
  - executor_identity
  - command
  - started_at
  - completed_at
  - exit_code
  - result
  - compliance_bit
  - assertions_total
  - assertions_passed
  - failed_assertions
  - blocking_assertions
  - repairs
  - repair_instructions
  - evidence_refs
  - evidence
  - evidence_sha256
  - input_sha256
  - output_sha256
  - retry_count
  runtime_invariants:
  - assertions_passed <= assertions_total
  - PASS requires assertions_passed = assertions_total
  - repairs = repair_instructions
  - completed_at >= started_at
  - output_sha256 is valid
repair_matrix:
- assertion_id: retryable_errors_without_retry_policy
  instruction: Agregar max_attempts y backoff desde política o bloquear.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: technical_errors_exposed_to_user
  instruction: Mover detalle a observabilidad y usar user_message_code.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: errors_without_correlation_strategy
  instruction: Agregar correlation_id_required o trace_code respaldado.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
prohibitions:
- worker_self_approval
- threshold_reduction_to_obtain_pass
- assertion_deletion_to_obtain_pass
- pass_without_evidence
- judged_at_legacy_field
