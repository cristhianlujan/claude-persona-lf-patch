judge_code: J00_SCREEN_INGESTION
judge_version: v0.1
status: CANDIDATO_READ_ONLY
scope: Valida la estructura de una lectura ciega bloqueada de la pantalla antes de J02; no afirma por sí solo calidad empírica del runtime visual.
independence: screen_ingestor_must_not_approve_own_output
retry_limit: 2

required_inputs:
- screen_ingestion

preflight:
- source_images_are_present
- raw_content_sha256_is_present_for_each_image
- blind_read_id_and_execution_id_are_present
- reader_identity_is_present
- auxiliary_context_before_lock_is_false
- separate_context_window_is_true
- action_tools_are_disabled
- screen_ingestion_schema_is_available

validators:
  input_schema_ref: schemas/screen-ingestion.schema.json
  semantic_validator_ref: scripts/validate_screen_ingestion.py
  runtime_status: STRUCTURAL_VALIDATOR_AVAILABLE
  visual_runtime_status: NOT_PROVEN

deterministic_procedure:
- validate_screen_ingestion_against_schema
- recompute_source_snapshot_hash_from_declared_raw_image_hashes
- verify_region_and_inventory_references
- verify_blind_context_lock
- verify_all_declared_source_images_were_scanned
- reject_known_omission_candidates
- reject_critical_uncertainties
- preserve_locked_observation_without_auxiliary_context_mutation

assertions:
- assertion_id: input_schema_valid
  expected: 0
  critical: true
- assertion_id: source_snapshot_hash_matches
  expected: 0
  critical: true
- assertion_id: source_images_unique
  expected: 0
  critical: true
- assertion_id: region_refs_resolvable
  expected: 0
  critical: true
- assertion_id: inventory_source_refs_unique
  expected: 0
  critical: true
- assertion_id: blind_context_lock
  expected: 0
  critical: true
- assertion_id: coverage_complete
  expected: 0
  critical: true
- assertion_id: no_blocking_uncertainty
  expected: 0
  critical: true

pass_if:
- structural_validator_exit_code = 0
- all_assertions_pass = true
- locked = true
- evidence_refs_non_empty = true

fail_if:
- source_snapshot_hash_is_decorative = true
- auxiliary_context_used_before_lock = true
- known_omission_candidate_ignored = true

block_if:
- raw_image_hash_missing = true
- source_images_missing = true
- critical_uncertainty_open = true
- visual_runtime_claimed_without_receipt = true

result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL

required_evidence:
- input_schema_sha256
- declared_source_snapshot_sha
- computed_source_snapshot_sha
- blind_read_id
- execution_id
- reader_identity
- checks
- validation_scope
- visual_runtime_proven

positive_behavior:
  command: python scripts/validate_screen_ingestion.py evals/fixtures/screen_ingestion_dense.json --evidence-ref fixture://screen_ingestion_dense
  expected: structural PASS_WITH_EVIDENCE with all checks at zero
  fixture_is_external_to_validator: true

negative_cases:
- case: source_snapshot_hash_mismatch
  expected_result: RETURN_TO_WORKER
  assertion: source_snapshot_hash_matches
- case: auxiliary_context_before_lock
  expected_result: RETURN_TO_WORKER
  assertion: blind_context_lock
- case: critical_uncertainty
  expected_result: RETURN_TO_WORKER
  assertion: no_blocking_uncertainty
- case: omitted_candidate_declared
  expected_result: RETURN_TO_WORKER
  assertion: coverage_complete

output:
  schema_ref: schemas/judge-result.schema.json
  schema_version: v0.5

prohibitions:
- worker_self_approval
- claim_perfect_visual_recall
- auxiliary_context_before_visual_lock
- action_tools_during_blind_read
- network_egress_by_default
- mutate_locked_visual_observation
- promote_to_production_without_visual_runtime_evidence

benchmark_note:
  source_contract: HANDOFF_TECNICO_P0_LECTURA_VISUAL_Y_CONTEXTO_AUXILIAR_LF_v1.0
  adopted_principle: blind_read_then_validate_then_lock_then_enrich
  current_limit: structural contract and synthetic fixtures only; real visual benchmark remains open
