judge_code: J06_SECURITY_PRIVACY
version: v0.3
status: CANDIDATO_READ_ONLY
scope: Verifica autenticación, autorización server-side, aislamiento por empresa, privacidad, MFA, idempotencia
  y almacenamiento sensible.
independence: worker_must_not_execute_own_judge
retry_limit: 2
required_inputs:
- story_pack
- permission_matrix
- security_contracts
- field_contracts
preflight:
- all_required_inputs_are_present
- input_versions_are_compatible
- source_and_evidence_refs_are_resolvable
- judge_is_not_executed_by_the_worker_under_review
assertions:
- assertion_id: stories_without_required_permission
  target: security_privacy
  pass_condition: stories_without_required_permission = 0
  critical: true
  evidence_required: true
- assertion_id: mutations_without_server_authorization
  target: security_privacy
  pass_condition: mutations_without_server_side_authorization = 0
  critical: true
  evidence_required: true
- assertion_id: cross_tenant_access
  target: security_privacy
  pass_condition: cross_tenant_access_allowed = 0
  critical: true
  evidence_required: true
- assertion_id: tenant_key_missing
  target: security_privacy
  pass_condition: tenant_key_missing = 0
  critical: true
  evidence_required: true
- assertion_id: sensitive_download_storage
  target: security_privacy
  pass_condition: sensitive_download_without_private_storage = 0
  critical: true
  evidence_required: true
- assertion_id: signed_url_ttl
  target: security_privacy
  pass_condition: signed_url_without_ttl = 0
  critical: true
  evidence_required: true
- assertion_id: critical_action_mfa
  target: security_privacy
  pass_condition: critical_action_without_mfa_decision = 0
  critical: true
  evidence_required: true
- assertion_id: mutation_idempotency
  target: security_privacy
  pass_condition: mutation_without_idempotency_decision = 0
  critical: true
  evidence_required: true
- assertion_id: pii_exposure
  target: fields
  pass_condition: pii_exposure_without_masking = 0
  critical: true
  evidence_required: true
pass_if:
- all_applicable_assertions_pass = true
- compliance_bit = 1
- evidence_refs_non_empty = true
fail_if:
- cross_tenant_access_allowed = true
- mutation_without_server_authorization = true
- sensitive_download_public = true
block_if:
- permission_source_unavailable = true
- tenant_model_undefined_and_blocking = true
- privacy_classification_conflict = true
result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL
result_rules:
  PASS_WITH_EVIDENCE: all applicable assertions pass; compliance_bit=1; evidence_refs non-empty
  RETURN_TO_WORKER: one or more repairable assertions fail; compliance_bit=0; repairs are actionable
  BLOCKED: a blocking condition is true or retry_limit is exhausted; compliance_bit=0
  FAIL: evidence proves an unrecoverable contract violation within this execution; compliance_bit=0
required_evidence:
- permission_count
- mutation_count
- tenant_rule_count
- sensitive_download_count
- pii_field_count
- failed_assertions
- blocking_assertions
- repair_instructions
repair_matrix:
- assertion_id: cross_tenant_access
  instruction: Fijar DENY o EXPLICIT_ALLOW_WITH_AUDIT y derivar prueba negativa.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: mutation_idempotency
  instruction: Registrar decisión explícita y prueba de duplicidad cuando aplique.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
validator_ref: scripts/validate_security_coverage.py
output:
  schema_ref: schemas/judge-result.schema.json
  required_fields:
  - judge_code
  - result
  - compliance_bit
  - failed_assertions
  - blocking_assertions
  - evidence_refs
  - evidence
  - repair_instructions
  - retry_count
  - judged_at
prohibitions:
- worker_self_approval
- assertion_deletion_to_obtain_pass
- threshold_reduction_to_obtain_pass
- unresolved_evidence_reference
- pass_without_evidence
design_sources:
- huggingface/transformers
- freeCodeCamp/freeCodeCamp
- Significant-Gravitas/AutoGPT
