judge_code: J02_SCREEN_DECOMPOSITION
judge_version: v0.4
status: CANDIDATO_READ_ONLY
scope: Verifica cobertura completa y no duplicada de contextos, campos, permisos, transiciones y unidades funcionales.
independence: worker_must_not_execute_own_judge
retry_limit: 2
required_inputs:
- source_snapshot
- screen_decomposition
- coverage_matrix
preflight:
- all_required_inputs_are_present
- input_versions_are_compatible
- source_and_evidence_refs_are_resolvable
- judge_is_not_executed_by_the_worker_under_review
- input_sha256_is_present
validators:
  static_contract_ref: scripts/validate_package.py#audit_artifact
  semantic_validator_ref: BLOCKED_DEDICATED_VALIDATOR_NOT_AVAILABLE
  semantic_validator_name: screen_decomposition_semantic_validator
runtime_status: BLOCKED_DEDICATED_VALIDATOR_NOT_AVAILABLE
deterministic_procedure:
- validate_preflight_and_hashes
- load_required_inputs_without_mutation
- execute_each_assertion_and_record_actual_expected
- reject_empty_or_missing_evidence
- calculate_binary_compliance_bit
- emit_schema_valid_judge_result
assertions:
- assertion_id: source_snapshot_sha_present
  target: screen_decomposition
  operator: equals
  actual_ref: screen_decomposition.source_snapshot_sha_present
  expected: true
  critical: true
  evidence_required: true
- assertion_id: source_screen_code_matches_target
  target: screen_decomposition
  operator: equals
  actual_ref: screen_decomposition.source_screen_code_matches_target
  expected: true
  critical: true
  evidence_required: true
- assertion_id: context_coverage
  target: coverage_matrix
  operator: equals
  actual_ref: coverage_matrix.context_source_count
  expected_ref: coverage_matrix.context_mapped_or_justified_count
  critical: true
  evidence_required: true
- assertion_id: permission_coverage
  target: coverage_matrix
  operator: equals
  actual_ref: coverage_matrix.permission_source_count
  expected_ref: coverage_matrix.permission_mapped_or_justified_count
  critical: true
  evidence_required: true
- assertion_id: transition_coverage
  target: coverage_matrix
  operator: equals
  actual_ref: coverage_matrix.transition_source_count
  expected_ref: coverage_matrix.transition_mapped_or_justified_count
  critical: true
  evidence_required: true
- assertion_id: unmapped_count
  target: coverage_matrix
  operator: equals
  actual_ref: coverage_matrix.unmapped_count
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: unjustified_count
  target: coverage_matrix
  operator: equals
  actual_ref: coverage_matrix.unjustified_count
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: conflicting_count
  target: coverage_matrix
  operator: equals
  actual_ref: coverage_matrix.conflicting_count
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: duplicate_functional_units
  target: functional_units
  operator: equals
  actual_ref: functional_units.duplicate_count
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: functional_units_complete
  target: functional_units
  operator: equals
  actual_ref: functional_units.without_actor_or_goal_or_output
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: confirmed_rules_have_source
  target: functional_units
  operator: equals
  actual_ref: functional_units.confirmed_without_source_count
  expected: 0
  critical: true
  evidence_required: true
pass_if:
- dedicated_semantic_validator_available = true
- all_applicable_assertions_pass = true
- assertions_passed = assertions_total
- compliance_bit = 1
- evidence_refs_non_empty = true
- input_output_evidence_hashes_present = true
fail_if:
- invented_rule_marked_confirmed = true
- duplicated_functional_unit = true
- functional_unit_without_business_result = true
block_if:
- source_screen_not_found = true
- screen_version_conflict = true
- required_decision_prevents_decomposition = true
- dedicated_semantic_validator_available = false
- executor_identity_missing = true
- input_sha256_missing = true
result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL
result_rules:
  PASS_WITH_EVIDENCE: Solo con runtime semántico disponible, todas las assertions aprobadas y evidencia íntegra.
  RETURN_TO_WORKER: Una o más assertions reparables fallan; compliance_bit=0 y reparaciones accionables.
  BLOCKED: Falta fuente, dependencia, runtime semántico o independencia; compliance_bit=0.
  FAIL: La evidencia prueba una violación no reparable dentro de la ejecución; compliance_bit=0.
required_evidence:
- source_snapshot_sha
- coverage_matrix_sha
- context_coverage_count
- permission_coverage_count
- transition_coverage_count
- functional_units_count
- failed_assertions
- blocking_assertions
- repair_instructions
- executor_identity
- judge_version
- command
- started_at
- completed_at
- assertions_total
- assertions_passed
- input_sha256
- output_sha256
- evidence_sha256
positive_behavior:
  precondition: dedicated_semantic_validator_available = true
  expected: PASS_WITH_EVIDENCE only after all assertions pass with non-empty evidence
negative_cases:
- case: empty_evidence
  expected_result: RETURN_TO_WORKER
  reason: evidence_refs_non_empty = false
- case: missing_runtime
  expected_result: BLOCKED
  reason: dedicated_semantic_validator_available = false
- case: worker_self_executes
  expected_result: BLOCKED
  reason: judge_is_not_executed_by_the_worker_under_review = false
repair_matrix:
- assertion_id: unmapped_count
  target_path: screen_decomposition.coverage_matrix
  instruction: Mapear cada elemento fuente a una unidad o justificar su exclusión.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: duplicate_functional_units
  target_path: screen_decomposition.functional_units
  instruction: Consolidar duplicados conservando trazabilidad y recalcular cobertura.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
output:
  schema_ref: schemas/judge-result.schema.json
  required_fields:
  - judge_code
  - judge_version
  - executor_identity
  - command
  - started_at
  - completed_at
  - exit_code
  - result
  - compliance_bit
  - assertions_total
  - assertions_passed
  - failed_assertions
  - blocking_assertions
  - repairs
  - repair_instructions
  - evidence_refs
  - evidence
  - evidence_sha256
  - input_sha256
  - output_sha256
  - retry_count
prohibitions:
- worker_self_approval
- assertion_deletion_to_obtain_pass
- threshold_reduction_to_obtain_pass
- unresolved_evidence_reference
- pass_without_evidence
- pass_without_semantic_runtime
design_sources:
- anthropics/skills
- github/docs
