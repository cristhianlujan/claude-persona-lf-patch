judge_code: J02_SCREEN_DECOMPOSITION
judge_version: v0.7
status: CANDIDATO_READ_ONLY
scope: Verifica por contenido la cobertura completa, uno-a-uno, no duplicada y trazable de contextos, campos, permisos, transiciones y unidades funcionales.
independence: worker_must_not_execute_own_judge
retry_limit: 2

required_inputs:
- target_screen_code
- screen_decomposition

input_contract:
  envelope_type: object
  required_fields:
  - target_screen_code
  - screen_decomposition
  screen_decomposition_schema_ref: schemas/screen-decomposition.schema.json
  schema_validation_required: true
  additional_envelope_properties_allowed: false

preflight:
- all_required_inputs_are_present
- executor_identity_is_present
- judge_version_is_present
- input_versions_are_compatible
- source_and_evidence_refs_are_resolvable
- judge_is_not_executed_by_the_worker_under_review
- input_sha256_is_present
- all_inventories_are_explicit_arrays
- source_version_and_main_responsibility_are_non_empty
- functional_units_and_coverage_items_are_non_empty
- input_schema_is_available
- semantic_validator_is_available
- semantic_validator_is_registered_in_canonical_inventory
- semantic_validator_sha_matches_main_and_recorded_evidence
- preflight_is_enforced_before_semantic_assertions

validators:
  static_contract_ref: scripts/validate_package.py#audit_artifact
  input_schema_ref: schemas/screen-decomposition.schema.json
  output_schema_ref: schemas/judge-result.schema.json
  semantic_validator_ref: scripts/validate_screen_decomposition.py
  semantic_validator_name: screen_decomposition_semantic_validator
  semantic_validator_registration_required: true
  semantic_validator_sha_reconciliation_required: true
  semantic_validator_sha256: 1126486c5d542fea8b25c51044798f2b0bd8e555687f7120040c3d04ea8fdd24
  semantic_validator_git_blob_sha1: 79b5de0bb5ce52852cb4f91a5bbb1c654206f66a
  semantic_validator_supabase_row_id: 229
  semantic_validator_registration_ref: supabase://private.lf_skill_artifacts/ART_SCRIPT_VALIDATE_SCREEN_DECOMPOSITION

runtime_status: AVAILABLE
runtime_blockers: []

runtime_command: LF_EXECUTOR_IDENTITY=<independent_executor> LF_JUDGE_VERSION=v0.7 python scripts/validate_screen_decomposition.py <input.json> --evidence-ref <ref> --expected-validator-sha256 1126486c5d542fea8b25c51044798f2b0bd8e555687f7120040c3d04ea8fdd24 --registration-ref supabase://private.lf_skill_artifacts/ART_SCRIPT_VALIDATE_SCREEN_DECOMPOSITION
self_test_command: LF_EXECUTOR_IDENTITY=LF_SELF_TEST LF_JUDGE_VERSION=v0.7 python scripts/validate_screen_decomposition.py --self-test

deterministic_procedure:
- validate_executor_identity_judge_version_and_preflight
- validate_screen_decomposition_against_input_schema
- reject_schema_invalid_input_before_semantic_assertions
- load_required_inputs_without_mutation
- execute_semantic_validator
- recompute_inventory_coverage_by_code_or_source_ref
- recompute_field_coverage
- recompute_semantic_and_code_duplicates
- validate_conditional_rules_including_merge_target
- validate_blocking_pending_decisions
- record_actual_expected_for_each_assertion
- reject_empty_or_missing_evidence
- emit_schema_valid_judge_result

