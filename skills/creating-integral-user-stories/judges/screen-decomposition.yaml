assertion_semantics:
  input_schema_valid: El objeto screen_decomposition cumple A44 completo, incluidas reglas condicionales y additionalProperties.
  context_coverage: Cada contexto está cubierto por su código o source_ref; no basta igualar cardinalidades.
  field_coverage: Cada campo está cubierto por un coverage_item FIELD con código o source_ref resoluble.
  permission_coverage: Cada permiso está cubierto por su permission_code o source_ref.
  transition_coverage: Cada transición está cubierta por source_ref porque A44 no define transition_code.
  duplicate_functional_units: Detecta códigos repetidos y equivalencia semántica de actor, goal y observable_output.
  functional_units_complete: Requiere todos los campos obligatorios de A44 y merge_target cuando decision es MERGE_WITH.
  blocking_pending_decisions: Cuenta decisiones con blocking=true y status=OPEN.

pass_if:
- runtime_status = AVAILABLE
- semantic_validator_exit_code = 0
- input_schema_valid = 0
- all_applicable_assertions_pass = true
- assertions_passed = assertions_total
- compliance_bit = 1
- evidence_refs_non_empty = true
- executor_identity_not_missing = true
- judge_version_matches_contract = true
- semantic_validator_sha_reconciled = true

fail_if:
- invented_rule_marked_confirmed = true
- duplicated_functional_unit = true
- functional_unit_without_business_result = true
- schema_invalid_input_received_pass = true
- unrelated_inventory_item_counted_as_covered = true
- blocking_pending_decision_ignored = true

block_if:
- source_screen_not_found = true
- screen_version_conflict = true
- required_decision_prevents_decomposition = true
- input_schema_unavailable = true
- semantic_validator_unavailable = true
- semantic_validator_unregistered = true
- semantic_validator_sha_unreconciled = true
- executor_identity_missing = true
- judge_version_missing = true
- input_sha256_missing = true
- required_input_missing = true
- inventory_missing_or_invalid = true
- functional_units_empty = true
- coverage_items_empty = true
- source_version_or_main_responsibility_empty = true

result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL

