- semantic_validator_git_blob_sha1
- command
- started_at
- completed_at
- assertions_total
- assertions_passed
- input_sha256
- output_sha256
- evidence_sha256

positive_behavior:
  command: LF_EXECUTOR_IDENTITY=LF_SELF_TEST LF_JUDGE_VERSION=v0.7 python scripts/validate_screen_decomposition.py --self-test
  expected: positive_pass=true and input_schema_valid=0 and assertions_passed=17 and exit_code=0

negative_cases:
- case: schema_invalid_merge_without_target
  expected_result: RETURN_TO_WORKER
  assertion: input_schema_valid
- case: empty_trigger
  expected_result: RETURN_TO_WORKER
  assertion: input_schema_valid
- case: pending_coverage_item
  expected_result: RETURN_TO_WORKER
  assertion: unmapped_count
- case: duplicated_functional_unit_same_code
  expected_result: RETURN_TO_WORKER
  assertion: duplicate_functional_units
- case: duplicated_functional_unit_distinct_code_same_semantics
  expected_result: RETURN_TO_WORKER
  assertion: duplicate_functional_units
- case: unrelated_context_coverage_same_cardinality
  expected_result: RETURN_TO_WORKER
  assertion: context_coverage
- case: missing_field_coverage
  expected_result: RETURN_TO_WORKER
  assertion: field_coverage
- case: blocking_pending_decision
  expected_result: BLOCKED
  assertion: required_decision_prevents_decomposition
- case: missing_runtime
  expected_result: BLOCKED
  assertion: semantic_validator_unavailable
- case: unregistered_runtime
  expected_result: BLOCKED
  assertion: semantic_validator_unregistered
- case: runtime_sha_mismatch
  expected_result: BLOCKED
  assertion: semantic_validator_sha_unreconciled
- case: mapped_to_unknown_functional_unit
  expected_result: RETURN_TO_WORKER
  assertion: coverage_mapped_to_unknown_functional_unit
- case: empty_functional_units
  expected_result: BLOCKED
  assertion: functional_units_empty
- case: empty_coverage_items
  expected_result: BLOCKED
  assertion: coverage_items_empty
- case: missing_executor_identity
  expected_result: BLOCKED
  assertion: executor_identity_missing
- case: missing_judge_version
  expected_result: BLOCKED
  assertion: judge_version_missing

repair_matrix:
- assertion_id: input_schema_valid
  target_path: screen_decomposition
  instruction: Reparar el objeto para cumplir A44 sin debilitar el schema.
  prohibited_shortcuts:
  - bypass_schema
  - lower_threshold
  - remove_conditional_rule
  - self_approve
- assertion_id: context_coverage
  target_path: screen_decomposition.coverage_items
  instruction: Cubrir cada contexto por código o source_ref verificable.
  prohibited_shortcuts:
  - count_by_cardinality_only
  - invent_source
  - self_approve
- assertion_id: field_coverage
  target_path: screen_decomposition.coverage_items
  instruction: Agregar cobertura FIELD para cada entrada de field_inventory.
  prohibited_shortcuts:
  - ignore_field_inventory
  - invent_source
  - self_approve
- assertion_id: unmapped_count
  target_path: screen_decomposition.coverage_items
  instruction: Mapear cada elemento fuente a una unidad o justificar su exclusión.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: duplicate_functional_units
  target_path: screen_decomposition.functional_units
  instruction: Consolidar duplicados por código o semántica, conservando trazabilidad y recalculando cobertura.
  prohibited_shortcuts:
  - compare_code_only
  - delete_assertion
  - invent_source
  - self_approve
- assertion_id: coverage_mapped_to_unknown_functional_unit
  target_path: screen_decomposition.coverage_items
  instruction: Corregir mapped_to para que cada referencia apunte a una unidad funcional declarada.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: blocking_pending_decisions
  target_path: screen_decomposition.pending_decisions
  instruction: Resolver la decisión en la fuente o devolver BLOCKED; nunca cambiar blocking para obtener PASS.
  prohibited_shortcuts:
  - mark_non_blocking_without_source
  - delete_decision
  - self_approve

output:
