judge_code: J10_TEST_COVERAGE
judge_version: v0.5
status: CANDIDATO_READ_ONLY
scope: Verifica cobertura positiva, negativa, límites, regresión, fixtures exactos, trazabilidad, tenant, estados, idempotencia, concurrencia y errores.
independence: worker_must_not_execute_own_judge
retry_limit: 2
required_inputs:
  - story_pack
  - critical_rules
  - fixtures
  - traceability_matrix
  - test_environment
preflight:
  - all_required_inputs_are_present
  - input_versions_are_compatible
  - source_and_evidence_refs_are_resolvable
  - judge_is_not_executed_by_the_worker_under_review
  - input_sha256_is_present
validators:
  static_contract_ref: scripts/validate_package.py#audit_artifact
  semantic_validator_ref: scripts/validate_test_coverage.py
  semantic_validator_name: test_coverage_semantic_validator
runtime_status: AVAILABLE
runtime_command: python scripts/validate_test_coverage.py <input.json> --evidence-ref <ref>
self_test_command: python scripts/validate_test_coverage.py --self-test
deterministic_procedure:
  - validate_preflight_and_hashes
  - load_required_inputs_without_mutation
  - execute_semantic_validator
  - record_actual_expected_for_each_assertion
  - reject_empty_or_missing_evidence
  - calculate_binary_compliance_bit
  - emit_schema_valid_judge_result
assertions:
  - {assertion_id: acceptance_criteria_without_test, actual_ref: evidence.checks.acceptance_criteria_without_test, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: critical_rule_without_test, actual_ref: evidence.checks.critical_rule_without_test, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: permission_without_negative_test, actual_ref: evidence.checks.permission_without_negative_test, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: tenant_rule_without_cross_tenant_test, actual_ref: evidence.checks.tenant_rule_without_cross_tenant_test, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: state_transition_without_state_test, actual_ref: evidence.checks.state_transition_without_state_test, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: idempotent_action_without_duplicate_test, actual_ref: evidence.checks.idempotent_action_without_duplicate_test, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: critical_error_without_test, actual_ref: evidence.checks.critical_error_without_test, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: mutable_shared_resource_without_concurrency_test, actual_ref: evidence.checks.mutable_shared_resource_without_concurrency_test, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: tests_without_exact_fixture, actual_ref: evidence.checks.tests_without_exact_fixture, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: tests_without_expected_result, actual_ref: evidence.checks.tests_without_expected_result, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: tests_without_traceability_ref, actual_ref: evidence.checks.tests_without_traceability_ref, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: orphan_tests, actual_ref: evidence.checks.orphan_tests, expected: 0, critical: true, evidence_required: true}
  - {assertion_id: vacuous_pass_count, actual_ref: evidence.checks.vacuous_pass_count, expected: 0, critical: true, evidence_required: true}
pass_if:
  - semantic_validator_exit_code = 0
  - all_applicable_assertions_pass = true
  - assertions_passed = assertions_total
  - compliance_bit = 1
  - evidence_refs_non_empty = true
  - input_output_evidence_hashes_present = true
fail_if:
  - critical_assertion_without_test = true
  - permission_without_negative_test = true
  - test_without_exact_fixture = true
  - vacuous_pass_count > 0
block_if:
  - story_pack_missing = true
  - test_derivation_source_missing = true
  - critical_expected_behavior_undefined = true
  - semantic_validator_unavailable = true
  - executor_identity_missing = true
  - input_sha256_missing = true
result_values: [PASS_WITH_EVIDENCE, RETURN_TO_WORKER, BLOCKED, FAIL]
result_rules:
  PASS_WITH_EVIDENCE: Solo con runtime semántico ejecutado, todas las assertions aprobadas, evidencia no vacía y hashes íntegros.
  RETURN_TO_WORKER: Una o más assertions reparables fallan; compliance_bit=0 y reparaciones accionables.
  BLOCKED: Falta fuente, dependencia, runtime, hash o independencia; compliance_bit=0.
  FAIL: La evidencia prueba una violación no reparable dentro de la ejecución; compliance_bit=0.
required_evidence:
  - acceptance_criteria_count
  - critical_rule_count
  - test_case_count
  - negative_test_count
  - exact_fixture_count
  - families_covered
  - failed_assertions
  - blocking_assertions
  - repair_instructions
  - executor_identity
  - judge_version
  - command
  - started_at
  - completed_at
  - assertions_total
  - assertions_passed
  - input_sha256
  - output_sha256
  - evidence_sha256
positive_behavior:
  command: python scripts/validate_test_coverage.py --self-test
  expected: positive_pass=true and exit_code=0
negative_cases:
  - case: missing_exact_fixture
    expected_result: RETURN_TO_WORKER
    assertion: tests_without_exact_fixture
  - case: empty_expected_result
    expected_result: RETURN_TO_WORKER
    assertion: tests_without_expected_result
  - case: missing_runtime
    expected_result: BLOCKED
    assertion: semantic_validator_unavailable
  - case: worker_self_executes
    expected_result: BLOCKED
    assertion: judge_is_not_executed_by_the_worker_under_review
repair_matrix:
  - assertion_id: permission_without_negative_test
    target_path: tests
    instruction: Agregar caso con actor no autorizado y resultado DENY sin exposición de datos.
    prohibited_shortcuts: [delete_assertion, lower_threshold, invent_source, self_approve]
  - assertion_id: tests_without_exact_fixture
    target_path: fixtures
    instruction: Definir actor, tenant, exact_inputs, initial_state, pasos, expected_result y evidence_path.
    prohibited_shortcuts: [generic_steps, placeholder_fixture, lower_threshold, self_approve]
  - assertion_id: orphan_tests
    target_path: tests
    instruction: Asignar criterion_ref o rule_ref resoluble; retirar solo si la prueba carece de sustento.
    prohibited_shortcuts: [invent_reference, delete_assertion, lower_threshold, self_approve]
output:
  schema_ref: schemas/judge-result.schema.json
  required_fields: [judge_code, judge_version, executor_identity, command, started_at, completed_at, exit_code, result, compliance_bit, assertions_total, assertions_passed, failed_assertions, blocking_assertions, repairs, repair_instructions, evidence_refs, evidence, evidence_sha256, input_sha256, output_sha256, retry_count]
prohibitions:
  - worker_self_approval
  - assertion_deletion_to_obtain_pass
  - threshold_reduction_to_obtain_pass
  - unresolved_evidence_reference
  - pass_without_evidence
  - pass_without_semantic_runtime
benchmark_dual:
  verified_at: 2026-07-29
  claude:
    repository: anthropics/skills
    reference: skills/skill-creator/SKILL.md
    blob: 65b3a402dbd09b8e83f9d637c6b553875189085c
    practice: objective assertions, programmatic grading, iterative benchmark
  github:
    repository: freeCodeCamp/freeCodeCamp
    stars_verified: 453125
    reference: curriculum/schema/challenge-schema.js
    blob: 7db60817942625110525fd313bf80f1df067f006
    practice: conditional constraints, uniqueness and deterministic rejection
  complement: exact fixtures and vacuous-pass detection are mandatory runtime gates
