judge_code: J10_TEST_COVERAGE
judge_version: v0.4
status: CANDIDATO_READ_ONLY
scope: Verifica cobertura positiva, negativa, límites y regresión con fixtures exactos para criterios, permisos, tenant, estados, idempotencia y errores.
independence: worker_must_not_execute_own_judge
retry_limit: 2
required_inputs:
- story_pack
- test_cases
- traceability_matrix
- test_environment
preflight:
- all_required_inputs_are_present
- input_versions_are_compatible
- source_and_evidence_refs_are_resolvable
- judge_is_not_executed_by_the_worker_under_review
- input_sha256_is_present
validators:
  static_contract_ref: scripts/validate_package.py#audit_artifact
  semantic_validator_ref: BLOCKED_DEDICATED_VALIDATOR_NOT_AVAILABLE
  semantic_validator_name: test_coverage_semantic_validator
runtime_status: BLOCKED_DEDICATED_VALIDATOR_NOT_AVAILABLE
deterministic_procedure:
- validate_preflight_and_hashes
- load_required_inputs_without_mutation
- execute_each_assertion_and_record_actual_expected
- reject_empty_or_missing_evidence
- calculate_binary_compliance_bit
- emit_schema_valid_judge_result
assertions:
- assertion_id: acceptance_criteria_without_test
  target: tests
  operator: equals
  actual_ref: coverage.acceptance_criteria_without_test
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: critical_rule_without_test
  target: tests
  operator: equals
  actual_ref: coverage.critical_rule_without_test
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: permission_without_negative_test
  target: tests
  operator: equals
  actual_ref: coverage.permission_without_negative_test
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: tenant_rule_without_cross_tenant_test
  target: tests
  operator: equals
  actual_ref: coverage.tenant_rule_without_cross_tenant_test
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: state_transition_without_state_test
  target: tests
  operator: equals
  actual_ref: coverage.state_transition_without_state_test
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: idempotent_action_without_duplicate_test
  target: tests
  operator: equals
  actual_ref: coverage.idempotent_action_without_duplicate_test
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: critical_error_without_test
  target: tests
  operator: equals
  actual_ref: coverage.critical_error_without_test
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: tests_without_exact_fixture
  target: tests
  operator: equals
  actual_ref: coverage.tests_without_exact_fixture
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: tests_without_expected_result
  target: tests
  operator: equals
  actual_ref: coverage.tests_without_expected_result
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: orphan_tests
  target: tests
  operator: equals
  actual_ref: coverage.tests_without_story_or_rule_reference
  expected: 0
  critical: true
  evidence_required: true
- assertion_id: vacuous_pass
  target: tests
  operator: equals
  actual_ref: coverage.vacuous_pass_count
  expected: 0
  critical: true
  evidence_required: true
pass_if:
- dedicated_semantic_validator_available = true
- all_applicable_assertions_pass = true
- assertions_passed = assertions_total
- compliance_bit = 1
- evidence_refs_non_empty = true
- input_output_evidence_hashes_present = true
fail_if:
- critical_assertion_without_test = true
- permission_without_negative_test = true
- test_without_exact_fixture = true
- vacuous_pass_count > 0
block_if:
- story_pack_missing = true
- test_derivation_source_missing = true
- critical_expected_behavior_undefined = true
- dedicated_semantic_validator_available = false
- executor_identity_missing = true
- input_sha256_missing = true
result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL
result_rules:
  PASS_WITH_EVIDENCE: Solo con runtime semántico disponible, todas las assertions aprobadas y evidencia íntegra.
  RETURN_TO_WORKER: Una o más assertions reparables fallan; compliance_bit=0 y reparaciones accionables.
  BLOCKED: Falta fuente, dependencia, runtime semántico o independencia; compliance_bit=0.
  FAIL: La evidencia prueba una violación no reparable dentro de la ejecución; compliance_bit=0.
required_evidence:
- acceptance_criteria_count
- critical_rule_count
- test_case_count
- negative_test_count
- exact_fixture_count
- families_covered
- coverage_gaps
- failed_assertions
- blocking_assertions
- repair_instructions
- executor_identity
- judge_version
- command
- started_at
- completed_at
- assertions_total
- assertions_passed
- input_sha256
- output_sha256
- evidence_sha256
positive_behavior:
  precondition: dedicated_semantic_validator_available = true
  expected: PASS_WITH_EVIDENCE only after all assertions pass with non-empty evidence
negative_cases:
- case: empty_evidence
  expected_result: RETURN_TO_WORKER
  reason: evidence_refs_non_empty = false
- case: missing_runtime
  expected_result: BLOCKED
  reason: dedicated_semantic_validator_available = false
- case: worker_self_executes
  expected_result: BLOCKED
  reason: judge_is_not_executed_by_the_worker_under_review = false
repair_matrix:
- assertion_id: permission_without_negative_test
  target_path: tests
  instruction: Agregar caso con actor no autorizado y resultado DENY sin exposición de datos.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: tests_without_exact_fixture
  target_path: tests
  instruction: Definir exact_inputs, initial_state, actor, steps, expected y evidence_path.
  prohibited_shortcuts:
  - generic_steps
  - placeholder_fixture
  - lower_threshold
  - self_approve
- assertion_id: orphan_tests
  target_path: tests
  instruction: Asignar criterion_ref o rule_ref resoluble; retirar solo si la prueba carece de sustento.
  prohibited_shortcuts:
  - invent_reference
  - delete_assertion
  - lower_threshold
  - self_approve
output:
  schema_ref: schemas/judge-result.schema.json
  required_fields:
  - judge_code
  - judge_version
  - executor_identity
  - command
  - started_at
  - completed_at
  - exit_code
  - result
  - compliance_bit
  - assertions_total
  - assertions_passed
  - failed_assertions
  - blocking_assertions
  - repairs
  - repair_instructions
  - evidence_refs
  - evidence
  - evidence_sha256
  - input_sha256
  - output_sha256
  - retry_count
prohibitions:
- worker_self_approval
- assertion_deletion_to_obtain_pass
- threshold_reduction_to_obtain_pass
- unresolved_evidence_reference
- pass_without_evidence
- pass_without_semantic_runtime
design_sources:
- anthropics/skills
- github/docs
