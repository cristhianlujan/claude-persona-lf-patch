pass_if:
- runtime_status = AVAILABLE
- semantic_validator_exit_code = 0
- assertions_passed = assertions_total
- compliance_bit = 1
- evidence_refs_non_empty = true
- executor_identity_not_missing = true
- judge_version_matches_contract = true
- validator_sha_reconciled = true

fail_if:
- worker_self_approval = true
- full_story_pack_required_from_A04 = true
- context_budget_required_from_A04 = true
- criterion_without_source_ref_received_pass = true
- multiple_independent_results_received_pass = true
- j02_not_passed_received_pass = true

block_if:
- required_input_missing = true
- executor_identity_missing = true
- judge_version_missing_or_mismatch = true
- worker_judge_independence_broken = true
- source_snapshot_unavailable = true
- source_hash_missing = true
- source_ref_unresolvable = true
- approved_functional_unit_missing_or_ambiguous = true
- target_decision_not_CREATE_STORY = true
- j02_not_passed_with_evidence = true
- validator_unavailable = true
- validator_unregistered = true
- validator_sha_unreconciled = true
- retry_limit_exhausted = true

result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL

required_evidence:
- input_envelope_ref
- identity_schema_ref
- core_schema_ref
- target_functional_unit_code
- source_decision_id
- source_snapshot_sha256
- source_version
- j02_result
- j02_evidence_refs
- acceptance_criteria_count
- duplicate_criterion_codes
- atomicity_boundaries
- failed_assertions
- blocking_assertions
- repair_instructions
- executor_identity
- judge_version
- semantic_validator_path
- semantic_validator_sha256
- semantic_validator_git_blob_sha1
- command
- started_at
- completed_at
- assertions_total
- assertions_passed
- input_sha256
- output_sha256
- evidence_sha256

positive_behavior:
  command: LF_EXECUTOR_IDENTITY=LF_SELF_TEST LF_JUDGE_VERSION=v0.7 python scripts/validate_story_pack.py --self-test
  expected: positive_pass=true and assertions_passed=20 and exit_code=0

negative_cases:
- case: missing_j02_evidence
  expected_result: BLOCKED
  assertion: j02_not_passed_with_evidence
- case: target_decision_not_create_story
  expected_result: BLOCKED
  assertion: target_decision_not_CREATE_STORY
- case: functional_unit_mismatch
  expected_result: RETURN_TO_WORKER
  assertion: target_functional_unit_matches
- case: source_decision_mismatch
  expected_result: RETURN_TO_WORKER
  assertion: source_decision_matches
- case: snapshot_sha_mismatch
  expected_result: RETURN_TO_WORKER
  assertion: source_snapshot_matches
- case: missing_actor
  expected_result: RETURN_TO_WORKER
  assertion: actor_missing
- case: missing_trigger
  expected_result: RETURN_TO_WORKER
  assertion: trigger_missing
- case: empty_main_flow
  expected_result: RETURN_TO_WORKER
  assertion: main_flow_missing
- case: criterion_missing_given
  expected_result: RETURN_TO_WORKER
  assertion: criteria_without_given_when_then
- case: criterion_missing_source_ref
  expected_result: RETURN_TO_WORKER
  assertion: criteria_without_source_ref
- case: duplicate_criterion_code
  expected_result: RETURN_TO_WORKER
  assertion: duplicate_criterion_codes
- case: missing_out_of_scope
  expected_result: RETURN_TO_WORKER
  assertion: out_of_scope_missing
- case: multiple_independent_results
  expected_result: RETURN_TO_WORKER
  assertion: multiple_independent_results
- case: blocking_pending_decision
  expected_result: BLOCKED
  assertion: blocking_pending_decisions
- case: missing_executor_identity
  expected_result: BLOCKED
  assertion: executor_identity_missing
- case: validator_sha_mismatch
  expected_result: BLOCKED
  assertion: validator_sha_unreconciled

repair_matrix:
- assertion_id: identity_schema_valid
  target_path: story_core.identity
  instruction: Reparar A identity conforme al subschema canónico sin escribir C-Q.
  prohibited_shortcuts: [weaken_schema, add_unconfirmed_value, self_approve]
- assertion_id: core_schema_valid
  target_path: story_core.core
  instruction: Reparar B core conforme al subschema canónico sin escribir C-Q.
  prohibited_shortcuts: [weaken_schema, delete_required_key, self_approve]
- assertion_id: multiple_independent_results
  target_path: target_functional_unit
  instruction: Retornar a J02 para separar resultados independientes; no dividir por tamaño visual ni ocultar el segundo resultado.
  prohibited_shortcuts: [ignore_result, merge_without_source, self_approve]
- assertion_id: criteria_without_given_when_then
  target_path: story_core.core.acceptance_criteria
  instruction: Completar cada criterio con given, when, then y fuente resoluble.
  prohibited_shortcuts: [delete_criterion, vague_then, invent_source, self_approve]
- assertion_id: blocking_pending_decisions
  target_path: pending_decisions
  instruction: Resolver mediante fuente o devolver BLOCKED; no cambiar blocking para obtener PASS.
  prohibited_shortcuts: [mark_non_blocking_without_source, delete_decision, self_approve]

output:
  schema_ref: schemas/judge-result.schema.json
  schema_version: v0.5
  required_fields:
  - schema_version
  - judge_code
  - judge_version
  - executor_identity
  - command
  - started_at
  - completed_at
  - exit_code
  - result
  - compliance_bit
  - assertions_total
  - assertions_passed
  - failed_assertions
  - blocking_assertions
  - repairs
  - repair_instructions
  - evidence_refs
  - evidence
  - evidence_sha256
  - input_sha256
  - output_sha256
  - retry_count

prohibitions:
- worker_self_approval
- assertion_deletion_to_obtain_pass
- threshold_reduction_to_obtain_pass
- pass_without_evidence
- pass_without_j02_evidence
- pass_without_source_trace
- pass_with_multiple_independent_results
- require_sections_C_Q_from_A04
- require_context_budget_from_A04
- modify_story_pack_schema_to_make_invalid_core_pass

