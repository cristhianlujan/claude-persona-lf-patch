judge_code: J03_STORY_CORE
version: v0.3
status: CANDIDATO_READ_ONLY
scope: Verifica que cada historia tenga un núcleo funcional completo, atómico, verificable y trazable.
independence: worker_must_not_execute_own_judge
retry_limit: 2
required_inputs:
- approved_functional_units
- story_cores
- source_snapshot
preflight:
- all_required_inputs_are_present
- input_versions_are_compatible
- source_and_evidence_refs_are_resolvable
- judge_is_not_executed_by_the_worker_under_review
assertions:
- assertion_id: stories_without_actor
  target: story_cores
  pass_condition: stories_without_actor = 0
  critical: true
  evidence_required: true
- assertion_id: stories_without_business_goal
  target: story_cores
  pass_condition: stories_without_business_goal = 0
  critical: true
  evidence_required: true
- assertion_id: stories_without_benefit
  target: story_cores
  pass_condition: stories_without_benefit = 0
  critical: true
  evidence_required: true
- assertion_id: stories_without_preconditions
  target: story_cores
  pass_condition: stories_without_preconditions = 0
  critical: true
  evidence_required: true
- assertion_id: stories_without_main_flow
  target: story_cores
  pass_condition: stories_without_main_flow = 0
  critical: true
  evidence_required: true
- assertion_id: stories_without_acceptance_criteria
  target: story_cores
  pass_condition: stories_without_acceptance_criteria = 0
  critical: true
  evidence_required: true
- assertion_id: criteria_without_given_when_then
  target: acceptance_criteria
  pass_condition: criteria_without_given_when_then = 0
  critical: true
  evidence_required: true
- assertion_id: multiple_independent_results
  target: story_cores
  pass_condition: stories_with_multiple_independent_results = 0
  critical: true
  evidence_required: true
- assertion_id: stories_without_out_of_scope
  target: story_cores
  pass_condition: stories_without_out_of_scope = 0
  critical: true
  evidence_required: true
- assertion_id: stories_without_source_trace
  target: story_cores
  pass_condition: stories_without_source_trace = 0
  critical: true
  evidence_required: true
- assertion_id: duplicate_criterion_codes
  target: acceptance_criteria
  pass_condition: duplicate_criterion_codes = 0
  critical: true
  evidence_required: true
fail_if:
- story_without_actor = true
- story_without_acceptance_criteria = true
- multiple_independent_results_in_story = true
block_if:
- approved_functional_units_missing = true
- source_snapshot_unavailable = true
- atomicity_undecidable = true
result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL
result_rules:
  PASS_WITH_EVIDENCE: all applicable assertions pass; compliance_bit=1; evidence_refs non-empty
  RETURN_TO_WORKER: one or more repairable assertions fail; compliance_bit=0; repairs are actionable
  BLOCKED: a blocking condition is true or retry_limit is exhausted; compliance_bit=0
  FAIL: evidence proves an unrecoverable contract violation within this execution; compliance_bit=0
required_evidence:
- story_count
- acceptance_criteria_count
- source_trace_count
- atomicity_decisions
- failed_assertions
- blocking_assertions
- repair_instructions
repair_matrix:
- assertion_id: criteria_without_given_when_then
  instruction: Convertir cada criterio a criterion_code/given/when/then/source_ref.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: multiple_independent_results
  instruction: Retornar a J02; el worker J03 no divide unilateralmente la unidad.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
validator_ref: scripts/validate_story_pack.py
output:
  schema_ref: schemas/judge-result.schema.json
  required_fields:
  - judge_code
  - result
  - compliance_bit
  - failed_assertions
  - blocking_assertions
  - evidence_refs
  - evidence
  - repair_instructions
  - retry_count
  - judged_at
prohibitions:
- worker_self_approval
- assertion_deletion_to_obtain_pass
- threshold_reduction_to_obtain_pass
- unresolved_evidence_reference
- pass_without_evidence
design_sources:
- huggingface/transformers
- freeCodeCamp/freeCodeCamp
- Significant-Gravitas/AutoGPT
