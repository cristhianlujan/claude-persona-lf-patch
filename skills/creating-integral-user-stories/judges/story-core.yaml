judge_code: J03_STORY_CORE
judge_version: v0.7
status: CANDIDATO_READ_ONLY
scope: Verifica exclusivamente el núcleo A-B producido para una unidad funcional CREATE_STORY, su atomicidad, trazabilidad y criterios verificables.
independence: worker_must_not_execute_own_judge
retry_limit: 2

required_inputs:
- target_functional_unit
- story_core
- source_snapshot
- j02_evidence

input_contract:
  envelope_type: object
  additional_envelope_properties_allowed: false
  required_fields:
  - target_functional_unit
  - story_core
  - source_snapshot
  - j02_evidence
  story_core_required_sections:
  - identity
  - core
  identity_schema_ref: schemas/story-pack.schema.json#properties/identity
  core_schema_ref: schemas/story-pack.schema.json#properties/core
  full_story_pack_required_at_j03: false
  sections_c_q_must_not_be_written_by_worker: true

preflight:
- all_required_inputs_are_present
- executor_identity_is_present
- judge_version_matches_contract
- worker_and_judge_identities_are_independent
- target_functional_unit_is_unique
- target_decision_is_CREATE_STORY
- j02_result_is_PASS_WITH_EVIDENCE
- j02_evidence_refs_are_non_empty_and_resolvable
- source_snapshot_version_and_sha256_are_present
- source_refs_are_resolvable_in_snapshot
- identity_and_core_are_objects
- validator_is_available
- validator_is_registered_in_canonical_inventory
- validator_sha_matches_main_and_recorded_evidence
- preflight_is_enforced_before_semantic_assertions

validators:
  static_contract_ref: scripts/validate_package.py#audit_artifact
  identity_schema_ref: schemas/story-pack.schema.json#properties/identity
  core_schema_ref: schemas/story-pack.schema.json#properties/core
  output_schema_ref: schemas/judge-result.schema.json
  semantic_validator_ref: scripts/validate_story_pack.py
  semantic_validator_name: story_core_semantic_validator
  semantic_validator_registration_required: true
  semantic_validator_sha_reconciliation_required: true
  semantic_validator_sha256: 6e4422167eab1f1ab12492c70a8afb71c69bce5f3264c8c57c0c0058c8298d20
  semantic_validator_git_blob_sha1: 404110421b6372601288960140daf5e02f0acc97
  semantic_validator_supabase_row_id: 234
  semantic_validator_registration_ref: supabase://private.lf_skill_artifacts/ART_SCRIPT_VALIDATE_STORY_PACK

runtime_status: AVAILABLE
runtime_blockers: []

runtime_registration:
  semantic_validator_sha256: 6e4422167eab1f1ab12492c70a8afb71c69bce5f3264c8c57c0c0058c8298d20
  semantic_validator_git_blob_sha1: 404110421b6372601288960140daf5e02f0acc97
  semantic_validator_supabase_row_id: 234
  semantic_validator_registration_ref: supabase://private.lf_skill_artifacts/ART_SCRIPT_VALIDATE_STORY_PACK
  strict_positive_assertions: 20/20
  strict_negative_cases: 16/16
  legacy_compatibility_scope: LF_JUDGE_VERSION_v0.6_without_sha_or_registration_only

runtime_command: LF_EXECUTOR_IDENTITY=<independent_executor> LF_JUDGE_VERSION=v0.7 python scripts/validate_story_pack.py <story-core-envelope.json> --evidence-ref <ref> --expected-validator-sha256 6e4422167eab1f1ab12492c70a8afb71c69bce5f3264c8c57c0c0058c8298d20 --registration-ref supabase://private.lf_skill_artifacts/ART_SCRIPT_VALIDATE_STORY_PACK
self_test_command: LF_EXECUTOR_IDENTITY=LF_SELF_TEST LF_JUDGE_VERSION=v0.7 python scripts/validate_story_pack.py --self-test

deterministic_procedure:
- validate_executor_identity_judge_version_and_worker_independence
- validate_required_envelope_and_preflight
- validate_identity_against_story_pack_identity_subschema
- validate_core_against_story_pack_core_subschema
- verify_target_functional_unit_and_source_decision_match
- verify_j02_pass_and_resolvable_evidence
- verify_snapshot_sha_version_and_source_refs
- recompute_atomicity_from_actor_trigger_result_permission_resource_and_state_boundaries
- validate_actor_need_benefit_preconditions_trigger_flows_postconditions_and_out_of_scope
- validate_each_acceptance_criterion_given_when_then_and_source_ref
- reject_duplicate_criterion_codes
- reject_blocking_pending_decisions
- record_actual_expected_for_every_assertion
- emit_schema_valid_judge_result

