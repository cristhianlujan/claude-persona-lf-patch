judge_code: J08_TOKENS_MESSAGES
version: v0.5
status: CANDIDATO_READ_ONLY
scope: Verifica presencia y consistencia de tokens y mensajes, ausencia de valores visuales hardcoded, códigos duplicados y metadatos incompletos.
independence:
  author_must_not_execute_final_judge: true
  executor_identity_required: true
  accepted_executor_types:
  - DETERMINISTIC_RUNNER
  - INDEPENDENT_AGENT
  - CI_RUNNER
  self_approval_forbidden: true
retry_limit: 2
required_inputs:
- story_pack
preflight:
- check_id: input_present
  condition: story_pack is a readable UTF-8 JSON object
  on_fail: BLOCKED
- check_id: judge_version_present
  condition: --judge-version is non-empty
  on_fail: BLOCKED
- check_id: executor_identity_present
  condition: --executor-identity is non-empty
  on_fail: BLOCKED
- check_id: evidence_ref_resolvable
  condition: at least one evidence_ref is resolvable
  on_fail: BLOCKED
- check_id: independent_executor
  condition: executor_identity differs from artifact author identity
  on_fail: BLOCKED
validator:
  entrypoint: scripts/validate_tokens.py
  git_blob_sha1: 7762ff859fd76441519671e5e96bc2e08357ad4a
  command_template: python scripts/validate_tokens.py <story_pack.json> --judge-version <git_blob_sha1> --executor-identity <actor> --evidence-ref <resolvable_ref>
  exit_codes:
    PASS_WITH_EVIDENCE: 0
    RETURN_TO_WORKER: 1
    FAIL: 1
    BLOCKED: 2
schema:
  ref: schemas/judge-result.schema.json
  version: v0.5
  git_blob_sha1: 829de11813df4c5a3ddc430856d12f1617f2124b
  additional_properties: false
assertions:
- tokens_messages_section_missing
- tokens_missing
- messages_missing
- tokens_without_code
- messages_without_code
- hardcoded_color_count
- hardcoded_spacing_count
- unregistered_component_tokens
- messages_without_severity
- messages_without_text_ref
- duplicate_message_codes
pass_if:
- all 11 assertion result collections are empty
- blocking_assertions is empty
- assertions_passed = assertions_total
- compliance_bit = 1
- exit_code = 0
- evidence_refs is non-empty and resolvable
- output validates against judge-result v0.5
return_to_worker_if:
- one or more repairable assertions fail
- repairs are actionable
- exit_code = 1
block_if:
- input or required metadata is missing
- executor is not independent
- evidence reference is unresolvable
- schema or runtime invariant validation cannot execute
fail_if:
- evidence proves an unrecoverable contract violation
- output hash or evidence hash is forged or inconsistent
result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL
required_evidence:
- tokens_declared
- messages_declared
- duplicate_text_refs
- checks
- input_path
output:
  schema_ref: schemas/judge-result.schema.json
  schema_version: v0.5
  required_fields:
  - schema_version
  - judge_code
  - judge_version
  - executor_identity
  - command
  - started_at
  - completed_at
  - exit_code
  - result
  - compliance_bit
  - assertions_total
  - assertions_passed
  - failed_assertions
  - blocking_assertions
  - repairs
  - repair_instructions
  - evidence_refs
  - evidence
  - evidence_sha256
  - input_sha256
  - output_sha256
  - retry_count
  invariants:
  - assertions_passed <= assertions_total
  - PASS requires assertions_passed = assertions_total
  - repairs = repair_instructions
  - completed_at >= started_at
  - output_sha256 is calculated before adding output_sha256
positive_behavior:
  case_id: J08-P01
  expected_result: PASS_WITH_EVIDENCE
  expected_assertions_total: 11
  expected_assertions_passed: 11
negative_behavior:
- case_id: J08-N01
  expected_result: RETURN_TO_WORKER
  must_fail:
  - tokens_without_code
  - unregistered_component_tokens
  - messages_without_code
  - messages_without_severity
  - messages_without_text_ref
  - duplicate_message_codes
  - hardcoded_color_count
  - hardcoded_spacing_count
- case_id: J08-N02
  omit_cli:
  - --judge-version
  - --executor-identity
  expected_result: BLOCKED
  must_block:
  - judge_version_missing
  - executor_identity_missing
repair_matrix:
- assertion_id: hardcoded_color_count
  instruction: Sustituir el valor hardcoded por un token registrado respaldado.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: unregistered_component_tokens
  instruction: Registrar el token o marcarlo CANDIDATO con referencia; no declararlo REGISTERED sin evidencia.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: messages_without_text_ref
  instruction: Agregar referencia resoluble al catálogo de mensajes.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
prohibitions:
- worker_self_approval
- vacuous_pass_on_empty_section
- assertion_deletion_to_obtain_pass
- threshold_reduction_to_obtain_pass
- unresolved_evidence_reference
- pass_without_strict_evidence_envelope
- judged_at_legacy_field
