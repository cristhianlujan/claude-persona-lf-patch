judge_code: J04_FIELD_CONTRACTS
version: v0.3
status: CANDIDATO_READ_ONLY
scope: Verifica cobertura 1:1 y consistencia de visibilidad, edición, validación, privacidad, auditoría y telemetría
  por campo.
independence: worker_must_not_execute_own_judge
retry_limit: 2
required_inputs:
- story_pack
- field_inventory
- field_contracts
- permission_matrix
preflight:
- all_required_inputs_are_present
- input_versions_are_compatible
- source_and_evidence_refs_are_resolvable
- judge_is_not_executed_by_the_worker_under_review
assertions:
- assertion_id: field_count_match
  target: fields
  pass_condition: fields_in_story = field_contracts_count
  critical: true
  evidence_required: true
- assertion_id: fields_without_visibility_rule
  target: fields
  pass_condition: fields_without_visibility_rule = 0
  critical: true
  evidence_required: true
- assertion_id: fields_without_editability_rule
  target: fields
  pass_condition: fields_without_editability_rule = 0
  critical: true
  evidence_required: true
- assertion_id: editable_fields_without_audit
  target: fields
  pass_condition: editable_fields_without_audit_strategy = 0
  critical: true
  evidence_required: true
- assertion_id: pii_without_classification
  target: fields
  pass_condition: pii_fields_without_classification = 0
  critical: true
  evidence_required: true
- assertion_id: pii_analytics
  target: fields
  pass_condition: pii_fields_with_analytics_allowed = 0
  critical: true
  evidence_required: true
- assertion_id: pii_logs
  target: fields
  pass_condition: pii_fields_with_logs_allowed_without_rule = 0
  critical: true
  evidence_required: true
- assertion_id: fields_without_validation_mapping
  target: fields
  pass_condition: fields_without_validation_mapping = 0
  critical: true
  evidence_required: true
- assertion_id: duplicate_field_codes
  target: fields
  pass_condition: duplicate_field_codes = 0
  critical: true
  evidence_required: true
fail_if:
- field_without_contract = true
- pii_field_allows_analytics = true
- editable_field_without_audit = true
block_if:
- field_inventory_missing = true
- permission_matrix_missing_and_required = true
- field_source_conflict = true
result_values:
- PASS_WITH_EVIDENCE
- RETURN_TO_WORKER
- BLOCKED
- FAIL
result_rules:
  PASS_WITH_EVIDENCE: all applicable assertions pass; compliance_bit=1; evidence_refs non-empty
  RETURN_TO_WORKER: one or more repairable assertions fail; compliance_bit=0; repairs are actionable
  BLOCKED: a blocking condition is true or retry_limit is exhausted; compliance_bit=0
  FAIL: evidence proves an unrecoverable contract violation within this execution; compliance_bit=0
required_evidence:
- fields_in_story
- field_contracts_count
- pii_field_count
- editable_field_count
- coverage_details
- failed_assertions
- blocking_assertions
- repair_instructions
repair_matrix:
- assertion_id: field_count_match
  instruction: Crear únicamente los contratos faltantes desde el inventario; no inventar campos.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
- assertion_id: pii_analytics
  instruction: Fijar analytics_allowed=false y revisar propiedades derivadas.
  prohibited_shortcuts:
  - delete_assertion
  - lower_threshold
  - invent_source
  - self_approve
validator_ref: scripts/validate_field_coverage.py
output:
  schema_ref: schemas/judge-result.schema.json
  required_fields:
  - judge_code
  - result
  - compliance_bit
  - failed_assertions
  - blocking_assertions
  - evidence_refs
  - evidence
  - repair_instructions
  - retry_count
  - judged_at
prohibitions:
- worker_self_approval
- assertion_deletion_to_obtain_pass
- threshold_reduction_to_obtain_pass
- unresolved_evidence_reference
- pass_without_evidence
design_sources:
- huggingface/transformers
- freeCodeCamp/freeCodeCamp
- Significant-Gravitas/AutoGPT
