version: v0.5
judge: JUDGE_CONTRATO_CARD_LF
operation: CREACION_CARD_LF
regularization: REGULARIZACION_STEP_GATE_L2L3_001
governance_pre_execution_contract: S26-E-GOVERNED-APPLICABILITY-CARD-FALLBACK-v0.1
pass_if:
  - repo_matrix_read
  - contract_read
  - ekb_readback_present
  - ekb_applicability_resolved
  - card_resolution_readback_present
  - governed_fallback_readback_if_no_card
  - s26_e_pre_execution_gate_pass
  - destination_validated
  - runtime_no_habilitado
  - automatic_impact_bloqueado
  - all_required_pre_judge_steps_pass
  - research_pack_pass
  - research_pack_evidence_strong
  - research_to_rules_matrix_present
  - decision_matrix_present
  - source_sha_present
  - contract_sha_present
  - judge_sha_present
  - github_write_done
  - github_readback_done
  - no_blocking_observations
fail_if:
  - write_without_contract
  - wrong_repository
  - wrong_path
  - runtime_enabled
  - automatic_impact_enabled
  - no_readback
  - missing_execution_id
  - missing_required_pre_judge_step
  - missing_ekb_readback
  - unresolved_ekb_applicability
  - missing_card_resolution_readback
  - no_card_direct_manual_without_structural_fallback
  - critical_card_ambiguity
  - schema_invention
  - data_model_mutation_for_ui
  - missing_s26_e_pre_execution_gate
  - missing_research_pack
  - weak_research_pack_evidence
  - missing_research_to_rules_matrix
  - missing_decision_matrix
  - assistant_freeform_decision
  - missing_source_sha
  - missing_contract_sha
  - missing_judge_sha
  - blocking_observations
result_values:
  - STEP_CLEAN_PASS
  - FAIL
  - BLOCKED
  - RETURN_TO_WORKER
