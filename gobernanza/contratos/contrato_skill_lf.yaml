version: v0.3
status: CANDIDATO_READ_ONLY
operation: CREACION_SKILL_LF
regularization: CREATION_FACTORY_PARITY_REPAIR_V1
required_before_write:
  - read_router
  - read_operational_source
  - read_repo_matrix
  - read_contract
  - validate_repo
  - validate_path
  - validate_file_name
  - research_pack_pass
  - research_pack_evidence_strong
  - research_to_rules_matrix_present
  - decision_matrix_present
  - partial_scope_guard_pass
  - pre_write_execution_binding_gate_pass
  - execution_bound_to_target
  - write_plan_bound
allowed:
  repository: cristhianlujan/claude-persona-lf-patch
  path_prefix: /skills/
  document_status: CANDIDATO
  operational_status: READ_ONLY
  runtime: NO_HABILITADO
  automatic_impact: BLOQUEADO
blocked:
  - write_without_contract
  - write_without_readback
  - write_before_pre_write_execution_binding_gate
  - missing_write_plan
  - written_path_outside_write_plan
  - partial_write
  - readback_file_set_mismatch
  - write_to_marketplace_ssot_for_skills
  - missing_research_pack
  - weak_research_pack_evidence
  - missing_research_to_rules_matrix
  - missing_decision_matrix
  - assistant_freeform_decision
  - enable_runtime
  - mark_vigente
  - mark_aprobado
required_after_write:
  - github_readback
  - commit_sha
  - blob_sha
  - write_plan_write_parity
  - readback_file_set_matches_write
  - all_required_steps_pass
  - source_sha_present
  - contract_sha_present
  - judge_sha_present
  - contract_judge
  - evidence_log_if_available
deep_contracts:
  source: SUPABASE
  table: lf_operation_step_contracts
  operation_filter: CREACION_SKILL_LF
  note: >
    Los contratos profundos por paso (pass_condition, block_condition,
    mini_judge_code, required_evidence_keys) residen en Supabase.
    Este archivo YAML gobierna el contrato de alto nivel (repo, ruta,
    estados, orden pre-write/write/readback y bloqueos). Para auditar
    pasos individuales consultar lf_operation_step_contracts filtrando
    por operation_code = CREACION_SKILL_LF.
