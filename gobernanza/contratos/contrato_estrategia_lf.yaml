  - auto_migrate_existing_strategies
  - enable_runtime
  - automatic_production_promotion
  - close_without_independent_readback
  - close_without_progress_refresh_readback
required_strategy_blocks:
  - problem_statement
  - objective
  - scope
  - non_goals
  - baseline
  - authorities
  - dependencies
  - applicable_policies
  - stages
  - gates
  - tests
  - metrics
  - risks
  - evidence_contract
  - rollback_or_recovery
  - execution_frontier
  - stage_conclusions
  - invalidation_triggers
  - change_log
  - closure_criteria
stage_schema:
  required_fields: [stage_code, objective_or_purpose, status, entry_conditions, actions_or_scope, tests, evidence_required, exit_gate, conclusion_ref]
  prewrite_conclusion_rule: CONCLUSION_REF_RESERVED_ZERO_OR_ONE_CURRENT_CONCLUSION_PER_STAGE
  close_conclusion_rule: EXACTLY_ONE_CURRENT_CONCLUSION_PER_STAGE
  history_rule: APPEND_ONLY_PRIOR_CONCLUSIONS_MAY_BE_STALE_OR_SUPERSEDED
  conclusion_ref_rule: WHEN_CURRENT_CONCLUSION_EXISTS_REF_MUST_MATCH_AT_CLOSE_EVERY_REF_MUST_RESOLVE
execution_frontier_contract:
  during_execution:
    required_fields: [current_stage, current_action, safe_parallel_work, blockers]
  at_close:
    state: CLOSED
    current_stage: TERMINAL_OR_LAST_DECLARED_STAGE
    current_action: NONE
    safe_parallel_work: []
    blockers: []
  progress_alignment:
    required: true
    fields: [current_stage, current_action, next_gate, blockers, safe_parallel_work]
    rule: execution_frontier and metadata.progress cannot project contradictory current state
  stale_frontier_blocks_close: true
  contradictory_current_state_blocks_close: true
strategy_progress_contract:
  contract_code: STRATEGY_PROGRESS_CONTRACT_V1
  carrier: public.lf_strategy_snapshots.metadata.progress
  exact_keyset_required: true
  legacy_payload_preserved: true
  completion_percent_requires_deterministic_denominator: true
  historical_evidence_does_not_increment_current_run_material_units: true
  refresh_events: [EXECUTION_START_CURRENTNESS_READ, AFTER_MATERIAL_MUTATION, AFTER_STAGE_CONCLUSION, BEFORE_RUN_CLOSE, BEFORE_SCHEDULER_REPROGRAM]
  close_requires_independent_progress_readback: true
strategy_type_extensions:
  resolution_required: true
  custom_requires_extension_schema_ref: true
  archetypes:
    GOVERNANCE:
      required_fields: [authority_model, ownership_boundaries, lifecycle_or_policy_impact, conflict_and_waiver_handling, next_gate_or_handoff]
    TECHNICAL_OPERATIONAL:
      required_fields: [runtime_or_system_boundary, failure_modes_and_first_bad_hop, reliability_test_plan, performance_or_resource_metrics_or_explicit_na, rollback_or_recovery, next_gate_or_handoff]
    PRODUCT:
      required_fields: [target_user_or_state, selected_decision, rejected_alternatives, tradeoffs, value_metric_or_success_proxy, observable_acceptance_criteria, next_gate_or_handoff]
    RESEARCH_BENCHMARK:
      required_fields: [research_questions_or_hypotheses, methodology, sample_dataset_or_case_families, evaluation_criteria, leakage_and_bias_controls, next_gate_or_handoff]
    MIGRATION_DEPLOYMENT:
      required_fields: [source_target_versions, parity_contract, rollout_or_cutover_plan, rollback_plan, smoke_ci_and_readback, production_boundary, next_gate_or_handoff]
    CANARY_VALIDATION:
      required_fields: [proof_target, positive_case, negative_cases, exact_evidence_boundary, cleanup_or_demotion_plan, next_gate_or_handoff]
required_operability_controls_when_applicable:
  - durable_start_contract
  - independent_post_write_readback
  - four_route_error_recovery_with_exhaustion
  - timeout_phase_budget
  - scheduler_scope_guard
  - dynamic_concurrency_atomicity_idempotency_retry_partial_failure_tests
  - one_mutating_target_per_child_execution_for_fanout
policy_resolution:
  inheritance: EXPLICIT_NOT_ASSUMED
  missing_required_policy: FAIL_CLOSED
  non_applicable_requires_reason: true
bootstrap:
  route: GOVERNED_PROVENANCE_BOOTSTRAP_ONLY
  precedent_operation: VULNERABILITY_COVERAGE_REPAIR_LF
  production_bootstrap_forbidden: true
readback:
  returning_is_receipt_only: true
  independent_post_write_readback_required: true
  strategy_progress_readback_required: true
  progress_validator_required_on_readback: true
timeout_policy:
  blind_timeout_extension_forbidden: true
  phases: [queue_wait, claim, prefill_or_input_prepare, generation_or_inference, persist, readback, caller_or_job]
recovery_routes: [A_ORIGINAL, B_FOCAL_MINIMAL, C_CANONICAL_EQUIVALENT, D_INDEPENDENT_AUTHORIZED]
required_after_write:
  - github_readback
  - commit_sha
  - source_blob_sha
  - supabase_registration_receipt
  - independent_supabase_registration_readback
  - strategy_snapshot_id
  - exact_strategy_version
  - policy_set_fingerprint_readback
  - strategy_progress_exact_keyset_readback
  - strategy_progress_row_state_alignment_readback
  - strategy_progress_payload_sha_readback
  - deterministic_strategy_progress_validator_readback_pass
  - all_required_steps_pass
  - all_stage_schemas_complete
  - all_stage_conclusions_current_and_bound
  - execution_frontier_terminal
  - strategy_type_extension_complete
  - deterministic_strategy_validator_close_pass
  - contract_sha_present
  - judge_sha_present
  - no_blocking_observations
  - report_output
