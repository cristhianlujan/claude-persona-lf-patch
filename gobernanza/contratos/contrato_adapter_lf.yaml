version: v0.3
status: CANDIDATO_READ_ONLY
operation: CREACION_ADAPTER_LF
regularization: REGULARIZACION_STEP_GATE_L2L3_001
supabase_ref:
  project_id: mhwmirqcgxxukpctffuv
  table: lf_operation_step_contracts
  filter: "operation_code = 'CREACION_ADAPTER_LF'"
  note: >
    Contratos profundos con pass_condition, block_condition y mini_judge_code
    residen en Supabase. Este archivo es la capa declarativa para GitHub y CI.
authority:
  invocation_policy: ROUTER_BOUND_ONLY
  activation_gate_prefix: ROUTER_BOUND_
  base_path_prefix: adapters/
  parent_skill_required: false
  rule: >
    Un adapter puede declarar targets o relaciones explícitas cuando su contrato específico
    lo requiera, pero no se debe inferir owner_skill ni parent_skill como autoridad universal.
required_before_write:
  - read_router
  - read_operational_source
  - read_repo_matrix
  - read_contract
  - validate_repo
  - validate_path
  - validate_file_name
  - duplicate_check
  - classification
  - adapter_design_complete
  - operational_evidence_pack_check
  - research_pack_pass
  - research_pack_evidence_strong
  - research_to_rules_matrix_present
  - decision_matrix_present
  - binding_authority_checked
  - invocation_policy_router_bound
  - declared_target_refs_checked_if_present
allowed:
  repository: cristhianlujan/claude-persona-lf-patch
  path_prefix: /adapters/
  document_status: CANDIDATO
  operational_status: READ_ONLY
  runtime: NO_HABILITADO
  automatic_impact: BLOQUEADO
blocked:
  - write_without_contract
  - write_without_readback
  - missing_duplicate_check
  - binding_authority_missing
  - base_path_outside_adapters
  - activation_gate_not_router_bound
  - invocation_policy_not_router_bound
  - declared_target_ref_not_found
  - parent_skill_requirement_inferred
  - assistant_freeform_decision
  - enable_runtime
  - mark_vigente
  - mark_aprobado
  - write_to_marketplace_ssot_for_adapters
required_after_write:
  - github_readback
  - commit_sha
  - blob_sha
  - all_required_steps_pass
  - source_sha_present
  - contract_sha_present
  - judge_sha_present
  - contract_judge
  - evidence_log_if_available
coverage_note:
  authority_source: SUPABASE_ACT0001_ROUTER
  invocation_policy: ROUTER_BOUND_ONLY
  supabase_step_contracts_materialized: 17
  supabase_step_judge_bindings: 17
  note: >
    La cobertura operativa profunda se resuelve desde Supabase. GitHub mantiene la
    declaración canónica de autoridad y CI sin duplicar los contratos step-level.
