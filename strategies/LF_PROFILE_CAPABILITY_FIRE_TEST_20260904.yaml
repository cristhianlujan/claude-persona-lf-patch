strategy_id: S25
snapshot_code: LF_PROFILE_CAPABILITY_FIRE_TEST_20260904
title: S25 — Prueba de fuego y evolución de Profiles, Cards y Adapters LF
version: v0.2
status: CANDIDATO_READ_ONLY
runtime_state: NO_HABILITADO
impact_policy: BLOQUEADO
strategy_archetype: RESEARCH_BENCHMARK
problem_statement: 'S25 v0.1 definió correctamente la secuencia baseline→diagnóstico→remediación→especialización,
  pero la revisión independiente PFIRE-001 confirmó que el banco de 30 casos aún es
  un catálogo de slots, no un benchmark ejecutable: 30/30 tareas son placeholders,
  30/30 están CANDIDATO, active_count=0, e2e_claim_allowed=false en 30/30 y los 30
  expected_output son idénticos. Además deben separarse readiness gates, behavioral
  scoring, judge/oracle independiente, causalidad por replay/counterfactual y criterios
  cuantitativos antes de decisiones arquitectónicas.'
objective: Consolidar S25 v0.2 como contrato de benchmark pre-ejecución que preserve
  las 30 identidades históricas, materialice primero integridad/holdout/fingerprint/variance/oracle/applicability,
  y sólo después habilite el Fire Test de perfiles actuales.
scope:
- preservar las 30 identidades históricas como PAIRED_REGRESSION_BANK
- crear BLIND_HOLDOUT_CHANNEL separado y fuera del feedback de remediación
- añadir ejes TASK_ARCHETYPE, DOMAIN, STRESS_AXIS y COMPLEXITY sin eliminar familias
  históricas
- reclasificar C/W/S/I/Q/P como READINESS_GATES y separar behavioral metrics
- definir applicability por checkpoint y evidencia observable
- definir execution fingerprint probabilístico completo incluyendo Working Context/EKB/judge/oracle/resolver
- calibrar repeated-run variance antes de fijar repetition policy
- exigir causalidad por replay/counterfactual antes de modificar Profile/Card/Adapter/Policy/Runtime/Profile
  Manager/Test Harness
- usar OWNER_FIRST_SMALLEST_BLAST_RADIUS y exigir evidencia transversal antes de Policy
- normalizar revisión independiente por identidad/canal, no por marca de modelo
- resolver vocabulario de checkpoints y semántica de Card antes de PFIRE-003
- predeclarar decision contract de specialist profiles sin inventar thresholds absolutos
  antes del variance pilot
non_goals:
- no ejecutar el Fire Test en PFIRE-002
- no materializar todavía las 30 tareas exactas ni holdouts en esta creación de v0.2
- no crear ni actualizar Profiles, Cards, Adapters o Policies
- no crear specialist profiles
- no reabrir ni reinterpretar S26
- no habilitar runtime
- no autorizar Gate G, Golden o producción
- no promover ni mergear automáticamente la rama candidata
