title: S25 — Prueba de fuego y evolución de Profiles, Cards y Adapters LF
version: v0.3
status: CANDIDATO_READ_ONLY
runtime_state: NO_HABILITADO
impact_policy: BLOQUEADO
strategy_archetype: RESEARCH_BENCHMARK
problem_statement: S25 v0.2 quedó ligado por error al banco histórico TS-PROGRAMMING-AGENT-E2E-001 de 30 casos. Ese banco
  pertenece a una campaña anterior del Programming Agent y ya no es el marco vigente para certificar Profile Runtime. S26
  consolidó Family Objective Matrix v3 Multidimensional como el marco actual, con jerarquía CASE→OBJECTIVE→FAMILY→TRANSVERSAL→SYSTEM
  y dimensiones FUNCTIONALITY/QUALITY/DEPTH/PERFORMANCE/EVIDENCE/PASS_FAIL. S25 debe consumir esa matriz y extender sólo gaps
  genuinos, sin imponer un conteo fijo de 30 casos.
objective: Recomponer S25 para evaluar Profiles, Cards y Adapters usando S26 Family Objective Matrix v3 como marco vigente;
  reutilizar primero evidencia/casos/objetivos aplicables y crear o extender pruebas sólo donde exista un gap real de objetivo,
  dimensión o aislamiento causal.
scope:
- Retirar TS-PROGRAMMING-AGENT-E2E-001 y el número fijo de 30 casos como dependencia obligatoria de S25.
- Adoptar S26 Family Objective Matrix v3 como contrato de evaluación base.
- Usar jerarquía CASE→OBJECTIVE→FAMILY→TRANSVERSAL→SYSTEM.
- Usar dimensiones FUNCTIONALITY, QUALITY, DEPTH, PERFORMANCE, EVIDENCE y PASS_FAIL.
- Mapear aplicabilidad de objetivos/casos S26 a la pregunta S25 antes de ejecutar; N/A requiere justificación y evidencia.
- Reusar evidencia/corpus S26 cuando sea semánticamente aplicable; extender únicamente gaps genuinos.
- Separar SYSTEM_E2E de ISOLATED_CAPABILITY_DIAGNOSTIC para atribuir Profile/Card/Adapter/Policy/Runtime/Profile Manager/Test
  Harness.
- Mantener owner-first smallest blast radius para remediación.
- Mantener specialist profile como escalamiento excepcional basado en residual gap reproducible.
non_goals:
- No revivir ni modificar la campaña histórica TS-PROGRAMMING-AGENT-E2E-001.
- No exigir 30 casos ni 10x3 como criterio de suficiencia.
- No reconstruir S26 Matrix v3.
- No ejecutar PFIRE-004 en esta recomposición.
- No crear ni actualizar Profiles, Cards, Adapters o Policies.
- No habilitar runtime, Gate G, Golden o producción.
