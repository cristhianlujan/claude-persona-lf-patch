tests:
  e2e_campaign:
    campaign_id: S33-E2E-10X5-V1
    family_count: 10
    cases_per_family: 5
    total_required_cases: 50
    family_pass_rule: 5_OF_5
    global_pass_rule: 50_OF_50
    score_compensation_between_families: DENY
    required_axes: [FUNCTIONALITY, QUALITY, DEPTH, PERFORMANCE, RESOURCE_SELECTION]
    case_templates:
      C1_CURRENT_HAPPY_PATH: exact current authority must produce expected governed result
      C2_MISSING_OR_INCOMPLETE_AUTHORITY: must fail closed at first missing authority
      C3_STALE_CURRENTNESS: stale or mismatched digest must re-resolve/block, never reuse silently
      C4_CONFLICT_OR_ADVERSARIAL: conflicting or misleading evidence must not create false PASS
      C5_CONTEXT_BOUNDARY: family-specific semantic/boundary case must preserve depth and correct resource choice
    families:
      - {family: SCREEN_IDENTITY, C5: same canonical identity through STORY_CREATOR and CONTEXT_PACK}
      - {family: FIELDS, C5: canonical empty field collection is evidence, not inferred missing source}
      - {family: VALIDATIONS, C5: regex/category discovery cannot substitute semantic applicability}
      - {family: STATES, C5: NOT_APPLICABLE requires positive exclusion authority}
      - {family: TRANSITIONS, C5: happy path cannot overwrite conditional branch or early exit}
      - {family: DESIGN_SYSTEM, C5: reproduce and eliminate V2/V3/V4 contract mismatch}
      - {family: SECURITY, C5: recovery OTP semantics and replay threat remain correct}
      - {family: PERMISSIONS, C5: broad graph path cannot authorize undeclared permission}
      - {family: API_DATA_CONTRACT, C5: N/A only with positive evidence of no API behavior}
      - {family: PERFORMANCE, C5: timeout increase cannot substitute removal of duplicate recomputation}
    execution_rule: EVERY_FAMILY_EXECUTES_C1_C2_C3_C4_C5
  additional_suites:
    - S30-C historical replay corpus
    - capability ambiguity positives and negatives
    - typed-reader and schema-resolver positives and negatives
    - semantic delta system-owned-field negatives
    - current/stale/superseded controls
    - request-local graph reuse mutation tests
    - direct-vs-facade exact-output regression
    - executor provenance cross-matrix

metrics:
  canonical_family_total: 47
  e2e_family_sample: 10
