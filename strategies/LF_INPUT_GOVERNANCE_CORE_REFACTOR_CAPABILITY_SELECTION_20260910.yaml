risks:
  - {id: S33-R1, risk: refactor changes proven 5.12 semantics, mitigation: strangler plus exact-output regression}
  - {id: S33-R2, risk: S33 duplicates S30 mechanisms, mitigation: reuse exact S30-B resources; S33 registry only maps capabilities}
  - {id: S33-R3, risk: parallel PR/main movement contaminates lineage, mitigation: frozen base and exact refs; rematerialize integration later}
  - {id: S33-R4, risk: 50 cases hide a weak family by averaging, mitigation: 5/5 each family plus 50/50 global}
  - {id: S33-R5, risk: prompt tuning replaces deterministic guards, mitigation: semantic-gap only and system-owned fields forbidden}
  - {id: S33-R6, risk: performance optimization weakens currentness/depth, mitigation: same-output A/B, mutation tests, request-local only}
  - {id: S33-R7, risk: V2/V3/V4 aliases survive repair, mitigation: one public contract plus explicit temporary compatibility adapter}

evidence_contract:
  claim_ceiling: CANDIDATE_NO_PRODUCTION
  required_per_material_gate: [source_ref, source_digest, implementation_sha, configuration_sha, executed, status, result, evidence_sha, currentness_receipt]
  e2e_case_receipt: [case_id, family_code, fixture_sha, capability_selected, implementation_ref, execution_authority, resource_receipts, functionality, quality, depth, performance, resource_selection, final_result, evidence_sha]
  rules:
    - declarative PASS without execution does not count
    - newer stale/failure invalidates historical PASS
    - model self-verdict is never final authority
    - performance requires observed timing/resource data
    - downstream digest binds exact upstream readback bytes

rollback_or_recovery:
  routes: [A_ORIGINAL, B_FOCAL_MINIMAL, C_CANONICAL_EQUIVALENT, D_INDEPENDENT_AUTHORIZED]
  refactor_pattern: STRANGLER_FACADE
  on_case_failure: freeze evidence, locate first bad hop, repair earliest deterministic point, rerun affected dependency chain
  on_main_movement: do not rebase frozen evidence lane; rematerialize later on fresh integration lane
  on_foreign_lane_conflict: stop write and consume exact SHA read-only

execution_frontier:
  state: IN_PROGRESS
  current_stage: S33-00
  current_action: freeze strategy/isolation and inventory capabilities/resources
  safe_parallel_work: [read-only executable inventory, owned-prefix test fixture preparation]
  blockers: []

stage_conclusions: []

