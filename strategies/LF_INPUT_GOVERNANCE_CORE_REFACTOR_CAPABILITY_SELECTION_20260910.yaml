closure_criteria:
  - every externally selectable executable has a canonical/internal/legacy disposition
  - consumers use capability/facade IDs and cannot directly select legacy/cached/versioned helpers
  - typed data access and schema resolver precede backend reads
  - applicable EKB rules are executable guards or explicit blocks
  - Design Graph/Context/JIT drift is reconciled and the old V3/V4 failing reproduction becomes a passing regression
  - semantic model is used only for a non-derivable gap with strict semantic delta
  - Edge shared transport preserves curator/validator role separation
  - 10 selected families pass 5/5 each and 50/50 total
  - every E2E case passes functionality, quality, depth, performance and resource-selection axes
  - affected 47-family regression remains semantically compatible
  - no production, main merge or foreign-lane write occurs under this strategy

next_gate_or_handoff: >
  Execute S33-00 freeze/readback, then S33-01 resource and capability inventory. Continue without
  micro-approval inside already authorized candidate scope; merge/promotion/production remain separate gates.
