title: "Estrategia 33 — Refactor Core Input Governance, capacidades y E2E 10x5"
status: CANDIDATO_READ_ONLY
runtime_state: PLAN_ONLY
impact_policy: BLOQUEADO
strategy_type: INPUT_GOVERNANCE_CORE_REFACTOR
strategy_archetype: TECHNICAL_OPERATIONAL

problem_statement: >
  Input Governance 5.12 conserva 47 familias y reglas valiosas, pero la evolución por parches dejó
  deuda de integración: 93 funciones fn_input_*, múltiples variantes versionadas/cached, contratos
  superpuestos, runtime semántico UNBOUND y drift ejecutable entre Design Binding Graph V2/V3/V4.
  El agente además necesita seleccionar recursos, funciones, facades, adapters y ejecutores por
  capacidad canónica, no por nombres disponibles ni por heurística del modelo.

objective: >
  Consolidar el core sin reescribir la semántica 5.12: aislar el carril, inventariar capacidades y
  recursos, crear Capability Registry y facades estables, reutilizar S30-B/S30-C, aplicar typed data
  access y deterministic-first, reconciliar Context/JIT/Design Graph, reducir el prompt a semantic
  delta gobernado, limpiar runtime y aprobar un E2E obligatorio de 10 familias x 5 casos = 50 casos.
  Cada caso mide funcionalidad, calidad, profundidad, performance y selección correcta de recurso.

scope:
  - Input Governance version_id=19 candidate
  - Resource and Capability Resolver
  - canonical capability registry and stable facades
  - S30-B typed data access, schema resolver, budgets and execution authority by exact SHA
  - S30-C replay/failure corpus by exact SHA
  - S26 executor_mode/adapter/provider/model provenance principles
  - Context Manifest/JIT and Design Graph V2/V3/V4 reconciliation
  - semantic prompt/delta boundary
  - Edge agent/curator/validator shared runtime cleanup
  - request-local currentness/performance reuse
  - mandatory E2E campaign 10 families x 5 cases

non_goals:
  - change proven 47-family semantics without separate authority
  - production or automatic promotion
  - merge main without a separate governed gate
  - mutate S26 or S30 owned paths
  - rewrite historical migrations
  - increase timeouts to hide duplicate work
  - let GPT, Claude or any model choose arbitrary SQL, RPC or helper names

