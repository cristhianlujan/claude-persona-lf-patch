risks:
  - id: S36-R1
    risk: existing Strategy/Profile qualification suites are mistaken for the complete canonical LF Test Matrix
    mitigation: treat them as reusable inputs and emit NOT_COVERED for missing family/process/dimension/depth rows
  - id: S36-R2
    risk: S36 duplicates S26/S30 ownership or repairs their semantics
    mitigation: S26/S30 contribute invariants; S36 owns reusable assurance only; semantic repair returns to owner
  - id: S36-R3
    risk: new operations/processes silently escape assurance
    mitigation: WP6/WP7 derive universe from canonical registries and fail completeness when unclassified
  - id: S36-R4
    risk: green tests are interpreted as complete assurance
    mitigation: coverage completeness and evidence currentness are distinct from pass rate
  - id: S36-R5
    risk: optional framework becomes required authority
    mitigation: LF canonical schema/contracts remain framework-neutral and removable
  - id: S36-R6
    risk: historical ZIP bundles become operational dependency
    mitigation: source resolution is path/SHA/snapshot/store based; ZIP is excluded
