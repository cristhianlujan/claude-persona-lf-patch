problem_statement: >-
  LF dispone de suites, casos, runners y matrices parciales de qualification, pero no de una única capacidad
  transversal que demuestre por familia y proceso qué está probado, a qué profundidad, contra qué invariantes
  y con qué evidencia. Los hallazgos de S26 y S30 no deben permanecer como pruebas aisladas ni originar matrices paralelas.
objective: >-
  Formalizar S36 como capacidad transversal de Test Assurance para recuperar, normalizar y evolucionar la matriz
  existente hacia una única LF Test Matrix canónica, industrializando assurance, cobertura, regresión, evidencia
  y enrolamiento de nuevas capacidades sin asumir semántica de los owners ni habilitar producción.
scope:
  - recuperar y normalizar la LF Test Matrix existente sin crear una segunda matriz
  - mapear familias y procesos a escenarios, invariantes, dimensiones, profundidad, evidencia y resultado
  - reusar lf_test_suites, lf_test_suite_cases, lf_test_runs, lf_test_requirement_bindings y artefactos asociados donde sean válidos
  - integrar invariantes reutilizables de S26 y S30 en la misma matriz
  - consolidar harness determinístico y normalizar PASS / FAIL / BLOCK / NOT_COVERED
  - evaluar property/stateful, adversarial y performance tooling solo si aporta valor neto y S/0 obligatorio
  - calcular cobertura por familia/proceso/dimensión/profundidad y bloquear completitud falsa
  - hacer visibles automáticamente nuevas operaciones/procesos dentro del modelo de assurance
  - preservar cada defecto escapado confirmado como regresión permanente
  - adoptar familias incrementalmente sin mutar su semántica
non_goals:
  - reescribir S26 o S30
  - crear matrices S26, S30 o transversal paralelas
  - cambiar lógica de negocio de Profiles, Cards, Skills, Strategy o Router
  - adoptar frameworks como autoridad semántica
  - instalar herramientas antes de demostrar el gap y el valor
  - introducir SaaS o licencias obligatorias de pago
  - mutar producción desde el desarrollo de S36
  - habilitar runtime o promover Golden/producción durante creación de estrategia
  - usar ZIP como input operacional o dependencia de S36
