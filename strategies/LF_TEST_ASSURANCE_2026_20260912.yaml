type_extension:
  runtime_or_system_boundary: >-
    S36 may read and classify LF assurance/test/governance sources and produce candidate assurance artifacts;
    it does not own family semantics, production repair, runtime activation or production mutation.
  failure_modes_and_first_bad_hop:
    - parallel or duplicate matrix is created
    - tests pass while required coverage remains missing
    - new operation/process escapes assurance visibility
    - historical evidence is treated as structural guarantee
    - stale evidence is accepted after material change
    - framework becomes semantic authority
    - owner semantic defect is repaired from S36 without authorization
  reliability_test_plan:
    - deterministic matrix completeness checks
    - negative cases for missing rows and unclassified operations
    - Router-to-terminal and required-step reachability regressions
    - idempotency/replay and evidence-readback checks
    - currentness/staleness checks before accepting assurance evidence
    - self-audit after each work package
  performance_or_resource_metrics_or_explicit_na:
    mandatory_license_cost_pen: S/0
    mandatory_paid_saas: NONE
    fast_pr_path: deterministic low-cost
    performance_framework: EVALUATE_IN_WP5
    semantic_paid_api: OPTIONAL_ONLY_IF_EXPLICITLY_APPROVED
  rollback_or_recovery: >-
    Fail closed. Keep family owners unchanged; preserve candidate evidence; use A-D recovery for Factory failures;
    do not register/activate a matrix representation that duplicates or bypasses the canonical stores.
  next_gate_or_handoff: EJECUCION_ESTRATEGIA_LF -> S36-WP01
