  risk: Cards become a static encyclopedia and freeze changing market truth
  mitigation: stable/current split plus freshness contract and research only when required
- id: S38-R2
  risk: Product Director detects concepts but runtime does not actually materialize Cards
  mitigation: WP08 must close PROFILE-CARD-RUNTIME-MATERIALIZATION-GAP-001 before any runtime-complete claim
- id: S38-R3
  risk: duplicate Cards/Skills proliferate
  mitigation: WP01 inventory + semantic dedup before create/update decisions
- id: S38-R4
  risk: S37 duplicates or becomes owner of commercial knowledge
  mitigation: WP10 consumption contract; S37 remains discoverer/consumer only
- id: S38-R5
  risk: research is overused, increasing cost/latency and replacing stable knowledge
  mitigation: explicit currentness decision rule and unnecessary-research metric
- id: S38-R6
  risk: WP execution bypasses missing Strategy Execute Router binding
  mitigation: close creation with blocked handoff; no manual execution or DML bypass
- id: S38-R7
