strategy_type: PRODUCT_COMMERCIAL_INTELLIGENCE
strategy_archetype: PRODUCT
problem_statement: LF depende hoy demasiado del conocimiento personal del usuario o de research ad hoc para detectar patrones
  comerciales de marketplace, pricing, packaging, promociones, campañas, growth, retención y monetización B2B. El Product
  Director existe, pero no dispone de un pack comercial canónico reusable ni de un contrato probado que separe conocimiento
  estable de benchmarks cambiantes.
objective: Crear un contenedor estratégico gobernado para convertir inteligencia comercial de producto/marketplace en una
  capacidad permanente y reusable del PERFIL-PRODUCT-DIRECTOR-LF, con Cards para conocimiento estable, Skills para análisis,
  research/currentness cuando corresponda, decisión final del Product Director y un contrato de consumo por S37 sin duplicar
  ownership.
scope:
- inventariar conocimiento comercial, Cards, Skills, Adapters y bindings actuales de Producto
- definir Product Commercial Intelligence Pack y su taxonomía canónica
- diseñar Cards para marketplace, pricing/packaging, promociones/unit economics, campañas, growth/retención y monetización
  B2B
- definir Skills analíticas necesarias y decidir reuse/create/update con deduplicación
- definir research/currentness adapter o capacidad reusable sin congelar benchmarks cambiantes en Cards
- integrar descubrimiento/selección de Cards con PERFIL-PRODUCT-DIRECTOR-LF bajo contratos de runtime gobernados
- probar E2E carga masiva, Cyber/promoción temporal, packaging y consulta de prácticas actuales
- definir contrato de consumo para que S37 descubra estas capacidades sin ser owner
non_goals:
- modificar S26
- modificar S37-WP01 o convertir S37 en owner de conocimiento comercial
- crear otro Product Director
- crear Cards directamente por SQL cuando existe operación gobernada
- hardcodear benchmarks o precios cambiantes en Cards
- usar research web como sustituto del conocimiento estable estructurado
- habilitar runtime productivo
- promover a Golden o producción
- escribir en main durante la creación candidata
- ejecutar los Work Packages mientras EJECUCION_ESTRATEGIA_LF no tenga binding Router activo
