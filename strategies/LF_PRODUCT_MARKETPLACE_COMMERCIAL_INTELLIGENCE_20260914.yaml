type_extension:
  target_user_or_state: Product Director LF durante trabajo normal de Producto, incluso sin S37; debe reconocer dimensiones
    comerciales relevantes que el usuario puede desconocer y separar conocimiento estable de información current.
  selected_decision: Product Director es owner del Product Commercial Intelligence Pack. Cards contienen patrones estables;
    Cards+Skills contienen marcos analíticos; research/currentness se invoca solo para benchmarks o hechos cambiantes; S37
    consume por discovery sin duplicar activos.
  rejected_alternatives:
  - S37 como owner del conocimiento comercial
  - un único prompt gigante dentro de Product Director
  - research web ad hoc para todo
  - hardcodear campañas/precios/benchmarks actuales en Cards
  - crear un segundo Product Director
  - crear Cards antes de inventario/deduplicación/runtime contract
  tradeoffs:
  - más activos gobernados y mantenimiento a cambio de reuso, trazabilidad y menor dependencia del conocimiento del usuario
  - research selectivo agrega latencia/costo solo cuando currentness es material
  - runtime card discovery exige resolver el gap de materialización antes de afirmar consumo real
  value_metric_or_success_proxy:
    primary: relevant_dimension_recall_without_user_prompting
    secondary:
    - duplicate_card_rate
    - unnecessary_research_rate
    - currentness_evidence_coverage
    - product_canary_pass_rate
    - decision_traceability_rate
  observable_acceptance_criteria:
  - Product Director descubre Cards comerciales pertinentes desde una solicitud de producto sin que el usuario deba nombrarlas
  - conocimiento estable se resuelve sin research innecesario
  - hechos/benchmarks cambiantes disparan research con evidencia y freshness
  - Product Director conserva la decisión final y no inventa business truth
  - no se crean Cards equivalentes duplicadas
  - S37 puede descubrir/convocar Cards sin copiarlas ni ser owner
  - canarios carga masiva, Cyber, packaging y current practices pasan E2E
  - no runtime/Golden/producción sin autorización separada
  next_gate_or_handoff: BLOCKED_PENDING_ROUTER_ENABLEMENT:EJECUCION_ESTRATEGIA_LF -> S38-WP01
