problem_statement: LF requiere una capacidad gobernada para descubrir oportunidades adyacentes, de negocio, de datos y frontier
  sin ampliar automáticamente el alcance autorizado. El prototipo Opportunity Expander demostró viabilidad conceptual pero
  fue iniciado antes de existir un contenedor estratégico canónico, por lo que debe reconciliarse como evidencia de preinvestigación
  y recrearse por el flujo gobernado de perfiles.
objective: Formalizar S37 como estrategia candidata/read-only y establecer un backlog gobernado cuyo primer trabajo ejecutable
  sea crear y validar Opportunity Expander junto con EXPLORATORY_PROFILE_QUALITY_PACK, con ejecución manual primero, evidencia
  reproducible, separación estricta de scope y sin automatización hasta una decisión posterior.
scope:
- formalizar S37 mediante CREACION_ESTRATEGIA_LF
- 'reconciliar PR #756 exclusivamente como prototipo/preinvestigación'
- definir WP-01 Opportunity Expander + Exploratory Profile Quality Pack
- definir WP-02 Manual Exploration E2E y canarios
- definir backlog posterior de perfiles exploratorios, tournament y opportunity registry
- mantener automatización como decisión futura separada
non_goals:
- modificar o reabrir S26
- activar automáticamente Opportunity Expander
- habilitar runtime productivo
- promover perfiles o estrategias a Golden/producción
- 'fusionar PR #756 como implementación oficial'
- modificar main durante la creación candidata
