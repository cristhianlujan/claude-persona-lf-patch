name: PR93 Clean LOTE-E temporary branch

on:
  pull_request:
    branches:
      - lf/architecture-v7-hardening
    types: [synchronize, reopened]

permissions:
  contents: write

jobs:
  clean:
    if: github.head_ref == 'agent/pr93-lote-e' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Normalize LOTE-E labels and remove auxiliaries
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260801180530_writer_evidence_runtime_hardening_v7.sql')
          text = migration.read_text(encoding='utf-8')
          text = text.replace(
              "raise exception 'V7 owner roles must exist before LOTE-D';",
              "raise exception 'V7 owner roles must exist before LOTE-E';",
              1,
          )
          text = text.replace(
              "message='preexisting V7 gate rows require explicit nonce backfill before LOTE-D';",
              "message='preexisting V7 gate rows require explicit nonce backfill before LOTE-E';",
              1,
          )
          migration.write_text(text, encoding='utf-8')

          tests = Path('sandbox/lf_contract_gate_test/PR93_WRITER_V7_ADVERSARIAL_TESTS.sql')
          text = tests.read_text(encoding='utf-8').replace(
              "raise exception 'LOTE-D V7 functions or gate nonce column are missing';",
              "raise exception 'LOTE-E V7 functions or gate nonce column are missing';",
              1,
          )
          tests.write_text(text, encoding='utf-8')

          readback = Path('sandbox/lf_contract_gate_test/PR93_LOTE_C_EVIDENCE_READBACK.sql')
          text = readback.read_text(encoding='utf-8').replace(
              'as pr93_lote_d_evidence_readback;',
              'as pr93_lote_e_evidence_readback;',
              1,
          )
          readback.write_text(text, encoding='utf-8')
          PY
          rm -f \
            .github/workflows/pr93-lote-e-clean.yml \
            .github/workflows/pr93-lote-e-apply.yml

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore(governance): normalize LOTE-E evidence labels"
          git push origin HEAD:agent/pr93-lote-e
