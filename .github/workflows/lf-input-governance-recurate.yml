name: LF Input Governance Recuration

on:
  workflow_dispatch:
    inputs:
      pantalla_ids:
        description: "Comma-separated pantalla_id list. Allowed: 1,2,3,5,43,51,52,53,54,55,56,57,58"
        required: true
        default: "1,2,3,5,43,51,52,53,54,55,56,57,58"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  validate-screens:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pantalla_ids_json: ${{ steps.screens.outputs.pantalla_ids_json }}
    steps:
      - name: Validate requested screens
        id: screens
        env:
          RAW_SCREEN_IDS: ${{ inputs.pantalla_ids }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          allowed={1,2,3,5,43,51,52,53,54,55,56,57,58}
          raw=os.environ['RAW_SCREEN_IDS']
          try:
              ids=[int(part.strip()) for part in raw.split(',') if part.strip()]
          except ValueError as exc:
              raise SystemExit(f'FAIL_RECURATION_SCREEN_ID_INVALID:{exc}')
          if not ids:
              raise SystemExit('FAIL_RECURATION_SCREEN_LIST_EMPTY')
          if len(ids)!=len(set(ids)):
              raise SystemExit('FAIL_RECURATION_SCREEN_DUPLICATE')
          forbidden=[value for value in ids if value not in allowed]
          if forbidden:
              raise SystemExit('FAIL_RECURATION_SCREEN_NOT_ALLOWED:'+json.dumps(forbidden))
          payload=json.dumps(ids,separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('pantalla_ids_json='+payload+'\n')
          print(json.dumps({'pantalla_ids':ids,'required_count':len(ids)},sort_keys=True))
          PY

  recurate-input-readiness:
    needs: validate-screens
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        pantalla_id: ${{ fromJSON(needs.validate-screens.outputs.pantalla_ids_json) }}
    steps:
      - name: Request fresh exact GitHub OIDC identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('lf-profiles-governance-caller-v1');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Recurate one Input Governance screen
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PANTALLA_ID: ${{ matrix.pantalla_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          request={
              'action':'input_readiness_recurate_v1',
              'pantalla_id':int(os.environ['PANTALLA_ID']),
          }
          with open('recuration-request.json','w',encoding='utf-8') as fh:
              json.dump(request,fh,separators=(',',':'),sort_keys=True)
          PY

          code=$(curl --silent --show-error \
            --max-time 150 \
            -o recuration-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @recuration-request.json \
            'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profiles-governance-caller-v1')
          cat recuration-response.json

          python3 - "$code" <<'PY'
          import json, os, sys
          http=int(sys.argv[1])
          requested=int(os.environ['PANTALLA_ID'])
          data=json.load(open('recuration-response.json',encoding='utf-8'))
          result=data.get('result') or {}
          checks={
              'http_success': http==200,
              'outcome_terminal': data.get('outcome')=='TERMINAL',
              'scope': data.get('scope')=='IG_CURATOR_VALIDATOR_REFACTOR_V2_N2',
              'consumer': data.get('consumer')=='STORY_CREATOR',
              'screen_echo': data.get('pantalla_id')==requested,
              'terminal_status_present': isinstance(data.get('terminal_status'),str) and bool(data.get('terminal_status')),
              'result_status_present': isinstance(result.get('status'),str) and bool(result.get('status')),
          }
          failed=[name for name,value in checks.items() if not value]
          if failed:
              raise SystemExit('FAIL_INPUT_GOVERNANCE_RECURATION:'+repr(failed)+':'+json.dumps(data,sort_keys=True)[:12000])
          print('PASS_INPUT_GOVERNANCE_RECURATION_SCREEN')
          print(json.dumps({
              'pantalla_id':requested,
              'terminal_status':data.get('terminal_status'),
              'run_id':data.get('run_id'),
          },sort_keys=True))
          PY
