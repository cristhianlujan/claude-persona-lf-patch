name: LF Input Governance Recuration

on:
  workflow_dispatch:
    inputs:
      pantalla_ids:
        description: "Comma-separated pantalla_id list. Allowed: 1,2,3,5,43,51,52,53,54,55,56,57,58"
        required: true
        default: "1,2,3,5,43,51,52,53,54,55,56,57,58"
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  recurate-input-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate requested screens
        id: screens
        env:
          RAW_SCREEN_IDS: ${{ inputs.pantalla_ids }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          allowed={1,2,3,5,43,51,52,53,54,55,56,57,58}
          raw=os.environ['RAW_SCREEN_IDS']
          try:
              ids=[int(part.strip()) for part in raw.split(',') if part.strip()]
          except ValueError as exc:
              raise SystemExit(f'FAIL_RECURATION_SCREEN_ID_INVALID:{exc}')
          if not ids:
              raise SystemExit('FAIL_RECURATION_SCREEN_LIST_EMPTY')
          if len(ids)!=len(set(ids)):
              raise SystemExit('FAIL_RECURATION_SCREEN_DUPLICATE')
          forbidden=[value for value in ids if value not in allowed]
          if forbidden:
              raise SystemExit('FAIL_RECURATION_SCREEN_NOT_ALLOWED:'+json.dumps(forbidden))
          payload=json.dumps(ids,separators=(',',':'))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              fh.write('pantalla_ids_json='+payload+'\n')
          print(json.dumps({'pantalla_ids':ids,'required_count':len(ids)},sort_keys=True))
          PY

      - name: Request exact GitHub OIDC identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('lf-profiles-governance-caller-v1');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Recurate Input Governance runs
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          PANTALLA_IDS_JSON: ${{ steps.screens.outputs.pantalla_ids_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          request={
              'action':'input_readiness_recurate_v1',
              'pantalla_ids':json.loads(os.environ['PANTALLA_IDS_JSON']),
          }
          with open('recuration-request.json','w',encoding='utf-8') as fh:
              json.dump(request,fh,separators=(',',':'),sort_keys=True)
          PY
          code=$(curl --silent --show-error \
            -o recuration-response.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @recuration-request.json \
            'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profiles-governance-caller-v1')
          cat recuration-response.json
          python3 - "$code" <<'PY'
          import json,sys
          http=int(sys.argv[1])
          data=json.load(open('recuration-response.json',encoding='utf-8'))
          requested=json.load(open('recuration-request.json',encoding='utf-8'))['pantalla_ids']
          results=data.get('results') or []
          checks={
              'http_success': http==200,
              'outcome_ready': data.get('outcome')=='READY',
              'scope': data.get('scope')=='IG_CURATOR_VALIDATOR_REFACTOR_V2_N2',
              'consumer': data.get('consumer')=='STORY_CREATOR',
              'requested_echo': data.get('requested_pantalla_ids')==requested,
              'required_count': data.get('required_count')==len(requested),
              'ready_count': data.get('ready_count')==len(requested),
              'result_count': len(results)==len(requested),
              'all_story_creator': all(row.get('consumer')=='STORY_CREATOR' for row in results),
              'all_ready': all(row.get('status')=='READY' for row in results),
          }
          failed=[name for name,value in checks.items() if not value]
          if failed:
              details=[{
                  'pantalla_id':row.get('pantalla_id'),
                  'status':row.get('status'),
                  'run_id':row.get('run_id'),
                  'error_code':row.get('error_code'),
                  'error_detail':row.get('error_detail'),
              } for row in results if row.get('status')!='READY']
              raise SystemExit('FAIL_INPUT_GOVERNANCE_RECURATION:'+repr(failed)+':'+json.dumps(details,sort_keys=True)[:12000])
          print('PASS_INPUT_GOVERNANCE_RECURATION')
          print(json.dumps({
              'required_count':len(requested),
              'ready_count':data.get('ready_count'),
              'runs':[{'pantalla_id':row.get('pantalla_id'),'run_id':row.get('run_id')} for row in results],
          },sort_keys=True))
          PY
