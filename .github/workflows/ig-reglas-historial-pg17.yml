name: IG Reglas Historial PG17
on:
  pull_request:
    paths:
      - 'supabase/migrations/*lf_ig_reglas_versiones_historial_v1.sql'
      - 'tests/input_governance/reglas_historial_pg17_*.sql'
      - '.github/workflows/ig-reglas-historial-pg17.yml'
permissions:
  contents: read
jobs:
  pg17-history-rollback:
    name: PG17 real BEGIN ROLLBACK, guard y readback
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ig_rule_history_ephemeral
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ig_rule_history_ephemeral
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Instalar cliente PostgreSQL
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          pg_isready
      - name: Ejecutar migracion y tests reales sobre PostgreSQL 17 aislado
        run: |
          set -euo pipefail
          migration="$(find supabase/migrations -maxdepth 1 -type f -name '*lf_ig_reglas_versiones_historial_v1.sql' | sort | tail -1)"
          test -n "$migration"
          psql -X -v ON_ERROR_STOP=1 -f tests/input_governance/reglas_historial_pg17_fixture_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f "$migration"
          psql -X -v ON_ERROR_STOP=1 -f tests/input_governance/reglas_historial_pg17_rollback_v1.sql
