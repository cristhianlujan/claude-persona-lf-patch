name: Platform Adopt R03-B OTel Spike

on:
  push:
    branches:
      - lf/platform-adopt-otel-phoenix-fitgap-001

jobs:
  r03b-otel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install LF runtime dependencies and pinned OpenTelemetry
        run: |
          python -m pip install --upgrade pip
          pip install -r services/profile_runtime_api/requirements.in
          pip install opentelemetry-api==1.44.0 opentelemetry-sdk==1.44.0
      - name: Execute isolated OTel parity privacy spike
        run: |
          python sandbox/lf_contract_gate_test/platform_adopt/otel_phoenix_fitgap_001/run_r03b_otel_spike.py | tee R03B_OTEL_SPIKE_REPORT.json
      - name: Upload isolated R03-B report
        uses: actions/upload-artifact@v4
        with:
          name: r03b-otel-spike-report
          path: R03B_OTEL_SPIKE_REPORT.json
          if-no-files-found: error
