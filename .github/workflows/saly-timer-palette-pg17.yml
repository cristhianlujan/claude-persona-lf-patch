name: SALY Timer Palette PG17 ROLLBACK
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123233000_lf_saly_creative_k_task_orchestration_v2.sql'
      - 'supabase/migrations/20261123234000_lf_saly_creative_owner_state_and_medium_v1.sql'
      - 'sandbox/creative_factory/k_task_v2/**'
      - '.github/workflows/saly-timer-palette-pg17.yml'
  workflow_dispatch:
jobs:
  pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_k_task_v2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_k_task_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: saly_k_task_v2_test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
      - name: Install PG17 client and image decoder
        run: |
          if ! command -v psql >/dev/null; then sudo apt-get install -y postgresql-client; fi
          if ! python3 -c 'from PIL import Image' >/dev/null 2>&1; then sudo apt-get install -y python3-pil; fi
          psql --version
          python3 -c 'from PIL import Image; print("PIL_READY")'
      - name: Execute real pending fixtures and rollback
        run: bash sandbox/creative_factory/k_task_v2/test_pg17.sh
