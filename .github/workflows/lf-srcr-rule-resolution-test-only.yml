name: LF SRCR Rule Resolution Candidate Test Only
on:
  push:
    branches:
      - lf/handoff-srcr-catalog-cascade-20261029
    paths:
      - "profiles/systemic_root_cause_repair_lf/**"
      - ".github/workflows/lf-srcr-rule-resolution-test-only.yml"
permissions:
  contents: read
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only dependency
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.26.0"
      - name: Compile exact candidate
        run: python -m compileall -q profiles/systemic_root_cause_repair_lf
      - name: Verify owner regression and generic policies
        run: |
          python profiles/systemic_root_cause_repair_lf/evals/v11_owner_authority_discovery_cases.py
          python profiles/systemic_root_cause_repair_lf/evals/v12_scoped_policy_resolution_cases.py
      - name: Full profile pack non-regression
        run: python profiles/systemic_root_cause_repair_lf/validators/validate_pack.py profiles/systemic_root_cause_repair_lf
