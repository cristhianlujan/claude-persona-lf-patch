name: LF Programming Analysis Skill Package Regression

# Source-only regression. No OIDC, secrets, database calls, merges or asset mutations.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'skills/programming_analysis/**'
      - '.github/workflows/lf-programming-analysis-package-regression.yml'

permissions:
  contents: read

jobs:
  analysis-package:
    name: analysis-skill-source-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head with no persisted token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local schema validator dependency
        run: python -m pip install 'jsonschema>=4.18,<5'
      - name: Run complete internal A1 source regression
        run: python -m unittest discover -s skills/programming_analysis/steps/a1/evals -p 'test_*.py' -v
      - name: Run analysis A1-A15 package manifest regression
        run: python -m unittest discover -s skills/programming_analysis/evals -p 'test_*.py' -v
