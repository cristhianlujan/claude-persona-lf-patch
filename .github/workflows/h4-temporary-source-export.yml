name: H4 temporary source export (remove before review)
on:
  push:
    branches:
      - lf/h4-ex6-real-chain-evidence-20261109
permissions:
  contents: read
jobs:
  temporary-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Archive only LF sandbox programming candidate source
        run: |
          python3 - <<'PY'
          import tarfile
          from pathlib import Path
          root=Path("sandbox/lf_contract_gate_test/programming_agent_four_stage")
          with tarfile.open("h4-sandbox-source.tar.gz","w:gz") as z:
              for p in sorted(root.rglob("*")):
                  if p.is_file() and not p.is_symlink() and "/__pycache__/" not in str(p):
                      z.add(p,arcname=str(p))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h4-sandbox-source-snapshot
          path: h4-sandbox-source.tar.gz
          retention-days: 1
