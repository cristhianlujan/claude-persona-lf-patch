name: LF IG N4 P10 isolated PostgreSQL (PR 3269 only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ig-n4-p10-isolated-pg-pr3269.yml'

permissions:
  contents: read

jobs:
  n4-p10-isolated:
    if: ${{ github.event.pull_request.number == 3269 && github.event.pull_request.head.repo.full_name == 'cristhianlujan/claude-persona-lf-patch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PGHOST: ''
      PGHOSTADDR: ''
      DATABASE_URL: ''
      SUPABASE_URL: ''
    steps:
      - name: Checkout source with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate P10 shell syntax
        run: bash -n sandbox/lf_contract_gate_test/input_governance/ig_p10_pg17_6_isolated_runner_20261028.sh
      - name: Isolated PostgreSQL 17.6 P10 11 cases and rollback
        run: bash sandbox/lf_contract_gate_test/input_governance/ig_p10_pg17_6_isolated_runner_20261028.sh
