name: LF Router Exact Identity Contract Tests

on:
  pull_request:
    paths:
      - 'supabase/migrations/*lf_router_exact_identity_structured_discovery_v1.sql'
      - 'sandbox/lf_contract_gate_test/canonical_route_guard/test_router_exact_identity_source_v1.py'
      - '.github/workflows/lf-router-exact-identity-contract-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  router-exact-identity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Assert exact identity and fail-closed source contracts
        run: python -m unittest discover -s sandbox/lf_contract_gate_test/canonical_route_guard -p 'test_router_exact_identity_source_v1.py' -v
