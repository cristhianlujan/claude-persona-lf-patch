permissions:
  contents: read

jobs:
  profile-product-director-gpt-native-raw-canonical:
    name: product-director-gpt-native-raw-canonical
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate without production credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run official Product Director validator on exact RAW and negative evidence
        run: |
          set -euo pipefail
          cmp -s \
            sandbox/lf_contract_gate_test/profile_execution_runtime/lf_product_director_ig949_chat_raw_record_candidate_20261030.sql \
            supabase/migrations/20261031004000_lf_profile_product_director_ig949_chat_raw_record_v1.sql
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/test_login_b2b_gpt_chat_raw.py

  profile-screen-selector-fallback-pg17:
    name: profile-screen-selector-fallback-pg17-isolated
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      pg:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: isolated-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 8
    steps:
      - name: Checkout isolated candidate (no production credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test filtered fallback and governed semantic selector in ephemeral PostgreSQL
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.pg.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER"
          cmp -s \
            sandbox/lf_contract_gate_test/profile_execution_runtime/lf_screen_selector_full_catalog_candidate_20261030.sql \
            supabase/migrations/20261030224500_lf_profile_screen_selector_full_catalog_fallback_v1.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < sandbox/lf_contract_gate_test/profile_execution_runtime/lf_screen_selector_full_catalog_pg17_fixture.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < sandbox/lf_contract_gate_test/profile_execution_runtime/lf_screen_selector_full_catalog_candidate_20261030.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < sandbox/lf_contract_gate_test/profile_execution_runtime/test_lf_screen_selector_full_catalog_pg17.sql
          docker exec "$PG_CONTAINER" psql -U postgres -d postgres -At -c \
            "SELECT 'SCREEN_SELECTOR_POST_MIGRATION_MD5='||md5(pg_get_functiondef('public.lf_profile_screen_selector_semantic_prepare_v1(text,jsonb)'::regprocedure));"

          docker exec "$PG_CONTAINER" createdb -U postgres selector_rollback_probe
          docker exec -i "$PG_CONTAINER" psql -U postgres -d selector_rollback_probe -v ON_ERROR_STOP=1 \
            < sandbox/lf_contract_gate_test/profile_execution_runtime/lf_screen_selector_full_catalog_pg17_fixture.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d selector_rollback_probe -v ON_ERROR_STOP=1 \
            < supabase/migrations/20261030224500_lf_profile_screen_selector_full_catalog_fallback_v1.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d selector_rollback_probe -v ON_ERROR_STOP=1 \
            < sandbox/lf_contract_gate_test/profile_execution_runtime/lf_screen_selector_full_catalog_rollback_20261030.sql
          actual_md5="$(docker exec "$PG_CONTAINER" psql -U postgres -d selector_rollback_probe -At -c \
            "SELECT md5(pg_get_functiondef('public.lf_profile_screen_selector_semantic_prepare_v1(text,jsonb)'::regprocedure));")"
          test "$actual_md5" = '7fefd902c745d18bf469b01b3280fe63'
          echo 'PASS_SELECTOR_EXACT_SOURCE_ROLLBACK'


  router-one-path-postgres-isolated:
    name: router-one-path-pg17-isolated-no-remote
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      pg:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: isolated-only
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 8
    steps:
      - name: Checkout candidate without production credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and four retired callers in ephemeral PostgreSQL 17.6
        shell: bash
        env:
          PG_CONTAINER: ${{ job.services.pg.id }}
        run: |
          set -euo pipefail
          test -n "$PG_CONTAINER"
          # Exact source-first requirement: approved candidate and migration must match byte-for-byte.
          cmp -s \
            sandbox/lf_contract_gate_test/profile_execution_runtime/router_stage6_readonly_admission_candidate_20261030.sql \
            supabase/migrations/20261030220500_lf_router_one_path_stage6_stage7_v1.sql
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < sandbox/lf_contract_gate_test/profile_execution_runtime/router_one_path_pg17_live_snapshot_fixture.sql
          {
            echo "SET check_function_bodies=off;"
            cat sandbox/lf_contract_gate_test/profile_execution_runtime/router_stage6_readonly_admission_candidate_20261030.sql
            echo "RESET check_function_bodies;"
          } | docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec -i "$PG_CONTAINER" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < sandbox/lf_contract_gate_test/profile_execution_runtime/test_router_one_path_pg17_isolated.sql
          # Independent transaction/database: restore all original definitions with exact source guards.
          docker exec "$PG_CONTAINER" createdb -U postgres rollback_probe
          docker exec -i "$PG_CONTAINER" psql -U postgres -d rollback_probe -v ON_ERROR_STOP=1 \
            < sandbox/lf_contract_gate_test/profile_execution_runtime/router_one_path_pg17_live_snapshot_fixture.sql
          {
            echo "SET check_function_bodies=off;"
            cat sandbox/lf_contract_gate_test/profile_execution_runtime/router_stage6_readonly_admission_candidate_20261030.sql
            echo "RESET check_function_bodies;"
          } | docker exec -i "$PG_CONTAINER" psql -U postgres -d rollback_probe -v ON_ERROR_STOP=1
          # Capture unmocked metadata source for exact rollback prestate fence.
          docker exec "$PG_CONTAINER" psql -U postgres -d rollback_probe -At -c \
            "SELECT 'UNMOCKED_METADATA_MD5='||md5(pg_get_functiondef('public.lf_router_profile_after_selection_v1(jsonb,jsonb)'::regprocedure));"
          {
            echo "SET check_function_bodies=off;"
            cat sandbox/lf_contract_gate_test/profile_execution_runtime/router_one_path_guarded_rollback_20261030.sql
            echo "RESET check_function_bodies;"
          } | docker exec -i "$PG_CONTAINER" psql -U postgres -d rollback_probe -v ON_ERROR_STOP=1
          docker exec -i "$PG_CONTAINER" psql -U postgres -d rollback_probe -v ON_ERROR_STOP=1 \
            < sandbox/lf_contract_gate_test/profile_execution_runtime/test_router_one_path_pg17_rollback_readback.sql

  router-level2-advisory-contract:
    name: router-level2-advisory-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate sources without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PG-03 C1 exact Git object stack candidate (advisory only)
