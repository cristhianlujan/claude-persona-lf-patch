name: IG Runtime Candidate Judge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - sandbox/ig_cv/n9_requests/request.json

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ig-runtime-candidate-judge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  judge:
    name: ig-runtime-candidate-judge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted base judge source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DB client only
        run: python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.10'

      - name: Self-test trusted request carrier
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/input_governance_runtime_candidate_judge/ig_runtime_candidate_judge_request_v1.py self-test

      - name: Resolve request from exact same-repository PR head
        env:
          REPOSITORY: ${{ github.repository }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "BLOCK_IG_N9_HEAD_REPOSITORY repository=$REPOSITORY head_repository=$HEAD_REPOSITORY"
            exit 2
          fi
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ -z "$CURRENT_MAIN_SHA" ]; then
            echo "BLOCK_IG_N9_CURRENT_MAIN_SHA"
            exit 2
          fi
          if [ "$BASE_SHA" != "$CURRENT_MAIN_SHA" ]; then
            echo "BLOCK_IG_N9_STALE_BASE base=$BASE_SHA current_main=$CURRENT_MAIN_SHA"
            exit 2
          fi
          git fetch --no-tags --depth=1 origin "$HEAD_SHA"
          git show "$HEAD_SHA:sandbox/ig_cv/n9_requests/request.json" > /tmp/ig-n9-request.json
          python3 -m json.tool /tmp/ig-n9-request.json >/dev/null
          echo "IG_N9_HEAD_SHA=$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Execute rollback-only independent flow judge
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/input_governance_runtime_candidate_judge/ig_runtime_candidate_judge_request_v1.py run \
            --request /tmp/ig-n9-request.json \
            --head-sha "$IG_N9_HEAD_SHA"
