name: PR93 Apply LOTE-E

on:
  push:
    branches:
      - agent/pr93-lote-e

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic LOTE-E patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260801180530_writer_evidence_runtime_hardening_v7.sql')
          s = migration.read_text(encoding='utf-8')
          s = s.replace(
              'LOTE-D / CA-N49..CA-N55 deployment and evidence hardening.',
              'LOTE-E / CA-N56..CA-N59 final static evidence hardening.',
              1,
          )
          dep_old = "     or to_regprocedure('private.fn_writer_key_separation_v7_valid()') is null then"
          dep_new = """     or to_regclass('private.lf_writer_hmac_keys_v7') is null
             or to_regprocedure('extensions.digest(bytea,text)') is null
             or to_regprocedure('private.fn_writer_hmac_v7_valid(text,text,text)') is null
             or to_regprocedure('private.fn_writer_hmac_v7_match_key(text,text,text)') is null
             or to_regprocedure('private.fn_consume_writer_proof_v7(text,text,text)') is null
             or to_regprocedure('private.fn_install_writer_hmac_key_v7(text,text,text)') is null
             or to_regprocedure('private.fn_writer_hmac_challenge_v7(text,text)') is null
             or to_regprocedure('private.fn_promote_writer_hmac_key_v7(text,text)') is null
             or to_regprocedure('private.fn_retire_writer_hmac_key_v7(text,text)') is null
             or to_regprocedure('private.fn_writer_key_separation_v7_valid()') is null then"""
          if s.count(dep_old) != 1:
              raise SystemExit('migration dependency marker mismatch')
          s = s.replace(dep_old, dep_new, 1)

          guard_old = """begin
            if new.writer_authentication is distinct from 'GITHUB_OIDC_HMAC_NONCE_V7' then
              return new;
            end if;

            if tg_op='UPDATE' then
              if new.evidence_event_id is distinct from old.evidence_event_id
                 or new.persisted_effects is distinct from old.persisted_effects
                 or new.persisted_effects_sha256 is distinct from old.persisted_effects_sha256
                 or new.writer_nonce_sha256 is distinct from old.writer_nonce_sha256 then
                raise exception using
                  errcode='55000',
                  message='V7 gate proof binding is immutable';
              end if;
            end if;
          """
          guard_new = """begin
            -- CA-N56: a V7 row cannot escape the immutable guard by changing its
            -- authentication mode. Transitions into or out of V7 are also forbidden.
            if tg_op='UPDATE'
               and (
                 old.writer_authentication is not distinct from 'GITHUB_OIDC_HMAC_NONCE_V7'
                 or new.writer_authentication is not distinct from 'GITHUB_OIDC_HMAC_NONCE_V7'
               ) then
              if new.writer_authentication is distinct from old.writer_authentication
                 or new.evidence_event_id is distinct from old.evidence_event_id
                 or new.persisted_effects is distinct from old.persisted_effects
                 or new.persisted_effects_sha256 is distinct from old.persisted_effects_sha256
                 or new.writer_nonce_sha256 is distinct from old.writer_nonce_sha256 then
                raise exception using
                  errcode='55000',
                  message='V7 gate proof binding is immutable';
              end if;
            end if;

            if new.writer_authentication is distinct from 'GITHUB_OIDC_HMAC_NONCE_V7' then
              return new;
            end if;
          """
          if s.count(guard_old) != 1:
              raise SystemExit('migration immutable guard marker mismatch')
          s = s.replace(guard_old, guard_new, 1)
          migration.write_text(s, encoding='utf-8')

          test = Path('sandbox/lf_contract_gate_test/PR93_WRITER_V7_ADVERSARIAL_TESTS.sql')
          t = test.read_text(encoding='utf-8')
          t = t.replace('after LOTE-D.', 'after LOTE-E.', 1)
          parser_marker = """  if private.fn_writer_preimage_scope_v7(
               private.fn_gate_preimage_v7(jsonb_build_object('case','gate'),'PR93-PARSER')
             )<>'GATE' then
            raise exception 'valid framed gate was rejected';
          end if;
          """
          parser_insert = parser_marker + """  if private.fn_writer_preimage_scope_v7(v_valid_manual)<>'RECONCILIATION' then
            raise exception 'manual three-frame control was rejected';
          end if;
          """
          if t.count(parser_marker) != 1:
              raise SystemExit('parser marker mismatch')
          t = t.replace(parser_marker, parser_insert, 1)

          decl_old = "  v_gate bigint; v_retry bigint; v_nonces bigint; v_gates bigint; v_events bigint;"
          decl_new = decl_old + "\n  v_downgrade_rejected boolean:=false; v_message text;"
          if t.count(decl_old) != 1:
              raise SystemExit('gate declaration marker mismatch')
          t = t.replace(decl_old, decl_new, 1)

          gate_marker = """    raise exception 'gate proof was not anchored consistently';
          end if;

          select count(*) into v_nonces from private.lf_reconciliation_writer_nonces_v7;
          """
          gate_insert = """    raise exception 'gate proof was not anchored consistently';
          end if;

          -- CA-N56: downgrading a V7 row must not bypass the immutable binder.
          begin
            update private.lf_gate_test_runs_v3
            set writer_authentication='PR93_DOWNGRADED',
                persisted_effects=persisted_effects||jsonb_build_object('tampered',true),
                persisted_effects_sha256=repeat('0',64),
                writer_nonce_sha256=repeat('0',64)
            where id=v_gate;
          exception when sqlstate '55000' then
            get stacked diagnostics v_message=message_text;
            v_downgrade_rejected:=position('immutable' in v_message)>0;
          end;
          if not v_downgrade_rejected
             or not private.fn_gate_nonce_v7_valid(v_gate) then
            raise exception 'V7 authentication downgrade bypassed immutability';
          end if;

          select count(*) into v_nonces from private.lf_reconciliation_writer_nonces_v7;
          """
          if t.count(gate_marker) != 1:
              raise SystemExit('gate insertion marker mismatch')
          t = t.replace(gate_marker, gate_insert, 1)

          static_start = t.find("  if position(\n       'retiring_until>clock_timestamp()'")
          static_end_marker = "  end if;\nend\n$rotation_overlap$;"
          if static_start < 0:
              raise SystemExit('rotation static marker missing')
          static_end = t.find(static_end_marker, static_start)
          if static_end < 0:
              raise SystemExit('rotation end marker missing')
          behavioral = """  -- CA-N55/H.8: conductually prove an expired RETIRING key is excluded.
          begin
            execute 'alter table private.lf_writer_hmac_keys_v7 disable trigger trg_guard_lf_writer_hmac_keys_v7';
            update private.lf_writer_hmac_keys_v7
            set retiring_at=clock_timestamp()-interval '20 minutes',
                retiring_until=clock_timestamp()-interval '10 minutes'
            where key_id='lf-writer-2099-01-r98'
              and lifecycle_state='RETIRING';
            if not found then
              raise exception 'RETIRING key was unavailable for expiry test';
            end if;
            execute 'alter table private.lf_writer_hmac_keys_v7 enable always trigger trg_guard_lf_writer_hmac_keys_v7';
          exception when others then
            begin
              execute 'alter table private.lf_writer_hmac_keys_v7 enable always trigger trg_guard_lf_writer_hmac_keys_v7';
            exception when others then null;
            end;
            raise;
          end;

          v_nonce_a:=gen_random_uuid()::text||'.'||
            floor(extract(epoch from clock_timestamp()+interval '5 minutes'))::bigint;
          v_signature:=encode(extensions.hmac(
            convert_to(v_preimage_a||':'||v_nonce_a,'UTF8'),
            convert_to('PR93_TEST_ONLY_HMAC_KEY_A_7b15d6e2_DO_NOT_REUSE','UTF8'),'sha256'
          ),'hex');
          if private.fn_consume_writer_proof_v7(v_preimage_a,v_signature,v_nonce_a) then
            raise exception 'expired RETIRING key proof was accepted';
          end if;
          if exists(
            select 1
            from private.lf_reconciliation_writer_nonces_v7
            where nonce_sha256=encode(
              extensions.digest(convert_to(v_nonce_a,'UTF8'),'sha256'),'hex'
            )
          ) then
            raise exception 'expired RETIRING proof persisted a nonce';
          end if;
          """
          t = t[:static_start] + behavioral + t[static_end + len("  end if;\n"):]
          test.write_text(t, encoding='utf-8')

          readback = Path('sandbox/lf_contract_gate_test/PR93_LOTE_C_EVIDENCE_READBACK.sql')
          r = readback.read_text(encoding='utf-8')
          r = r.replace('LOTE-D structural readback', 'LOTE-E structural readback', 1)
          start_marker = "  'definition_checks',jsonb_build_object("
          end_marker = "  ),\n  'gate_event_alignment_gaps',(" 
          start = r.find(start_marker)
          end = r.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('readback definition block markers missing')
          block = """  'definition_checks',jsonb_build_object(
            'gate_validator_private_nonce_column',position(
              't.writer_nonce_sha256'
              in regexp_replace(
                pg_get_functiondef('private.fn_gate_nonce_v7_valid(bigint)'::regprocedure),
                E'\\s+','','g'
              )
            )>0,
            'gate_validator_event_crosscheck',position(
              'e.payload->>''writer_nonce_sha256'''
              in regexp_replace(
                pg_get_functiondef('private.fn_gate_nonce_v7_valid(bigint)'::regprocedure),
                E'\\s+','','g'
              )
            )>0,
            'gate_validator_effects_crosscheck',position(
              'e.payload->''persisted_effects''=t.persisted_effects'
              in regexp_replace(
                pg_get_functiondef('private.fn_gate_nonce_v7_valid(bigint)'::regprocedure),
                E'\\s+','','g'
              )
            )>0,
            'binder_preserves_persisted_effects',position(
              'new.persisted_effects:='
              in regexp_replace(
                pg_get_functiondef('private.fn_bind_gate_writer_nonce_v7()'::regprocedure),
                E'\\s+','','g'
              )
            )=0
            and position(
              'new.persisted_effects_sha256:='
              in regexp_replace(
                pg_get_functiondef('private.fn_bind_gate_writer_nonce_v7()'::regprocedure),
                E'\\s+','','g'
              )
            )=0,
            'binder_guards_auth_transition',position(
              'old.writer_authentication'
              in regexp_replace(
                pg_get_functiondef('private.fn_bind_gate_writer_nonce_v7()'::regprocedure),
                E'\\s+','','g'
              )
            )>0
            and position(
              'new.writer_authenticationisdistinctfromold.writer_authentication'
              in regexp_replace(
                pg_get_functiondef('private.fn_bind_gate_writer_nonce_v7()'::regprocedure),
                E'\\s+','','g'
              )
            )>0,
            'separation_covers_parser',position(
              'fn_writer_preimage_scope_v7'
              in regexp_replace(
                pg_get_functiondef('private.fn_writer_key_separation_v7_valid()'::regprocedure),
                E'\\s+','','g'
              )
            )>0,
            'separation_covers_binder',position(
              'fn_bind_gate_writer_nonce_v7'
              in regexp_replace(
                pg_get_functiondef('private.fn_writer_key_separation_v7_valid()'::regprocedure),
                E'\\s+','','g'
              )
            )>0
          """
          r = r[:start] + block + r[end:]
          readback.write_text(r, encoding='utf-8')

          guards = Path('sandbox/lf_contract_gate_test/PR93_LOTE_C_GUARDS.md')
          g = guards.read_text(encoding='utf-8')
          g = g.replace('# PR #93 · LOTE-D · Guardas CA-N49 a CA-N55', '# PR #93 · LOTE-E · Guardas CA-N56 a CA-N59', 1)
          g = g.replace('exclusión estática de claves `RETIRING` expiradas', 'exclusión conductual de claves `RETIRING` expiradas')
          g += """

## LOTE-E · cierre de hallazgos bajos

### CA-N56 · autenticación inmutable

El binder evalúa tanto `OLD.writer_authentication` como `NEW.writer_authentication`.
Una fila V7 no puede degradarse a otro modo ni una fila anterior puede convertirse en
V7 mediante `UPDATE`. Los cuatro campos de binding continúan inmutables.

### CA-N57 · readback normalizado

Todas las búsquedas sobre `pg_get_functiondef` eliminan whitespace con
`regexp_replace(..., E'\\s+', '', 'g')`. La comprobación negativa cubre tanto
`persisted_effects` como `persisted_effects_sha256`, y se valida el uso de `OLD` para
proteger transiciones de autenticación.

### CA-N58 · control positivo del parser

La batería afirma primero que el vector manual de tres frames es aceptado y luego
comprueba que el mismo vector con un byte adicional es rechazado.

### CA-N59 · dependencias completas

El preflight incluye `extensions.digest(bytea,text)`, la tabla de claves y todas las
funciones externas citadas por el invariante permanente. El binder se define dentro de
la propia migración y se valida mediante el readback posterior.

### H.8 · prueba conductual

En la transacción aislada se vence temporalmente una clave `RETIRING`, con el trigger
de ciclo de vida deshabilitado únicamente dentro de la prueba. Se exige que la firma
sea rechazada y que no se persista ningún nonce. El `ROLLBACK` final restaura todo.

### CA-N60 · decisión

Se conserva el `EXECUTE` explícito de `postgres` sobre la trigger function para que
`CREATE TRIGGER` no dependa de privilegios implícitos del contexto de owner. La función
sigue sin ser invocable como función ordinaria y permanece denegada a roles API.
"""
          guards.write_text(g, encoding='utf-8')
          PY
          rm .github/workflows/pr93-lote-e-apply.yml
      - name: Validate and commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(governance): close LOTE-E static evidence gaps"
          git push
