name: SALY SUNAT commercial gate full PG17 temporary
on:
  push:
    branches: [saly/sunat-elegibilidad-comercial-v1-20261122]
    paths: ['.github/workflows/saly-sunat-gate-parent-pg17-temp.yml','skills/ai_sales_discovery/tests/sunat_governed_batch_pg17.py','supabase/migrations/20261122191500_lf_saly_sunat_commercial_filter_v1.sql']
permissions:
  contents: read
jobs:
  pg17-test-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_pte_writer_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_pte_writer_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saly_pte_writer_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PG17 client and isolated fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = saly_pte_writer_ci
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num;' | cut -c1-2)" = 17
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE ROLE supabase_read_only_user NOLOGIN;"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE SCHEMA saly; CREATE TABLE saly.proyecto(codigo text PRIMARY KEY, estado text NOT NULL); INSERT INTO saly.proyecto VALUES ('SALY-001','ACTIVO');"
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121012002_lf_saly_ventas_discovery_staging_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121014653_lf_saly_ventas_discovery_coverage_fk_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121030300_lf_saly_ventas_pte_writer_core_v1.sql
          python3 - <<'PY'
          from pathlib import Path
          s=Path('supabase/migrations/20261121092501_lf_saly_ventas_pte_snapshot_unique_v1.sql').read_text()
          x=s.index('CREATE UNIQUE INDEX saly_pte_source_batch_once_v1')
          Path('/tmp/saly_pte_idx.sql').write_text(s[x:s.index(';',x)+1]+'\n')
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/saly_pte_idx.sql
      - name: Execute SUNAT original writer and Unicode guard PG17
        run: |
          python3 skills/ai_sales_discovery/tests/sunat_writer_pg17.py
          python3 skills/ai_sales_discovery/tests/sunat_name_whitespace_pg17.py
      - name: Execute repaired governed SUNAT commercial gate full PG17
        run: |
          set -euo pipefail
          python3 -m py_compile skills/ai_sales_discovery/tests/sunat_governed_batch_pg17.py
          python3 skills/ai_sales_discovery/tests/sunat_governed_batch_pg17.py 2>&1 | tee /tmp/saly_sunat_full_test.log
          grep -q PASS_SALY_SUNAT_COMMERCIAL_GATE_PG17_50_49_NO_HABIDO_DYNAMIC_POLICY /tmp/saly_sunat_full_test.log
          grep -q PASS_SUNAT_NATIVE_PLAN_BATCH_ATOMIC_ROLLBACK_READBACK_REPLAY_LEASE_2_BATCHES_2_COMPANIES /tmp/saly_sunat_full_test.log
