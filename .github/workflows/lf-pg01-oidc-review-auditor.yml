name: LF PG-01 OIDC Review Auditor
# H1-C2 D-B. Identity = this workflow file on main + GitHub environment lf-pg01-auditor
# (a different workflow, run and environment than the verifier). It reads the verifier run back
# from the GitHub API itself; the DB accepts it only if that run id is the one whose RS256-verified
# token recorded the subject verification. No verifier token or artifact is consumed.
on:
  workflow_dispatch:
    inputs:
      judge_execution_id:
        description: REVISION_INDEPENDIENTE_ESTRATEGIA_LF execution to attest
        required: true
        type: string
      verifier_run_id:
        description: Run id of the LF PG-01 OIDC Subject Verifier run to audit
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: lf-pg01-oidc-review-${{ inputs.judge_execution_id }}
  cancel-in-progress: false
jobs:
  attest-review:
    environment: lf-pg01-auditor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Independent GitHub readback of the verifier run and attestation submission
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIER_RUN_ID: ${{ inputs.verifier_run_id }}
          JUDGE_EXECUTION_ID: ${{ inputs.judge_execution_id }}
          EDGE_URL: ${{ vars.LF_PG01_OIDC_EDGE_URL }}
        run: |
          set -euo pipefail
          [[ "$VERIFIER_RUN_ID" =~ ^[0-9]+$ ]] || { echo "INPUT_RUN_INVALID"; exit 2; }
          [[ "$VERIFIER_RUN_ID" != "$GITHUB_RUN_ID" ]] || { echo "SAME_RUN_NOT_INDEPENDENT"; exit 2; }
          [[ "$JUDGE_EXECUTION_ID" =~ ^[A-Za-z0-9._:-]{2,200}$ ]] || { echo "INPUT_JUDGE_INVALID"; exit 2; }
          [[ -n "$EDGE_URL" ]] || { echo "EDGE_URL_MISSING"; exit 2; }
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIER_RUN_ID" \
            --jq '{workflow_path:.path,conclusion:.conclusion,head_branch:.head_branch,run_id:(.id|tostring)}' > readback.json
          cat readback.json
          jq -e '.workflow_path==".github/workflows/lf-pg01-oidc-subject-verifier.yml" and .conclusion=="success" and .head_branch=="main"' readback.json >/dev/null \
            || { echo "VERIFIER_RUN_NOT_ACCEPTED"; exit 3; }
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=lf-pg01-review-attestation" | jq -r .value)
          echo "::add-mask::$token"
          jq -n --arg j "$JUDGE_EXECUTION_ID" --arg v "$VERIFIER_RUN_ID" --arg run "$GITHUB_RUN_ID" --arg att "$GITHUB_RUN_ATTEMPT" \
            --slurpfile rb readback.json \
            '{kind:"REVIEW_ATTESTATION",payload:{workflow_run_id:$run,workflow_run_attempt:$att,judge_execution_id:$j,
              verifier_run_id:$v,verifier_run_readback:$rb[0]}}' > body.json
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST "$EDGE_URL" \
            -H "Authorization: Bearer $token" -H "content-type: application/json" --data @body.json)
          cat response.json; echo
          [[ "$code" == "200" ]] || { echo "EDGE_REJECTED:$code"; exit 4; }
