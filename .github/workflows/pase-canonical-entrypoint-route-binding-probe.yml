name: LF PASE Canonical Entrypoint Route Binding Probe

on:
  pull_request:
    branches:
      - lf/pase-canonical-entrypoint-route-binding-v1-20260929

permissions:
  contents: read

jobs:
  exact-head-route-binding-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Assert exact candidate head
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6acb20f8312d8e261f4c49ce9ffd3a7cfddb7371"
      - name: Run merge-route qualification binding tests
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_pase_merge_route_v1.py
