name: H4 temporary EX6 full chain regression gate
on:
  push:
    branches: [lf/h4-ex6-real-chain-evidence-20261109]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: All-in-one v1 diagnostic and unchanged suites
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tools/ex6_one_pass_v1.py
          python3 -m unittest discover -s sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tests -p 'test_ex6*.py' -v
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg06_preflight_candidate/tests/test_pg06_c1_c5_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg07_worker_candidate/tests/test_pg07_c1_c6_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg08_build_candidate/tests/test_pg08_full_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg09_iteration_candidate/tests/test_pg09_iteration_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg10_conflict_candidate/tests/test_pg10_decision_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg11_integrity_candidate/tests/test_pg11_integrity_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg12_identity_candidate/tests/test_pg12_identity_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg13_freeze_candidate/tests/test_pg13_freeze_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg14_testing_handoff_candidate/tests/test_pg14_final_chain_v1.py
