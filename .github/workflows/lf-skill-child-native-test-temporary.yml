name: LF skill child native Issue parser temporary tests

on:
  pull_request:
    paths:
      - 'scripts/lf_profile_native_resume.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/test_profile_resume_issue_request.py'
      - '.github/workflows/lf-skill-child-native-test-temporary.yml'

permissions:
  contents: read

jobs:
  native-issue-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run real parser and runtime tests without OIDC credentials
        run: |
          python3 -m unittest sandbox.lf_contract_gate_test.profile_execution_runtime.test_profile_resume_issue_request -v
