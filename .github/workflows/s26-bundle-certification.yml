name: S26 Bundle Certification Gate

on:
  push:
    paths:
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_bundle_certification.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_bundle_certification_tests.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_real_bundle_certification.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_real_bundle_replay_validator.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_semantic_binding_validator_tests.py"
      - ".github/workflows/s26-bundle-certification.yml"
  pull_request:
    paths:
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_bundle_certification.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_bundle_certification_tests.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_real_bundle_certification.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_real_bundle_replay_validator.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_semantic_binding_validator_tests.py"
      - ".github/workflows/s26-bundle-certification.yml"

permissions:
  contents: read

jobs:
  certify-frozen-bundle-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      S26_C_BASE_SHA: "9632cab4acde619ac7c5b68a3259e31acf5c557d"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run S26 frozen bundle certification regression matrix
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_bundle_certification_tests.py

      - name: Build and certify real S26 frozen bundle
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/s26-real"
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_real_bundle_certification.py \
            --out-dir "${RUNNER_TEMP}/s26-real/unpacked" \
            --zip "${RUNNER_TEMP}/s26-real/S26_Run_E_Certified_Review_Bundle.zip" \
            --receipt-out "${RUNNER_TEMP}/s26-real/certification_receipt.json"
          test -s "${RUNNER_TEMP}/s26-real/S26_Run_E_Certified_Review_Bundle.zip"
          test -s "${RUNNER_TEMP}/s26-real/certification_receipt.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "s26-real"
          receipt = json.loads((root / "certification_receipt.json").read_text(encoding="utf-8"))
          assert receipt["status"] == "PASS", receipt
          assert receipt["fresh_unpack_pass"] is True, receipt
          assert receipt["replay_pass"] is True, receipt
          assert receipt["manifest_reconciled"] is True, receipt
          assert receipt["hashes_verified"] is True, receipt
          print("S26_REAL_BUNDLE_CERTIFICATION_PASS")
          PY

      - name: Upload certified real S26 bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: s26-c-certified-real-bundle
          path: |
            ${{ runner.temp }}/s26-real/S26_Run_E_Certified_Review_Bundle.zip
            ${{ runner.temp }}/s26-real/certification_receipt.json
          if-no-files-found: error
          retention-days: 7
