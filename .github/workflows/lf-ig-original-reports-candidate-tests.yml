name: LF IG original reports candidate | isolated tests

# Candidate-only tests. Does NOT deploy/apply LF migrations, call Supabase,
# execute the Router/Profile, authorize semantic PASS, or promote the PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'supabase/migrations/20261107203000_lf_ig_original_producer_reports_transport_v1.sql'
      - 'sandbox/lf_contract_gate_test/engineering_checkpoints/ig_evo/test_original_producer_reports_once_transport_v1.py'
      - 'docs/input-governance/IG_EVO_ORIGINAL_PRODUCER_REPORT_TRANSPORT_V1.md'
      - '.github/workflows/lf-ig-original-reports-candidate-tests.yml'

permissions:
  contents: read

jobs:
  ig-python-29-on-exact-head:
    name: IG 29 unittest | exact PR SHA | nonproduction
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout the literal PR HEAD, not the synthetic merge
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify frozen source identities and the 29 declared tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          python3 - <<'PY'
          import ast
          import pathlib
          import subprocess

          expected = {
              "supabase/migrations/20261107203000_lf_ig_original_producer_reports_transport_v1.sql": "90fb622dd667a0859d708f3cbe0b4de50b78484c",
              "sandbox/lf_contract_gate_test/engineering_checkpoints/ig_evo/test_original_producer_reports_once_transport_v1.py": "25d5fd7aec141ff3cf1bff60a5665e5620342308",
              "docs/input-governance/IG_EVO_ORIGINAL_PRODUCER_REPORT_TRANSPORT_V1.md": "d0151c247a8e4d228f2767a3734074bc15678ce0",
          }
          for path, wanted in expected.items():
              actual = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if actual != wanted:
                  raise SystemExit(f"IG_CANDIDATE_SOURCE_BLOB_DRIFT:{path}:{actual}")
              print(f"SOURCE_PIN_PASS:{path}:{actual}")
          test_source = pathlib.Path(
              "sandbox/lf_contract_gate_test/engineering_checkpoints/ig_evo/test_original_producer_reports_once_transport_v1.py"
          )
          tree = ast.parse(test_source.read_text(encoding="utf-8"))
          declared = sum(
              isinstance(item, ast.FunctionDef) and item.name.startswith("test_")
              for node in tree.body if isinstance(node, ast.ClassDef)
              for item in node.body
          )
          if declared != 29:
              raise SystemExit(f"IG_EXPECTED_29_TESTS_FOUND:{declared}")
          print(f"TEST_METHOD_COUNT_PASS:{declared}")
          PY

      - name: Execute all 29 Python unittest cases (not mirrored checks)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lf_ig_candidate_evidence
          git rev-parse HEAD | tee .lf_ig_candidate_evidence/head.txt
          python3 --version 2>&1 | tee .lf_ig_candidate_evidence/python_version.txt
          python3 -m unittest discover \
            -s sandbox/lf_contract_gate_test/engineering_checkpoints/ig_evo \
            -p 'test_original_producer_reports_once_transport_v1.py' \
            -v 2>&1 | tee .lf_ig_candidate_evidence/unittest_29.log

      - name: Preserve test logs regardless of result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-ig-original-reports-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lf_ig_candidate_evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  ig-isolated-postgres-readiness:
    name: PostgreSQL 16 disposable readiness | SQL apply NOT_TESTED
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ig_candidate_ci
          POSTGRES_PASSWORD: ig_candidate_ephemeral_only
          POSTGRES_DB: ig_candidate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ig_candidate_ci -d ig_candidate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify disposable PostgreSQL is real and candidate baseline is absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lf_ig_pg_evidence
          git rev-parse HEAD | tee .lf_ig_pg_evidence/head.txt
          test "$(git hash-object supabase/migrations/20261107203000_lf_ig_original_producer_reports_transport_v1.sql)" = "90fb622dd667a0859d708f3cbe0b4de50b78484c"
          docker exec "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U ig_candidate_ci -d ig_candidate_ci -A -t \
            -c "SELECT 'POSTGRESQL_16_DISPOSABLE_READY',current_setting('server_version_num'),current_database();" \
            | tee .lf_ig_pg_evidence/readiness.txt
          printf '%s\n' 'SQL_APPLY_NOT_TESTED: full LF base schema and exact 4 source-function MD5 pins are not installed in this disposable instance.' \
            | tee .lf_ig_pg_evidence/sql_apply_status.txt
          printf '%s\n' 'NO_LIVE_DB_CONNECTION; NO_SQL_APPLY; NO_ROLLBACK_CLAIM; NO_SEMANTIC_PASS.' \
            | tee -a .lf_ig_pg_evidence/sql_apply_status.txt

      - name: Preserve PostgreSQL environment receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-ig-original-reports-pg-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lf_ig_pg_evidence
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
