name: SALY PTE PG17 real concurrence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saly-pte-resguardos-pg17.yml'
      - 'supabase/tests/saly_ventas_pte_writer_core_v1_concurrency.py'
      - 'supabase/tests/saly_ventas_pte_crossrun_pg17_concurrency.py'
      - 'supabase/migrations/*_lf_saly_ventas_pte_writer_core_v1.sql'
      - 'supabase/migrations/*_lf_saly_ventas_pte_snapshot_unique_v1.sql'
      - 'skills/ai_sales_discovery/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-two-session-evidence:
    name: PG17 disposable two-session PTE writer and cross-run negative
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_pte_writer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_pte_writer_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saly_pte_writer_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Assert disposable PG17 and prepare synthetic SALY substrate
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num;' | cut -c1-2)" = '17'
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE ROLE supabase_read_only_user NOLOGIN;"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE SCHEMA saly; CREATE TABLE saly.proyecto(codigo text PRIMARY KEY, estado text NOT NULL); INSERT INTO saly.proyecto VALUES ('SALY-001','ACTIVO');"
      - name: Apply EXACT original L27 and L28 with rollback fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121012002_lf_saly_ventas_discovery_staging_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121014653_lf_saly_ventas_discovery_coverage_fk_v1.sql
      - name: Apply EXACT deployed PTE writer with positive-negative rollback tests
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121030300_lf_saly_ventas_pte_writer_core_v1.sql
      - name: Apply deployed L45 partial unique index to disposable database
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path("supabase/migrations/20261121092501_lf_saly_ventas_pte_snapshot_unique_v1.sql").read_text()
          start=source.index("CREATE UNIQUE INDEX saly_pte_source_batch_once_v1")
          end=source.index(";",start)+1
          ddl=source[start:end].strip()
          assert ddl.endswith("WHERE source_id='PE-PTE' AND scope_key='LIMA_ICA';")
          assert source.count("CREATE UNIQUE INDEX saly_pte_source_batch_once_v1")==1
          Path("/tmp/pte_index_exact.sql").write_text(ddl+"\n")
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/pte_index_exact.sql
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_indexes WHERE schemaname='saly' AND indexname='saly_pte_source_batch_once_v1'")" = '1'
      - name: Compete on SAME consultation in two real PG17 sessions
        run: python3 supabase/tests/saly_ventas_pte_writer_core_v1_concurrency.py
      - name: Compete across TWO different runs on same snapshot
        run: python3 supabase/tests/saly_ventas_pte_crossrun_pg17_concurrency.py
      - name: Verify test state is empty and report PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM saly.ventas_discovery_runs;')" = '0'
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM saly.ventas_hallazgos;')" = '0'
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM saly.ventas_discovery_ingestas;')" = '0'
          echo PASS_PTE_PG17_REAL_TWO_SESSIONS_CLEANUP
      - name: Test scope adapter with alternatives and negative controls
        run: node docs/saly/ventas/candidate/pte/test_normalize_pte_csv.mjs
      - name: Test read-only discovery skill with policy, source, retry, timeout, readback and terminal receipts
        run: node skills/ai_sales_discovery/tests/pte_readonly_pipeline.test.mjs
      - name: Test Radar semantic judge and guard mutations
        run: node profiles/saly_radar_comercial/evals/test_judge.mjs
