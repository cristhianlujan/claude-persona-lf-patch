name: SALY PTE PG17 real concurrence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/saly-pte-resguardos-pg17.yml'
      - 'supabase/tests/saly_ventas_pte_writer_core_v1_concurrency.py'
      - 'supabase/tests/saly_ventas_pte_crossrun_pg17_concurrency.py'
      - 'supabase/migrations/*_lf_saly_ventas_pte_writer_core_v1.sql'
      - 'supabase/migrations/*_lf_saly_ventas_pte_snapshot_unique_v1.sql'
      - 'skills/ai_sales_discovery/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/saly-pte-resguardos-pg17.yml'
      - 'skills/ai_sales_discovery/**'
      - 'supabase/tests/saly_ventas_pte_writer_core_v1_concurrency.py'
      - 'supabase/tests/saly_ventas_pte_crossrun_pg17_concurrency.py'
      - 'supabase/migrations/*_lf_saly_ventas_pte_writer_core_v1.sql'
      - 'supabase/migrations/*_lf_saly_ventas_pte_snapshot_unique_v1.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pg17-two-session-evidence:
    name: PG17 disposable two-session PTE writer and cross-run negative
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_pte_writer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_pte_writer_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saly_pte_writer_ci
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Assert disposable PG17 and prepare synthetic SALY substrate
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num;' | cut -c1-2)" = '17'
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE ROLE supabase_read_only_user NOLOGIN;"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE SCHEMA saly; CREATE TABLE saly.proyecto(codigo text PRIMARY KEY, estado text NOT NULL); INSERT INTO saly.proyecto VALUES ('SALY-001','ACTIVO');"
      - name: Apply EXACT original L27 and L28 with rollback fixtures
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121012002_lf_saly_ventas_discovery_staging_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121014653_lf_saly_ventas_discovery_coverage_fk_v1.sql
      - name: Apply EXACT deployed PTE writer with positive-negative rollback tests
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121030300_lf_saly_ventas_pte_writer_core_v1.sql
      - name: Apply deployed L45 partial unique index to disposable database
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path("supabase/migrations/20261121092501_lf_saly_ventas_pte_snapshot_unique_v1.sql").read_text()
          start=source.index("CREATE UNIQUE INDEX saly_pte_source_batch_once_v1")
          end=source.index(";",start)+1
          ddl=source[start:end].strip()
          assert ddl.endswith("WHERE source_id='PE-PTE' AND scope_key='LIMA_ICA';")
          assert source.count("CREATE UNIQUE INDEX saly_pte_source_batch_once_v1")==1
          Path("/tmp/pte_index_exact.sql").write_text(ddl+"\n")
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/pte_index_exact.sql
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM pg_indexes WHERE schemaname='saly' AND indexname='saly_pte_source_batch_once_v1'")" = '1'
      - name: Compete on SAME consultation in two real PG17 sessions
        run: python3 supabase/tests/saly_ventas_pte_writer_core_v1_concurrency.py
      - name: Compete across TWO different runs on same snapshot
        run: python3 supabase/tests/saly_ventas_pte_crossrun_pg17_concurrency.py
      - name: Verify test state is empty and report PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM saly.ventas_discovery_runs;')" = '0'
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM saly.ventas_hallazgos;')" = '0'
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM saly.ventas_discovery_ingestas;')" = '0'
          echo PASS_PTE_PG17_REAL_TWO_SESSIONS_CLEANUP
      - name: Test scope adapter with alternatives and negative controls
        run: node docs/saly/ventas/candidate/pte/test_normalize_pte_csv.mjs
      - name: Test read-only discovery skill with policy, source, retry, timeout, readback and terminal receipts
        run: node skills/ai_sales_discovery/tests/pte_readonly_pipeline.test.mjs
      - name: Test independent source admission policy, ZIP, privacy, and API gates
        run: node skills/ai_sales_discovery/tests/source_admission_v1.test.mjs
      - name: Test synthetic ZIP security preflight for SUNAT archive candidate
        run: node skills/ai_sales_discovery/tests/zip_archive_preflight.test.mjs
      - name: Test bounded ZIP content CRC, actual sizes and local headers
        run: node skills/ai_sales_discovery/tests/zip_content_verify.test.mjs
      - name: Test SUNAT candidate records bounded stream and schema guards
        run: node skills/ai_sales_discovery/tests/sunat_records_candidate.test.mjs
      - name: Test SUNAT header, privacy and quota guard mutations
        run: node skills/ai_sales_discovery/tests/sunat_records_mutation.test.mjs
      - name: Test integrated SUNAT ZIP to candidate records, full archive CRC barrier
        run: node skills/ai_sales_discovery/tests/sunat_zip_candidate.test.mjs
      - name: Test Radar semantic judge and guard mutations
        run: node profiles/saly_radar_comercial/evals/test_judge.mjs

      - name: Test capped join, CRC barrier, duplicate exclusions, replay and cleanup
        run: python3 skills/ai_sales_discovery/tests/test_sunat_join_batches_v1.py
      - name: Validate resumable clean retry and byte limits
        run: python3 skills/ai_sales_discovery/tests/test_sunat_download_v1.py
      - name: Validate SUNAT dual-observation contract and bounded JSON batches
        run: python3 skills/ai_sales_discovery/tests/test_sunat_company_v1.py
      - name: Test SUNAT pinned QA integrated candidate and dual reader
        run: |
          python3 skills/ai_sales_discovery/tests/test_sunat_dual_stream_v1.py
          python3 skills/ai_sales_discovery/tests/test_sunat_candidate_run_v1.py
      - name: Test SUNAT candidate deterministic batch manifest
        run: python3 skills/ai_sales_discovery/tests/test_sunat_batch_plan_v1.py
      - name: Test SUNAT verified delivery staging and cleanup
        run: python3 skills/ai_sales_discovery/tests/test_sunat_verified_delivery_v1.py
      - name: Test commercial SUNAT governed-loader admission and readback without DB credentials
        run: python3 skills/ai_sales_discovery/tests/test_sunat_commercial_governed_v3.py
      - name: Qualify candidate SUNAT writer with rollback and competing PG17 sessions
        run: python3 skills/ai_sales_discovery/tests/sunat_writer_pg17.py
      - name: Test exact Unicode source-name guard before and after patch in disposable PG17
        run: python3 skills/ai_sales_discovery/tests/sunat_name_whitespace_pg17.py
      - name: Qualify native SUNAT plan and batch transaction candidate in disposable PG17
        run: python3 skills/ai_sales_discovery/tests/sunat_governed_batch_pg17.py

  sunat-source-schema-one-shot:
    name: SUNAT official ZIP schema evidence (bounded read only)
    if: github.event_name == 'push' && (contains(github.event.head_commit.added, 'skills/ai_sales_discovery/tests/sunat_real_schema_probe.py') || contains(github.event.head_commit.modified, 'skills/ai_sales_discovery/tests/sunat_real_schema_probe.py') || contains(github.event.head_commit.message, 'SUNAT esquema real v0.8'))
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Read at most 128 KiB of the official archive, emit schema metadata only
        run: python3 skills/ai_sales_discovery/tests/sunat_real_schema_probe.py

  sunat-full-archive-one-shot:
    name: SUNAT full archive QA (ephemeral aggregate only)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SUNAT archivo completo v0.9')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Test positive and negative fixtures
        run: python3 skills/ai_sales_discovery/tests/sunat_full_archive_probe.py --self-test
      - name: Download official ZIP and inspect header, CRC and aggregate counts
        run: python3 skills/ai_sales_discovery/tests/sunat_full_archive_probe.py

  sunat-join-one-shot:
    name: SUNAT monthly reduced join QA (aggregate only)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SUNAT cruce de padrones v1.0')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify join and rejection fixtures
        run: python3 skills/ai_sales_discovery/tests/sunat_join_probe.py --self-test
      - name: Download and join official sources by RUC, report aggregate evidence
        run: python3 skills/ai_sales_discovery/tests/sunat_join_probe.py

  sunat-history-pilot:
    name: SUNAT historical presence pilot
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SUNAT historia piloto 202310')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 skills/ai_sales_discovery/tests/test_sunat_history_v1.py
      - run: python3 skills/ai_sales_discovery/tests/sunat_history_pilot.py

  sunat-integrated-qa-one-shot:
    name: SUNAT integrated pinned-snapshot QA (aggregate only)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SUNAT flujo integrado v1.3')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 skills/ai_sales_discovery/tests/test_sunat_candidate_run_v1.py
      - run: python3 skills/ai_sales_discovery/tests/sunat_integrated_real_probe.py

  sunat-pinned-plan-one-shot:
    name: SUNAT pinned batch manifest QA (aggregate only)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SUNAT manifiestos integrados v1.7')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 skills/ai_sales_discovery/tests/test_sunat_candidate_run_v1.py
      - run: python3 skills/ai_sales_discovery/tests/sunat_pinned_plan_real_probe.py

  sunat-commercial-governed-v3:
    name: SUNAT commercial-only new RUN with verified 50+ extraction and per-batch readback
    # Main-only, owner-approved one-shot. Not a recurring trigger and not the old 479 plan.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SUNAT comercial ejecutar v3.0')
    environment: lf-merge-train
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: saly-sunat-commercial-v3-once
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate trusted SALY commercial RUN/lease source before reading secrets
        run: |
          set -euo pipefail
          python3 -m py_compile skills/ai_sales_discovery/tests/sunat_commercial_governed_v3.py
          python3 skills/ai_sales_discovery/tests/test_sunat_commercial_governed_v3.py
          python3 skills/ai_sales_discovery/tests/test_sunat_commercial_delivery_v1.py
      - name: Install PostgreSQL client for approved native operation
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Re-verify complete SUNAT source then insert only accepted new RUN batches
        timeout-minutes: 36
        env:
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.mhwmirqcgxxukpctffuv
          PGDATABASE: postgres
          PGSSLMODE: require
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: python3 skills/ai_sales_discovery/tests/sunat_commercial_governed_v3.py

  sunat-first-real-batch:
    name: SUNAT first real batch — governed native writer and independent readback
    # The Train must first apply the activation migration and merge this PR to main.
    # Workflow-dispatch opt-in is a recovery path; no timer or recurring run.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SUNAT insert real v2.4')
    environment: lf-merge-train
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit test first-batch dispatch and tamper/redaction handling
        run: python3 skills/ai_sales_discovery/tests/test_sunat_first_governed_batch_v22.py
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Execute exactly one pinned SUNAT batch against SALY governed writer
        timeout-minutes: 32
        env:
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.mhwmirqcgxxukpctffuv
          PGDATABASE: postgres
          PGSSLMODE: require
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: python3 skills/ai_sales_discovery/tests/sunat_first_governed_batch_v22.py
  
  sunat-current-snapshot-rebaseline:
    name: SUNAT current snapshot hashes and bounded aggregate reconciliation
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SUNAT recalcular snapshot v2.3')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Measure official SUNAT current archive and complete deterministic metadata
        run: python3 skills/ai_sales_discovery/tests/sunat_current_snapshot_measure_v23.py

  sunat-all-sequential-v25:
    name: SUNAT registered plan — batches 2 through 479 STRICTLY sequential
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'SUNAT normalizar nombre v2.7')
    environment: lf-merge-train
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test sequential contract — no DB connection
        run: python3 skills/ai_sales_discovery/tests/test_sunat_remaining_sequential_v25.py
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Execute remaining SUNAT batches serially, halt and preserve committed prefix on failure
        timeout-minutes: 345
        env:
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.mhwmirqcgxxukpctffuv
          PGDATABASE: postgres
          PGSSLMODE: require
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: python3 skills/ai_sales_discovery/tests/sunat_remaining_sequential_v25.py
