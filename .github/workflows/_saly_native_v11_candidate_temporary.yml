name: SALY Native V11 candidate Python PG17 TEMPORARY
on:
  push:
    branches:
      - saly-creative-queue-pg17-pilot-20261122
jobs:
  v11_python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: V08 V09 V11 source tests
        run: python -m unittest -v sandbox.creative_factory.queue_v08.test_native_archive_bridge_v1 sandbox.creative_factory.queue_v09.test_dispatch_fence_v1 sandbox.creative_factory.queue_v11.test_native_handoff_reservation_bridge_v1
      - name: B25 B28 V11 mutational assertions
        env:
          SALY_MUTATION_SANDBOX: '1'
        run: python sandbox/creative_factory/queue_v11/test_mutations_v1.py
  v11_pg17_real_v10_ports:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: saly_queue_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: saly_queue_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: PostgreSQL client (no production credentials)
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Load V02 V05 V06 V10 real candidate SQL on disposable PG17
        run: |
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = saly_queue_test
          test -z "${PGPASSWORD:-}"
          psql -XAt -v ON_ERROR_STOP=1 -c "SHOW server_version_num" | grep -qE '^17[0-9]{4}$'
          psql -X -q -v ON_ERROR_STOP=1 -f sandbox/creative_factory/queue_v02/fixture_pg17.sql
          psql -X -q -v ON_ERROR_STOP=1 -f sandbox/creative_factory/queue_v05/001_saly_native_render_wire_candidate.sql
          psql -X -q -v ON_ERROR_STOP=1 -f sandbox/creative_factory/queue_v06/001_saly_delivery_attestation_guard_candidate.sql
          psql -X -q -v ON_ERROR_STOP=1 -f sandbox/creative_factory/queue_v10/001_saly_native_dispatch_reservation_candidate.sql
          psql -X -q -v ON_ERROR_STOP=1 -f sandbox/creative_factory/queue_v10/setup_pg17.sql
      - name: Python V11 through actual V10 PG17 SQL RPC and readback
        run: python sandbox/creative_factory/queue_v11/test_real_v10_ports_pg17.py
      - name: Restore local test DB and verify V11 never delivered
        run: |
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c "select count(*) from saly.creative_queue_native_delivery_evidence_v1")" = 0
          psql -X -q -v ON_ERROR_STOP=1 -f sandbox/creative_factory/queue_v02/fixture_pg17.sql
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c "select coalesce(to_regclass('saly.creative_queue_native_dispatch_reservations_v1')::text,'NONE')")" = NONE
          echo PASS_V11_RESTORE_NO_SUPABASE
