name: lf-contract-check

# Manual compatibility caller only. Ordinary pull-request and main-push validation are owned by PASE.
# This legacy identity has no automatic trigger after the PASE source-authority cutover.
# It remains workflow_dispatch-only for bounded rollback/diagnostic compatibility.
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  lf-pase:
    name: lf-contract-check
    uses: ./.github/workflows/pase.yml
