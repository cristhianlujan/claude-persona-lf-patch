name: lf-contract-check

# Compatibility caller only. Ordinary pull-request validation is owned by PASE.
# This legacy identity remains temporarily on push/main so post-merge evidence and
# reconciliation keep working until the canonical source-authority/push cutover
# is proven. It delegates execution to the single reusable PASE body.
on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  lf-pase:
    name: lf-contract-check
    uses: ./.github/workflows/pase.yml
