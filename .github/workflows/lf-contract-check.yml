name: lf-contract-check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "lf/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  lf-contract-check:
    name: lf-contract-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate declared governance paths
        run: |
          pip install pyyaml
          python3 scripts/validate_declared_paths.py --repo-root .

      - name: Verify hosted Supabase Data API excludes net schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          project = os.environ["SUPABASE_PROJECT_ID"]
          if not token:
              raise SystemExit("FAIL_SUPABASE_CONTROL_PLANE_TOKEN_MISSING")

          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project}/postgrest",
              headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "lf-contract-check-pr93",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  config = json.loads(response.read().decode("utf-8"))
          except (urllib.error.URLError, TimeoutError, UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit(f"FAIL_SUPABASE_POSTGREST_CONFIG_READBACK: {type(exc).__name__}") from exc

          schema_value = None
          schema_field = None
          for candidate in ("db_schema", "db_schemas", "schemas"):
              if candidate in config:
                  schema_field = candidate
                  schema_value = config[candidate]
                  break
          if schema_value is None:
              keys = ",".join(sorted(str(key) for key in config))
              raise SystemExit(f"FAIL_SUPABASE_POSTGREST_SCHEMA_FIELD_MISSING: keys={keys}")

          if isinstance(schema_value, str):
              schemas = {part.strip() for part in schema_value.split(",") if part.strip()}
          elif isinstance(schema_value, list):
              schemas = {str(part).strip() for part in schema_value if str(part).strip()}
          else:
              raise SystemExit(
                  "FAIL_SUPABASE_POSTGREST_SCHEMA_FIELD_TYPE: "
                  f"field={schema_field} type={type(schema_value).__name__}"
              )

          if not schemas:
              raise SystemExit("FAIL_SUPABASE_POSTGREST_EXPOSED_SCHEMAS_EMPTY")
          if "net" in schemas:
              raise SystemExit("FAIL_SUPABASE_NET_SCHEMA_EXPOSED")

          rendered = ",".join(sorted(schemas))
          print(f"PASS_SUPABASE_NET_SCHEMA_NOT_EXPOSED: field={schema_field} schemas={rendered}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("### Supabase Data API control-plane readback\n")
                  handle.write(f"- exposed schemas: `{rendered}`\n")
                  handle.write("- `net` exposed: `false`\n")
          PY

      - name: Enforce LF migration source parity after checkpoint
        env:
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
          LF_MIGRATION_CUTOVER: "20260808031006"
          LF_MIGRATION_CLASSIFICATION_BASELINE_END: "20260822195004"
          LF_MIGRATION_GRANDFATHERED_COUNT: "154"
          LF_MIGRATION_GRANDFATHERED_SHA256: "f6694a57d984bb02266630c12151e6334ef40535d17f7986be6e1820956186a5"
        run: |
          set -euo pipefail
          if [ -z "${PGPASSWORD:-}" ]; then
            echo "FAIL_LF_MIGRATION_PARITY_DB_PASSWORD_MISSING"
            exit 1
          fi
          export PGHOST="$SUPABASE_POOLER_HOST"
          export PGPORT=5432
          export PGUSER="postgres.${SUPABASE_PROJECT_ID}"
          export PGDATABASE=postgres
          export PGSSLMODE=require

          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:17.6 psql -X -v ON_ERROR_STOP=1 --csv -t -c "select version,coalesce(name,''),encode(convert_to(array_to_string(statements,E'\n'),'UTF8'),'hex') from supabase_migrations.schema_migrations where version > '${LF_MIGRATION_CUTOVER}' and (name like 'pr93\_%' escape '\' or name like 'lf\_%' escape '\' or name like 'programacion\_story\_agent\_task\_%' escape '\' or name like 'programacion\_task\_sizing\_%' escape '\' or name like 'programacion\_task\_dependency\_%' escape '\' or name like 'programacion\_agent\_task\_%' escape '\' or name like 'programacion\_dependency\_context\_%' escape '\' or name like 'programacion\_propagate\_execution\_%' escape '\' or name like 'programacion\_deprecate\_declared\_independence\_%' escape '\' or name like 'programacion\_revoke\_security\_definer\_%' escape '\' or name like 'programacion\_worker\_spec\_%' escape '\' or name like 'programacion\_prog017\_%' escape '\') order by version" > "$RUNNER_TEMP/lf-managed-migrations.csv"

          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:17.6 psql -X -v ON_ERROR_STOP=1 --csv -t -c "select version,coalesce(name,'') from supabase_migrations.schema_migrations where version > '${LF_MIGRATION_CUTOVER}' order by version" > "$RUNNER_TEMP/lf-post-cutover-migrations.csv"

          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:17.6 psql -X -v ON_ERROR_STOP=1 --csv -t -c "with x as (select version,coalesce(name,'') as name,array_to_string(statements,E'\n') as sql_text from supabase_migrations.schema_migrations where version > '${LF_MIGRATION_CUTOVER}' and version <= '${LF_MIGRATION_CLASSIFICATION_BASELINE_END}' and not (coalesce(name,'') like 'pr93\_%' escape '\' or coalesce(name,'') like 'lf\_%' escape '\' or coalesce(name,'') like 'programacion\_story\_agent\_task\_%' escape '\' or coalesce(name,'') like 'programacion\_task\_sizing\_%' escape '\' or coalesce(name,'') like 'programacion\_task\_dependency\_%' escape '\' or coalesce(name,'') like 'programacion\_agent\_task\_%' escape '\' or coalesce(name,'') like 'programacion\_dependency\_context\_%' escape '\' or coalesce(name,'') like 'programacion\_propagate\_execution\_%' escape '\' or coalesce(name,'') like 'programacion\_deprecate\_declared\_independence\_%' escape '\' or coalesce(name,'') like 'programacion\_revoke\_security\_definer\_%' escape '\' or coalesce(name,'') like 'programacion\_worker\_spec\_%' escape '\' or coalesce(name,'') like 'programacion\_prog017\_%' escape '\')) select count(*)::text,encode(extensions.digest(convert_to(coalesce(string_agg(version||E'\n'||name||E'\n'||sql_text,E'\n--MIGRATION--\n' order by version),''),'UTF8'),'sha256'),'hex') from x" > "$RUNNER_TEMP/lf-grandfathered-migrations.csv"

          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:17.6 psql -X -v ON_ERROR_STOP=1 --csv -t -c "select count(*)::text,encode(extensions.digest(convert_to(string_agg(version||E'\n'||coalesce(name,'')||E'\n'||array_to_string(statements,E'\n--STATEMENT--\n'),E'\n--MIGRATION--\n' order by version),'UTF8'),'sha256'),'hex') from supabase_migrations.schema_migrations where version between '20260801063708' and '20260801170332'" > "$RUNNER_TEMP/lf-legacy-checkpoint.csv"

          python3 - <<'PY'
          import csv
          import hashlib
          import os
          import pathlib
          import re

          cutover = os.environ["LF_MIGRATION_CUTOVER"]
          classification_baseline_end = os.environ["LF_MIGRATION_CLASSIFICATION_BASELINE_END"]
          grandfathered_count = os.environ["LF_MIGRATION_GRANDFATHERED_COUNT"]
          grandfathered_sha = os.environ["LF_MIGRATION_GRANDFATHERED_SHA256"]
          migrations = pathlib.Path("supabase/migrations")
          marker_re = re.compile(
              r"^-- LF_MIGRATION_SOURCE_CHECKPOINT_V1 "
              r"cutover=(\d{14}) legacy_start=(\d{14}) legacy_end=(\d{14}) "
              r"legacy_count=(\d+) legacy_sha256=([0-9a-f]{64})$"
          )
          managed_prefixes = (
              "pr93_",
              "lf_",
              "programacion_story_agent_task_",
              "programacion_task_sizing_",
              "programacion_task_dependency_",
              "programacion_agent_task_",
              "programacion_dependency_context_",
              "programacion_propagate_execution_",
              "programacion_deprecate_declared_independence_",
              "programacion_revoke_security_definer_",
              "programacion_worker_spec_",
              "programacion_prog017_",
          )
          classified_external_prefixes = (
              "input_governance_",
              "programacion_input_governance_",
              "gov_router_act0001_",
              "router_ui_capability_canary_",
              "router_keyword_verification_canary_",
              "router_generic_keyword_dispatch_",
              "router_generic_tie_break_",
          )
          classified_external_names = {
              "retire_b2b_auth005_legacy_totp_screen",
          }

          def classified(name: str) -> bool:
              return name.startswith(managed_prefixes + classified_external_prefixes) or name in classified_external_names

          if not classified("programacion_worker_spec_probe"):
              raise SystemExit("FAIL_CI009_SELFTEST_MANAGED_WORKER_SPEC")
          if not classified("programacion_prog017_probe"):
              raise SystemExit("FAIL_CI009_SELFTEST_MANAGED_PROG017")
          if not classified("input_governance_probe"):
              raise SystemExit("FAIL_CI009_SELFTEST_EXTERNAL_OWNER")
          if classified("totally_unknown_future_migration"):
              raise SystemExit("FAIL_CI009_SELFTEST_UNKNOWN_ACCEPTED")

          markers = []
          for path in sorted(migrations.glob("*.sql")):
              first = path.read_text(encoding="utf-8").splitlines()[0] if path.stat().st_size else ""
              match = marker_re.fullmatch(first)
              if match:
                  markers.append((path, match))
          if len(markers) != 1:
              raise SystemExit(f"FAIL_LF_MIGRATION_CHECKPOINT_COUNT: {len(markers)}")

          checkpoint_path, marker = markers[0]
          marker_cutover, legacy_start, legacy_end, legacy_count, legacy_sha = marker.groups()
          if marker_cutover != cutover:
              raise SystemExit("FAIL_LF_MIGRATION_CHECKPOINT_CUTOVER")

          legacy_file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lf-legacy-checkpoint.csv"
          with legacy_file.open(newline="", encoding="utf-8") as handle:
              legacy_rows = list(csv.reader(handle))
          if len(legacy_rows) != 1:
              raise SystemExit("FAIL_LF_MIGRATION_LEGACY_ROW_COUNT")
          observed_count, observed_sha = legacy_rows[0]
          if observed_count != legacy_count or observed_sha != legacy_sha:
              raise SystemExit("FAIL_LF_MIGRATION_LEGACY_ATTESTATION")

          grandfather_file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lf-grandfathered-migrations.csv"
          with grandfather_file.open(newline="", encoding="utf-8") as handle:
              grandfather_rows = list(csv.reader(handle))
          if len(grandfather_rows) != 1 or len(grandfather_rows[0]) != 2:
              raise SystemExit("FAIL_LF_MIGRATION_GRANDFATHER_BASELINE_ROW")
          observed_grandfathered_count, observed_grandfathered_sha = grandfather_rows[0]
          if observed_grandfathered_count != grandfathered_count or observed_grandfathered_sha != grandfathered_sha:
              raise SystemExit(
                  "FAIL_LF_MIGRATION_GRANDFATHER_BASELINE: "
                  f"expected={grandfathered_count}/{grandfathered_sha} "
                  f"observed={observed_grandfathered_count}/{observed_grandfathered_sha}"
              )

          all_remote_file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lf-post-cutover-migrations.csv"
          with all_remote_file.open(newline="", encoding="utf-8") as handle:
              all_remote_rows = list(csv.reader(handle))
          unclassified_remote = []
          for row in all_remote_rows:
              if len(row) != 2:
                  raise SystemExit(f"FAIL_LF_MIGRATION_CLASSIFICATION_ROW: {row!r}")
              version, name = row
              if version > classification_baseline_end and not classified(name):
                  unclassified_remote.append(f"{version}_{name}")
          if unclassified_remote:
              raise SystemExit(
                  "FAIL_UNCLASSIFIED_POST_CUTOVER_MIGRATION: remote=" + ",".join(unclassified_remote)
              )

          def canonical(sql: str) -> bytes:
              sql = sql.replace("\r\n", "\n").replace("\r", "\n")
              lines = [line for line in sql.split("\n") if not line.lstrip().startswith("--")]
              return "\n".join(lines).rstrip("\n").encode("utf-8")

          local = {}
          filename_re = re.compile(r"^(\d{14})_(.+)\.sql$")
          for path in sorted(migrations.glob("*.sql")):
              match = filename_re.fullmatch(path.name)
              if not match:
                  continue
              version, name = match.groups()
              if version <= cutover:
                  continue
              if not name.startswith(managed_prefixes):
                  if version > classification_baseline_end and not classified(name):
                      raise SystemExit(f"FAIL_UNCLASSIFIED_POST_CUTOVER_MIGRATION: git={path.name}")
                  continue
              local[version] = (
                  name,
                  hashlib.sha256(canonical(path.read_text(encoding="utf-8"))).hexdigest(),
              )

          remote = {}
          remote_file = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lf-managed-migrations.csv"
          with remote_file.open(newline="", encoding="utf-8") as handle:
              remote_rows = list(csv.reader(handle))
          for row in remote_rows:
              if len(row) != 3:
                  raise SystemExit(f"FAIL_LF_MIGRATION_LEDGER_ROW: {row!r}")
              version, name, sql_hex = row
              sql = bytes.fromhex(sql_hex).decode("utf-8")
              remote[version] = (name, hashlib.sha256(canonical(sql)).hexdigest())

          if set(local) != set(remote):
              raise SystemExit(
                  f"FAIL_LF_MIGRATION_VERSION_PARITY: git={sorted(local)} remote={sorted(remote)}"
              )
          mismatches = [version for version in sorted(local) if local[version] != remote[version]]
          if mismatches:
              raise SystemExit(f"FAIL_LF_MIGRATION_CONTENT_PARITY: {mismatches}")

          print(
              f"PASS_LF_MIGRATION_SOURCE_PARITY: checkpoint={checkpoint_path.name} "
              f"post_cutover={len(local)} legacy={legacy_count} sha256={legacy_sha} "
              f"grandfathered={grandfathered_count}/{grandfathered_sha} "
              f"classification_baseline_end={classification_baseline_end}"
          )
          print("PASS_CI009_MIGRATION_CLASSIFICATION_SELFTEST=4/4")
          PY

      - name: Enforce Input Governance migration source parity
        env:
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
          INPUT_GOVERNANCE_CUTOVER: "20260818213426"
        run: |
          set -euo pipefail
          if [ -z "${PGPASSWORD:-}" ]; then
            echo "FAIL_INPUT_GOVERNANCE_MIGRATION_PARITY_DB_PASSWORD_MISSING"
            exit 1
          fi
          export PGHOST="$SUPABASE_POOLER_HOST"
          export PGPORT=5432
          export PGUSER="postgres.${SUPABASE_PROJECT_ID}"
          export PGDATABASE=postgres
          export PGSSLMODE=require

          docker run --rm -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE postgres:17.6 psql -X -v ON_ERROR_STOP=1 --csv -t -c "select version,coalesce(name,''),encode(convert_to(array_to_string(statements,E'\n'),'UTF8'),'hex') from supabase_migrations.schema_migrations where version >= '${INPUT_GOVERNANCE_CUTOVER}' and (name like 'input\_governance\_%' escape '\' or name like 'programacion\_input\_governance\_%' escape '\' or name = 'retire_b2b_auth005_legacy_totp_screen') order by version" > "$RUNNER_TEMP/input-governance-migrations.csv"

          python3 scripts/input_governance_migration_parity.py \
            --migrations supabase/migrations \
            --remote "$RUNNER_TEMP/input-governance-migrations.csv" \
            --cutover "$INPUT_GOVERNANCE_CUTOVER"

      - name: Install deterministic audit dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            PyYAML==6.0.2 \
            jsonschema==4.23.0

      - name: Provision governed P0 visual runtime
        run: |
          set -euo pipefail
          if [ -n "${P0_CI_ENGINEERING_REGRESSION:-}" ]; then
            echo "FAIL_P0_CI_ENGINEERING_REGRESSION_OVERRIDE_FORBIDDEN"
            exit 1
          fi
          python3 -m pip install --disable-pip-version-check \
            -r sandbox/story_creator_p0_visual/v1.1/requirements-p0-visual-quality.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa

      - name: Validate LF contract
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          route="$(python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = {
              ".github/workflows/lf-contract-check.yml",
              "gobernanza/contratos/contrato_perfil_lf.yaml",
              "gobernanza/repositorios/matriz_repos_lf.yaml",
              "scripts/validate_declared_paths.py",
          }

          def diff_names(base: str, head: str) -> set[str]:
              raw = subprocess.check_output(
                  ["git", "diff", "--name-only", "-z", base, head, "--"]
              )
              return {
                  item.decode("utf-8", "strict")
                  for item in raw.split(b"\0")
                  if item
              }

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          changed: set[str] = set()
          if event == "pull_request":
              base_ref = os.environ.get("GITHUB_BASE_REF", "main")
              subprocess.run(
                  ["git", "fetch", "--no-tags", "origin", base_ref],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              merge_base = subprocess.check_output(
                  ["git", "merge-base", f"origin/{base_ref}", "HEAD"], text=True
              ).strip()
              changed = diff_names(merge_base, "HEAD")
          elif event == "push":
              event_path = Path(os.environ["GITHUB_EVENT_PATH"])
              payload = json.loads(event_path.read_text(encoding="utf-8"))
              before = payload.get("before", "")
              after = payload.get("after") or os.environ.get("GITHUB_SHA", "HEAD")
              if before and set(before) != {"0"}:
                  probe = subprocess.run(
                      ["git", "cat-file", "-e", f"{before}^{{commit}}"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if probe.returncode != 0:
                      subprocess.run(
                          ["git", "fetch", "--no-tags", "origin", before],
                          check=True,
                          stdout=subprocess.DEVNULL,
                      )
                  changed = diff_names(before, after)
              else:
                  repository = payload.get("repository") or {}
                  default_branch = repository.get("default_branch", "main")
                  subprocess.run(
                      ["git", "fetch", "--no-tags", "origin", default_branch],
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
                  merge_base = subprocess.check_output(
                      ["git", "merge-base", f"origin/{default_branch}", after], text=True
                  ).strip()
                  changed = diff_names(merge_base, after)

          def governed_scope(files: set[str]) -> bool:
              return files == expected

          if not governed_scope(expected):
              raise SystemExit("FAIL_GOV017_SCOPE_ROUTER_POSITIVE_SELFTEST")
          if governed_scope(expected - {"scripts/validate_declared_paths.py"}):
              raise SystemExit("FAIL_GOV017_SCOPE_ROUTER_SUBSET_SELFTEST")
          if governed_scope(expected | {"production/unexpected.txt"}):
              raise SystemExit("FAIL_GOV017_SCOPE_ROUTER_MIXED_SELFTEST")

          print("DECLARED_GOVERNANCE" if governed_scope(changed) else "LEGACY")
          PY
          )"

          if [ "$route" = "DECLARED_GOVERNANCE" ]; then
            echo "PASS_GOV017_SCOPE_ROUTING=4/4"
            python3 scripts/validate_declared_paths.py --repo-root .
            GITHUB_EVENT_NAME=workflow_dispatch \
              python3 sandbox/lf_contract_gate_test/PR93_P0_RUNTIME_CONTRACT_CHECK_ENTRYPOINT.py
          else
            python3 sandbox/lf_contract_gate_test/PR93_P0_RUNTIME_CONTRACT_CHECK_ENTRYPOINT.py
          fi

          export LF_GOV017_ROUTE="$route"
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          if os.environ["LF_GOV017_ROUTE"] == "DECLARED_GOVERNANCE":
              validator_path = Path("scripts/lf_contract_check.py")
              spec = importlib.util.spec_from_file_location("lf_contract_check_gov017_scan", validator_path)
              if spec is None or spec.loader is None:
                  raise SystemExit("FAIL_GOV017_FORBIDDEN_STATUS_SCANNER_LOAD")
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              module.validate_forbidden_terms([
                  ".github/workflows/lf-contract-check.yml",
                  "gobernanza/contratos/contrato_perfil_lf.yaml",
                  "gobernanza/repositorios/matriz_repos_lf.yaml",
                  "scripts/validate_declared_paths.py",
              ])
              print("PASS_GOV017_FORBIDDEN_STATUS_SCAN=4/4")
          PY

      - name: Run E.16 governance regression matrices
        run: |
          python3 sandbox/lf_contract_gate_test/PR93_LOTE_E16_REGRESSION_TESTS.py \
            --validator sandbox/lf_contract_gate_test/PR93_LOTE_E16_CONTRACT_CHECK_ENTRYPOINT.py
          python3 sandbox/lf_contract_gate_test/PR93_LOTE_E16_INVENTORY_TESTS.py \
            --inventory sandbox/lf_contract_gate_test/PR93_LOTE_E16_GITHUB_INVENTORY.py
          python3 sandbox/lf_contract_gate_test/PR93_LOTE_E16_RATIFICATION_TESTS.py \
            --repo-root .
          python3 sandbox/lf_contract_gate_test/PR93_LOTE_E16_INTEGRATION_TESTS.py \
            --candidate-root .
          python3 sandbox/lf_contract_gate_test/PR93_P0_RUNTIME_SCOPE_TESTS.py

      - name: Run LF validation engine self-test
        run: |
          python3 sandbox/lf_contract_gate_test/lf_validation_engine_v0_10_2_selftest.py

      - name: Run NO BYPASS judge profile-card-skill self-test
        run: |
          python3 sandbox/no_bypass_judge_profile_card_skill/no_bypass_judge_selftest.py

      - name: Enforce merge and CI evidence for PASS candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 sandbox/lf_contract_gate_test/pass_evidence_gate.py \
            --self-test \
            --scan skills/creating-integral-user-stories/evidence/pass-candidates \
            --repository "$GITHUB_REPOSITORY"

      - name: Audit creating-integral-user-stories A01-A62
        run: |
          python3 sandbox/lf_contract_gate_test/r8_continuous_audit.py \
            skills/creating-integral-user-stories \
            --output .audit-output/creating-integral-user-stories \
            --commit-sha "$GITHUB_SHA"

      - name: Capture authenticated E.16 Actions inventory
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E16_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 sandbox/lf_contract_gate_test/PR93_LOTE_E16_GITHUB_INVENTORY.py \
            --repository "$GITHUB_REPOSITORY" \
            --head-sha "$E16_HEAD_SHA" \
            --output .audit-output/creating-integral-user-stories/github-actions-inventory-e16.json

      - name: Build authoritative reconciliation manifest
        env:
          LF_WORKFLOW_EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess
          from datetime import datetime, timezone

          root = pathlib.Path.cwd()
          output = root / ".audit-output" / "creating-integral-user-stories" / "reconciliation-manifest-v3.json"
          output.parent.mkdir(parents=True, exist_ok=True)

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          files = {}
          for raw_path in tracked:
              if not raw_path:
                  continue
              relative_path = raw_path.decode("utf-8")
              path = root / relative_path
              if not path.is_file():
                  continue
              content = path.read_bytes()
              git_blob = subprocess.check_output(["git", "hash-object", relative_path], text=True).strip()
              files[relative_path] = {
                  "sha256": hashlib.sha256(content).hexdigest(),
                  "git_blob": git_blob,
              }

          manifest = {
              "schema_version": "lf-reconciliation-manifest/v3",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_name": "lf-contract-check",
              "workflow_event": os.environ["LF_WORKFLOW_EVENT"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "commit_sha": os.environ["GITHUB_SHA"],
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "validation_suite": [
                  "scripts/lf_contract_check.py",
                  "sandbox/lf_contract_gate_test/PR93_LOTE_E16_CONTRACT_CHECK_ENTRYPOINT.py",
                  "sandbox/lf_contract_gate_test/PR93_P0_RUNTIME_CONTRACT_CHECK_ENTRYPOINT.py",
                  "sandbox/lf_contract_gate_test/PR93_P0_RUNTIME_SCOPE_TESTS.py",
                  "sandbox/lf_contract_gate_test/functional_red_team_v1_regression.py",
                  "sandbox/lf_contract_gate_test/PR93_LOTE_E16_REGRESSION_TESTS.py",
                  "sandbox/lf_contract_gate_test/PR93_LOTE_E16_INVENTORY_TESTS.py",
                  "sandbox/lf_contract_gate_test/PR93_LOTE_E16_GITHUB_INVENTORY.py",
                  "sandbox/lf_contract_gate_test/PR93_LOTE_E16_RATIFICATION_TESTS.py",
                  "sandbox/lf_contract_gate_test/PR93_LOTE_E16_INTEGRATION_TESTS.py",
                  "sandbox/lf_contract_gate_test/lf_validation_engine_v0_10_2_selftest.py",
                  "sandbox/no_bypass_judge_profile_card_skill/no_bypass_judge_selftest.py",
                  "sandbox/lf_contract_gate_test/pass_evidence_gate.py --self-test --scan",
                  "sandbox/lf_contract_gate_test/r8_continuous_audit.py",
              ],
              "files": dict(sorted(files.items())),
          }
          output.write_text(json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          print(f"manifest={output} files={len(files)}")
          PY

      - name: Upload per-artifact audit evidence and canonical source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-continuous-audit-${{ github.run_id }}
          path: |
            .audit-output/creating-integral-user-stories
            skills/creating-integral-user-stories
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7