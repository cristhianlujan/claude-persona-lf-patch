          if "net" in schemas:
              raise SystemExit("FAIL_SUPABASE_NET_SCHEMA_EXPOSED")

          rendered = ",".join(sorted(schemas))
          print(f"PASS_SUPABASE_NET_SCHEMA_NOT_EXPOSED: field={schema_field} schemas={rendered}")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
