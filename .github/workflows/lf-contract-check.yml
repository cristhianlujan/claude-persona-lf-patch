      - name: Validate LF contract
        if: contains(fromJSON(steps.feedback_tier.outputs.lf_contract_controls_json), 'LF_CONTRACT_CORE')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          route="$(python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          expected = {
              ".github/workflows/lf-contract-check.yml",
              "gobernanza/contratos/contrato_perfil_lf.yaml",
              "gobernanza/repositorios/matriz_repos_lf.yaml",
              "scripts/validate_declared_paths.py",
          }

          def diff_names(base: str, head: str) -> set[str]:
              raw = subprocess.check_output(
                  ["git", "diff", "--name-only", "-z", base, head, "--"]
              )
              return {
                  item.decode("utf-8", "strict")
                  for item in raw.split(b"\0")
                  if item
              }

          event = os.environ.get("GITHUB_EVENT_NAME", "")
          changed: set[str] = set()
          if event == "pull_request":
              base_ref = os.environ.get("GITHUB_BASE_REF", "main")
              subprocess.run(
                  ["git", "fetch", "--no-tags", "origin", base_ref],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              merge_base = subprocess.check_output(
                  ["git", "merge-base", f"origin/{base_ref}", "HEAD"], text=True
              ).strip()
              changed = diff_names(merge_base, "HEAD")
          elif event == "push":
              event_path = Path(os.environ["GITHUB_EVENT_PATH"])
              payload = json.loads(event_path.read_text(encoding="utf-8"))
              before = payload.get("before", "")
              after = payload.get("after") or os.environ.get("GITHUB_SHA", "HEAD")
              if before and set(before) != {"0"}:
                  probe = subprocess.run(
                      ["git", "cat-file", "-e", f"{before}^{{commit}}"],
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if probe.returncode != 0:
                      subprocess.run(
                          ["git", "fetch", "--no-tags", "origin", before],
                          check=True,
                          stdout=subprocess.DEVNULL,
                      )
                  changed = diff_names(before, after)
              else:
                  repository = payload.get("repository") or {}
                  default_branch = repository.get("default_branch", "main")
                  subprocess.run(
                      ["git", "fetch", "--no-tags", "origin", default_branch],
                      check=True,
                      stdout=subprocess.DEVNULL,
                  )
                  merge_base = subprocess.check_output(
                      ["git", "merge-base", f"origin/{default_branch}", after], text=True
                  ).strip()
                  changed = diff_names(merge_base, after)

          def governed_scope(files: set[str]) -> bool:
              return files == expected

          if not governed_scope(expected):
              raise SystemExit("FAIL_GOV017_SCOPE_ROUTER_POSITIVE_SELFTEST")
          if governed_scope(expected - {"scripts/validate_declared_paths.py"}):
              raise SystemExit("FAIL_GOV017_SCOPE_ROUTER_SUBSET_SELFTEST")
          if governed_scope(expected | {"production/unexpected.txt"}):
