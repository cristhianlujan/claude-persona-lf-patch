name: lf-contract-check

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "lf/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  dedupe-router:
    name: lf-contract-dedupe-router
    runs-on: ubuntu-latest
    outputs:
      run_deep: ${{ steps.classify.outputs.run_deep }}
      decision: ${{ steps.classify.outputs.decision }}
      reason: ${{ steps.classify.outputs.reason }}
      pr_number: ${{ steps.classify.outputs.pr_number }}
      exact_count: ${{ steps.classify.outputs.exact_count }}
      reused_run_id: ${{ steps.classify.outputs.reused_run_id }}
      router_overhead_ms: ${{ steps.classify.outputs.router_overhead_ms }}
    steps:
      - name: Classify same-context coverage
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          started_ms="$(date +%s%3N)"
          run_deep="true"
          decision="RUN_DEEP"
          reason="NOT_APPLICABLE"
          pr_number=""
          exact_count="0"
          reused_run_id=""

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            pr_number="${PR_NUMBER:-}"
            if [[ "$EVENT_ACTION" != "ready_for_review" ]]; then
              reason="PR_EVENT_AUTHORITATIVE"
            elif [[ -z "${PR_NUMBER:-}" || -z "${PR_HEAD_SHA:-}" || -z "${EVENT_BASE_SHA:-}" ]]; then
              reason="READY_CONTEXT_MISSING_FAIL_DEEP"
            else
              set +e
              current_main_sha="$(gh api "repos/${GH_REPO}/git/ref/heads/main" --jq '.object.sha' 2>"$RUNNER_TEMP/lf-ready-main.err")"
              main_rc=$?
              set -e

              if [[ "$main_rc" -ne 0 || -z "$current_main_sha" ]]; then
                reason="CURRENT_MAIN_LOOKUP_FAILED_FAIL_DEEP"
              elif [[ "$current_main_sha" != "$EVENT_BASE_SHA" ]]; then
                reason="CURRENTNESS_REEVALUATION_REQUIRED_RUN_DEEP"
              else
                set +e
                runs_response="$(gh api -X GET \
                  "repos/${GH_REPO}/actions/workflows/lf-contract-check.yml/runs" \
                  -f event=pull_request \
                  -f status=completed \
                  -f head_sha="$PR_HEAD_SHA" \
                  -f per_page=100 2>"$RUNNER_TEMP/lf-ready-runs.err")"
                runs_rc=$?
                set -e

                if [[ "$runs_rc" -ne 0 ]] || ! jq -e '.workflow_runs | type == "array"' <<<"$runs_response" >/dev/null 2>&1; then
                  reason="PRIOR_RUN_LOOKUP_FAILED_FAIL_DEEP"
                else
                  exact_runs="$(jq -c \
                    --argjson pr "$PR_NUMBER" \
                    --arg head "$PR_HEAD_SHA" \
                    --arg base "$EVENT_BASE_SHA" \
                    --argjson current "$CURRENT_RUN_ID" \
                    '[.workflow_runs[]
                      | select(.id != $current)
                      | select(.head_sha == $head)
                      | select(any(.pull_requests[]?; .number == $pr and .head.sha == $head and .base.sha == $base))
                    ] | sort_by([.updated_at, .id])' <<<"$runs_response")"
                  exact_count="$(jq -r 'length' <<<"$exact_runs")"

                  if [[ "$exact_count" -eq 0 ]]; then
                    reason="NO_EXACT_PRIOR_CONTEXT_FAIL_DEEP"
                  else
                    latest_run_id="$(jq -r '.[-1].id' <<<"$exact_runs")"
                    latest_conclusion="$(jq -r '.[-1].conclusion // ""' <<<"$exact_runs")"

                    if [[ -z "$latest_run_id" || "$latest_conclusion" != "success" ]]; then
                      reason="LATEST_EXACT_CONTEXT_NOT_SUCCESS_FAIL_DEEP"
                    else
                      set +e
                      jobs_response="$(gh api -X GET \
                        "repos/${GH_REPO}/actions/runs/${latest_run_id}/jobs" \
                        -f filter=latest \
                        -f per_page=100 2>"$RUNNER_TEMP/lf-ready-jobs.err")"
                      jobs_rc=$?
                      artifacts_response="$(gh api -X GET \
                        "repos/${GH_REPO}/actions/runs/${latest_run_id}/artifacts" \
                        -f per_page=100 2>"$RUNNER_TEMP/lf-ready-artifacts.err")"
                      artifacts_rc=$?
                      set -e

                      if [[ "$jobs_rc" -ne 0 ]] || ! jq -e '.jobs | type == "array"' <<<"$jobs_response" >/dev/null 2>&1; then
                        reason="PRIOR_DEEP_JOB_LOOKUP_FAILED_FAIL_DEEP"
                      elif [[ "$artifacts_rc" -ne 0 ]] || ! jq -e '.artifacts | type == "array"' <<<"$artifacts_response" >/dev/null 2>&1; then
                        reason="PRIOR_MANIFEST_ARTIFACT_LOOKUP_FAILED_FAIL_DEEP"
                      else
                        deep_success_count="$(jq -r '[.jobs[] | select(.name == "lf-contract-check" and .conclusion == "success")] | length' <<<"$jobs_response")"
                        manifest_count="$(jq -r --arg name "r8-continuous-audit-${latest_run_id}" '[.artifacts[] | select(.name == $name and (.expired == false))] | length' <<<"$artifacts_response")"

                        if [[ "$deep_success_count" -ne 1 ]]; then
                          reason="LATEST_EXACT_CONTEXT_NOT_REAL_DEEP_SUCCESS_FAIL_DEEP"
                        elif [[ "$manifest_count" -ne 1 ]]; then
                          reason="LATEST_EXACT_CONTEXT_MANIFEST_NOT_PROVABLE_FAIL_DEEP"
                        else
                          run_deep="false"
                          decision="SKIP_READY_REUSE_EXACT_DEEP"
                          reason="EXACT_PR_HEAD_SAME_BASE_REAL_DEEP_SUCCESS_REUSE_ONLY"
                          reused_run_id="$latest_run_id"
                        fi
                      fi
                    fi
                  fi
                fi
              fi
            fi
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == lf/* ]]; then
            reason="NO_EXACT_OPEN_PR_FAIL_DEEP"
            set +e
            response="$(gh api -X GET \
              "repos/${GH_REPO}/pulls" \
              -f state=open \
              -f base=main \
              -f head="${REPO_OWNER}:${REF_NAME}" \
              -f per_page=100 2>"$RUNNER_TEMP/lf-contract-dedupe-gh.err")"
            api_rc=$?
            set -e

            if [[ "$api_rc" -eq 0 ]] && jq -e 'type == "array"' <<<"$response" >/dev/null; then
              matches="$(jq -c --arg sha "$HEAD_SHA" '[.[] | select(.head.sha == $sha)]' <<<"$response")"
              exact_count="$(jq -r 'length' <<<"$matches")"
              if [[ "$exact_count" == "1" ]]; then
                run_deep="false"
                decision="SKIP_DUPLICATE_PUSH"
                reason="EXACT_OPEN_PR_COVERS_SHA"
                pr_number="$(jq -r '.[0].number' <<<"$matches")"
              elif [[ "$exact_count" -gt 1 ]]; then
                reason="AMBIGUOUS_EXACT_OPEN_PR_FAIL_DEEP"
              fi
            else
              reason="PR_LOOKUP_FAILED_FAIL_DEEP"
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            reason="NON_LF_PUSH_FAIL_DEEP"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            reason="MANUAL_RUN_DEEP"
          fi

          if [[ "$EVENT_NAME" == "pull_request" && "$run_deep" != "true" && "$decision" != "SKIP_READY_REUSE_EXACT_DEEP" ]]; then
            echo "FAIL_S28_PR_SKIP_OUTSIDE_READY_EXACT_DEEP_REUSE"
            exit 1
          fi
          if [[ "$decision" == "SKIP_READY_REUSE_EXACT_DEEP" ]]; then
            if [[ "$EVENT_ACTION" != "ready_for_review" || -z "$reused_run_id" || "$exact_count" -lt 1 ]]; then
              echo "FAIL_S28_READY_SKIP_WITHOUT_EXACT_DEEP_PROOF"
              exit 1
            fi
          fi
          if [[ "$decision" == "SKIP_DUPLICATE_PUSH" && "$exact_count" != "1" ]]; then
            echo "FAIL_S28_SKIP_WITHOUT_EXACT_PR_PROOF"
            exit 1
          fi

          ended_ms="$(date +%s%3N)"
          router_overhead_ms="$((ended_ms - started_ms))"
          effective_sha="$HEAD_SHA"
          if [[ "$EVENT_NAME" == "pull_request" && -n "${PR_HEAD_SHA:-}" ]]; then
            effective_sha="$PR_HEAD_SHA"
          fi

          {
            echo "run_deep=$run_deep"
            echo "decision=$decision"
            echo "reason=$reason"
            echo "pr_number=$pr_number"
            echo "exact_count=$exact_count"
            echo "reused_run_id=$reused_run_id"
            echo "router_overhead_ms=$router_overhead_ms"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Strategy 28 — LF contract dedupe router"
            echo "- event: \`$EVENT_NAME\`"
            echo "- action: \`${EVENT_ACTION:-none}\`"
            echo "- ref: \`$REF_NAME\`"
            echo "- candidate sha: \`$effective_sha\`"
            echo "- decision: \`$decision\`"
            echo "- reason: \`$reason\`"
            echo "- exact evidence count: \`$exact_count\`"
            if [[ -n "$pr_number" ]]; then
              echo "- PR: \`#$pr_number\`"
            fi
            if [[ -n "$reused_run_id" ]]; then
              echo "- reused real DEEP run: \`$reused_run_id\`"
            fi
            echo "- router overhead: \`${router_overhead_ms} ms\`"
            echo "- safety: ready_for_review reuse requires exact PR+head+base+current-main, latest real DEEP job SUCCESS and manifest artifact; all uncertainty => DEEP"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "PASS_S28_DEDUPE_ROUTER decision=$decision reason=$reason exact_count=$exact_count pr=${pr_number:-none} reused_run=${reused_run_id:-none} overhead_ms=$router_overhead_ms"

  lf-contract-check:
    name: lf-contract-check
    needs: dedupe-router
    if: needs.dedupe-router.outputs.run_deep == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Canonical preflight and unified CI applicability plan
        id: feedback_tier
        env:
          LF_PLAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LF_PLAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LF_PLAN_EVENT_ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import subprocess
          from pathlib import Path

          validator_path = Path("scripts/lf_contract_check.py")
          spec = importlib.util.spec_from_file_location("lf_contract_check_feedback_tier", validator_path)
          if spec is None or spec.loader is None:
              raise SystemExit("FAIL_LF_FEEDBACK_TIER_VALIDATOR_LOAD")
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)

          validator.validate_p0_closure_evidence_scope()
          exact_base = (os.environ.get("LF_PLAN_BASE_SHA") or "").strip()
          exact_head = (os.environ.get("LF_PLAN_HEAD_SHA") or os.environ.get("GITHUB_SHA") or "").strip()
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if event_name in {"pull_request","push"}:
              if not exact_base or not exact_head:
                  raise SystemExit("FAIL_CI_PLAN_EXACT_BASE_HEAD_MISSING")
              subprocess.run(
                  ["git","fetch","--no-tags","origin",exact_base,exact_head],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
              raw_changed = subprocess.check_output(
                  ["git","diff","--name-only","--no-renames",exact_base,exact_head],
                  text=True,
              )
              changed = sorted({line.strip() for line in raw_changed.splitlines() if line.strip()})
          elif event_name == "workflow_dispatch":
              changed = []
          else:
              raise SystemExit(f"FAIL_CI_PLAN_UNSUPPORTED_EVENT:{event_name}")
          print("Unified-plan exact changed files:")
          for path in changed:
              print(f"- {path}")

          lane_router_path = Path("sandbox/lf_contract_gate_test/s28_ci_lane_router/lf_ci_lane_router.py")
          lane_spec = importlib.util.spec_from_file_location("lf_ci_lane_router", lane_router_path)
          if lane_spec is None or lane_spec.loader is None:
              raise SystemExit("FAIL_S28_CI_LANE_ROUTER_LOAD")
          lane_router = importlib.util.module_from_spec(lane_spec)
          lane_spec.loader.exec_module(lane_router)
          lane = lane_router.classify(changed)

          # Canonical content/scope checks remain authoritative before applicability.
          p0_regular = False
          if changed:
              governed = validator.validate_changed_files(changed)
              validator.validate_governed_receipt(changed, governed)
              validator.validate_forbidden_terms(changed)

              p0_docs = validator.P0_CLOSURE_EVIDENCE_ALLOWED_EXACT
              if all(path in p0_docs for path in changed):
                  raw = subprocess.check_output(
                      ["git", "ls-files", "-s", "-z", "--", *changed]
                  )
                  regular = set()
                  for record in raw.split(b"\0"):
                      if not record:
                          continue
                      metadata, sep, raw_path = record.partition(b"\t")
                      if not sep:
                          continue
                      mode = metadata.split(b" ", 1)[0]
                      if mode in {b"100644", b"100755"}:
                          regular.add(raw_path.decode("utf-8", "strict"))
                  p0_regular = all(path in regular for path in changed)

          plan_path = Path("sandbox/lf_contract_gate_test/s28_ci_lane_router/lf_ci_execution_plan_v2.py")
          currentness_path = Path("sandbox/lf_contract_gate_test/s28_ci_lane_router/lf_ci_currentness_bridge_v1.py")
          plan_spec = importlib.util.spec_from_file_location("lf_ci_execution_plan_v2", plan_path)
          if plan_spec is None or plan_spec.loader is None:
              raise SystemExit("FAIL_S28_CI_EXECUTION_PLAN_LOAD")
          plan_module = importlib.util.module_from_spec(plan_spec)
          import sys
          sys.modules[plan_spec.name] = plan_module
          plan_spec.loader.exec_module(plan_module)
          currentness_spec = importlib.util.spec_from_file_location(
              "lf_ci_currentness_bridge_v1", currentness_path
          )
          if currentness_spec is None or currentness_spec.loader is None:
              raise SystemExit("FAIL_S28_CI_CURRENTNESS_BRIDGE_LOAD")
          currentness_module = importlib.util.module_from_spec(currentness_spec)
          sys.modules[currentness_spec.name] = currentness_module
          currentness_spec.loader.exec_module(currentness_module)

          subprocess.run(
              ["git","fetch","--no-tags","origin","refs/heads/main:refs/remotes/origin/main"],
              check=True,
              stdout=subprocess.DEVNULL,
          )
          authority_current = subprocess.check_output(
              ["git","rev-parse","refs/remotes/origin/main"], text=True
          ).strip()

          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          force_full = event_name == "workflow_dispatch" or (event_name == "push" and ref_name == "main")
          force_reason = (
              "WORKFLOW_DISPATCH_FULL_REGRESSION" if event_name == "workflow_dispatch"
              else "MAIN_PUSH_FULL_REGRESSION" if event_name == "push" and ref_name == "main"
              else None
          )
          if changed and all(path in validator.P0_CLOSURE_EVIDENCE_ALLOWED_EXACT for path in changed) and not p0_regular:
              force_full = True
              force_reason = "P0_FAST_DOC_NONREGULAR_OR_DELETED_FAIL_CLOSED"

          plan = plan_module.build_plan(
              changed_paths=changed,
              lane_required_controls=lane.required_controls,
              lane_mode=lane.mode,
              repo_root=Path("."),
              force_full=force_full,
              force_full_reason=force_reason,
              source_ref=exact_head,
          )
          applicability_sha256 = plan["plan_sha256"]
          authority_bound = currentness_module.resolve_authority_evidence_revision(
              repo=Path("."),
              event_name=event_name,
              ref_name=ref_name,
              diff_base_revision=exact_base,
              candidate_head_revision=exact_head,
              current_revision=authority_current,
          )

          currentness = currentness_module.evaluate_ci_authority_currentness(
              repo=Path("."),
              bound_revision=authority_bound,
              current_revision=authority_current,
          )
          currentness_module.require_ready(currentness)

          plan["plan_sha256"] = applicability_sha256
          plan["applicability_sha256"] = applicability_sha256
          plan["source_authority"] = currentness
          plan["authority_evidence_revision"] = authority_bound
          plan["base_sha"] = os.environ.get("LF_PLAN_BASE_SHA") or None
          plan["head_sha"] = os.environ.get("LF_PLAN_HEAD_SHA") or os.environ.get("GITHUB_SHA")
          plan["event_name"] = event_name
          plan["event_action"] = os.environ.get("LF_PLAN_EVENT_ACTION") or ""
          evidence_source = dict(plan)
          evidence_source.pop("evidence_sha256", None)
          plan["evidence_sha256"] = plan_module._sha(
              plan_module._canonical(evidence_source).encode("utf-8")
          )

          plan_dir = Path(".lf_ci")
          plan_dir.mkdir(parents=True, exist_ok=True)
          plan_file = plan_dir / "lf_ci_execution_plan_v2.json"
          plan_file.write_text(
              json.dumps(plan, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          required_controls_json = json.dumps(plan["required_controls"], separators=(",", ":"))
          lf_contract_controls_json = json.dumps(
              plan.get("carrier_controls", {}).get("LF_CONTRACT_CHECK", []),
              separators=(",", ":"),
          )
          migration_required = str("MIGRATION_SOURCE_PARITY" in plan["required_controls"]).lower()
          input_gov_required = str("INPUT_GOVERNANCE_MIGRATION_PARITY" in plan["required_controls"]).lower()
          selftest_required = str("CI_ROUTER_SELFTEST" in plan["required_controls"]).lower()
          p0_fast_only = plan["required_controls"] == ["P0_FAST_DOCS"] and p0_regular
          tier = "FAST_P0_DOCS" if p0_fast_only else "DEEP"
          reason = (
              "UNIFIED_PLAN_P0_FAST_DOCS"
              if p0_fast_only
              else f"UNIFIED_PLAN_{plan['full_regression_reason']}"
              if plan["full_regression"]
              else "UNIFIED_APPLICABILITY_PLAN"
          )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              handle.write(f"tier={tier}\n")
              handle.write(f"reason={reason}\n")
              handle.write(f"migration_parity_required={migration_required}\n")
              handle.write(f"input_governance_parity_required={input_gov_required}\n")
              handle.write(f"ci_router_selftest_required={selftest_required}\n")
              handle.write(f"required_controls_json={required_controls_json}\n")
              handle.write(f"lf_contract_controls_json={lf_contract_controls_json}\n")
              handle.write(f"plan_sha256={plan['plan_sha256']}\n")
              handle.write(f"applicability_sha256={plan['applicability_sha256']}\n")
              handle.write(f"evidence_sha256={plan['evidence_sha256']}\n")
              handle.write(f"authority_current_revision={plan['source_authority']['resolved_revision']}\n")
              handle.write(f"currentness_decision={plan['source_authority']['decision']}\n")
              handle.write(f"plan_full_regression={str(plan['full_regression']).lower()}\n")
              handle.write(f"lane_mode={lane.mode}\n")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("### Strategy 28 — unified CI applicability authority\n")
                  handle.write(f"- tier compatibility output: `{tier}`\n")
                  handle.write(f"- lane mode: `{lane.mode}`\n")
                  handle.write(f"- applicability sha256: `{plan['applicability_sha256']}`\n")
                  handle.write(f"- evidence sha256: `{plan['evidence_sha256']}`\n")
                  handle.write(f"- currentness: `{plan['source_authority']['decision']}` -> `{plan['source_authority']['resolved_revision']}`\n")
                  handle.write(f"- full regression: `{str(plan['full_regression']).lower()}`\n")
                  handle.write(f"- required controls: `{required_controls_json}`\n")
                  handle.write(f"- lf-contract-check controls: `{lf_contract_controls_json}`\n")
                  handle.write("- execution authority: CI_FAST_DEEP_LANE_ROUTER plan -> carrier controls; unknown/self-change => full regression\n")

          print(
              f"PASS_LF_UNIFIED_CI_PLAN tier={tier} lane={lane.mode} "
              f"plan_sha={plan['plan_sha256']} controls={required_controls_json}"
          )
          PY

      - name: Run CI lane router self-tests with deterministic diagnostics
        if: contains(fromJSON(steps.feedback_tier.outputs.lf_contract_controls_json), 'CI_ROUTER_SELFTEST')
        run: |
          python3 sandbox/lf_contract_gate_test/gate_check_observability/run_gate_checks_v1.py \
            --gate-id LF_CONTRACT_CHECK_CI_ROUTER_SELFTEST \
            --step-id ci_lane_router_selftests \
            --mode COLLECT_ALL \
            --command-json '{"argv":["python3","sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_lane_router.py"],"source_path":"sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_lane_router.py","critical":true}' \
            --command-json '{"argv":["python3","sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_lane_workflow_integration.py"],"source_path":"sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_lane_workflow_integration.py","critical":true}' \
            --command-json '{"argv":["python3","sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_contract_check_parity_equivalence_v1.py"],"source_path":"sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_contract_check_parity_equivalence_v1.py","critical":true}' \
            --command-json '{"argv":["python3","sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_execution_plan_v2.py"],"source_path":"sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_execution_plan_v2.py","critical":true}' \
            --command-json '{"argv":["python3","sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_currentness_bridge_v1.py"],"source_path":"sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_currentness_bridge_v1.py","critical":true}' \
            --command-json '{"argv":["python3","sandbox/lf_contract_gate_test/s28_ci_lane_router/test_run_changed_migrations_rollback_v1.py"],"source_path":"sandbox/lf_contract_gate_test/s28_ci_lane_router/test_run_changed_migrations_rollback_v1.py","critical":true}' \
            --command-json '{"argv":["python3","sandbox/lf_contract_gate_test/s28_ci_lane_router/test_ci_control_carrier_wiring_v2.py"],"source_path":"sandbox/lf_contract_gate_test/s28_ci_lane_router/test_ci_control_carrier_wiring_v2.py","critical":true}' \
            --artifact-dir .lf_gate_diagnostics/lf_contract_check/ci_router_selftest \
            --artifact-name lf_gate_error_v1.json \
            --check-prefix CIR \
            --owner CI_FAST_DEEP_LANE_ROUTER \
            --next-action FIX_CI_ROUTER_SELFTEST_AND_RERUN \
            --downstream-impact lf-contract-check

      - name: Enforce lf-contract-check transversal closure prerequisites
        env:
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGPORT: "5432"
          PGUSER: postgres.mhwmirqcgxxukpctffuv
          PGDATABASE: postgres
