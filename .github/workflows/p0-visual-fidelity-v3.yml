name: P0 Visual Fidelity V3

on:
  pull_request:
    branches: [main]
    paths:
      - "sandbox/story_creator_p0_visual/v1.1/**"
      - ".github/workflows/p0-visual-fidelity-v3.yml"
  push:
    branches:
      - main
      - "lf/**"
    paths:
      - "sandbox/story_creator_p0_visual/v1.1/**"
      - ".github/workflows/p0-visual-fidelity-v3.yml"

permissions:
  contents: read

jobs:
  p0-visual-fidelity-v3:
    name: P0 V3 fail-closed gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install governed local visual runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
          python -m pip install --upgrade pip
          python -m pip install -r sandbox/story_creator_p0_visual/v1.1/requirements-p0-visual-quality.txt
      - name: No symlinks and Python syntax
        run: |
          test -z "$(find sandbox/story_creator_p0_visual/v1.1 -type l -print -quit)"
          python -m compileall -q sandbox/story_creator_p0_visual/v1.1/scripts sandbox/story_creator_p0_visual/v1.1/evals
      - name: V3 schema contracts
        run: python sandbox/story_creator_p0_visual/v1.1/scripts/validate_p0_v3_schemas.py
      - name: V3 negatives restores regressions
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_visual_fidelity_v3_suite.py | tee /tmp/p0-v3-suite.json
      - name: V3 fresh forward adversarial
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_visual_fidelity_forward_adversarial_v3.py | tee /tmp/p0-v3-forward.json
      - name: V2 N01-N28 and positive restores
        env:
          P0_CI_ENGINEERING_REGRESSION: "1"
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_machine_visual_quality_negative_suite_v2.py | tee /tmp/p0-v2-negative.json
      - name: V2 runtime regressions
        env:
          P0_CI_ENGINEERING_REGRESSION: "1"
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_visual_quality_runtime_regression_suite.py | tee /tmp/p0-v2-runtime.json
      - name: V2 fresh forward adversarial
        env:
          P0_CI_ENGINEERING_REGRESSION: "1"
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_blind_forward_adversarial_test.py | tee /tmp/p0-v2-forward.json
      - name: V3 inventory hash integrity
        run: python sandbox/story_creator_p0_visual/v1.1/scripts/verify_p0_v3_manifest.py | tee /tmp/p0-v3-hash-inventory.json
      - name: V3 premerge independent compliance universe
        run: python sandbox/story_creator_p0_visual/v1.1/scripts/audit_p0_handoff_v3_compliance.py --phase premerge | tee /tmp/p0-v3-compliance-premerge.json
      - name: Publish non-sensitive engineering receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-v3-engineering-gate-receipts
          path: |
            /tmp/p0-v3-suite.json
            /tmp/p0-v3-forward.json
            /tmp/p0-v3-hash-inventory.json
            /tmp/p0-v2-negative.json
            /tmp/p0-v2-runtime.json
            /tmp/p0-v2-forward.json
            /tmp/p0-v3-compliance-premerge.json
          retention-days: 14
