name: SALY Ventas PG17 staging (isolated rollback)
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261120235000_saly_ventas_discovery_staging_v1.sql'
      - 'supabase/tests/saly_ventas_discovery_staging_v1*'
      - '.github/workflows/saly-ventas-pg17-staging.yml'
permissions:
  contents: read
jobs:
  pg17_isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: saly_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: saly_test_only
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL CLI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Isolated SALY schema fixture
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA saly;
          CREATE TABLE saly.proyecto (codigo text NOT NULL, estado text NOT NULL);
          INSERT INTO saly.proyecto(codigo,estado) VALUES ('SALY-001','ACTIVO');
          SQL
      - name: Test migration inside real BEGIN and ROLLBACK
        shell: bash
        run: |
          sed -e '/^BEGIN;$/d' -e '/^COMMIT;$/d' supabase/migrations/20261120235000_saly_ventas_discovery_staging_v1.sql > /tmp/saly_ventas_body.sql
          cat > /tmp/saly_rollback_ddl.sql <<'SQL'
          BEGIN;
          \i /tmp/saly_ventas_body.sql
          DO $verify$
          BEGIN
           IF to_regclass('saly.ventas_discovery_ingestas') IS NULL
              OR to_regclass('saly.ventas_hallazgos') IS NULL
              OR to_regclass('saly.ventas_unidades_operativas') IS NULL
           THEN RAISE EXCEPTION 'DDL_MISSING_IN_TRANSACTION'; END IF;
          END $verify$;
          ROLLBACK;
          DO $verify$
          BEGIN
           IF to_regclass('saly.ventas_discovery_ingestas') IS NOT NULL
              OR to_regclass('saly.ventas_hallazgos') IS NOT NULL
              OR to_regclass('saly.ventas_unidades_operativas') IS NOT NULL
           THEN RAISE EXCEPTION 'DDL_NOT_ROLLED_BACK'; END IF;
          END $verify$;
          SQL
          psql -v ON_ERROR_STOP=1 -f /tmp/saly_rollback_ddl.sql
      - name: Apply schema to ephemeral PG17 only
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261120235000_saly_ventas_discovery_staging_v1.sql
      - name: Verify constraints and functional BEGIN/ROLLBACK
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/saly_ventas_discovery_staging_v1_pg17_rollback.sql
      - name: Verify canonical table and no duplicate
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
           IF to_regclass('saly.ventas_hallazgos') IS NULL
              OR to_regclass('saly.ventas_discovery_registros') IS NOT NULL
           THEN RAISE EXCEPTION 'CANONICAL_HALLAZGOS_MISSING_OR_DUPLICATED'; END IF;
          END $verify$;
          SQL
