name: R8 Deep Artifact Audit

on:
  pull_request:
    branches:
      - feat/integral-story-creator-r8-forward
    paths:
      - 'skills/creating-integral-user-stories/**'
      - 'tools/**'
      - '.github/workflows/r8-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r8-deep-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sequential-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LF_JUDGE_VERSION: v0.5
      LF_EXECUTOR_IDENTITY: R8_GITHUB_ACTIONS_DEEP_AUDIT
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/deep-audit-a01-a62

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic audit dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'jsonschema==4.23.0'

      - name: Verify shared external benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          python - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          path = Path('tools/benchmark-snapshot.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          verified = dt.date.fromisoformat(data['verified_at'])
          age = (dt.datetime.now(dt.timezone.utc).date() - verified).days
          if age < 0 or age > 30:
              raise SystemExit(f'benchmark_snapshot_stale:{age}')
          minimum = int(data['minimum_required_stars'])
          rows = data.get('repositories', [])
          expected = {
              'anthropics/skills',
              'microsoft/vscode',
              'freeCodeCamp/freeCodeCamp',
              'Significant-Gravitas/AutoGPT',
          }
          actual = {row.get('repository') for row in rows}
          if actual != expected:
              raise SystemExit(f'benchmark_repository_set_mismatch:{sorted(actual)}')
          for row in rows:
              stars = int(row['stars_lower_bound'])
              if stars <= minimum:
                  raise SystemExit(f"benchmark_below_threshold:{row['repository']}:{stars}")
              if not row.get('reference_path') or not row.get('practice'):
                  raise SystemExit(f"benchmark_evidence_incomplete:{row['repository']}")
          out = {
              'result': 'PASS_WITH_EVIDENCE',
              'verified_at': data['verified_at'],
              'age_days': age,
              'minimum_required_stars': minimum,
              'repositories': rows,
          }
          Path('audit-results/benchmark-snapshot-verified.json').write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY

      - name: Audit A01 through A62 sequentially
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p audit-results
          failures=0
          : > audit-results/checkpoints.tsv
          for n in $(seq -w 1 62); do
            code="A${n}"
            num=$((10#$n))
            echo "::group::CHECKPOINT ${code}"
            static_rc=0
            runtime_rc=0
            if [ "$num" -ge 13 ] && [ "$num" -le 22 ]; then
              python tools/judge_audit.py --artifact "${code}" --mode static --report-dir audit-results || static_rc=$?
            elif [ "$num" -ge 31 ] && [ "$num" -le 38 ]; then
              python tools/script_audit.py --artifact "${code}" --mode static --report-dir audit-results || static_rc=$?
            elif [[ "$code" =~ ^A(43|45|46|47|48|49|50)$ ]]; then
              python tools/cross_contract_audit.py --artifact "${code}" --mode static --report-dir audit-results || static_rc=$?
            elif [ -f "tools/static_v2/${code}.py" ]; then
              python "tools/static_v2/${code}.py" --report-dir audit-results || static_rc=$?
            elif [ -f "tools/static/${code}.py" ]; then
              python "tools/static/${code}.py" --report-dir audit-results || static_rc=$?
            else
              python tools/r8_deep_audit.py --artifact "${code}" --report-dir audit-results --skip-external || static_rc=$?
            fi
            if [ "$num" -ge 13 ] && [ "$num" -le 22 ]; then
              python tools/judge_audit.py --artifact "${code}" --mode runtime --report-dir audit-results | tee "audit-results/${code}-runtime-console.json" || runtime_rc=${PIPESTATUS[0]}
            elif [ "$num" -ge 31 ] && [ "$num" -le 38 ]; then
              python tools/script_audit.py --artifact "${code}" --mode runtime --report-dir audit-results | tee "audit-results/${code}-runtime.json" || runtime_rc=${PIPESTATUS[0]}
            elif [[ "$code" =~ ^A(43|45|46|47|48|49|50)$ ]]; then
              python tools/cross_contract_audit.py --artifact "${code}" --mode runtime --report-dir audit-results | tee "audit-results/${code}-runtime.json" || runtime_rc=${PIPESTATUS[0]}
            elif [ -f "tools/runtime_v2/${code}.py" ]; then
              python "tools/runtime_v2/${code}.py" | tee "audit-results/${code}-runtime.json" || runtime_rc=${PIPESTATUS[0]}
            elif [ -f "tools/runtime/${code}.py" ]; then
              python "tools/runtime/${code}.py" | tee "audit-results/${code}-runtime.json" || runtime_rc=${PIPESTATUS[0]}
            elif [ "$num" -le 4 ]; then
              python tools/r8_runtime_checks.py --artifact "${code}" --report-dir audit-results || runtime_rc=$?
            else
              python tools/r8_runtime_matrix.py --artifact "${code}" --report-dir audit-results || runtime_rc=$?
            fi
            if [ "$static_rc" -ne 0 ] || [ "$runtime_rc" -ne 0 ]; then
              failures=$((failures + 1))
              status="FAIL"
            else
              status="PASS"
            fi
            printf '%s\t%s\t%s\t%s\n' "$code" "$status" "$static_rc" "$runtime_rc" >> audit-results/checkpoints.tsv
            echo "${code}: ${status} (static=${static_rc}, runtime=${runtime_rc})"
            echo "::endgroup::"
          done
          echo "artifact_failures=${failures}" | tee audit-results/summary.txt
          test "$failures" -eq 0

      - name: Package audited source tree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar -czf audit-results/audited-source-tree.tar.gz \
            skills/creating-integral-user-stories \
            tools \
            .github/workflows/r8-deep-audit.yml

      - name: Upload per-artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-deep-audit-evidence
          path: audit-results/
          if-no-files-found: warn
          retention-days: 30
