name: R8 Deep Artifact Audit

on:
  pull_request:
    branches:
      - feat/integral-story-creator-r8-forward
    paths:
      - 'skills/creating-integral-user-stories/**'
      - 'tools/**'
      - '.github/workflows/r8-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sequential-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LF_JUDGE_VERSION: v0.5
      LF_EXECUTOR_IDENTITY: R8_GITHUB_ACTIONS_DEEP_AUDIT
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/deep-audit-a01-a62

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic audit dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'jsonschema==4.23.0'

      - name: Apply deterministic cross-artifact corrections
        run: python tools/apply_cross_artifact_fixes.py

      - name: Persist corrections only on audit branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No deterministic corrections required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add skills/creating-integral-user-stories
            git commit -m 'fix deterministic cross-artifact audit findings'
            git push origin HEAD:fix/deep-audit-a01-a62
          fi

      - name: Audit A01 through A62 sequentially
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p audit-results
          failures=0
          : > audit-results/checkpoints.tsv
          for n in $(seq -w 1 62); do
            code="A${n}"
            num=$((10#$n))
            echo "::group::CHECKPOINT ${code}"
            static_rc=0
            runtime_rc=0
            if [ "$num" -ge 13 ] && [ "$num" -le 22 ]; then
              python tools/judge_audit.py --artifact "${code}" --mode static --report-dir audit-results || static_rc=$?
            elif [ -f "tools/static_v2/${code}.py" ]; then
              python "tools/static_v2/${code}.py" --report-dir audit-results || static_rc=$?
            elif [ -f "tools/static/${code}.py" ]; then
              python "tools/static/${code}.py" --report-dir audit-results || static_rc=$?
            else
              python tools/r8_deep_audit.py --artifact "${code}" --report-dir audit-results || static_rc=$?
            fi
            if [ "$num" -ge 13 ] && [ "$num" -le 22 ]; then
              python tools/judge_audit.py --artifact "${code}" --mode runtime --report-dir audit-results | tee "audit-results/${code}-runtime-console.json" || runtime_rc=${PIPESTATUS[0]}
            elif [ -f "tools/runtime_v2/${code}.py" ]; then
              python "tools/runtime_v2/${code}.py" | tee "audit-results/${code}-runtime.json" || runtime_rc=${PIPESTATUS[0]}
            elif [ -f "tools/runtime/${code}.py" ]; then
              python "tools/runtime/${code}.py" | tee "audit-results/${code}-runtime.json" || runtime_rc=${PIPESTATUS[0]}
            elif [ "$num" -le 4 ]; then
              python tools/r8_runtime_checks.py --artifact "${code}" --report-dir audit-results || runtime_rc=$?
            else
              python tools/r8_runtime_matrix.py --artifact "${code}" --report-dir audit-results || runtime_rc=$?
            fi
            if [ "$static_rc" -ne 0 ] || [ "$runtime_rc" -ne 0 ]; then
              failures=$((failures + 1))
              status="FAIL"
            else
              status="PASS"
            fi
            printf '%s\t%s\t%s\t%s\n' "$code" "$status" "$static_rc" "$runtime_rc" >> audit-results/checkpoints.tsv
            echo "${code}: ${status} (static=${static_rc}, runtime=${runtime_rc})"
            echo "::endgroup::"
          done
          echo "artifact_failures=${failures}" | tee audit-results/summary.txt
          test "$failures" -eq 0

      - name: Upload per-artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-deep-audit-evidence
          path: audit-results/
          if-no-files-found: warn
          retention-days: 30
