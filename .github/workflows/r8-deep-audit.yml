name: R8 Deep Artifact Audit

on:
  pull_request:
    branches:
      - feat/integral-story-creator-r8-forward
    paths:
      - 'skills/creating-integral-user-stories/**'
      - 'tools/**'
      - '.github/workflows/r8-deep-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sequential-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LF_JUDGE_VERSION: v0.5
      LF_EXECUTOR_IDENTITY: R8_GITHUB_ACTIONS_DEEP_AUDIT
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic audit dependencies
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'jsonschema==4.23.0'

      - name: Audit A01 through A62 sequentially
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-results
          for n in $(seq -w 1 62); do
            code="A${n}"
            echo "::group::CHECKPOINT ${code}"
            python tools/r8_deep_audit.py --artifact "${code}" --report-dir audit-results
            if [ -f "tools/runtime/${code}.py" ]; then
              python "tools/runtime/${code}.py" | tee "audit-results/${code}-runtime.json"
            elif [ "$n" -le 4 ]; then
              python tools/r8_runtime_checks.py --artifact "${code}" --report-dir audit-results
            else
              python tools/r8_runtime_matrix.py --artifact "${code}" --report-dir audit-results
            fi
            echo "::endgroup::"
          done

      - name: Upload per-artifact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-deep-audit-evidence
          path: audit-results/
          if-no-files-found: warn
          retention-days: 30
