name: P0 Exact-HEAD Real-Source Evidence

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "lf/p0-*"

permissions:
  contents: read
  actions: read

jobs:
  exact-head-real-source:
    name: exact-head-real-source
    runs-on: ubuntu-latest
    env:
      P0_EXACT_HEAD_BROKER_URL: https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-p0-exact-head-evidence-broker-v2

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify runner and broker identity policies
        run: |
          python3 sandbox/lf_contract_gate_test/p0_exact_head_real_source_ci_v2.py --self-test
          node supabase/functions/lf-p0-exact-head-evidence-broker-v2/policy_test.mjs

      - name: Provision governed P0 visual runtime
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            -r sandbox/story_creator_p0_visual/v1.1/requirements-p0-visual-quality.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa

      - name: Probe broker fail-closed identity boundaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          url=os.environ['P0_EXACT_HEAD_BROKER_URL']
          token=os.environ['GITHUB_TOKEN']
          base={
            'repository':os.environ['GITHUB_REPOSITORY'],
            'ref':os.environ['GITHUB_REF'],
            'github_sha':os.environ['GITHUB_SHA'],
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'run_attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),
            'event_name':os.environ['GITHUB_EVENT_NAME'],
            'action':'get_source',
          }
          probes=[
            ('bad_ref',{**base,'ref':'refs/heads/feature/arbitrary'},'GITHUB_REQUEST_REF_NOT_GOVERNED'),
            ('bad_sha',{**base,'github_sha':'0'*40},'GITHUB_WORKFLOW_SHA_MISMATCH'),
            ('bad_event',{**base,'event_name':'pull_request'},'GITHUB_EVENT_INVALID'),
          ]
          for name,payload,expected in probes:
            req=urllib.request.Request(url,data=json.dumps(payload,separators=(',',':')).encode(),method='POST',headers={'Authorization':f'Bearer {token}','Content-Type':'application/json','Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=30) as response:
                body=json.loads(response.read().decode())
                raise SystemExit(f'FAIL_{name}: unexpectedly allowed: {body}')
            except urllib.error.HTTPError as exc:
              body=json.loads(exc.read().decode())
              if body.get('outcome')!='BLOCKED' or body.get('code')!=expected:
                raise SystemExit(f'FAIL_{name}: expected={expected} observed={body}')
              print(f'PASS_{name}={expected}')
          PY

      - name: Capture exact-HEAD canonical-source receipt
        id: capture
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 sandbox/lf_contract_gate_test/p0_exact_head_real_source_ci_v2.py

      - name: Require persisted exact-HEAD evidence even when technical P0 remains blocked
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          path=pathlib.Path('.audit-output/creating-integral-user-stories/p0-exact-head-real-source-summary.json')
          if not path.is_file(): raise SystemExit('FAIL_P0_EXACT_HEAD_SUMMARY_MISSING')
          data=json.loads(path.read_text())
          observed=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          required={
            'github_sha':os.environ['GITHUB_SHA'],
            'observed_git_head':observed,
            'source_sha256':'e308b66778d1108241e2832997f6628f47841d7da1fc53820007834fdbb720d7',
          }
          for key,value in required.items():
            if data.get(key)!=value: raise SystemExit(f'FAIL_P0_EXACT_HEAD_SUMMARY_BINDING:{key}')
          if not data.get('receipt_evidence_object_id'): raise SystemExit('FAIL_P0_EXACT_HEAD_RECEIPT_NOT_PERSISTED')
          if data.get('production_authorized') is not False or data.get('p0_5_authorized') is not False:
            raise SystemExit('FAIL_P0_EXACT_HEAD_UNAUTHORIZED_ACCEPTANCE_SIGNAL')
          print(json.dumps({
            'evidence_capture':'PERSISTED',
            'github_sha':data['github_sha'],
            'receipt_evidence_object_id':data['receipt_evidence_object_id'],
            'technical_result':data.get('technical_result'),
            'terminal_result':data.get('terminal_result'),
            'capture_step_outcome':os.environ.get('CAPTURE_OUTCOME'),
            'production_authorized':False,
          },sort_keys=True))
          PY

      - name: Upload exact-HEAD evidence summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0-exact-head-real-source-${{ github.run_id }}
          path: .audit-output/creating-integral-user-stories/p0-exact-head-real-source-summary.json
          if-no-files-found: error
          retention-days: 7
