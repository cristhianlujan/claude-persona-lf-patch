name: LF Phase1 profiles-skills candidate PASE
run-name: LF phase1 candidate ${{ github.sha }}
on:
  push:
    branches:
      - lf/fase1-perfiles-skills-worker-consolidado-20261110
  pull_request:
    branches: [main]
    paths:
      - 'sandbox/lf_contract_gate_test/programming_agent_four_stage/selector_experimental/**'
      - 'sandbox/lf_contract_gate_test/programming_agent_four_stage/programmer_profiles_exp/**'
      - '.github/workflows/lf-phase1-perfiles-skills-pase.yml'
permissions:
  contents: read
jobs:
  phase1-candidate:
    name: phase1 disposable suites / no production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: localtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      SELECTOR_EXP_DISPOSABLE_DB: 'YES'
      PGHOST: '127.0.0.1'
      PGUSER: 'postgres'
      PGPASSWORD: 'localtest'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout candidate and full PG04-PG14 producers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install a local loopback PostgreSQL server (not Docker or Supabase)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          version="$(ls /etc/postgresql | sort -V | tail -1)"
          sudo pg_ctlcluster "$version" main start || sudo pg_ctlcluster "$version" main status
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER ROLE postgres PASSWORD 'localtest'"
          actual="$(PGPASSWORD=localtest psql -X -At -h 127.0.0.1 -U postgres -d postgres -c "SELECT host(inet_server_addr())")"
          test "$actual" = "127.0.0.1"
          echo "LOCAL_POSTGRES_SERVER_IP=127.0.0.1"
      - name: Offline fixtures and PG00 immutable catalog suite
        run: bash sandbox/lf_contract_gate_test/programming_agent_four_stage/programmer_profiles_exp/qualification/run_phase1_suite.sh
