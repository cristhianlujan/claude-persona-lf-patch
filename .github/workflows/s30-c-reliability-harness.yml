name: S30-C Reliability Harness

on:
  push:
    branches:
      - "lf/s30-c-*"
    paths:
      - "sandbox/lf_contract_gate_test/s30_c_reliability_harness/**"
      - ".github/workflows/s30-c-reliability-harness.yml"
  pull_request:
    branches:
      - main
    paths:
      - "sandbox/lf_contract_gate_test/s30_c_reliability_harness/**"
      - ".github/workflows/s30-c-reliability-harness.yml"

permissions:
  contents: read

jobs:
  s30-c-reliability:
    name: S30-C deterministic evidence freeze replay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute S30-C regression suite
        run: python sandbox/lf_contract_gate_test/s30_c_reliability_harness/test_s30c_harness.py

      - name: Emit machine CI readback
        env:
          S30C_CI_ACTUAL: "1"
        run: python sandbox/lf_contract_gate_test/s30_c_reliability_harness/s30c_harness.py ci-receipt
