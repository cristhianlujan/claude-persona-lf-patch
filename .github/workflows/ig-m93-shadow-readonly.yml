name: IG M9.3 Governed Read-Only Evidence
on:
  workflow_dispatch:
    inputs:
      rollback_e2e:
        type: boolean
        required: true
        default: false
      cohort:
        type: choice
        required: true
        default: ALL
        options: [ALL, AUTH, FORMS, NAVIGATION, DESIGN, ONBOARDING, RECOVERY, API]

# One workflow run and one active cohort replay at a time; prevents pooler exhaustion and
# preserves per-cohort independently downloadable machine evidence.
concurrency:
  group: ig-m93-live-sandbox-readback
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      cohorts: ${{ steps.select.outputs.cohorts }}
    steps:
      - id: select
        name: Resolve governed cohort type selection
        shell: bash
        env:
          REQUESTED_COHORT: ${{ inputs.cohort }}
        run: |
          set -euo pipefail
          case "$REQUESTED_COHORT" in
            ALL)
              echo 'cohorts=["AUTH","FORMS","NAVIGATION","DESIGN","ONBOARDING","RECOVERY","API"]' >> "$GITHUB_OUTPUT"
              ;;
            AUTH|FORMS|NAVIGATION|DESIGN|ONBOARDING|RECOVERY|API)
              printf 'cohorts=["%s"]\n' "$REQUESTED_COHORT" >> "$GITHUB_OUTPUT"
              ;;
            *) echo 'UNKNOWN_GOVERNED_COHORT' >&2; exit 1 ;;
          esac

  m93-readonly:
    needs: prepare
    if: needs.prepare.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        cohort: ${{ fromJson(needs.prepare.outputs.cohorts) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout merged trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Assert exact sandbox and no production
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/main"
          test -f sandbox/lf_contract_gate_test/engineering_checkpoints/m9_3/full_pipeline_shadow_runner.py
          python3 sandbox/lf_contract_gate_test/engineering_checkpoints/m9_3/full_pipeline_shadow_runner.py --self-test
      - name: Install PostgreSQL client if missing
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Live seven-cohort diagnostic (fail closed)
        shell: bash
        env:
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGUSER: postgres.mhwmirqcgxxukpctffuv
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          M93_COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          args=(--live --output .lf_ci/m9_3_live_diagnostic.json)
          if [ "${{ inputs.rollback_e2e }}" = true ]; then args+=(--rollback-e2e); fi
          args+=(--cohort "$M93_COHORT")
          python3 sandbox/lf_contract_gate_test/engineering_checkpoints/m9_3/full_pipeline_shadow_runner.py "${args[@]}"
      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-m93-readonly-diagnostic-${{ matrix.cohort }}
          path: .lf_ci/m9_3_live_diagnostic.json
          if-no-files-found: warn
          retention-days: 7
