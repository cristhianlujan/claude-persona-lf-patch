name: LF PASE Current Main Readiness V1

on:
  pull_request:
    paths:
      - 'sandbox/lf_contract_gate_test/pase_integration_replay/**'
      - '.github/workflows/lf-pase-current-main-readiness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-main-readiness:
    name: Verify qualified PASE stack on current main
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact readiness head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact head and current-main ancestry
        shell: bash
        run: |
          set -euo pipefail
          expected_head='${{ github.event.pull_request.head.sha || github.sha }}'
          test "$(git rev-parse HEAD)" = "$expected_head"
          git merge-base --is-ancestor c28b86adafd782707f37813775f5c6bcfc33b068 HEAD
          echo "PASE_CURRENT_MAIN_READINESS_HEAD=$(git rev-parse HEAD)"
          echo "PASE_CURRENT_MAIN_BASE=c28b86adafd782707f37813775f5c6bcfc33b068"

      - name: Prove inventory universe unchanged since observed baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline=b2f8d9ad833d9f8b363b7e2ab65a41d1561149c6
          current=c28b86adafd782707f37813775f5c6bcfc33b068
          registry='sandbox/lf_contract_gate_test/s28_ci_lane_router/lf_ci_control_impact_registry_v2.json'
          test "$(git rev-parse "$baseline:$registry")" = '35532aa19c080068b881fe2b50bb19a251953638'
          test "$(git rev-parse "$current:$registry")" = '35532aa19c080068b881fe2b50bb19a251953638'
          mapfile -t changed < <(git diff --name-only "$baseline" "$current")
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'supabase/migrations/20260928202023_lf_input_governance_router_execution_v1.sql'
          echo 'PASE_INVENTORY_FRESHNESS=SEMANTIC_UNIVERSE_UNCHANGED'

      - name: Execute qualified governance owner-local tests
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/transversal_assets/lf_governance_super_admin/test_lf_governance_super_admin_contract_v1.py
          python3 sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_execution_plan_v2.py
          python3 sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_super_admin_plan_binding_v1.py
          python3 sandbox/lf_contract_gate_test/pase_control_binding_inventory/test_pase_control_binding_inventory_v1.py

      - name: Execute qualified PASE orchestrator owner-local test
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/pase_orchestrator/test_pase_orchestrator_v1.py

      - name: Execute current-main integration replay
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/pase_integration_replay/test_pase_integration_replay_v1.py

      - name: Emit readiness marker
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS_PASE_CURRENT_MAIN_READINESS_V1 layers=6 inventory_controls=25 unresolved=0'
