name: LF Edge Deploy Credential Readback

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Governed Edge action"
        required: true
        default: readback
        type: choice
        options:
          - readback
          - deploy-caller
  workflow_run:
    workflows: ["IG M10.5 CP2 OIDC Edge Bridge Tests"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/lf-edge-deploy-credential-readback.yml'
      - 'sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py'
      - 'sandbox/lf_contract_gate_test/edge_function_operation/edge_management_r17_read_measurement_v1.py'
      - 'sandbox/lf_contract_gate_test/edge_function_operation/edge_bundle_rollback_rehearsal_v1.py'
      - 'sandbox/lf_contract_gate_test/edge_function_operation/test_edge_deploy_governed_workflow_v1.py'
      - 'supabase/functions/lf-profiles-governance-caller-v1/index.ts'
      - 'supabase/functions/lf-profiles-governance-caller-v1/caller.ts'
      - 'supabase/functions/lf-profiles-governance-caller-v1/cp2_edge_bridge.ts'

permissions:
  contents: read

concurrency:
  group: lf-edge-deploy-governed
  cancel-in-progress: false

jobs:
  profile-merge-authority:
    name: Verify merged PR provenance for governed deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.verify.outputs.approved }}
    steps:
      - name: Verify current main is exact merge of successful caller test
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" || -z "${SOURCE_SHA:-}" ]]; then
            exit 0
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/pulls" > /tmp/router_prs.json
          PR_NUMBER="$(jq -r --arg head "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $head and .base.ref == "main")][0].number // empty' /tmp/router_prs.json)"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" |
            jq -s -e '[.[][] | .filename] | any(. == "supabase/functions/lf-profiles-governance-caller-v1/caller.ts" or . == ".github/workflows/lf-edge-deploy-credential-readback.yml")' >/dev/null
          echo "approved=true" >> "$GITHUB_OUTPUT"
          echo "Governed exact-merge deploy authorized for PR #${PR_NUMBER} @ ${GITHUB_SHA}"

  credential-readback:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'readback') }}
    name: Read existing Edge metadata only
    runs-on: ubuntu-latest
    environment: lf-edge-deploy
    timeout-minutes: 5
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify token through GET of existing Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py
      - name: R17 measured read-only Management GET sampling
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_r17_read_measurement_v1.py
      - name: Save durable R17 read diagnostic without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m105-r17-management-read-${{ github.run_id }}
          path: r17_edge_management_read_diagnostic.json
          if-no-files-found: warn
          retention-days: 30
      - name: Offline Edge bundle rollback rehearsal — GET only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_bundle_rollback_rehearsal_v1.py
      - name: Save rollback rehearsal diagnostic without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m105-r17-offline-rollback-${{ github.run_id }}
          path: m105_edge_bundle_rollback_rehearsal.json
          if-no-files-found: warn
          retention-days: 30

  deploy-caller:
    needs: [profile-merge-authority]
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_run' && needs.profile-merge-authority.outputs.approved == 'true') || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-caller')) }}
    name: Governed deploy — lf-profiles-governance-caller-v1
    runs-on: ubuntu-latest
    environment: lf-edge-deploy
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mhwmirqcgxxukpctffuv
      EDGE_FUNCTION_SLUG: lf-profiles-governance-caller-v1
      ROLLBACK_COMMIT: c9be66afa6d73727c760878fce0e1a9362e33106
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact main and fixed target
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${EDGE_FUNCTION_SLUG}" = "lf-profiles-governance-caller-v1"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          git cat-file -e "${ROLLBACK_COMMIT}^{commit}"
          MAIN_SHA="$(git rev-parse HEAD)"
          test "${MAIN_SHA}" = "${GITHUB_SHA}"
          printf 'main_sha=%s\nfunction=%s\nrollback_commit=%s\n'             "${MAIN_SHA}" "${EDGE_FUNCTION_SLUG}" "${ROLLBACK_COMMIT}"             | tee edge-deploy-authority.txt

      - name: Predeploy Management API readback
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py             | tee edge-predeploy-readback.json

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.48.3

      - name: Deploy exact caller source from main
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "${EDGE_FUNCTION_SLUG}"             --project-ref "${SUPABASE_PROJECT_REF}"             --no-verify-jwt             --use-api

      - name: Postdeploy Management API readback
        id: postread
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py             | tee edge-postdeploy-readback.json

      - name: Roll back caller if postdeploy verification failed
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout "${ROLLBACK_COMMIT}" --             supabase/functions/lf-profiles-governance-caller-v1/index.ts             supabase/functions/lf-profiles-governance-caller-v1/caller.ts
          supabase functions deploy "${EDGE_FUNCTION_SLUG}"             --project-ref "${SUPABASE_PROJECT_REF}"             --no-verify-jwt             --use-api
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py             | tee edge-rollback-readback.json

      - name: Save governed deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-edge-deploy-caller-${{ github.run_id }}
          path: |
            edge-deploy-authority.txt
            edge-predeploy-readback.json
            edge-postdeploy-readback.json
            edge-rollback-readback.json
          if-no-files-found: warn
          retention-days: 30

  router-profile-v2-live-canary:
    if: ${{ github.event_name == 'workflow_run' && needs.profile-merge-authority.outputs.approved == 'true' }}
    name: Router V2 -> governed profile admission live canary
    needs: [profile-merge-authority, deploy-caller]
    runs-on: ubuntu-latest
    environment: lf-edge-deploy
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout governed canary
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Invoke fixed Router V2 Login B2B canary with GitHub OIDC
        run: python3 sandbox/lf_contract_gate_test/router/router_v2_profile_admission_canary.py
