name: LF Edge Deploy Credential Readback

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      action:
        description: "Governed Edge action"
        required: true
        default: readback
        type: choice
        options:
          - readback
          - deploy-caller
          - deploy-profile-runtime
          - deploy-profile-creator-caller
          - resume-native-profile
      execution_id:
        description: Existing governed EJECUCION_PERFIL_LF execution identifier
        required: false
        type: string
      screen_selection_draft_json:
        description: Optional validated native semantic screen-selection JSON; never auto-selected
        required: false
        type: string
  workflow_run:
    workflows: ["IG M10.5 CP2 OIDC Edge Bridge Tests", "F0 Workflow Activation Static Tests"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/lf-edge-deploy-credential-readback.yml'
      - 'sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py'
      - 'sandbox/lf_contract_gate_test/edge_function_operation/edge_management_r17_read_measurement_v1.py'
      - 'sandbox/lf_contract_gate_test/edge_function_operation/edge_bundle_rollback_rehearsal_v1.py'
      - 'sandbox/lf_contract_gate_test/edge_function_operation/test_edge_deploy_governed_workflow_v1.py'
      - 'supabase/functions/lf-profiles-governance-caller-v1/index.ts'
      - 'supabase/functions/lf-profiles-governance-caller-v1/caller.ts'
      - 'supabase/functions/lf-profiles-governance-caller-v1/profile_continuation.ts'
      - 'scripts/lf_profile_native_resume.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/test_profile_resume_issue_request.py'
      - 'supabase/functions/lf-profiles-governance-caller-v1/cp2_edge_bridge.ts'

permissions:
  contents: read

concurrency:
  group: lf-edge-deploy-governed
  cancel-in-progress: false

jobs:
  governed-issue-request-tests:
    if: ${{ github.event_name == 'push' }}
    name: Test strict issue request parser without credentials
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate generic issue request contract
        run: python3 -m unittest discover -s sandbox/lf_contract_gate_test/profile_execution_runtime -p test_profile_resume_issue_request.py

  profile-merge-authority:
    name: Verify merged PR provenance for governed deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      approved: ${{ steps.verify.outputs.approved }}
    steps:
      - name: Verify current main is exact merge of successful caller test
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "approved=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "workflow_run" ]]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event.workflow_run.conclusion }}" != "success" || -z "${SOURCE_SHA:-}" ]]; then
            exit 0
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/pulls" > /tmp/router_prs.json
          PR_NUMBER="$(jq -r --arg head "$GITHUB_SHA" '[.[] | select(.merged_at != null and .merge_commit_sha == $head and .base.ref == "main")][0].number // empty' /tmp/router_prs.json)"
          if [[ -z "$PR_NUMBER" ]]; then
            exit 0
          fi
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" |
            jq -s -e '[.[][] | .filename] | any(. == "supabase/functions/lf-profiles-governance-caller-v1/caller.ts" or . == "supabase/functions/lf-profiles-governance-caller-v1/index.ts" or . == ".github/workflows/lf-edge-deploy-credential-readback.yml")' >/dev/null
          echo "approved=true" >> "$GITHUB_OUTPUT"
          echo "Governed exact-merge deploy authorized for PR #${PR_NUMBER} @ ${GITHUB_SHA}"

  native-profile-resume:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.action == 'resume-native-profile') || (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'lf-profile-resume-governed' && github.event.issue.state == 'open' && github.event.issue.pull_request == null) }}
    name: Governed native profile bridge continuation
    runs-on: ubuntu-latest
    timeout-minutes: 7
    environment: lf-edge-deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout exact workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify governed request parser before live continuation
        run: python3 -m unittest discover -s sandbox/lf_contract_gate_test/profile_execution_runtime -p test_profile_resume_issue_request.py
      - name: Continue existing authorized profile without modifying product data
        env:
          LF_PROFILE_EDGE_URL: https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profiles-governance-caller-v1
          PROFILE_EXECUTION_ID: ${{ inputs.execution_id }}
          PROFILE_SCREEN_SELECTION_DRAFT_JSON: ${{ inputs.screen_selection_draft_json }}
          LF_PROFILE_RESUME_REQUEST_MODE: ${{ github.event_name == 'issues' && 'ISSUE' || 'DISPATCH' }}
        run: python3 scripts/lf_profile_native_resume.py
      - name: Preserve native RAW and deterministic validation receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: profile-native-output-${{ github.run_id }}
          path: |
            profile-native-output.json
            profile-native-evidence-manifest.json
            profile-native-output-original.json
            profile-native-origin-repair.json
            profile-native-validation.json
            profile-native-validation-binding.json
            profile-semantic-judge.json
            profile-native-continuation.json
            profile-native-operation-plan.json
            profile-native-skill-semantic.json
          if-no-files-found: ignore
          retention-days: 30

  credential-readback:
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'readback') }}
    name: Read existing Edge metadata only
    runs-on: ubuntu-latest
    environment: lf-edge-deploy
    timeout-minutes: 5
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify token through GET of existing Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py
      - name: R17 measured read-only Management GET sampling
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_r17_read_measurement_v1.py
      - name: Save durable R17 read diagnostic without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m105-r17-management-read-${{ github.run_id }}
          path: r17_edge_management_read_diagnostic.json
          if-no-files-found: warn
          retention-days: 30
      - name: Offline Edge bundle rollback rehearsal — GET only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_bundle_rollback_rehearsal_v1.py
      - name: Save rollback rehearsal diagnostic without secrets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m105-r17-offline-rollback-${{ github.run_id }}
          path: m105_edge_bundle_rollback_rehearsal.json
          if-no-files-found: warn
          retention-days: 30

  deploy-caller:
    needs: [profile-merge-authority]
    if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_run' && needs.profile-merge-authority.outputs.approved == 'true') || (github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-caller')) }}
    name: Governed deploy — lf-profiles-governance-caller-v1
    runs-on: ubuntu-latest
    environment: lf-edge-deploy
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mhwmirqcgxxukpctffuv
      EDGE_FUNCTION_SLUG: lf-profiles-governance-caller-v1
      ROLLBACK_COMMIT: c9be66afa6d73727c760878fce0e1a9362e33106
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact main and fixed target
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${EDGE_FUNCTION_SLUG}" = "lf-profiles-governance-caller-v1"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          git cat-file -e "${ROLLBACK_COMMIT}^{commit}"
          MAIN_SHA="$(git rev-parse HEAD)"
          test "${MAIN_SHA}" = "${GITHUB_SHA}"
          printf 'main_sha=%s\nfunction=%s\nrollback_commit=%s\n'             "${MAIN_SHA}" "${EDGE_FUNCTION_SLUG}" "${ROLLBACK_COMMIT}"             | tee edge-deploy-authority.txt

      - name: Predeploy Management API readback
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py             | tee edge-predeploy-readback.json

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.48.3

      - name: Deploy exact caller source from main
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "${EDGE_FUNCTION_SLUG}"             --project-ref "${SUPABASE_PROJECT_REF}"             --no-verify-jwt             --use-api

      - name: Postdeploy Management API readback
        id: postread
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py             | tee edge-postdeploy-readback.json

      - name: Roll back caller if postdeploy verification failed
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout "${ROLLBACK_COMMIT}" --             supabase/functions/lf-profiles-governance-caller-v1/index.ts             supabase/functions/lf-profiles-governance-caller-v1/caller.ts
          supabase functions deploy "${EDGE_FUNCTION_SLUG}"             --project-ref "${SUPABASE_PROJECT_REF}"             --no-verify-jwt             --use-api
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_management_credential_canary_v1.py             | tee edge-rollback-readback.json

      - name: Save governed deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-edge-deploy-caller-${{ github.run_id }}
          path: |
            edge-deploy-authority.txt
            edge-predeploy-readback.json
            edge-postdeploy-readback.json
            edge-rollback-readback.json
          if-no-files-found: warn
          retention-days: 30

  deploy-profile-runtime:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-profile-runtime' }}
    name: Governed deploy — run-creacion-perfil-lf
    runs-on: ubuntu-latest
    environment: lf-edge-deploy
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mhwmirqcgxxukpctffuv
      PROFILE_RUNTIME_SLUG: run-creacion-perfil-lf
      PROFILE_RUNTIME_ROLLBACK_COMMIT: b7be59551f72e7b6a02bd4e849ab64bfcaa44cdc
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0

      - name: Guard exact main and fixed target
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "${PROFILE_RUNTIME_SLUG}" = "run-creacion-perfil-lf"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          git cat-file -e "${PROFILE_RUNTIME_ROLLBACK_COMMIT}^{commit}"
          MAIN_SHA="$(git rev-parse HEAD)"
          test "${MAIN_SHA}" = "${GITHUB_SHA}"
          test -f supabase/functions/run-creacion-perfil-lf/index.ts
          test -f supabase/functions/run-creacion-perfil-lf/required_profile_steps.ts
          printf 'main_sha=%s\nfunction=%s\nrollback_commit=%s\n' "${MAIN_SHA}" "${PROFILE_RUNTIME_SLUG}" "${PROFILE_RUNTIME_ROLLBACK_COMMIT}" | tee profile-runtime-deploy-authority.txt

      - name: Predeploy Management API readback
        id: preread
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_profile_runtime_readback_v1.py "${PROFILE_RUNTIME_SLUG}" | tee profile-runtime-predeploy-readback.json
          echo "pre_version=$(jq -r .version profile-runtime-predeploy-readback.json)" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.48.3

      - name: Deploy exact profile runtime source from main
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "${PROFILE_RUNTIME_SLUG}" --project-ref "${SUPABASE_PROJECT_REF}" --use-api

      - name: Postdeploy Management API readback
        id: postread
        shell: bash
        env:
          PRE_VERSION: ${{ steps.preread.outputs.pre_version }}
        run: |
          set -euo pipefail
          [[ "${PRE_VERSION}" =~ ^[0-9]+$ ]]
          NEXT=$(( PRE_VERSION + 1 ))
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_profile_runtime_readback_v1.py "${PROFILE_RUNTIME_SLUG}" "${NEXT}" | tee profile-runtime-postdeploy-readback.json

      - name: Roll back profile runtime if postdeploy verification failed
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout "${PROFILE_RUNTIME_ROLLBACK_COMMIT}" -- supabase/functions/run-creacion-perfil-lf
          supabase functions deploy "${PROFILE_RUNTIME_SLUG}" --project-ref "${SUPABASE_PROJECT_REF}" --use-api
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_profile_runtime_readback_v1.py "${PROFILE_RUNTIME_SLUG}" | tee profile-runtime-rollback-readback.json

      - name: Save governed deploy evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-edge-deploy-profile-runtime-${{ github.run_id }}
          path: |
            profile-runtime-deploy-authority.txt
            profile-runtime-predeploy-readback.json
            profile-runtime-postdeploy-readback.json
            profile-runtime-rollback-readback.json
          if-no-files-found: warn
          retention-days: 30

  deploy-profile-creator-caller:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'deploy-profile-creator-caller' }}
    name: Governed deploy — lf-profile-creator-governance-caller-v1 SALY documentary
    runs-on: ubuntu-latest
    environment: lf-edge-deploy
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mhwmirqcgxxukpctffuv
      CREATOR_SLUG: lf-profile-creator-governance-caller-v1
      ROLLBACK_COMMIT: e39abc6eb8fc44d21252f6bcdd34ca2431e816b8
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact main, caller source and rollback
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CREATOR_SLUG" = "lf-profile-creator-governance-caller-v1"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$ROLLBACK_COMMIT^{commit}"
          grep -Fq 'saly_profile_creator_init_v1' supabase/functions/lf-profile-creator-governance-caller-v1/index.ts
          grep -Fq 'SALY_CREATION_DOCUMENTARY_AUTHORITY_INVALID' supabase/functions/run-creacion-perfil-lf/index.ts
          python3 -m unittest discover -s sandbox/lf_contract_gate_test/edge_function_operation -p test_b07_saly_profile_creator_oidc_v1.py -v
          printf 'main_sha=%s\nslug=%s\nrollback_commit=%s\n' "$GITHUB_SHA" "$CREATOR_SLUG" "$ROLLBACK_COMMIT" | tee creator-caller-deploy-authority.txt
      - name: Predeploy Management API metadata readback
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_profile_creator_caller_readback_v1.py "$CREATOR_SLUG" | tee creator-caller-predeploy-readback.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      - name: Deploy exact creator caller on main
        id: deploy
        run: |
          set -euo pipefail
          supabase functions deploy "$CREATOR_SLUG" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
      - name: Postdeploy readback, verify version and JWT mode
        id: postread
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_profile_creator_caller_readback_v1.py "$CREATOR_SLUG" | tee creator-caller-postdeploy-readback.json
          python3 - <<'PY'
          import json
          before=json.load(open('creator-caller-predeploy-readback.json',encoding='utf-8'))
          after=json.load(open('creator-caller-postdeploy-readback.json',encoding='utf-8'))
          assert before['target']==after['target']=='lf-profile-creator-governance-caller-v1', 'CREATOR_TARGET_DRIFT'
          assert before['jwt_mode_preserved'] is True and after['jwt_mode_preserved'] is True, 'CREATOR_JWT_DRIFT'
          assert after['version']>before['version'], 'CREATOR_DEPLOY_VERSION_NOT_INCREASED'
          print('PASS_SALY_CREATOR_CALLER_DEPLOY_READBACK')
          PY
      - name: Rollback creator caller if postdeploy verification failed
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        run: |
          set -euo pipefail
          git checkout "$ROLLBACK_COMMIT" -- supabase/functions/lf-profile-creator-governance-caller-v1
          supabase functions deploy "$CREATOR_SLUG" --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_profile_creator_caller_readback_v1.py "$CREATOR_SLUG" | tee creator-caller-rollback-readback.json
      - name: Save creator deployment receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-edge-deploy-saly-creator-caller-${{ github.run_id }}
          path: |
            creator-caller-deploy-authority.txt
            creator-caller-predeploy-readback.json
            creator-caller-postdeploy-readback.json
            creator-caller-rollback-readback.json
          if-no-files-found: warn
          retention-days: 30

  deploy-ig-v58-runtime:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'lf-ig-v58-edge-deploy-governed' && github.event.issue.pull_request == null && github.event.issue.state == 'open'
    name: Governed sandbox deploy — IG Agent and Validator V58
    runs-on: ubuntu-latest
    environment: lf-edge-deploy
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: mhwmirqcgxxukpctffuv
      IG_V58_ROLLBACK_SHA: 312210acad9297106204f138cabf12fad81c3656
      IG_V58_MERGE_SHA: e40bb4e95326f1c6778e54e1edea431b3c26f9d7
    steps:
      - name: Checkout exact current main, not user-controlled issue ref
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
          fetch-depth: 0
      - name: Verify governed V58 issue authority and sandbox-only source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$SUPABASE_PROJECT_REF" = "mhwmirqcgxxukpctffuv"
          test -n "$SUPABASE_ACCESS_TOKEN"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$IG_V58_ROLLBACK_SHA^{commit}"
          git merge-base --is-ancestor "$IG_V58_MERGE_SHA" HEAD
          python3 - <<'PY'
          import json,os
          event=json.load(open(os.environ["GITHUB_EVENT_PATH"],encoding="utf-8"))
          label=event.get("label",{}).get("name")
          body=json.loads(event.get("issue",{}).get("body",""))
          assert label=="lf-ig-v58-edge-deploy-governed", "IG_V58_LABEL_DRIFT"
          assert body=={"schema_version":"LF_IG_V58_EDGE_DEPLOY_REQUEST_V1",
             "project_ref":"mhwmirqcgxxukpctffuv","pr_number":3867,
             "source_merge_commit":"e40bb4e95326f1c6778e54e1edea431b3c26f9d7"}, "IG_V58_UNAUTHORIZED_ISSUE_BODY"
          print("PASS_IG_V58_OWNER_APPROVED_SANDBOX_DEPLOY_REQUEST")
          PY
          for slug in input-governance-validator-v1 input-governance-agent-v1; do
            test -f "supabase/functions/$slug/index.ts"
          done
          printf 'main_sha=%s\nproject_ref=%s\nrollback_sha=%s\n' "$GITHUB_SHA" "$SUPABASE_PROJECT_REF" "$IG_V58_ROLLBACK_SHA" > ig-v58-authority.txt
      - name: Predeploy exact Management GET source, version and hash
        id: ig_pre
        shell: bash
        run: |
          set -euo pipefail
          for slug in input-governance-validator-v1 input-governance-agent-v1; do
            python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_ig_v58_governed_readback_v1.py "$slug" > "ig-v58-$slug-before.json"
          done
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          for slug in ("input-governance-validator-v1","input-governance-agent-v1"):
            data=json.load(open("ig-v58-"+slug+"-before.json",encoding="utf-8"))
            path="supabase/functions/"+slug+"/index.ts"
            old=subprocess.check_output(["git","show",os.environ["IG_V58_ROLLBACK_SHA"]+":"+path])
            old_sha=hashlib.sha256(old).hexdigest()
            assert data["source_sha256"]==old_sha, "IG_V58_LIVE_PREIMAGE_DRIFT_"+slug
            assert data["verify_jwt"] is True, "IG_V58_JWT_PREIMAGE_DRIFT"
            print("PASS_IG_V58_PREIMAGE "+slug+" version="+str(data["version"])+" sha256="+old_sha)
          PY
      - name: Set up pinned Supabase CLI from established lf-edge-deploy environment
        uses: supabase/setup-cli@v1
        with:
          version: 2.48.3
      - name: Deploy exact V58 Validator source from main
        id: validator_deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "input-governance-validator-v1" --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Deploy exact V58 Agent source from main
        id: agent_deploy
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy "input-governance-agent-v1" --project-ref "$SUPABASE_PROJECT_REF" --use-api
      - name: Verify BOTH increased versions, exact source SHA and preserved verify_jwt=true
        id: ig_post
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib,subprocess,os
          for slug in ("input-governance-validator-v1","input-governance-agent-v1"):
            before=json.load(open("ig-v58-"+slug+"-before.json",encoding="utf-8"))
            src=open("supabase/functions/"+slug+"/index.ts","rb").read()
            expected=hashlib.sha256(src).hexdigest()
            nextv=before["version"]+1
            with open("ig-v58-"+slug+"-expect.txt","w",encoding="utf-8") as f:
              f.write(str(nextv)+" "+expected+"\n")
            r=subprocess.run(["python3","sandbox/lf_contract_gate_test/edge_function_operation/edge_ig_v58_governed_readback_v1.py",slug,str(nextv),expected],capture_output=True,text=True)
            if r.returncode:
              raise RuntimeError("IG_V58_POSTREAD_BLOCKED_"+slug+":"+r.stdout[:450])
            with open("ig-v58-"+slug+"-after.json","w",encoding="utf-8") as f:
              f.write(r.stdout)
            after=json.loads(r.stdout)
            assert after["source_sha256"]==expected and after["version"]>before["version"]
            print("PASS_IG_V58_DEPLOY "+slug+" from="+str(before["version"])+" to="+str(after["version"])+" sha256="+expected)
          PY
      - name: Rollback BOTH functions to source preimage on postdeploy failure
        if: ${{ failure() && (steps.validator_deploy.outcome == 'success' || steps.agent_deploy.outcome == 'success') }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout "$IG_V58_ROLLBACK_SHA" -- supabase/functions/input-governance-validator-v1/index.ts supabase/functions/input-governance-agent-v1/index.ts
          supabase functions deploy "input-governance-validator-v1" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy "input-governance-agent-v1" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          for slug in input-governance-validator-v1 input-governance-agent-v1; do
            expected="$(sha256sum "supabase/functions/$slug/index.ts" | cut -d' ' -f1)"
            python3 sandbox/lf_contract_gate_test/edge_function_operation/edge_ig_v58_governed_readback_v1.py "$slug" 1 "$expected" > "ig-v58-$slug-rollback.json"
          done
      - name: Preserve governed IG V58 deployment receipts (no keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-ig-v58-edge-sandbox-deploy-${{ github.run_id }}
          path: |
            ig-v58-authority.txt
            ig-v58-*-before.json
            ig-v58-*-after.json
            ig-v58-*-rollback.json
          if-no-files-found: warn
          retention-days: 30
