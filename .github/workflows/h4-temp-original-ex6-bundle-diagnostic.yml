name: H4 temporary real EX6 artifact chain validation

on:
  push:
    branches:
      - lf/h4-ex6-real-chain-evidence-20261109

permissions:
  contents: read

jobs:
  ex6-source-only-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify original ZIP, original v1 stages and EX6-only negatives
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tests -p 'test_ex6*.py' -v
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tools/ex6_one_pass_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg06_preflight_candidate/tests/test_pg06_c1_c5_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg08_build_candidate/tests/test_pg08_full_chain_v1.py
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/pg12_identity_candidate/tests/test_pg12_identity_chain_v1.py
