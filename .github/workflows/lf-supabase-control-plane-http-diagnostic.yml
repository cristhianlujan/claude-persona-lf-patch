name: LF Supabase control-plane HTTP diagnostic

on:
  push:
    branches:
      - diagnostic/lf-supabase-control-plane-http-20260906

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
    steps:
      - name: Read sanitized Supabase PostgREST control-plane status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          project = os.environ["SUPABASE_PROJECT_ID"]
          if not token:
              raise SystemExit("DIAG_SUPABASE_TOKEN_MISSING")

          endpoint = f"https://api.supabase.com/v1/projects/{project}/postgrest"
          request = urllib.request.Request(
              endpoint,
              headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "lf-supabase-control-plane-diagnostic",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read().decode("utf-8")
                  payload = json.loads(body)
                  keys = ",".join(sorted(str(k) for k in payload))
                  print(f"DIAG_SUPABASE_HTTP status={response.status} reason={response.reason} keys={keys}")
          except urllib.error.HTTPError as exc:
              print(f"DIAG_SUPABASE_HTTP status={exc.code} reason={exc.reason}")
              raise SystemExit(1)
          except urllib.error.URLError as exc:
              print(f"DIAG_SUPABASE_URL_ERROR reason_type={type(exc.reason).__name__}")
              raise SystemExit(1)
          except TimeoutError:
              print("DIAG_SUPABASE_TIMEOUT")
              raise SystemExit(1)
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              print(f"DIAG_SUPABASE_RESPONSE_DECODE_ERROR type={type(exc).__name__}")
              raise SystemExit(1)
          PY
