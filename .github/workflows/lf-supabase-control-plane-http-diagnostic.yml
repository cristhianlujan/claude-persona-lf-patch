name: LF Supabase Data API schema exposure diagnostic
# Trigger-only refresh 2026-09-07: no semantic change; classify current control-plane HTTP status.

on:
  push:
    branches:
      - diagnostic/lf-supabase-control-plane-http-20260906

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://mhwmirqcgxxukpctffuv.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_QuQYjjAzceKzg4JpFJ434A_RlX3PdQ6
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
    steps:
      - name: Verify actual Data API rejects net schema
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_PUBLISHABLE_KEY"].strip()
          if not key.startswith("sb_publishable_"):
              raise SystemExit("FAIL_SUPABASE_PUBLISHABLE_KEY_SHAPE")

          url = base + "/rest/v1/__lf_schema_exposure_probe__?select=*"

          def probe(schema: str):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "Accept-Profile": schema,
                      "apikey": key,
                      "User-Agent": "lf-data-api-schema-exposure-probe",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode("utf-8")
                      return response.status, None, None, body
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  code = None
                  message = None
                  try:
                      payload = json.loads(body)
                      if isinstance(payload, dict):
                          code = payload.get("code")
                          message = payload.get("message") or payload.get("msg") or payload.get("error")
                  except json.JSONDecodeError:
                      message = body[:160].replace("\n", " ")
                  return exc.code, code, message, body

          public_status, public_code, public_message, _ = probe("public")
          print(f"DIAG_PUBLIC_SCHEMA status={public_status} code={public_code} message={public_message}")
          if public_status == 402:
              raise SystemExit("FAIL_SUPABASE_DATA_API_GATEWAY_402_EGRESS_QUOTA_RESTRICTED")
          if public_code == "PGRST106":
              raise SystemExit("FAIL_SUPABASE_PUBLIC_SCHEMA_NOT_SELECTABLE")

          net_status, net_code, net_message, _ = probe("net")
          print(f"DIAG_NET_SCHEMA status={net_status} code={net_code} message={net_message}")
          if net_status != 406 or net_code != "PGRST106":
              raise SystemExit(
                  f"FAIL_SUPABASE_NET_SCHEMA_EXPOSURE_GUARD status={net_status} code={net_code} message={net_message}"
              )

          print("PASS_SUPABASE_NET_SCHEMA_NOT_EXPOSED_BEHAVIORAL")
          PY

      - name: Diagnose management PostgREST readback status safely
        if: always()
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          project = os.environ["SUPABASE_PROJECT_ID"]
          if not token:
              print("DIAG_MANAGEMENT_POSTGREST status=NO_TOKEN classification=TOKEN_MISSING")
              raise SystemExit(0)

          request = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project}/postgrest",
              headers={
                  "Accept": "application/json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "lf-control-plane-http-diagnostic",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  raw = response.read().decode("utf-8")
                  payload = json.loads(raw)
                  keys = sorted(str(key) for key in payload) if isinstance(payload, dict) else []
                  print(f"DIAG_MANAGEMENT_POSTGREST status={response.status} classification=READBACK_OK keys={','.join(keys)}")
          except urllib.error.HTTPError as exc:
              status = int(exc.code)
              classification = {
                  401: "UNAUTHORIZED_OR_TOKEN_EXPIRED",
                  403: "FORBIDDEN_OR_DATA_API_CONFIG_READ_MISSING",
                  429: "RATE_LIMITED",
                  500: "MANAGEMENT_INTERNAL_ERROR",
              }.get(status, "UNEXPECTED_HTTP_STATUS")
              print(f"DIAG_MANAGEMENT_POSTGREST status={status} classification={classification}")
          except urllib.error.URLError as exc:
              print(f"DIAG_MANAGEMENT_POSTGREST status=URL_ERROR classification={type(exc.reason).__name__}")
          except TimeoutError:
              print("DIAG_MANAGEMENT_POSTGREST status=TIMEOUT classification=NETWORK_TIMEOUT")
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              print(f"DIAG_MANAGEMENT_POSTGREST status=DECODE_ERROR classification={type(exc).__name__}")
          PY
