name: PASE

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  lf-pase:
    name: PASE
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce single ordinary PR entrypoint
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/pase_github_entrypoint/test_single_pr_entrypoint_v1.py

      - name: Build canonical PASE applicability and repair-enforcement plan
        id: pase_plan
        env:
          LF_PLAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          LF_PLAN_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          LF_PLAN_EVENT_ACTION: ${{ github.event.action }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="${LF_PLAN_HEAD_SHA:-$(git rev-parse HEAD)}"
          base_sha="${LF_PLAN_BASE_SHA:-}"

          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"

          args=(
            python3 sandbox/lf_contract_gate_test/s28_ci_lane_router/emit_ci_execution_plan_v2.py
            --repo-root .
            --head "$head_sha"
            --authority-current-revision "$current_main"
            --event-name "$GITHUB_EVENT_NAME"
            --event-action "${LF_PLAN_EVENT_ACTION:-}"
            --ref-name "$GITHUB_REF_NAME"
            --output-json .lf_ci/lf_ci_execution_plan_v2.json
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ -n "$base_sha" && ! "$base_sha" =~ ^0+$ ]]; then
            args+=(--base "$base_sha")
          fi
          "${args[@]}"

      - name: Build canonical PASE dispatch plan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util
          import json
          from pathlib import Path

          plan_path = Path(".lf_ci/lf_ci_execution_plan_v2.json")
          output_path = Path(".lf_ci/lf_pase_dispatch_plan_v1.json")
          orchestrator_path = Path(
              "sandbox/lf_contract_gate_test/pase_orchestrator/pase_orchestrator_v1.py"
          )

          if not plan_path.is_file():
              raise SystemExit("FAIL_PASE_ORCHESTRATOR_SOURCE_PLAN_MISSING")
          spec = importlib.util.spec_from_file_location(
              "lf_pase_orchestrator_entrypoint", orchestrator_path
          )
          if spec is None or spec.loader is None:
              raise SystemExit("FAIL_PASE_ORCHESTRATOR_LOAD")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          dispatch = module.build_dispatch_plan(plan)

          if dispatch.get("schema_version") != "lf-pase-dispatch-plan/v1":
              raise SystemExit("FAIL_PASE_DISPATCH_SCHEMA")
          if dispatch.get("producer") != "PASE_ORCHESTRATOR_V1":
              raise SystemExit("FAIL_PASE_DISPATCH_PRODUCER")
          if dispatch.get("source_plan_sha256") != plan.get("plan_sha256"):
              raise SystemExit("FAIL_PASE_DISPATCH_SOURCE_PLAN_DRIFT")
          if dispatch.get("governance_admin") != plan.get("governance_admin"):
              raise SystemExit("FAIL_PASE_DISPATCH_GOVERNANCE_ADMIN_DRIFT")
          if dispatch.get("required_controls") != plan.get("required_controls"):
              raise SystemExit("FAIL_PASE_DISPATCH_CONTROL_COVERAGE_DRIFT")
          if dispatch.get("coverage_complete") is not True:
              raise SystemExit("FAIL_PASE_DISPATCH_COVERAGE")
          if dispatch.get("no_applicability_reclassification") is not True:
              raise SystemExit("FAIL_PASE_DISPATCH_RECLASSIFICATION_GUARD")
          if dispatch.get("no_owner_recalculation") is not True:
              raise SystemExit("FAIL_PASE_DISPATCH_OWNER_RECALCULATION_GUARD")
          if dispatch.get("no_domain_execution") is not True:
              raise SystemExit("FAIL_PASE_DISPATCH_DOMAIN_EXECUTION_GUARD")

          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(
              json.dumps(dispatch, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(
              "PASS_PASE_ORCHESTRATOR_ENTRYPOINT_V1 "
              f"controls={dispatch['control_count']} dispatches={dispatch['dispatch_count']} "
              f"sha256={dispatch['dispatch_sha256']}"
          )
          PY

      - name: Enforce PASE repair-window boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          plan_path = Path(".lf_ci/lf_ci_execution_plan_v2.json")
          plan = json.loads(plan_path.read_text(encoding="utf-8"))
          if plan.get("schema_version") != "lf-ci-execution-plan/v2":
              raise SystemExit("FAIL_PASE_PLAN_SCHEMA")
          if plan.get("coverage_complete") is not True:
              raise SystemExit("FAIL_PASE_PLAN_COVERAGE_INCOMPLETE")

          enforcement = plan.get("pase_control_enforcement")
          if not isinstance(enforcement, dict):
              raise SystemExit("FAIL_PASE_ENFORCEMENT_MISSING")
          if enforcement.get("policy_id") != "PASE_CONTROL_REPAIR_QUARANTINE_V1":
              raise SystemExit("FAIL_PASE_REPAIR_POLICY_ID")
          if enforcement.get("authority") != "CHANGESET_GOVERNANCE_LF_V1":
              raise SystemExit("FAIL_PASE_REPAIR_AUTHORITY")
          if enforcement.get("no_applicability_reclassification") is not True:
              raise SystemExit("FAIL_PASE_APPLICABILITY_RECLASSIFICATION_GUARD")
          if enforcement.get("structural_governance_fail_closed") is not True:
              raise SystemExit("FAIL_PASE_STRUCTURAL_FAIL_CLOSED_GUARD")

          required = set(plan.get("required_controls") or [])
          blocking = set(enforcement.get("blocking_controls") or [])
          observe_only = set(enforcement.get("observe_only_controls") or [])
          if blocking & observe_only:
              raise SystemExit("FAIL_PASE_ENFORCEMENT_PARTITION_OVERLAP")
          if blocking | observe_only != required:
              missing = sorted(required - blocking - observe_only)
              extra = sorted((blocking | observe_only) - required)
              raise SystemExit(
                  "FAIL_PASE_ENFORCEMENT_PARTITION_COVERAGE:"
                  f"missing={missing}:extra={extra}"
              )
          if blocking:
              raise SystemExit(
                  "BLOCK_PASE_ACTIVE_CONTROL_REQUIRES_OWNER_RUNNER_CUTOVER:"
                  + ",".join(sorted(blocking))
              )

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("### LF PASE — single validation entrypoint\n")
                  handle.write(f"- applicability plan: `{plan['applicability_sha256']}`\n")
                  handle.write(f"- repair policy: `{enforcement['policy_id']}`\n")
                  handle.write(f"- applicable controls: `{len(required)}`\n")
                  handle.write(f"- active blocking controls: `{len(blocking)}`\n")
                  handle.write(f"- repair observe-only controls: `{len(observe_only)}`\n")
                  handle.write("- automatic legacy-domain execution: `disabled during repair window`\n")
                  handle.write("- structural governance: `fail-closed`\n")

          print(
              "PASS_PASE_SINGLE_ENTRYPOINT_REPAIR_WINDOW "
              f"applicable={len(required)} blocking={len(blocking)} "
              f"observe_only={len(observe_only)}"
          )
          PY

      - name: Run POST-PASE L6 multi-scenario E2E when changed
        if: github.event_name == 'pull_request'
        env:
          LF_E2E_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LF_E2E_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha="${LF_E2E_BASE_SHA:-}"
          head_sha="${LF_E2E_HEAD_SHA:-$(git rev-parse HEAD)}"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            echo "SKIP_POST_PASE_L6_E2E_NO_BASE_SHA"
            exit 0
          fi
          if ! git diff --name-only "$base_sha" "$head_sha" | grep -q '^sandbox/lf_contract_gate_test/post_pase_e2e/'; then
            echo "SKIP_POST_PASE_L6_E2E_NOT_CHANGED"
            exit 0
          fi
          PYTHONPATH=. python3 sandbox/lf_contract_gate_test/post_pase_e2e/test_post_pase_multi_scenario_e2e_v1.py

      - name: Persist canonical PASE plan
        uses: actions/upload-artifact@v4
        with:
          name: lf-ci-applicability-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lf_ci/lf_ci_execution_plan_v2.json
          if-no-files-found: error
          retention-days: 30

      - name: Persist canonical PASE dispatch plan
        uses: actions/upload-artifact@v4
        with:
          name: lf-pase-dispatch-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lf_ci/lf_pase_dispatch_plan_v1.json
          if-no-files-found: error
          retention-days: 30
