name: S30 Migration Lifecycle Bootstrap

on:
  push:
    branches:
      - s30-strategy-lifecycle-qualification-exec-begin-20260914

permissions:
  contents: write

concurrency:
  group: s30-migration-lifecycle-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover-exact-live-sources:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install bounded test dependency
        run: python3 -m pip install --disable-pip-version-check pytest==8.3.5

      - name: Run migration lifecycle regressions
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            sandbox/lf_contract_gate_test/migration_lifecycle/test_lf_migration_lifecycle_reconcile.py \
            sandbox/lf_contract_gate_test/migration_lifecycle/test_lf_migration_lifecycle_transport_contract.py

      - name: Recover exact S30 ledger sources into worktree
        env:
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.mhwmirqcgxxukpctffuv
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          bash sandbox/lf_contract_gate_test/migration_lifecycle/run_lf_migration_lifecycle_reconcile.sh \
            --owner-prefix s30_ \
            --min-version 20260914061116 \
            --max-version 20260914065909 \
            --materialize

      - name: Verify frozen first real case 11 of 11
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/migration_lifecycle/lf_migration_lifecycle_verify_case.py \
            --case sandbox/lf_contract_gate_test/migration_lifecycle/s30_source_parity_case_20260914.json \
            --migrations-dir supabase/migrations

      - name: Commit only exact recovered migration sources
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git status --porcelain | awk '$1=="??" {print $2}' | sort)
          if [[ "${#paths[@]}" -ne 11 ]]; then
            printf 'FAIL_S30_RECOVERY_UNTRACKED_COUNT=%s\n' "${#paths[@]}"
            printf '%s\n' "${paths[@]}"
            exit 1
          fi
          for path in "${paths[@]}"; do
            case "$path" in
              supabase/migrations/2026091406*.sql) ;;
              *) echo "FAIL_S30_RECOVERY_SCOPE=$path"; exit 1 ;;
            esac
          done
          git add -- "${paths[@]}"
          staged_count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          if [[ "$staged_count" != "11" ]]; then
            echo "FAIL_S30_RECOVERY_STAGED_COUNT=$staged_count"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'S30: reconcile 11 live migration sources exactly'
          git push origin "HEAD:${GITHUB_REF_NAME}"
