name: LF A5 Candidate Tests

# A5 unit projection only. No SQL, service secrets, owner decisions, or
# governed runtime read/write; this is NOT ADR/ASOF authority verification.
on:
  push:
    paths:
      - 'skills/programming_analysis/steps/a5/**'
      - '.github/workflows/lf-analysis-a5-candidate-tests.yml'
  pull_request:
    paths:
      - 'skills/programming_analysis/steps/a5/**'
      - '.github/workflows/lf-analysis-a5-candidate-tests.yml'

permissions:
  contents: read

jobs:
  a5-candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run A5 deterministic decisions / ADR tests
        run: python3 -m unittest discover -s skills/programming_analysis/steps/a5/evals -p 'test_*.py' -v
