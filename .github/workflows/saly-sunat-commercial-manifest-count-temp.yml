name: SALY SUNAT commercial eligibility read-only full source probe
on:
  push:
    branches: [saly/sunat-commercial-count-probe-20261123]
    paths: ['.github/workflows/saly-sunat-commercial-manifest-count-temp.yml']
permissions:
  contents: read
jobs:
  verified-commercial-count:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Full pinned original QA then commercial-only rebatch, no SALY credentials
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys,hashlib
          from pathlib import Path
          d=Path('skills/ai_sales_discovery')
          sys.path.insert(0,str(d/'adapters'))
          sys.path.insert(0,str(d/'tests'))
          from sunat_first_governed_batch_v22 import expected,request_for
          from sunat_verified_delivery_v1 import verified_candidate_payloads
          from sunat_commercial_delivery_v1 import commercial_payloads_from_verified
          exact,prior=expected()
          request=request_for(prior)
          print('SUNAT_COMMERCIAL_PROBE_START '+json.dumps(dict(original_batches=exact['batches'],
                 old_found=136,remaining_raw_batches=exact['batches']-136,
                 upstream_manifest=exact['manifest_digest_sha256'],
                 source_sha256=exact['source_sha256']),sort_keys=True),flush=True)
          with verified_candidate_payloads(request,expected_manifest=exact) as (qa,stream):
              with commercial_payloads_from_verified(
                  stream,
                  original_manifest_sha256=exact['manifest_digest_sha256'],
                  snapshot_sha256=exact['source_sha256'],
                  original_batches=exact['batches'],
                  historical_found_batches=136,
                  existing_rucs=set(), # read-only manifest QA; no RUC literals
                  existing_ruc_hashes=set(["d712517527cc9237","51ec372b6056c267","09df4e58faae0fe6","25a793f8f0c0c4e9","b472aa4f25250dfe","baf310fe812e570a","513dc0c15887b109","999ab41e58c1e60f","cb74170c0fd9eb6d","0b6b9915fe9f1df5","479e3650dc813c72","9a7973e375fe9a47","7fe348e7f0482347","003311e74ec5aa3e","2164d464fd745f33","fe24c9fca6d661ad","66f2068f2fba917e","3e75935f762659e6","bf34669ba3e1299e","15b2d90801c3bd11","df697c25fd7a5d6b","9018e969447726a4","1da639bfdccbe9af","6ea49754aedcc10d","806b1124cf53b631","8d0b2640ee38c298","f1191e9ab919e6aa","107ed4e615193d13"]),
                  min_workers=50,
                  max_rows=1000,max_bytes=4*1024*1024,max_batches=479,
                  max_total_bytes=479*4*1024*1024,
                  monthly_url='https://www.datosabiertos.gob.pe/sites/default/files/PadronRUC_202610.zip'
              ) as (receipt,verified):
                  rows=0
                  hashed_rucs=[]
                  for entry,payload in verified:
                      rows+=entry['rows']
                      hashed_rucs.extend(hashlib.sha256(
                          item['capture']['normalized']['ruc'].encode('ascii')).hexdigest()[:16]
                          for item in json.loads(payload))
                  assert rows==receipt['rows']
                  assert len(hashed_rucs)==len(set(hashed_rucs))
                  # Publish only non-reversible bounded digests and manifest metadata.
                  # The names, RUC literals, source payloads never enter Github logs.
                  print('COMMERCIAL_CANDIDATE_HASH64_LIST '+','.join(hashed_rucs),flush=True)
                  print('COMMERCIAL_CANDIDATE_PLAN_METADATA '+json.dumps(receipt['plan'],
                        sort_keys=True,separators=(',',':')),flush=True)
                  assert receipt['scanned_remaining_rows']==(receipt['excluded_by_commercial_policy']+receipt['skipped_already_registered']+receipt['rows'])
                  safe={k:receipt[k] for k in ('rows','batches','total_bytes','manifest_digest_sha256',
                    'scanned_remaining_rows','excluded_by_commercial_policy','skipped_historical_rows',
                    'original_batches','historical_found_batches')}
                  safe['db_write_confirmed']=False
                  safe['requires_existing_roster_reconciliation']=True
                  print('PASS_SUNAT_COMMERCIAL_ELIGIBLE_CANDIDATE_COUNT '+json.dumps(safe,sort_keys=True),flush=True)
          PY
