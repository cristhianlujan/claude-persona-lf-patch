name: Creative compositor review
on:
  pull_request:
    paths:
      - "sandbox/creative_factory/**"
      - ".github/workflows/creative-compositor-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compositor_contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install bounded offline renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check "Pillow==11.3.0" "CairoSVG==2.8.2"
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Run isolated positive and negative contract tests
        env:
          PYTHONPATH: sandbox/creative_factory
        run: python -m unittest -v sandbox/creative_factory/test_compositor_core_v1.py
