name: PASE Orchestrator Source Regression
on:
  pull_request:
    paths:
      - 'sandbox/lf_contract_gate_test/pase_orchestrator/pase_orchestrator_v1.py'
      - 'sandbox/lf_contract_gate_test/pase_orchestrator/test_pase_orchestrator_v1.py'
      - '.github/workflows/lf-pase-orchestrator-source-regression.yml'
  workflow_dispatch:
jobs:
  orchestrator-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify PASE CURRENT_REBOUND and rejection paths on exact PR head
        run: python3 sandbox/lf_contract_gate_test/pase_orchestrator/test_pase_orchestrator_v1.py
