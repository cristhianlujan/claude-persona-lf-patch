name: Engineering RUN_TEST Repair Loop Exact Apply

on:
  push:
    branches:
      - apply/engineering-run-test-repair-loop-20261005

permissions:
  contents: read

concurrency:
  group: engineering-run-test-repair-loop-20261005171000
  cancel-in-progress: false

jobs:
  exact-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
      PGHOST: aws-1-us-east-1.pooler.supabase.com
      PGPORT: "5432"
      PGDATABASE: postgres
      PGUSER: postgres.mhwmirqcgxxukpctffuv
      MIGRATION_PATH: supabase/migrations/20261005171000_engineering_run_test_repair_loop_v1.sql
      EXPECTED_SOURCE_COMMIT: e1aaae571340b44b334d56dd6295de314b66a3e8
      EXPECTED_BLOB: 39620788ac4038878c71bc62348bff261aef5618
      MIGRATION_VERSION: "20261005171000"
      MIGRATION_NAME: engineering_run_test_repair_loop_v1
      EXECUTION_ID: EXEC-DB-ENGINEERING-RUN-TEST-REPAIR-20261005-002

    steps:
      - name: Checkout exact merged source
        uses: actions/checkout@v4
        with:
          ref: e1aaae571340b44b334d56dd6295de314b66a3e8
          fetch-depth: 1

      - name: Verify exact source and baseline
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PGPASSWORD:-}" || { echo "BLOCK_DB_PASSWORD_MISSING"; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git hash-object "$MIGRATION_PATH")" = "$EXPECTED_BLOB"
          psql -X -v ON_ERROR_STOP=1 -Atc "select case when exists(select 1 from supabase_migrations.schema_migrations where version='20261005171000') then 1 else 0 end" | grep -qx 0

      - name: Build atomic exact-source apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          path = Path(os.environ['MIGRATION_PATH'])
          source = path.read_text(encoding='utf-8')
          marker = '\ncommit;'
          if not source.startswith('begin;\n') or source.count(marker) != 1:
              raise SystemExit('BLOCK_TRANSACTION_SHAPE')
          source_md5 = hashlib.md5(source.encode('utf-8')).hexdigest()
          version = os.environ['MIGRATION_VERSION']
          name = os.environ['MIGRATION_NAME']
          exec_id = os.environ['EXECUTION_ID']
          blob = os.environ['EXPECTED_BLOB']
          delimiter = '$lf_run_test_repair_source$'
          if delimiter in source:
              raise SystemExit('BLOCK_LEDGER_DELIMITER_COLLISION')
          tail = f'''
          insert into supabase_migrations.schema_migrations(
            version,statements,name,created_by,idempotency_key,rollback
          ) values (
            '{version}',
            array[{delimiter}{source}{delimiter}]::text[],
            '{name}',
            '{exec_id}',
            'gitblob:{blob}',
            array[]::text[]
          );
          do $post$
          declare
            v_boot jsonb;
            v_spec jsonb;
            v_packet jsonb;
            v_count integer;
            v_md5 text;
          begin
            v_boot:=programacion.fn_engineering_unit_bootstrap_v3('IG_CURATOR_VALIDATOR_REFACTOR_V2','M3.7');
            if v_boot#>>'{{current_checkpoint,checkpoint_code}}' is distinct from 'NEGATIVE_READINESS_FIELD' then raise exception 'POST_M37_CURRENT:%',v_boot#>>'{{current_checkpoint,checkpoint_code}}'; end if;
            if (v_boot#>>'{{state,progress_pct}}')::numeric <> 65 then raise exception 'POST_M37_PROGRESS:%',v_boot#>>'{{state,progress_pct}}'; end if;
            v_spec:=programacion.fn_engineering_checkpoint_action_spec_v3('IG_CURATOR_VALIDATOR_REFACTOR_V2','M3.7','NEGATIVE_READINESS_FIELD');
            if v_spec#>>'{{repair_policy,mode}}' is distinct from 'REPAIR_DECLARED_TARGET_THEN_RETEST' then raise exception 'POST_REPAIR_POLICY'; end if;
            v_packet:=v_boot->'execution_packet';
            if v_packet#>>'{{connector_plan,0,executor_contract,executor}}' is distinct from 'ENGINEERING_AGENT_RUN_TEST_V1' then raise exception 'POST_EXECUTOR'; end if;
            if v_packet#>>'{{connector_plan,0,executor_contract,repair_loop,enabled}}' is distinct from 'true' then raise exception 'POST_REPAIR_LOOP'; end if;
            select count(*) into v_count from public.lf_test_suite_cases where metadata->>'unit_code'='M3.7' and metadata->>'checkpoint_code'='NEGATIVE_READINESS_FIELD';
            if v_count<>5 then raise exception 'POST_CASE_COUNT:%',v_count; end if;
            select md5(statements[1]) into v_md5 from supabase_migrations.schema_migrations where version='{version}';
            if v_md5 is distinct from '{source_md5}' then raise exception 'POST_LEDGER_MD5:%',v_md5; end if;
          end
          $post$;
          commit;
          '''
          Path('/tmp/exact_apply.sql').write_text('\\set ON_ERROR_STOP on\n' + source.replace(marker,'\n'+tail,1),encoding='utf-8')
          print('PASS_ATOMIC_WRAPPER', source_md5)
          PY

      - name: Apply exact source and ledger atomically
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f /tmp/exact_apply.sql

      - name: Terminal readback
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -Atc "
            select 'LEDGER|'||version||'|'||coalesce(name,'')||'|'||md5(statements[1]) from supabase_migrations.schema_migrations where version='20261005171000';
            select 'M37|'||(programacion.fn_engineering_unit_bootstrap_v3('IG_CURATOR_VALIDATOR_REFACTOR_V2','M3.7')#>>'{state,progress_pct}')||'|'||(programacion.fn_engineering_unit_bootstrap_v3('IG_CURATOR_VALIDATOR_REFACTOR_V2','M3.7')#>>'{current_checkpoint,checkpoint_code}');
            select 'CASES|'||count(*) from public.lf_test_suite_cases where metadata->>'unit_code'='M3.7' and metadata->>'checkpoint_code'='NEGATIVE_READINESS_FIELD';
          "
