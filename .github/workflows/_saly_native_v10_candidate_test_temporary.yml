name: SALY Native V10 candidate PostgreSQL 17 TEMPORARY
on:
  push:
    branches:
      - saly-creative-queue-pg17-pilot-20261122
jobs:
  v10_pg17:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: saly_queue_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: saly_queue_test
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client (no credentials)
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: PostgreSQL 17 candidate tests and rollback
        run: bash sandbox/creative_factory/queue_v10/test_pg17.sh
