name: PR94 Finalize LOTE-E hardening

on:
  push:
    branches:
      - agent/pr93-lote-e

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply final deterministic hardening
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path('supabase/migrations/20260801180530_writer_evidence_runtime_hardening_v7.sql')
          s = migration.read_text(encoding='utf-8')
          old = "     or to_regclass('public.lf_eventos') is null\n"
          new = (
              "     or to_regclass('public.lf_eventos') is null\n"
              "     or to_regclass('private.lf_writer_hmac_keys_v7') is null\n"
          )
          if old not in s or "to_regclass('private.lf_writer_hmac_keys_v7')" in s:
              raise SystemExit('key-table preflight marker missing or already present')
          s = s.replace(old, new, 1)

          old = """  if tg_op='UPDATE' then
            if new.evidence_event_id is distinct from old.evidence_event_id
               or new.persisted_effects is distinct from old.persisted_effects
               or new.persisted_effects_sha256 is distinct from old.persisted_effects_sha256
               or new.writer_nonce_sha256 is distinct from old.writer_nonce_sha256 then
              raise exception using
                errcode='55000',
                message='V7 gate proof binding is immutable';
            end if;
          end if;
          """
          new = """  if tg_op='UPDATE' then
            if new.writer_authentication is distinct from old.writer_authentication
               or new.test_code is distinct from old.test_code
               or new.artifact_id is distinct from old.artifact_id
               or new.gate_code is distinct from old.gate_code
               or new.test_kind is distinct from old.test_kind
               or new.target_relation is distinct from old.target_relation
               or new.probe_preimage is distinct from old.probe_preimage
               or new.probe_sha256 is distinct from old.probe_sha256
               or new.expected_outcome is distinct from old.expected_outcome
               or new.observed_outcome is distinct from old.observed_outcome
               or new.persisted_effects is distinct from old.persisted_effects
               or new.persisted_effects_sha256 is distinct from old.persisted_effects_sha256
               or new.passed is distinct from old.passed
               or new.runner_type is distinct from old.runner_type
               or new.runner_identity is distinct from old.runner_identity
               or new.source_workflow_run_id is distinct from old.source_workflow_run_id
               or new.source_commit_sha is distinct from old.source_commit_sha
               or new.evidence_event_id is distinct from old.evidence_event_id
               or new.executed_by_execution_id is distinct from old.executed_by_execution_id
               or new.executed_at is distinct from old.executed_at
               or new.writer_signature_sha256 is distinct from old.writer_signature_sha256
               or new.writer_nonce_sha256 is distinct from old.writer_nonce_sha256 then
              raise exception using
                errcode='55000',
                message='V7 gate proof binding is immutable';
            end if;
          end if;
          """
          if old not in s:
              raise SystemExit('binder immutability block not found')
          s = s.replace(old, new, 1)
          migration.write_text(s, encoding='utf-8')

          test = Path('sandbox/lf_contract_gate_test/PR93_WRITER_V7_ADVERSARIAL_TESTS.sql')
          t = test.read_text(encoding='utf-8')
          old = "  v_downgrade_rejected boolean:=false; v_message text;\n"
          new = (
              "  v_downgrade_rejected boolean:=false;\n"
              "  v_evidence_mutation_rejected boolean:=false;\n"
              "  v_message text;\n"
          )
          if old not in t:
              raise SystemExit('gate test declaration marker not found')
          t = t.replace(old, new, 1)

          marker = """  if not v_downgrade_rejected
             or (select writer_authentication
                 from private.lf_gate_test_runs_v3 where id=v_gate)
                is distinct from 'GITHUB_OIDC_HMAC_NONCE_V7' then
            raise exception 'V7 gate authentication downgrade was not blocked';
          end if;

          """
          addition = marker + """  begin
            update private.lf_gate_test_runs_v3
            set observed_outcome=observed_outcome||jsonb_build_object(
              'tampered_by','PR93-LOTE-E'
            )
            where id=v_gate;
          exception when sqlstate '55000' then
            get stacked diagnostics v_message=message_text;
            v_evidence_mutation_rejected:=position(
              'proof binding is immutable' in v_message
            )>0;
          end;
          if not v_evidence_mutation_rejected
             or not private.fn_gate_nonce_v7_valid(v_gate) then
            raise exception 'V7 signed gate evidence mutation was not blocked';
          end if;

          """
          if marker not in t:
              raise SystemExit('downgrade assertion marker not found')
          t = t.replace(marker, addition, 1)
          test.write_text(t, encoding='utf-8')

          readback = Path('sandbox/lf_contract_gate_test/PR93_LOTE_C_EVIDENCE_READBACK.sql')
          r = readback.read_text(encoding='utf-8')
          old = """  'temporary_creator_acl_removed',not has_function_privilege(
            'postgres','private.fn_bind_gate_writer_nonce_v7()','EXECUTE'
          ),
          """
          new = """  'temporary_creator_acl_removed',not exists(
            select 1
            from pg_proc p
            cross join lateral aclexplode(
              coalesce(p.proacl,acldefault('f',p.proowner))
            ) a
            join pg_roles r on r.oid=a.grantee
            where p.oid='private.fn_bind_gate_writer_nonce_v7()'::regprocedure
              and r.rolname='postgres'
              and a.privilege_type='EXECUTE'
          ),
          """
          if old not in r:
              raise SystemExit('temporary ACL readback marker not found')
          r = r.replace(old, new, 1)

          marker = """    'binder_blocks_authentication_downgrade',(
              position(
                'old.writer_authentication=''GITHUB_OIDC_HMAC_NONCE_V7'''
                in regexp_replace(
          pg_get_functiondef('private.fn_bind_gate_writer_nonce_v7()'::regprocedure),
          '\\s','','g'
                )
              )>0
              and position(
                'V7gateauthenticationcannotbedowngraded'
                in regexp_replace(
          pg_get_functiondef('private.fn_bind_gate_writer_nonce_v7()'::regprocedure),
          '\\s','','g'
                )
              )>0
            ),
          """
          addition = marker + """    'binder_blocks_signed_field_updates',(
              position(
                'new.observed_outcomeisdistinctfromold.observed_outcome'
                in regexp_replace(
          pg_get_functiondef('private.fn_bind_gate_writer_nonce_v7()'::regprocedure),
          '\\s','','g'
                )
              )>0
              and position(
                'V7gateproofbindingisimmutable'
                in regexp_replace(
          pg_get_functiondef('private.fn_bind_gate_writer_nonce_v7()'::regprocedure),
          '\\s','','g'
                )
              )>0
            ),
          """
          if marker not in r:
              raise SystemExit('binder downgrade readback marker not found')
          r = r.replace(marker, addition, 1)
          readback.write_text(r, encoding='utf-8')

          guards = Path('sandbox/lf_contract_gate_test/PR93_LOTE_C_GUARDS.md')
          g = guards.read_text(encoding='utf-8')
          old = """El binder bloquea cualquier `UPDATE` que intente cambiar una fila V7 hacia otro modo
          de autenticación. La batería ejecuta el downgrade y exige SQLSTATE `55000`, conservando
          la fila como `GITHUB_OIDC_HMAC_NONCE_V7`.
          """
          new = """El binder bloquea cualquier `UPDATE` que intente cambiar una fila V7 hacia otro modo
          de autenticación. También hace inmutables todos los campos de evidencia firmados,
          incluidos identidad, resultados, efectos, origen, timestamps, firma y nonce. La batería
          ejecuta tanto el downgrade como una mutación de `observed_outcome`, exige SQLSTATE
          `55000` y confirma que el binding sigue siendo válido.
          """
          if old not in g:
              raise SystemExit('CA-N56 documentation marker not found')
          g = g.replace(old, new, 1)

          old = """PostgreSQL exige `EXECUTE` sobre la trigger function al crear el trigger. La migración
          concede ese privilegio a `postgres` únicamente durante `CREATE TRIGGER` y lo revoca
          después de `ENABLE ALWAYS`. El readback exige que no quede ACL residual.
          """
          new = """PostgreSQL exige `EXECUTE` sobre la trigger function al crear el trigger. La migración
          concede ese privilegio a `postgres` únicamente durante `CREATE TRIGGER` y lo revoca
          después de `ENABLE ALWAYS`. El readback inspecciona la ACL explícita mediante
          `aclexplode`, evitando depender de privilegios efectivos de un posible superusuario.
          """
          if old not in g:
              raise SystemExit('CA-N60 documentation marker not found')
          g = g.replace(old, new, 1)
          guards.write_text(g, encoding='utf-8')
          PY
          rm .github/workflows/pr94-finalize-lote-e.yml
      - name: Commit finalized LOTE-E
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(governance): finalize LOTE-E evidence guards"
          git push
