name: SRCR Independent Semantic Final
on:
  push:
    branches:
      - eval/srcr-pre-research-baseline-v2-semantic-20260921
permissions:
  contents: read
jobs:
  independent-semantic-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run independent semantic judge
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib,json,os,urllib.request,urllib.error,re,pathlib,time
          enc=pathlib.Path('.github/srcr-eval/payload.b64').read_text().strip()
          packet=json.loads(zlib.decompress(base64.b64decode(enc)))
          pathlib.Path('/tmp/scope.json').write_text(json.dumps(packet['scope_authority_packet'],ensure_ascii=False,indent=2)+'\n')
          model='@cf/mistralai/mistral-small-3.1-24b-instruct'
          scope_ids=[]
          for key in ('authorized_requirements','constraints','forbidden_changes'):
            scope_ids += [x['id'] for x in packet['scope_authority_packet'][key]]
          skeleton={
            'verdict':'PASS_INDEPENDENT_SEMANTIC',
            'candidate_sha256':packet['candidate_sha256'],
            'scope_packet_sha256':packet['scope_packet_sha256'],
            'source_refs_inspected':[],
            'observed_candidate_changes':[],
            'requirement_reconciliation':[],
            'change_declaration_reconciliation':[],
            'scope_conformance_reconciliation':[],
            'invariant_results':[],
            'open_design_decisions_found':[],
            'unsupported_claims':[],
            'blocking_codes':[],
            'repair_instructions':[],
            'next_gate':'REGRESSION_AFTER'
          }
          prompt=(
            'Act as the canonical INDEPENDENT Semantic Judge B. You are not the producer and have no producer context. '
            'Use only this packet and independently inspect the ENTIRE exact_candidate. The exact_candidate is a PROFILE SOURCE UPDATE containing the complete unified patch and deterministic evidence. Do not trust producer declarations as proof. '
            'Apply judge_instructions literally. Return ONLY strict JSON. '+
            'The exact scope IDs that MUST EACH appear exactly once in requirement_reconciliation are: '+json.dumps(scope_ids)+'. IMPORTANT: requirement_reconciliation is a legacy name; it MUST include ALL 11 IDs across authorized_requirements, constraints, AND forbidden_changes, not just the 4 REQ-* rows. Copy every ID from this exact list once. '+
            'OUTPUT EXACTLY these 14 TOP-LEVEL keys and no wrapper keys: '+json.dumps(skeleton,separators=(',',':'))+'. '+
            'Do NOT emit required_scalars, other_required_arrays, or any wrapper object. candidate_sha256 and scope_packet_sha256 are top-level strings exactly as shown. '+
            'requirement_reconciliation: one row per listed scope ID with fields scope_item_id,disposition,evidence_refs and disposition SATISFIED/PRESERVED/NOT_APPLICABLE_WITH_EVIDENCE/VIOLATED/UNRESOLVED. '+
            'observed_candidate_changes: independently enumerate each material proposed change with change_id,action_class,target,candidate_paths,statement,materiality,evidence_refs. '+
            'change_declaration_reconciliation: one row per observed change_id with change_id,disposition,evidence_refs; disposition DECLARED_EQUIVALENT/DISCOVERY_ONLY_NOT_IN_SELECTED_REPAIR/UNDECLARED_PROPOSED_CHANGE. '+
            'scope_conformance_reconciliation: one row per observed change_id with change_id,disposition,evidence_refs; disposition IN_SCOPE/DISCOVERY_OUT_OF_SCOPE/OUT_OF_SCOPE_DESIGN_DELTA/UNRESOLVED_SCOPE. '+
            'invariant_results: all seven rows with invariant,result,reason,evidence_refs. '+
            'All observed changes must have both declaration and scope-conformance rows. A material unsupported/out-of-scope/open issue forbids PASS. '+
            'All seven invariants required: SCOPE_AUTHORITY_INTEGRITY,EVIDENCE_INTEGRITY,CAUSAL_CLOSURE,CONTRADICTION_INTEGRITY,MINIMUM_SUFFICIENT_REUSE,INDEPENDENT_DECISION_CLOSURE,FALSIFIABILITY_REGRESSION. Check specifically that temporal baseline proof depends on durable pre-research runtime evidence, not a self-asserted field, and that incremental-value proof permits NO_MATERIAL_UPLIFT but rejects UNPROVEN for ready material-research closure. '+
            '\nPACKET:\n'+json.dumps(packet,ensure_ascii=False,separators=(',',':'))
          )
          body={'messages':[{'role':'system','content':'Return strict JSON only. No markdown fences, no prose outside JSON.'},{'role':'user','content':prompt}],'temperature':0,'max_tokens':9000,'response_format':{'type':'json_object'}}
          url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/ai/run/{model}"
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'},method='POST')
          envelope=None
          for attempt,delay in enumerate((0,20,40,80,120),start=1):
            if delay: time.sleep(delay)
            try:
              with urllib.request.urlopen(req,timeout=300) as resp:
                envelope=json.loads(resp.read().decode())
              break
            except urllib.error.HTTPError as exc:
              if exc.code != 429 or attempt == 5: raise
              print(f'CF_RATE_LIMIT_RETRY={attempt}')
          if envelope is None: raise SystemExit('CF_NO_ENVELOPE')
          if not envelope.get('success'): raise SystemExit('CF_FAIL:'+json.dumps(envelope)[:2000])
          result=envelope.get('result') or {}
          choices=result.get('choices') if isinstance(result,dict) else None
          content=((choices[0].get('message') or {}).get('content') if isinstance(choices,list) and choices else None) or (result.get('response') if isinstance(result,dict) else None)
          if not isinstance(content,str) or not content.strip(): raise SystemExit('MODEL_EMPTY_CONTENT:'+json.dumps(result)[:3000])
          s=content.strip()
          if s.startswith('```'):
            s=re.sub(r'^```(?:json)?\s*','',s); s=re.sub(r'\s*```$','',s)
          obj=json.loads(s)
          pathlib.Path('/tmp/semantic_result.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          print('MODEL_ID='+model)
          print('VERDICT='+str(obj.get('verdict')))
          print('RECONCILED_SCOPE_ITEMS='+str(len(obj.get('requirement_reconciliation') or [])))
          print('OBSERVED_CHANGES='+str(len(obj.get('observed_candidate_changes') or [])))
          print('JUDGE_RESULT_B64='+base64.b64encode(json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).decode())
          PY
      - name: Validate exact-bound semantic judge result
        run: |
          python3 profiles/systemic_root_cause_repair_lf/validators/validate_semantic_judge_result.py /tmp/semantic_result.json \
            --scope-packet /tmp/scope.json \
            --candidate-sha256 00a125b5dd6b4a3675f117863baa25be217cfdc6d678db0db548ea788def6c4a \
            --scope-packet-sha256 a3c5d1fda124e1b5402ed199c8ea04d0d4ec704fdd2901e9f802a6b9286350b6
