name: SALY Creative Intake Repair PG17 Temporary
on:
  push:
    branches:
      - fix/saly-creative-intake-literal-semantic-qa-v1-20261123
    paths:
      - 'supabase/migrations/20261123105500_lf_saly_creative_intake_literal_semantic_repair_v1.sql'
      - 'sandbox/creative_factory/intake_repair_v01/**'
      - '.github/workflows/saly-creative-intake-repair-pg17-temporary.yml'
permissions:
  contents: read
jobs:
  pg17-intake-repair:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_intake_repair_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_intake_repair_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PostgreSQL 17 exact intake repair and negative semantic gates
        run: |
          docker run --rm --network host \
            -v "$PWD:/repo:ro" -w /repo \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e PGDATABASE=saly_intake_repair_test \
            -e PGUSER=postgres -e PGPASSWORD=postgres \
            postgres:17 bash sandbox/creative_factory/intake_repair_v01/test_pg17.sh
