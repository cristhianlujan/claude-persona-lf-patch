name: LF Profile Native Execution Bridge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'sandbox/lf_profile_native_requests/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: lf-profile-native-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  native-profile-bridge:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: lf-merge-train
    env:
      SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          fetch-depth: 1
          persist-credentials: false

      - name: Validate operational PR shape from GitHub API
        id: shape
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                per_page: 100
              }
            );
            if (files.length < 1 || files.length > 2) {
              core.setFailed(`PROFILE_NATIVE_BRIDGE_FILE_COUNT:${files.length}`);
              return;
            }
            const names = files.map(f => f.filename);
            const request = names.find(
              x => /^sandbox\/lf_profile_native_requests\/[A-Za-z0-9_.-]+\/request\.json$/.test(x)
            );
            if (!request) {
              core.setFailed('PROFILE_NATIVE_BRIDGE_REQUEST_FILE_MISSING');
              return;
            }
            const root = request.replace(/\/request\.json$/, '');
            const allowed = new Set([request, `${root}/output.json`]);
            const forbidden = files.filter(
              f => !allowed.has(f.filename) || f.status === 'removed'
            );
            if (forbidden.length) {
              core.setFailed(
                'PROFILE_NATIVE_BRIDGE_UNTRUSTED_PATH:' +
                forbidden.map(x => x.filename).join(',')
              );
              return;
            }
            const output = names.includes(`${root}/output.json`)
              ? `${root}/output.json`
              : '';
            core.setOutput('request_path', request);
            core.setOutput('output_path', output);
            core.setOutput('has_output', output ? 'true' : 'false');
            core.setOutput('root', root);

      - name: Fetch untrusted payload as data only
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PATH: ${{ steps.shape.outputs.request_path }}
          OUTPUT_PATH: ${{ steps.shape.outputs.output_path }}
        run: |
          set -euo pipefail
          mkdir -p .native_bridge
          gh api "repos/${REPO}/contents/${REQUEST_PATH}?ref=${HEAD_SHA}" \
            --jq '.content' | tr -d '\n' | base64 -d > .native_bridge/request.json
          if [ -n "${OUTPUT_PATH:-}" ]; then
            gh api "repos/${REPO}/contents/${OUTPUT_PATH}?ref=${HEAD_SHA}" \
              --jq '.content' | tr -d '\n' | base64 -d > .native_bridge/output.json
          fi
          python3 - <<'PY'
          import json
          req=json.load(open('.native_bridge/request.json',encoding='utf-8'))
          if req.get('schema_version')!='LF_PROFILE_NATIVE_BRIDGE_REQUEST_V1':
              raise SystemExit('PROFILE_NATIVE_BRIDGE_REQUEST_SCHEMA_INVALID')
          if not isinstance(req.get('stage1'),dict) or not isinstance(req.get('semantic_result'),dict):
              raise SystemExit('PROFILE_NATIVE_BRIDGE_REQUEST_BODY_INVALID')
          if req.get('executor_mode','GPT_NATIVE')!='GPT_NATIVE':
              raise SystemExit('PROFILE_NATIVE_BRIDGE_EXECUTOR_MODE_FORBIDDEN')
          if req['stage1'].get('texto_original') != 'Dame las reglas en el login B2B':
              # The first operational bridge is intentionally bounded. Expand by reviewed PR,
              # never by accepting arbitrary execution payloads through pull_request_target.
              raise SystemExit('PROFILE_NATIVE_BRIDGE_LITERAL_NOT_ALLOWED_V1')
          if req['stage1'].get('canal_candidato')!='PRODUCTO':
              raise SystemExit('PROFILE_NATIVE_BRIDGE_CHANNEL_NOT_ALLOWED_V1')
          print('PASS_PROFILE_NATIVE_BRIDGE_REQUEST_DATA_ONLY')
          PY

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version
          [ -n "${LF_SUPABASE_DB_PASSWORD:-}" ] || {
            echo 'PROFILE_NATIVE_BRIDGE_DB_SECRET_MISSING'
            exit 2
          }

      - name: Materialize Gate2 and seven pre-model steps
        id: prepare
        env:
          ACTOR_EXECUTION_ID: gha-profile-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          MAIN_SHA="$(git rev-parse HEAD)"
          REQUEST_B64="$(base64 -w0 .native_bridge/request.json)"
          export MAIN_SHA REQUEST_B64

          python3 - <<'PY' > .native_bridge/begin.sql
          import os
          b64=os.environ['REQUEST_B64']
          actor=os.environ['ACTOR_EXECUTION_ID']
          print(r"""\pset tuples_only on
          \pset format unaligned
          SELECT public.lf_profile_native_bridge_begin_v1(
            (convert_from(decode('""" + b64 + r"""','base64'),'UTF8')::jsonb)->'stage1',
            (convert_from(decode('""" + b64 + r"""','base64'),'UTF8')::jsonb)->'semantic_result',
            'GPT_NATIVE',
            '""" + actor + r"""'
          );""")
          PY

          PGPASSWORD="${LF_SUPABASE_DB_PASSWORD}" \
          psql "host=${SUPABASE_POOLER_HOST} port=5432 user=postgres.${SUPABASE_PROJECT_ID} dbname=postgres sslmode=require" \
            -X -v ON_ERROR_STOP=1 -f .native_bridge/begin.sql \
            | sed '/^[[:space:]]*$/d' | tail -1 > .native_bridge/begin.json

          cat .native_bridge/begin.json
          python3 - <<'PY'
          import json
          x=json.load(open('.native_bridge/begin.json',encoding='utf-8'))
          if x.get('status')!='NATIVE_EXECUTION_READY' or x.get('bridge_status')!='READY':
              raise SystemExit('PROFILE_NATIVE_BRIDGE_BEGIN_NOT_READY:'+json.dumps(x,sort_keys=True)[:3000])
          if x.get('profile_code')!='PERFIL-PRODUCT-DIRECTOR-LF':
              raise SystemExit('PROFILE_NATIVE_BRIDGE_UNEXPECTED_PROFILE')
          if not isinstance(x.get('execution_id'),str) or not x['execution_id']:
              raise SystemExit('PROFILE_NATIVE_BRIDGE_EXECUTION_ID_MISSING')
          open('.native_bridge/execution_id','w').write(x['execution_id'])
          path=x.get('profile_path')
          if not isinstance(path,str) or not path.startswith('profiles/') or '..' in path.split('/'):
              raise SystemExit('PROFILE_NATIVE_BRIDGE_PROFILE_PATH_INVALID')
          open('.native_bridge/profile_path','w').write(path)
          PY

          EXECUTION_ID="$(cat .native_bridge/execution_id)"
          PROFILE_PATH="$(cat .native_bridge/profile_path)"
          [ -f "${PROFILE_PATH}" ] || {
            echo "PROFILE_NATIVE_BRIDGE_SOURCE_MISSING:${PROFILE_PATH}"
            exit 2
          }
          SOURCE_DIGEST="sha256:$(sha256sum "${PROFILE_PATH}" | awk '{print $1}')"
          export EXECUTION_ID PROFILE_PATH SOURCE_DIGEST

          python3 - <<'PY' > .native_bridge/prepare.sql
          import os
          print(r"""\pset tuples_only on
          \pset format unaligned
          SELECT public.lf_profile_native_bridge_prepare_v1(
            '""" + os.environ['EXECUTION_ID'] + r"""',
            '""" + os.environ['MAIN_SHA'] + r"""',
            '""" + os.environ['SOURCE_DIGEST'] + r"""',
            '""" + os.environ['ACTOR_EXECUTION_ID'] + r"""'
          );""")
          PY

          PGPASSWORD="${LF_SUPABASE_DB_PASSWORD}" \
          psql "host=${SUPABASE_POOLER_HOST} port=5432 user=postgres.${SUPABASE_PROJECT_ID} dbname=postgres sslmode=require" \
            -X -v ON_ERROR_STOP=1 -f .native_bridge/prepare.sql \
            | sed '/^[[:space:]]*$/d' | tail -1 > .native_bridge/prepare.json

          cat .native_bridge/prepare.json
          python3 - <<'PY'
          import json
          x=json.load(open('.native_bridge/prepare.json',encoding='utf-8'))
          if x.get('status')!='NATIVE_MODEL_INPUT_READY' or x.get('clean_step_count')!=7:
              raise SystemExit('PROFILE_NATIVE_BRIDGE_PREPARE_NOT_READY:'+json.dumps(x,sort_keys=True)[:5000])
          ig=x.get('input_governance') or {}
          if ig.get('status')!='NOT_REQUIRED':
              raise SystemExit('PROFILE_NATIVE_BRIDGE_IG_EXPECTED_NOT_REQUIRED:'+json.dumps(ig,sort_keys=True))
          print('PASS_PROFILE_NATIVE_BRIDGE_PRE_MODEL_7_OF_11')
          PY
          echo "execution_id=${EXECUTION_ID}" >> "${GITHUB_OUTPUT}"
          {
            echo "### LF native profile bridge"
            echo "- execution_id: `${EXECUTION_ID}`"
            echo "- producer: `PERFIL-PRODUCT-DIRECTOR-LF / GPT_NATIVE`"
            echo "- pre-model steps: `7/11`"
            echo "- Input Governance: `NOT_REQUIRED_CANONICAL_READ`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate and record current-chat Product Director RAW
        if: steps.shape.outputs.has_output == 'true'
        env:
          OUTPUT_PATH: ${{ steps.shape.outputs.output_path }}
          ACTOR_EXECUTION_ID: gha-profile-native-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          EXECUTION_ID="$(cat .native_bridge/execution_id)"
          MAIN_SHA="$(git rev-parse HEAD)"

          python3 profiles/product_director_lf/validators/validate_product_director_output.py \
            < .native_bridge/output.json > .native_bridge/validation.json
          cat .native_bridge/validation.json
          python3 - <<'PY'
          import json
          v=json.load(open('.native_bridge/validation.json',encoding='utf-8'))
          if v.get('valid') is not True or v.get('blocking_codes'):
              raise SystemExit('PROFILE_NATIVE_BRIDGE_PRODUCT_VALIDATOR_FAILED:'+json.dumps(v,sort_keys=True)[:5000])
          print('PASS_PROFILE_NATIVE_BRIDGE_PRODUCT_VALIDATOR')
          PY

          OUTPUT_B64="$(base64 -w0 .native_bridge/output.json)"
          VALIDATION_B64="$(base64 -w0 .native_bridge/validation.json)"
          RAW_REF="github://${REPO}@${HEAD_SHA}/${OUTPUT_PATH}"
          VALIDATOR_REF="github://${REPO}@${MAIN_SHA}/profiles/product_director_lf/validators/validate_product_director_output.py"
          export EXECUTION_ID OUTPUT_B64 VALIDATION_B64 RAW_REF VALIDATOR_REF

          python3 - <<'PY' > .native_bridge/record.sql
          import os
          print(r"""\pset tuples_only on
          \pset format unaligned
          SELECT public.lf_profile_native_bridge_record_output_v1(
            '""" + os.environ['EXECUTION_ID'] + r"""',
            convert_from(decode('""" + os.environ['OUTPUT_B64'] + r"""','base64'),'UTF8')::jsonb,
            convert_from(decode('""" + os.environ['VALIDATION_B64'] + r"""','base64'),'UTF8')::jsonb,
            '""" + os.environ['RAW_REF'] + r"""',
            '""" + os.environ['VALIDATOR_REF'] + r"""',
            '""" + os.environ['ACTOR_EXECUTION_ID'] + r"""'
          );""")
          PY

          PGPASSWORD="${LF_SUPABASE_DB_PASSWORD}" \
          psql "host=${SUPABASE_POOLER_HOST} port=5432 user=postgres.${SUPABASE_PROJECT_ID} dbname=postgres sslmode=require" \
            -X -v ON_ERROR_STOP=1 -f .native_bridge/record.sql \
            | sed '/^[[:space:]]*$/d' | tail -1 > .native_bridge/record.json
          cat .native_bridge/record.json

          python3 - <<'PY'
          import json
          x=json.load(open('.native_bridge/record.json',encoding='utf-8'))
          if x.get('status')!='NATIVE_PRODUCER_VALIDATED' or x.get('clean_step_count')!=9:
              raise SystemExit('PROFILE_NATIVE_BRIDGE_RECORD_NOT_9_OF_11:'+json.dumps(x,sort_keys=True)[:5000])
          if x.get('independent_semantic_judge_required') is not True or x.get('terminal_authority_ready') is not False:
              raise SystemExit('PROFILE_NATIVE_BRIDGE_INDEPENDENCE_BOUNDARY_BROKEN')
          print('PASS_PROFILE_NATIVE_BRIDGE_PRODUCER_9_OF_11')
          PY
          {
            echo "- producer RAW + deterministic validator: `9/11`"
            echo "- next: `independent semantic_judge`"
            echo "- producer self-authorization: `FORBIDDEN`"
          } >> "${GITHUB_STEP_SUMMARY}"
