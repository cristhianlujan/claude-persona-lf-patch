name: LF F3 Drift Monitor Shadow
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  drift-shadow:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Intentionally no environment and no database secret until separately approved.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'psycopg[binary]==3.2.10'
      - name: Snapshot main vs ledger — shadow only
        if: ${{ false }}
        # Activation requires lf_ci_readonly and LF_SUPABASE_DB_READONLY_PASSWORD.
        env:
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGUSER: lf_ci_readonly.mhwmirqcgxxukpctffuv
          PGPORT: '5432'
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_READONLY_PASSWORD }}
        run: |
          python sandbox/lf_contract_gate_test/f3_drift_monitor_shadow.py > "$RUNNER_TEMP/f3-drift.json"
          cat "$RUNNER_TEMP/f3-drift.json"
