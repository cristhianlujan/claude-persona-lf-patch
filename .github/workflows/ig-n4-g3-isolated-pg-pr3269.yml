name: LF IG N4 G3 isolated PostgreSQL (PR 3269 only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ig-n4-g3-isolated-pg-pr3269.yml'
      - 'sandbox/lf_contract_gate_test/input_governance/**'

permissions:
  contents: read

jobs:
  n4-g3-isolated:
    if: ${{ github.event.pull_request.number == 3269 && github.event.pull_request.head.repo.full_name == 'cristhianlujan/claude-persona-lf-patch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Intentional: no project connection credentials and no Supabase env.
      PGHOST: ''
      PGHOSTADDR: ''
      DATABASE_URL: ''
      SUPABASE_URL: ''
    steps:
      - name: Checkout source with no persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate shell syntax
        run: bash -n sandbox/lf_contract_gate_test/input_governance/ig_n4_docker_pg17_6_isolated_20261028.sh
      - name: Isolated PostgreSQL 17.6 DDL, 28 tests, parity and rollback
        run: bash sandbox/lf_contract_gate_test/input_governance/ig_n4_docker_pg17_6_isolated_20261028.sh
