name: SALY Chat Gate V16 PG17 Temporary
on:
  push:
    branches:
      - feat/saly-creative-chat-entry-qa-v16-20261123
    paths:
      - 'supabase/migrations/20261123084800_lf_saly_creative_chat_entry_qa_gate_v1.sql'
      - 'sandbox/creative_factory/queue_v16/**'
      - '.github/workflows/saly-chat-gate-v16-pg17-temporary.yml'
permissions:
  contents: read
jobs:
  pg17-v16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_chat_gate_v16_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_chat_gate_v16_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Isolated PG17 existing queue and Native wire plus V16 gate
        run: |
          docker run --rm --network host \
            -v "$PWD:/repo:ro" -w /repo \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e PGDATABASE=saly_chat_gate_v16_test \
            -e PGUSER=postgres -e PGPASSWORD=postgres \
            postgres:17 bash sandbox/creative_factory/queue_v16/test_pg17.sh
