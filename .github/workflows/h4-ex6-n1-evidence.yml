name: H4 EX6 N+1 exact SHA and one-pass source-only diagnostics

on:
  pull_request:
    paths:
      - 'sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/**'
      - '.github/workflows/h4-ex6-n1-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  h4-ex6-n1-one-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PG12_TEST_DSN: postgresql://ex6_ci:ex6-local-only@127.0.0.1:5432/pg12_test_ex6
      PG12_DISPOSABLE_DB: YES
    steps:
      - name: Checkout exact LF PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Start disposable PostgreSQL loopback
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql postgresql-client
          sudo service postgresql start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE ROLE ex6_ci LOGIN SUPERUSER PASSWORD 'ex6-local-only'"
          sudo -u postgres createdb -O ex6_ci pg12_test_ex6
          PGPASSWORD=ex6-local-only psql -h 127.0.0.1 -U ex6_ci -d pg12_test_ex6 -c "SELECT current_database()"
      - name: Test both original ZIP/JSON checksums, attacks and legacy N
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tests -p 'test_ex6*.py' -v
      - name: Execute one PG04 through PG14 pass with verified N+1
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tools/ex6_n1_one_pass_v1.py > "$RUNNER_TEMP/h4-ex6-n1-onepass.json.log"
          grep -F 'EX6_N1_PG04_PG14_ONE_PASS_SOURCE_ONLY_PASS' "$RUNNER_TEMP/h4-ex6-n1-onepass.json.log"
      - name: Publish source-only one-pass record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: h4-ex6-n1-pg04-pg14-source-only
          path: ${{ runner.temp }}/h4-ex6-n1-onepass.json.log
          if-no-files-found: warn
          retention-days: 30
