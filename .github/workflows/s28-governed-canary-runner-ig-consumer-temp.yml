name: S28 Governed Canary Runner IG Consumer TEMP

on:
  push:
    branches:
      - lf/s28-governed-canary-runner-v1-20260907

permissions:
  contents: read

concurrency:
  group: s28-governed-canary-runner-ig-consumer-temp
  cancel-in-progress: false

jobs:
  ig-consumer-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CANARY_WORKDIR: ${{ runner.temp }}/s28-ig-generic-runner
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify generic runner and adapter locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            sandbox/lf_contract_gate_test/governed_canary_runner_v1/lf_governed_canary_runner.py \
            sandbox/lf_contract_gate_test/governed_canary_runner_v1/input_governance_ig006_ig007_adapter.py
          python3 sandbox/lf_contract_gate_test/governed_canary_runner_v1/test_lf_governed_canary_runner.py

      - name: Run Input Governance exact-version consumer through generic runner
        id: consumer
        timeout-minutes: 18
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${LF_SUPABASE_DB_PASSWORD:-}"
          python3 sandbox/lf_contract_gate_test/governed_canary_runner_v1/input_governance_ig006_ig007_adapter.py \
            --phase run \
            --workdir "$CANARY_WORKDIR"

      - name: Mandatory transport finalizer rollback
        if: always()
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${LF_SUPABASE_DB_PASSWORD:-}"
          python3 sandbox/lf_contract_gate_test/governed_canary_runner_v1/input_governance_ig006_ig007_adapter.py \
            --phase rollback \
            --workdir "$CANARY_WORKDIR"

      - name: Mandatory transport finalizer post-readback
        if: always()
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${LF_SUPABASE_DB_PASSWORD:-}"
          python3 sandbox/lf_contract_gate_test/governed_canary_runner_v1/input_governance_ig006_ig007_adapter.py \
            --phase post_readback \
            --workdir "$CANARY_WORKDIR"

      - name: Publish sanitized canary metrics
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['CANARY_WORKDIR'])
          print('### S28 governed canary runner — Input Governance consumer')
          for name in ('runner_evidence.json','metrics.json','post_readback.json'):
              p=root/name
              print(f'- {name}:', 'present' if p.exists() else 'absent')
          p=root/'metrics.json'
          if p.exists():
              m=json.loads(p.read_text())
              print(f"- current screens: {m['current_screens_passed']}/5")
              print(f"- stale controls: {m['stale_controls_passed']}/4")
              print(f"- false_close: {m['false_close']}")
              print(f"- Curator p50/p95 ms: {m['curator_p50_ms']}/{m['curator_p95_ms']}")
              print(f"- Validator total p50/p95 ms: {m['validator_total_p50_ms']}/{m['validator_total_p95_ms']}")
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s28-governed-canary-runner-ig-consumer-${{ github.sha }}
          path: |
            ${{ runner.temp }}/s28-ig-generic-runner/runner_evidence.json
            ${{ runner.temp }}/s28-ig-generic-runner/metrics.json
            ${{ runner.temp }}/s28-ig-generic-runner/post_readback.json
          if-no-files-found: warn
          retention-days: 7
