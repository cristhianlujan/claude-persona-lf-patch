      - name: Run existing child writer with synthetic judged parent (not independent judge)
        run: python3 sandbox/lf_contract_gate_test/rule_update_bulk_v1/test_pg17_rule_owner_bulk_atomic.py

  rule-promotion-governed-pg18:
    if: github.head_ref == 'lf/issue-3779-lote3-governed-rule-promotion-v1'
    name: One rule | governed deterministic judge and existing promotion route PG18
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
