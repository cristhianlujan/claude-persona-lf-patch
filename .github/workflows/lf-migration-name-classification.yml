          psql --version
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
      - name: Run PR-G authentic V2 code in disposable PostgreSQL17 BEGIN/ROLLBACK
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/input_governance/run_pr_g_owner_username_pg17_v1.py
          python3 - <<'PY'
