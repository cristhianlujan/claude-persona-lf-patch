name: LF migration name classification

on:
  pull_request:
    paths:
      - "supabase/migrations/**/*.sql"
      - ".github/workflows/lf-migration-merge-train.yml"
      - ".github/workflows/lf-migration-name-classification.yml"
      - "sandbox/lf_contract_gate_test/migration_source_parity/lf_migration_source_parity_ci_context.py"
      - "sandbox/lf_contract_gate_test/migration_source_parity/lf_migration_name_classification_check.py"
      - "sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_pre_apply.py"
      - "sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_family_classification.py"
      - "sandbox/lf_contract_gate_test/input_governance/test_pr_f_auth_params_source_v1.py"
      - "sandbox/lf_contract_gate_test/input_governance/run_pr_k_lockout_reset_pg17_v1.py"
      - "sandbox/lf_contract_gate_test/input_governance/run_ig_chat8_auth_window_pg17.py"
      - "sandbox/lf_contract_gate_test/input_governance/run_ig_chat8_create_candidate_pg17_v1.py"
      - "docs/input-governance/PR_K_LOGIN_LOCKOUT_RESET_AND_FOUR_RULES_DOCUMENT_ONLY_20261118.json"
      - "sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_reconciliation_source.py"
      - ".github/workflows/lf-migration-route-guard.yml"
      - "sandbox/lf_contract_gate_test/engineering_checkpoints/m10_13/cp3_legacy_reintroduction_guard_v1.py"
      - "sandbox/lf_contract_gate_test/migration_route_guard/**"

permissions:
  contents: read

jobs:
  # Exact-HEAD source fixture; no remote Supabase credentials.
  ig-chat8-auth-window30-pg17:
    name: IG Chat8 PG17 BEGIN/ROLLBACK auth window 30m
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'lf/ig-chat8-auth-login-window30-20261118' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ig_chat8_ephemeral_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: ig_chat8_ephemeral_only
    steps:
      - name: Exact branch HEAD checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PostgreSQL 17 readiness
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres
      - name: One positive and four negative transaction readbacks
        run: |
          set -euo pipefail
          python3 -m py_compile sandbox/lf_contract_gate_test/input_governance/run_ig_chat8_auth_window_pg17.py
          python3 sandbox/lf_contract_gate_test/input_governance/run_ig_chat8_auth_window_pg17.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.lf_ci/ig_chat8_auth_window/report.json').read_text())
          assert r['status']=='PASS'
          assert r['independent_readback']=='RESTORED_12_10_0_579'
          assert len(r['negative_checks'])==4
          assert r['candidate_rules_created']==0
          assert r['remote_supabase_tested'] is False
          print('IG_CHAT8_PG17_EXACT_ROLLBACK_1_POSITIVE_4_NEGATIVE_PASS')
          PY
      - name: Execute exact CREATE Step70/owner PG17 synthetic rollback test
        run: |
          set -euo pipefail
          python3 -m py_compile sandbox/lf_contract_gate_test/input_governance/run_ig_chat8_create_candidate_pg17_v1.py
          python3 sandbox/lf_contract_gate_test/input_governance/run_ig_chat8_create_candidate_pg17_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.lf_ci/ig_chat8_create_candidate/report.json').read_text())
          assert r['status']=='PASS' and r['remote_supabase_tested'] is False
          assert r['independent_readback']=='ROLLBACK_RESTORED'
          assert len(r['checks'])==6 and all(r['checks'].values())
          print('IG_CHAT8_CREATE_PG17_6_CHECKS_AND_INDEPENDENT_READBACK_PASS')
          PY
      - name: Archive exact source hash and rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ig-chat8-auth-window30-pg17-report
          path: |
            .lf_ci/ig_chat8_auth_window/report.json
            .lf_ci/ig_chat8_create_candidate/report.json
            .lf_ci/ig_chat8_create_candidate/postgresql.log
          if-no-files-found: warn
          retention-days: 30

  classify-migration-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for canonical name classifier
        run: |
          python3 sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_pre_apply.py
          python3 sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_reconciliation_source.py
      - name: Unit tests for migration route guard classifier
        run: |
          python3 sandbox/lf_contract_gate_test/migration_route_guard/test_lf_migration_route_guard.py
      - name: Test IG M10.13 anti-reintroduction guard in unprivileged PR CI
        run: python3 sandbox/lf_contract_gate_test/engineering_checkpoints/m10_13/cp3_legacy_reintroduction_guard_v1.py self-test
      - name: Classify changed migration filenames
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          mapfile -t migration_paths < <(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" -- supabase/migrations/)
          if [ "${#migration_paths[@]}" -eq 0 ]; then
            echo "PASS_NO_MIGRATION_PATHS_CHANGED"
            exit 0
          fi
          python3 sandbox/lf_contract_gate_test/migration_source_parity/lf_migration_name_classification_check.py \
            --failure-code FAIL_UNCLASSIFIED_MIGRATION_PRE_APPLY \
            --allow-reconciliation-source \
            "${migration_paths[@]}"

  # No protected credentials: the real PostgreSQL 17 service is ephemeral CI.
  # This is bound to this one PR and never writes to Supabase.
  pr-c-niubiz-pg17-real-rollback:
    name: PR-C 4078 real PostgreSQL 17 BEGIN/ROLLBACK and one fake row
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 4078 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pr_c_ephemeral_pg17_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: pr_c_ephemeral_pg17_only
      PR_C_EXACT_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout the exact PR-C HEAD without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run PR-C static scope and RLS source guards (4/4)
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/input_governance/test_pr_c_payment_provider_config_source_v1.py
          python3 -m py_compile sandbox/lf_contract_gate_test/input_governance/run_pr_c_payment_provider_pg17_v1.py
      - name: Install isolated PostgreSQL client if missing
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
      - name: Execute real PG17 BEGIN/ROLLBACK and independent readback
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/input_governance/run_pr_c_payment_provider_pg17_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.lf_ci/pr_c_payment_provider_config/report.json').read_text())
          assert r['status']=='PASS' and r['sql_exit_code']==0
          assert r['independent_readback']=='ABSENT'
          assert all(r['assertions'].values()) and r['remote_supabase_tested'] is False
          print('PR_C_REAL_PG17_BEGIN_ROLLBACK_PASS')
          PY
      - name: Archive SHA256 reports and real PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-c-4078-pg17-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lf_ci/pr_c_payment_provider_config/report.json
            .lf_ci/pr_c_payment_provider_config/postgresql.log
          if-no-files-found: warn
          retention-days: 30

  # Only PR-D; no production secrets. PG17 Docker service is disposable.
  pr-d-global-config-pg17-real-rollback:
    name: PR-D 4079 real PostgreSQL 17 BEGIN/ROLLBACK global config
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 4079 }}
