name: LF migration name classification

on:
  pull_request:
    paths:
      - "supabase/migrations/**/*.sql"
      - ".github/workflows/lf-migration-merge-train.yml"
      - ".github/workflows/lf-migration-name-classification.yml"
      - "sandbox/lf_contract_gate_test/migration_source_parity/lf_migration_source_parity_ci_context.py"
      - "sandbox/lf_contract_gate_test/migration_source_parity/lf_migration_name_classification_check.py"
      - "sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_pre_apply.py"
      - "sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_family_classification.py"
      - "sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_reconciliation_source.py"
      - ".github/workflows/lf-migration-route-guard.yml"
      - "sandbox/lf_contract_gate_test/migration_route_guard/**"

permissions:
  contents: read

jobs:
  classify-migration-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests for canonical name classifier
        run: |
          python3 sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_pre_apply.py
          python3 sandbox/lf_contract_gate_test/migration_source_parity/test_migration_name_reconciliation_source.py
      - name: Unit tests for migration route guard classifier
        run: |
          python3 sandbox/lf_contract_gate_test/migration_route_guard/test_lf_migration_route_guard.py
      - name: Classify changed migration filenames
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          mapfile -t migration_paths < <(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" -- supabase/migrations/)
          if [ "${#migration_paths[@]}" -eq 0 ]; then
            echo "PASS_NO_MIGRATION_PATHS_CHANGED"
            exit 0
          fi
          python3 sandbox/lf_contract_gate_test/migration_source_parity/lf_migration_name_classification_check.py \
            --failure-code FAIL_UNCLASSIFIED_MIGRATION_PRE_APPLY \
            --allow-reconciliation-source \
            "${migration_paths[@]}"
  rule-history-pg17:
    if: github.head_ref == 'lf/issue-3779-rule-update-history-v1' || github.head_ref == 'lf/issue-3779-rule-update-general-v1' || github.head_ref == 'lf/issue-3779-rule-bulk-atomic-v1'
    name: Rule history | full pre/post, SHA, rollback, immutable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Execute canonical writer and immutable-history negative tests
        run: python3 sandbox/lf_contract_gate_test/rule_update_history_v1/test_pg17_rule_history.py
  rule-general-update-pg17:
    if: github.head_ref == 'lf/issue-3779-rule-update-general-v1' || github.head_ref == 'lf/issue-3779-rule-bulk-atomic-v1'
    name: Rule update | individual admin, SHA, atomic 578 rules
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Execute canonical writer and immutable-history negative tests
        run: |
          python3 sandbox/lf_contract_gate_test/rule_update_general_v1/test_pg17_rule_general_update.py
          python3 sandbox/lf_contract_gate_test/rule_update_general_v1/test_rule_owner_schema_impact.py
          python3 sandbox/lf_contract_gate_test/rule_update_bulk_v1/test_pg17_rule_owner_bulk_atomic.py
  step40-one-rule-pg18:
    if: github.head_ref == 'lf/issue-3779-step40-rule-batch-audit-v1'
    name: Step40 | one rule, screen CURRENT, missing screen, PANTALLA regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Run one-rule positive, negative, PANTALLA, source, rollback probes
        run: python3 sandbox/lf_contract_gate_test/rule_scope_v1/test_pg18_step40_rule_scope.py
  existing-rule-atomic-pg18:
    if: github.head_ref == 'lf/issue-3779-step40-rule-batch-audit-v1'
    name: Rule child | judge, exact scope, 578 rollback, same-RUN replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Run existing child writer with synthetic judged parent (not independent judge)
        run: python3 sandbox/lf_contract_gate_test/rule_update_bulk_v1/test_pg17_rule_owner_bulk_atomic.py
