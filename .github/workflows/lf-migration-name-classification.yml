        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_one_rule_promotion.py

  rule-lote4-mutation-pg18:
    if: github.head_ref == 'lf/issue-3779-lote4-semantic-measurement-v1' || github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
    name: Lote4 | deterministic confusion matrix from labelled real-rule mutations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Measure objective deterministic mutation detection; no quality threshold hidden
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote4_mutation_measurement.py
      - name: Export machine-readable confusion matrix and RAW cases
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lf-3779-lote4-deterministic-measurement
          path: sandbox/lf_contract_gate_test/rule_promotion_v1/lote4_deterministic_measurement_runtime.json
          if-no-files-found: warn

  rule-lote4-semantic-gate-pg18:
    if: github.head_ref == 'lf/issue-3779-lote4-semantic-measurement-v1' || github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
    name: Lote4 | native-review receipt gate fail-closed, 42 legacy regressions PG18
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Existing L3 request / deterministic decide / apply regression (without L4 gate)
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_one_rule_promotion.py
      - name: "L4 semantic receipt gate: missing, forged, inconclusive, stale and synthetic positives"
        if: github.head_ref == 'lf/issue-3779-lote4-semantic-measurement-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote4_semantic_gate.py
      - name: "L3693 static contract: semantic family remediation preserves promotion_authorized=false"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 -m unittest sandbox/lf_contract_gate_test/engineering_checkpoints/ig_evo/test_semantic_family_remediation_detail_v1.py
      - name: "L4C blind dataset: novel cases, minimum per family, no leaked key"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_lote4c_blind_packet_contract.py
      - name: "L4C existing IG Validator: quote, synthetic Step70, policy drift, rollback"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote4_semantic_gate.py
      - name: "L4D owner profile authority: verified decision, human escalation and apply readback"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote4d_profile_owner_approval.py
      - name: "L5 structural: real-case schema, owner registry ACL, atomic VIGENTE readback, owner return"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote5_real_verdict_profile_return.py
      - name: "L6 PG18: actual auditor verdict fixture without quotes, owner review only, HUMAN and fail closed"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote6_claude_blind_5pass_uncited.py
      - name: "L7 PG18: frozen base/proposal, prebind IG citation, Step70 ACL, unique quotes, apply revalidation, injection"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote7_exact_citation_capture.py
      - name: "L8 PG18: case-scoped BASE quote repetition, proposal collision and cross-rule guard"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote8_quote_reuse_scoped.py
      - name: "L9 PG18: 154 actual chat-export citations, SHA and neutral L6, unmodified L7-L8"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote9_real_chat_export_citation_measurement.py
      - name: "L10 PG18: owner-declared ChatGPT, four real-quote negative paths and honest 12-stage E2E"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote10_owner_declared_e2e_attestation_limits.py
      - name: "L11 PG18: native provenance reachability without forging official Step70 or receipt"
        if: github.head_ref == 'lf/issue-3779-lote4b-validator-reuse-audit-v1'
        run: python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote11_synthetic_positive_reachability.py
      - name: Preserve reproducible native gate spec and blind datasets
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lf-3779-lote4-semantic-gate-contract
          path: |
            sandbox/lf_contract_gate_test/rule_promotion_v1/lote4_native_semantic_gate_contract_v1.json
            sandbox/lf_contract_gate_test/rule_promotion_v1/lote4_semantic_mutations_labeled_v1.json
            sandbox/lf_contract_gate_test/rule_promotion_v1/lote4_adversarial_mutations_labeled_v1.json
            docs/input-governance/L5_REAL_VERDICT_PROFILE_OWNER_RETURN_CONTRACT_V1.md
            docs/input-governance/L5_ORPHAN_PROFILE_RUNS_READONLY_TRIAGE_V1.json
            sandbox/lf_contract_gate_test/rule_promotion_v1/lote6_claude_blind_5pass_verdicts_not_native_ig_receipt_v1.json
            docs/input-governance/L6_RUNTIME_ORPHANS_21_AND_PROFILE3_READONLY_TRIAGE_V1.json
            docs/input-governance/L6_CLAUDE_VERDICTS_NO_QUOTES_GOVERNED_CAPTURE_PLAN_V1.md
            docs/input-governance/L7_EXACT_CITATION_CAPTURE_GOVERNED_CONTRACT_V1.md
            sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote7_exact_citation_capture.py
            sandbox/lf_contract_gate_test/rule_promotion_v1/lote9_real_review_pass1_chat_export_model_unattested.txt
            sandbox/lf_contract_gate_test/rule_promotion_v1/lote9_real_review_pass1_chat_export_model_unattested.json
