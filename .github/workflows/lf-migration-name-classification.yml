          python3 -m py_compile sandbox/lf_contract_gate_test/input_governance/run_pr_d_global_config_pg17_v1.py
      - name: Install PostgreSQL client, check local container
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
