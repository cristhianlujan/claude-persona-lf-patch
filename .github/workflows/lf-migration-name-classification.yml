          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/input_governance/test_pr_g_owner_username_source_v1.py
          python3 -m py_compile sandbox/lf_contract_gate_test/input_governance/run_pr_g_owner_username_pg17_v1.py
      - name: Ensure local PostgreSQL client ready
