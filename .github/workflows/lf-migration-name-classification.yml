          fi
          psql --version
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
      - name: Execute real PR-D BEGIN/ROLLBACK and independent source readback
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/input_governance/run_pr_d_global_config_pg17_v1.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('.lf_ci/pr_d_global_config/report.json').read_text())
          assert r['status']=='PASS' and r['sql_exit_code']==0
          assert r['independent_readback']=='RESTORED'
          assert r['source_snapshot_rows']==1 and all(r['assertions'].values())
          assert r['remote_supabase_tested'] is False
          print('PR_D_REAL_PG17_BEGIN_ROLLBACK_PASS')
          PY
      - name: Archive real PG17 evidence and hashes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-d-4079-pg17-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lf_ci/pr_d_global_config/report.json
            .lf_ci/pr_d_global_config/postgresql.log
          if-no-files-found: warn
          retention-days: 30

  # PR-F only: exact-head real PostgreSQL 17 isolated service, no cloud DB secrets.
  pr-f-auth-global-params-pg17-rollback:
