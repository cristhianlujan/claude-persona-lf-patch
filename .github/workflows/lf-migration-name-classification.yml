      - name: Run PR-F static exact-value and no-rule-change checks
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/input_governance/test_pr_f_auth_params_source_v1.py
          python3 -m py_compile sandbox/lf_contract_gate_test/input_governance/run_pr_f_auth_params_pg17_v1.py
      - name: Verify local PostgreSQL client and ephemeral DB
