name: M1A6 Migration Source Parity Probe

on:
  push:
    branches:
      - lf/test-m1a6-migration-parity-20261001
    paths:
      - .github/workflows/m1a6-migration-source-parity-probe.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  migration-source-parity:
    name: Execute MIGRATION_SOURCE_PARITY
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact M1.A6 candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: b6986f02714fac5ff8d4c78c2a8c597d9d1ba863

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute canonical Migration Source Parity flow
        id: parity
        continue-on-error: true
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/migration_source_parity/run_migration_source_parity_flow_v1.py \
            --repo-root . \
            --base-sha 1722bbc3e554344498631ef88dc12bb2e8b387cf \
            --head-sha b6986f02714fac5ff8d4c78c2a8c597d9d1ba863 \
            --base-ref main \
            --event-name pull_request \
            --output-dir .lf_migration_source_parity

      - name: Persist bounded evidence on ephemeral branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m1a6-parity
          for f in parity-output.txt parity-stderr.txt run-summary.json; do
            if [ -f ".lf_migration_source_parity/$f" ]; then
              cp ".lf_migration_source_parity/$f" "/tmp/m1a6-parity/$f"
            fi
          done
          git fetch origin lf/test-m1a6-migration-parity-20261001
          git switch -C lf/test-m1a6-migration-parity-20261001 origin/lf/test-m1a6-migration-parity-20261001
          mkdir -p sandbox_runs/m1a6_parity_probe
          cp -f /tmp/m1a6-parity/* sandbox_runs/m1a6_parity_probe/ 2>/dev/null || true
          printf '%s\n' '${{ steps.parity.outcome }}' > sandbox_runs/m1a6_parity_probe/step-outcome.txt
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sandbox_runs/m1a6_parity_probe
          if ! git diff --cached --quiet; then
            git commit -m 'test: persist M1.A6 parity diagnostic [skip ci]'
            git push origin HEAD:lf/test-m1a6-migration-parity-20261001
          fi

      - name: Fail job when canonical parity failed
        if: steps.parity.outcome == 'failure'
        shell: bash
        run: exit 1
