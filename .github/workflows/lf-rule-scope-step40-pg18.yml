name: LF #3779 | Rule scope Step40 isolated PG18

on:
  pull_request:
    paths:
      - "supabase/migrations/20261111170000_lf_profile_input_governance_rule_scope_loop_v1.sql"
      - "supabase/migrations/20261111123500_lf_rule_owner_bulk_atomic_governed_v1.sql"
      - "sandbox/lf_contract_gate_test/rule_scope_v1/**"
      - "sandbox/lf_contract_gate_test/rule_update_bulk_v1/test_pg17_rule_owner_bulk_atomic.py"
      - ".github/workflows/lf-rule-scope-step40-pg18.yml"

permissions:
  contents: read

jobs:
  step40-one-rule-pg18:
    name: Step40 | one rule, screen CURRENT, missing screen, PANTALLA regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Run one-rule positive, negative, PANTALLA, source, rollback probes
        run: python3 sandbox/lf_contract_gate_test/rule_scope_v1/test_pg18_step40_rule_scope.py
  existing-rule-atomic-pg18:
    name: Rule child | judge, exact scope, 578 rollback, same-RUN replay
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: "127.0.0.1"
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Run existing child writer with synthetic judged parent (not independent judge)
        run: python3 sandbox/lf_contract_gate_test/rule_update_bulk_v1/test_pg17_rule_owner_bulk_atomic.py
