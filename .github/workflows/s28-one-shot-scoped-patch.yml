name: S28 One Shot Scoped Patch

on:
  push:
    branches:
      - s28-evidence-retention-20260906
    paths:
      - .github/workflows/s28-one-shot-scoped-patch.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: s28-evidence-retention-20260906
          fetch-depth: 0

      - name: Apply scoped parser route and verify preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/lf-contract-check.yml')
          text = path.read_text(encoding='utf-8')
          old = 'python3 scripts/input_governance_migration_parity.py \\\n'
          new = 'python3 sandbox/lf_contract_gate_test/input_governance_migration_parity_compact.py \\\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'FAIL_S28_INPUT_PARITY_ROUTE_OCCURRENCES observed={count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm .github/workflows/s28-one-shot-scoped-patch.yml

          python3 -m py_compile \
            sandbox/lf_contract_gate_test/lf_migration_source_parity.py \
            sandbox/lf_contract_gate_test/input_governance_migration_parity_compact.py \
            sandbox/lf_contract_gate_test/p0_exact_head_real_source_ci_v1.py

          python3 - <<'PY'
          import importlib.util
          import subprocess
          from pathlib import Path

          validator_path = Path('scripts/lf_contract_check.py')
          spec = importlib.util.spec_from_file_location('lf_contract_check_s28_local_preflight', validator_path)
          if spec is None or spec.loader is None:
              raise SystemExit('FAIL_S28_LOCAL_PREFLIGHT_VALIDATOR_LOAD')
          validator = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(validator)

          raw = subprocess.check_output(['git','diff','--name-only','origin/main','--'], text=True)
          changed = [line.strip() for line in raw.splitlines() if line.strip()]
          print('S28 final changed paths before commit:')
          for item in changed:
              print(f'- {item}')
          governed = validator.validate_changed_files(changed)
          validator.validate_governed_receipt(changed, governed)
          validator.validate_forbidden_terms(changed)
          if 'scripts/input_governance_migration_parity.py' in changed:
              raise SystemExit('FAIL_S28_LEGACY_INPUT_PARSER_STILL_CHANGED')
          if '.github/workflows/s28-one-shot-scoped-patch.yml' in changed:
              raise SystemExit('FAIL_S28_TEMP_WORKFLOW_STILL_CHANGED')
          print('PASS_S28_LOCAL_SCOPE_PREFLIGHT')
          PY

          wf_sha="$(sha256sum .github/workflows/lf-contract-check.yml | awk '{print $1}')"
          wf_blob="$(git hash-object .github/workflows/lf-contract-check.yml)"
          echo "S28_WORKFLOW_SHA256=$wf_sha"
          echo "S28_WORKFLOW_GIT_BLOB=$wf_blob"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/lf-contract-check.yml .github/workflows/s28-one-shot-scoped-patch.yml
          if git diff --cached --quiet; then
            echo 'FAIL_S28_ONE_SHOT_NO_STAGED_CHANGE'
            exit 1
          fi
          git commit -m "fix(s28): route compact input parity through allowed sandbox [wf-sha256=${wf_sha} wf-blob=${wf_blob}]"
          git push origin HEAD:s28-evidence-retention-20260906
