name: S26 Canonical Profile Gate One Shot V2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/s26-canonical-profile-gate-preflight.yml"

permissions:
  contents: read

jobs:
  canonical-live-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install canonical runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r services/profile_runtime_api/requirements-dev.in

      - name: Enforce S26 zero-download guard
        env:
          LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
        run: python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_model_download_guard.py --repo-root .

      - name: Revalidate fresh v2 gate offline before inference
        env:
          LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
        run: python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_canonical_profile_gate.py --offline-preflight

      - name: Execute one-shot canonical S26 v2 gate
        env:
          LF_REPOSITORY_VISIBILITY: public
          LF_RUNNER_LABEL: ubuntu-latest
          LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_CANARY_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
        run: python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_canonical_profile_gate.py --result-dir "$RUNNER_TEMP/s26-canonical-profile-gate-v2"

      - name: Upload durable canonical v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s26-canonical-profile-gate-v2-${{ github.run_id }}
          path: ${{ runner.temp }}/s26-canonical-profile-gate-v2
          if-no-files-found: error
          retention-days: 30
