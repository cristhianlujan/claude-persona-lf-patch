name: S26 Nemotron Reasoning Effort Diagnostic One Shot

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/s26-canonical-profile-gate-preflight.yml"

permissions:
  contents: read

jobs:
  nemotron-reasoning-effort-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce S26 zero-download guard
        env:
          LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
        run: python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_model_download_guard.py --repo-root .

      - name: Validate reasoning diagnostic harness offline
        run: python3 -m py_compile sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_nemotron_reasoning_effort_diagnostic.py

      - name: Execute two-call Nemotron reasoning-effort diagnostic
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_CANARY_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
        run: python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_nemotron_reasoning_effort_diagnostic.py --result-path "$RUNNER_TEMP/s26-nemotron-reasoning-effort-diagnostic/result.json"

      - name: Upload sanitized diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s26-nemotron-reasoning-effort-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/s26-nemotron-reasoning-effort-diagnostic
          if-no-files-found: error
          retention-days: 30
