name: S26 Canonical Profile Gate Preflight

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/s26-canonical-profile-gate-preflight.yml"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/cloudflare_workers_ai_profile_runtime.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_canonical_profile_gate.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_canonical_profile_gate_plan_v1.json"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_runtime_route_v1.json"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_ui_architect_semantic_obligation_manifest_v1.json"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/github_actions_semantic_judge.py"
      - "adapters/lf_shell_profile_adapter/runtime/runtime_capsule.yaml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install canonical runtime test dependencies
        run: python -m pip install --disable-pip-version-check -r services/profile_runtime_api/requirements-dev.in

      - name: Enforce S26 zero-download guard
        env:
          LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
        run: python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_model_download_guard.py --repo-root .

      - name: Validate canonical manifest receipt parity path offline
        env:
          LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
        run: python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_canonical_profile_gate.py --offline-preflight
