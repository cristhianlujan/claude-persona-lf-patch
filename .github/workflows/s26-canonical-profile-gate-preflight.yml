name: S26 Llama4 Scout Judge Calibration One Shot

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/s26-canonical-profile-gate-preflight.yml"

permissions:
  contents: read

jobs:
  llama4-scout-judge-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce S26 zero-download guard
        env:
          LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
        run: python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_model_download_guard.py --repo-root .

      - name: Validate reusable challenger harness offline
        run: |
          python3 -m py_compile sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_judge_challenger_calibration.py
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_judge_challenger_calibration.py --help >/dev/null

      - name: Execute frozen six-case Llama4 Scout calibration
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_CANARY_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
        run: |
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_judge_challenger_calibration.py \
            --model '@cf/meta/llama-4-scout-17b-16e-instruct' \
            --protocol OPENAI_CHAT_COMPLETIONS \
            --result-path "$RUNNER_TEMP/s26-llama4-scout-judge-calibration/result.json"

      - name: Upload challenger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s26-llama4-scout-judge-calibration-${{ github.run_id }}
          path: ${{ runner.temp }}/s26-llama4-scout-judge-calibration
          if-no-files-found: error
          retention-days: 30
