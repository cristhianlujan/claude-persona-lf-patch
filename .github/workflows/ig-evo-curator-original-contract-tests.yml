name: IG EVO Curator Original Report Contract Tests

on:
  pull_request:
    paths:
      - 'supabase/migrations/20261107203000_lf_ig_original_producer_reports_transport_v1.sql'
      - 'docs/input-governance/IG_EVO_ORIGINAL_PRODUCER_REPORT_TRANSPORT_V1.md'
      - 'sandbox/lf_contract_gate_test/engineering_checkpoints/ig_evo/test_original_producer_reports_once_transport_v1.py'
      - '.github/workflows/ig-evo-curator-original-contract-tests.yml'

permissions:
  contents: read

jobs:
  curator-original-contract:
    name: curator-original-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run original Curator/R1-R6/G1 contract regressions
        run: |
          python3 -m unittest discover \
            -s sandbox/lf_contract_gate_test/engineering_checkpoints/ig_evo \
            -p 'test_original_producer_reports_once_transport_v1.py' -v
      - name: Report test scope
        if: always()
        run: |
          {
            echo "### IG EVO Curator contract-only CI"
            echo "Runs structural and source-contract tests against candidate files."
            echo "This is NOT a Supabase SQL execution, performance test,"
            echo "validator semantic judgement, or Profile E2E receipt."
          } >> "$GITHUB_STEP_SUMMARY"
