name: input-governance-rec001-runtime

on:
  push:
    branches:
      - "lf/input-gov-rec001-runtime-*"

permissions:
  contents: read

jobs:
  invoke-rec001:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Invoke governed Input Governance runtime for REC_001
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          project = os.environ["SUPABASE_PROJECT_ID"]
          access_token = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          if not access_token:
              raise SystemExit("FAIL_SUPABASE_ACCESS_TOKEN_MISSING")

          keys_req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project}/api-keys?reveal=true",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
                  "User-Agent": "lf-input-governance-rec001-runtime",
              },
          )
          try:
              with urllib.request.urlopen(keys_req, timeout=30) as response:
                  keys = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"FAIL_SUPABASE_API_KEY_READBACK:{type(exc).__name__}") from exc

          records = keys if isinstance(keys, list) else keys.get("keys", []) if isinstance(keys, dict) else []
          candidates = []
          metadata = []
          for idx, item in enumerate(records):
              if not isinstance(item, dict):
                  continue
              value = item.get("api_key") or item.get("key") or item.get("value")
              name = str(item.get("name", ""))
              key_type = str(item.get("type", ""))
              metadata.append({"index": idx, "name": name, "type": key_type, "has_value": bool(value)})
              if isinstance(value, str) and value:
                  candidates.append((idx, name, key_type, value))

          print("AVAILABLE_KEY_METADATA=" + json.dumps(metadata, sort_keys=True))
          if not candidates:
              raise SystemExit("FAIL_NO_PROJECT_API_KEY_CANDIDATES")

          body = json.dumps({"pantalla_id": 58, "consumer": "STORY_CREATOR"}).encode("utf-8")
          attempts = []
          success_payload = None
          success_meta = None
          for idx, name, key_type, candidate in candidates:
              req = urllib.request.Request(
                  f"https://{project}.supabase.co/functions/v1/input-governance-agent-v1",
                  data=body,
                  method="POST",
                  headers={
                      "Authorization": "Bearer " + candidate,
                      "Content-Type": "application/json",
                      "User-Agent": "lf-input-governance-rec001-runtime",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as response:
                      raw = response.read().decode("utf-8")
                      status = response.status
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode("utf-8", errors="replace")
                  status = exc.code
              try:
                  payload = json.loads(raw) if raw else None
              except Exception:
                  payload = {"non_json_response": True}
              safe_error = payload.get("error") if isinstance(payload, dict) else None
              attempts.append({"index": idx, "name": name, "type": key_type, "status": status, "error": safe_error})
              if 200 <= status < 300:
                  success_payload = payload
                  success_meta = {"index": idx, "name": name, "type": key_type, "status": status}
                  break

          print("KEY_ATTEMPTS=" + json.dumps(attempts, sort_keys=True))
          if success_payload is None:
              raise SystemExit("FAIL_NO_PROJECT_API_KEY_ACCEPTED_BY_RUNTIME")
          print("ACCEPTED_KEY_METADATA=" + json.dumps(success_meta, sort_keys=True))
          print("EDGE_RESPONSE=" + json.dumps(success_payload, sort_keys=True))
          PY
