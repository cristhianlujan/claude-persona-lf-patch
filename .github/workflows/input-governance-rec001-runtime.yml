name: input-governance-rec001-runtime

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoke-rec001:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Invoke governed Validator runtime for REC_001 run 205
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          project = os.environ["SUPABASE_PROJECT_ID"]
          access_token = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          if not access_token:
              raise SystemExit("FAIL_SUPABASE_ACCESS_TOKEN_MISSING")

          keys_req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project}/api-keys?reveal=true",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
                  "User-Agent": "lf-input-governance-rec001-validator",
              },
          )
          with urllib.request.urlopen(keys_req, timeout=30) as response:
              keys = json.loads(response.read().decode("utf-8"))

          records = keys if isinstance(keys, list) else keys.get("keys", []) if isinstance(keys, dict) else []
          secret_key = None
          safe_meta = []
          for idx, item in enumerate(records):
              if not isinstance(item, dict):
                  continue
              key_type = str(item.get("type", ""))
              name = str(item.get("name", ""))
              value = item.get("api_key") or item.get("key") or item.get("value")
              safe_meta.append({"index": idx, "name": name, "type": key_type, "has_value": bool(value)})
              if key_type == "secret" and isinstance(value, str) and value:
                  secret_key = value
          print("AVAILABLE_KEY_METADATA=" + json.dumps(safe_meta, sort_keys=True))
          if not secret_key:
              raise SystemExit("FAIL_SECRET_KEY_NOT_RESOLVED")

          body = json.dumps({"run_id": 205}).encode("utf-8")
          req = urllib.request.Request(
              f"https://{project}.supabase.co/functions/v1/input-governance-validator-v1",
              data=body,
              method="POST",
              headers={
                  "Authorization": "Bearer " + secret_key,
                  "Content-Type": "application/json",
                  "User-Agent": "lf-input-governance-rec001-validator",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  raw = response.read().decode("utf-8")
                  status = response.status
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              status = exc.code

          try:
              payload = json.loads(raw) if raw else None
          except Exception:
              payload = {"non_json_response": True, "status": status}
          print("VALIDATOR_HTTP_STATUS=" + str(status))
          print("VALIDATOR_RESPONSE=" + json.dumps(payload, sort_keys=True))
          if status < 200 or status >= 300:
              raise SystemExit("FAIL_VALIDATOR_RUNTIME")
          PY
