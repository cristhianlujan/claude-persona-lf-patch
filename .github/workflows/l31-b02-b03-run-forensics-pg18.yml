name: L31 B02 B03 exact RUN snapshot recon PG18
on:
  push:
    branches: [lf/issue-3779-lote31-b02-b03-readonly-pg18-evidence-v1]
    paths:
      - audits/rule-quality-lote31/01_b02_r01_live_cohorte_jsonb.json
      - audits/rule-quality-lote31/03_b03_run_effects_live.json
      - audits/rule-quality-lote31/06_b02_canonical_live_jsonb_text.json
      - audits/rule-quality-lote31/07_b03_canonical_live_jsonb_text.json
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_l31_b02_b03_snapshot.py
      - .github/workflows/l31-b02-b03-run-forensics-pg18.yml
permissions:
  contents: read
concurrency:
  group: l31-b02-b03-pg18-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pg18-copy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      pg18:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PostgreSQL 18 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -X -A -t -v ON_ERROR_STOP=1 -d postgres -c "SHOW server_version;"
      - name: Reproduce B02 G01 and B03 G02 from live snapshots, negative tests only in disposable PG18
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_l31_b02_b03_snapshot.py | tee "$RUNNER_TEMP/l31.log"
          python3 - <<'PY'
          import json
          path="audits/rule-quality-lote31/05_pg18_result_runtime.json"
          x=json.load(open(path))
          assert x["b02"]["status"]=="NO_GO_UNVERIFIED"
          assert x["b03"]["status"]=="NO_GO_UNVERIFIED"
          assert x["b02"]["frozen_n"]==234 and x["b03"]["readback_n"]==234
          assert x["supabase_dml_ddl"]==x["run_mutations"]==0
          assert x["pg18_disposable_db_dropped"]
          assert len(x["blockers_closed"])==0
          assert all(t["status"]=="PASS" for t in x["tests"])
          print("L31_CI_ASSERT_PASS",x["test_total"])
          PY
      - name: Capture RAW run evidence and SHA256
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l31"
          cp "$RUNNER_TEMP/l31.log" "$RUNNER_TEMP/l31/" 2>/dev/null || true
          cp audits/rule-quality-lote31/05_pg18_result_runtime.json "$RUNNER_TEMP/l31/" 2>/dev/null || true
          sha256sum audits/rule-quality-lote31/06_b02_canonical_live_jsonb_text.json audits/rule-quality-lote31/07_b03_canonical_live_jsonb_text.json sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_l31_b02_b03_snapshot.py > "$RUNNER_TEMP/l31/source_sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l31-b02-b03-pg18-raw-run
          path: ${{ runner.temp }}/l31/
          retention-days: 30
          if-no-files-found: warn
