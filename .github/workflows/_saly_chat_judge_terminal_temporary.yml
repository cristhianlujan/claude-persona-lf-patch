name: SALY Chat Judge Terminal TEMPORARY PG17
on:
  push:
    branches:
      - saly/creative-chat-judge-terminal-v1-20261122
jobs:
  pg17:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: saly_queue_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: saly_queue_test
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Test judge manifests and exactly scoped real SQL state transitions
        run: bash sandbox/creative_factory/reconciliation_v02/test_pg17.sh
