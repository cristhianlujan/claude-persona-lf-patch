name: Profile GPT Native Capture Regression
on:
  pull_request:
    paths:
      - 'skills/profile_creator/evals/gpt_native_in_chat_capture_v1.py'
      - 'skills/profile_creator/evals/test_gpt_native_in_chat_capture_v1.py'
      - '.github/workflows/profile-gpt-native-capture-regression.yml'
      - 'skills/profile_creator/validators/run_bound_profile_output_validator_v1.py'
      - 'skills/profile_creator/evals/test_pe10_c6_canonical_output_binding_v1.py'
      - 'skills/profile_creator/evals/test_profile_output_shape_preflight_v1.py'
      - 'profiles/systemic_root_cause_repair_lf/schemas/output.schema.json'
      - 'profiles/systemic_root_cause_repair_lf/validators/runtime_validate.py'
      - 'profiles/systemic_root_cause_repair_lf/contracts/runtime_binding.json'
  workflow_dispatch:
jobs:
  capture-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test exact source with positive and negative controls
        run: python skills/profile_creator/evals/test_gpt_native_in_chat_capture_v1.py
  profile-output-binding:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install canonical JSON Schema validator
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Check source-bound canonical validator and legacy runner regressions
        run: |
          python skills/profile_creator/evals/test_profile_output_shape_preflight_v1.py
          python skills/profile_creator/evals/test_pe10_c6_canonical_output_binding_v1.py
