name: INV 5.1 File History Evidence

on:
  push:
    branches:
      - lf/inv-5-1-file-history-20261001
    paths:
      - ".github/workflows/inv-5-1-file-history-evidence.yml"
      - "sandbox/lf_contract_gate_test/transversal_assets/global_technical_inventory/inv_5_1/compute_repo_file_history_v1.py"
      - "sandbox/lf_contract_gate_test/transversal_assets/global_technical_inventory/inv_5_1/repo_inventory_paths_v1.json"

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch with full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute exact per-file history
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/transversal_assets/global_technical_inventory/inv_5_1/compute_repo_file_history_v1.py \
            --input sandbox/lf_contract_gate_test/transversal_assets/global_technical_inventory/inv_5_1/repo_inventory_paths_v1.json \
            --evidence sandbox/lf_contract_gate_test/transversal_assets/global_technical_inventory/inv_5_1/file_history_evidence_v1.json \
            --sql sandbox/lf_contract_gate_test/transversal_assets/global_technical_inventory/inv_5_1/apply_file_history_v1.sql

      - name: Commit generated evidence only
        run: |
          set -euo pipefail
          git config user.name "lf-inv-5-1-bot"
          git config user.email "lf-inv-5-1-bot@users.noreply.github.com"
          git add \
            sandbox/lf_contract_gate_test/transversal_assets/global_technical_inventory/inv_5_1/file_history_evidence_v1.json \
            sandbox/lf_contract_gate_test/transversal_assets/global_technical_inventory/inv_5_1/apply_file_history_v1.sql
          git diff --cached --quiet && { echo "FAIL_NO_GENERATED_EVIDENCE"; exit 1; }
          git commit -m "evidence(inventory): generate INV-5.1 file history"
          git push origin HEAD:lf/inv-5-1-file-history-20261001
