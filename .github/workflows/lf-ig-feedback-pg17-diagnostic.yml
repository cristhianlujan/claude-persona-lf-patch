name: LF IG Feedback — isolated PostgreSQL 17 diagnostic

# BRANCH-ONLY diagnostic, never a second pull_request/PASE entrypoint.
# No Supabase credentials, no deploy, no production network access.
on:
  push:
    branches:
      - dev/ig-n4-tremed-cascade-governed-20261028
    paths:
      - .github/workflows/lf-ig-feedback-pg17-diagnostic.yml
      - sandbox/lf_contract_gate_test/input_governance/ig_feedback_*.sql
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      pg17:
        image: postgres:17.6
        env:
          POSTGRES_USER: ig_test
          POSTGRES_PASSWORD: local_only_not_a_secret
          POSTGRES_DB: ig_test
        options: >-
          --health-cmd "pg_isready -U ig_test -d ig_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout current test branch (read only)
        uses: actions/checkout@v4

      - name: Assert isolated PostgreSQL version and credentials
        env:
          PG_SERVICE: ${{ job.services.pg17.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_SERVICE" psql -U ig_test -d ig_test -v ON_ERROR_STOP=1 -Atc "SELECT current_setting('server_version_num')" | grep -E '^1700[0-9]{2}$'
          test -z "${SUPABASE_DB_URL:-}" || { echo "FAIL_UNEXPECTED_PRODUCTION_DB_ENV"; exit 1; }

      - name: Load synthetic schema and exact live function preimages
        env:
          PG_SERVICE: ${{ job.services.pg17.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PG_SERVICE" psql -U ig_test -d ig_test -v ON_ERROR_STOP=1 < sandbox/lf_contract_gate_test/input_governance/ig_feedback_pg17_synthetic_preimage_fixture.sql

      - name: Compile and run Native output bridge candidate with rollback
        env:
          PG_SERVICE: ${{ job.services.pg17.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PG_SERVICE" psql -U ig_test -d ig_test -v ON_ERROR_STOP=1 < sandbox/lf_contract_gate_test/input_governance/ig_feedback_native_bridge_emission_candidate_20261029.sql
          docker exec "$PG_SERVICE" psql -U ig_test -d ig_test -v ON_ERROR_STOP=1 -Atc "SELECT md5(pg_get_functiondef('public.lf_profile_native_bridge_record_output_v1(text,jsonb,jsonb,text,text,text)'::regprocedure))" | grep -Fx 'e16131b4a542c71867e59730ca14b253'

      - name: Compile and run sidecar binding, 11 negative tests, rollback
        env:
          PG_SERVICE: ${{ job.services.pg17.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PG_SERVICE" psql -U ig_test -d ig_test -v ON_ERROR_STOP=1 < sandbox/lf_contract_gate_test/input_governance/ig_feedback_cross_profile_report_output_candidate_20261029.sql
          docker exec "$PG_SERVICE" psql -U ig_test -d ig_test -v ON_ERROR_STOP=1 -Atc "SELECT md5(pg_get_functiondef('public.lf_profile_execution_trust_validation_v2(text,text,jsonb)'::regprocedure)) || ':' || md5(pg_get_functiondef('public.lf_profile_result_router_return_prepare_v1(text)'::regprocedure))" | grep -Fx 'c71964f030d7c2f9bf90101f541a6e6b:8bf503bf17f038a18124783c038d9793'
          if docker exec "$PG_SERVICE" psql -U ig_test -d ig_test -v ON_ERROR_STOP=1 -Atc "SELECT to_regprocedure('private.lf_profile_ig_feedback_validate_v1(text,text,jsonb)')" | grep -q 'lf_profile_ig_feedback_validate_v1'; then
            echo "FAIL_ROLLBACK_RESIDUE_PRIVATE_HELPER"; exit 1
          fi
          echo "PASS_PG17_ISOLATED_COMPILE_POSTCHECK_ROLLBACK_NO_LIVE_DB"
