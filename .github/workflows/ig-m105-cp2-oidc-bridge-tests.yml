name: IG M10.5 CP2 OIDC Edge Bridge Tests
on:
  pull_request:
    paths:
      - "supabase/functions/lf-profiles-governance-caller-v1/**"
      - "supabase/functions/input-governance-agent-v1/index.ts"
      - "supabase/functions/input-governance-curator-v1/index.ts"
      - "supabase/functions/input-governance-validator-v1/index.ts"
      - "sandbox/lf_contract_gate_test/input_governance/test_ig_context_pack_ticket_source_parity_v1.py"
      - ".github/workflows/lf-input-governance-recurate.yml"
      - ".github/workflows/lf-input-governance-recurate-dispatch.yml"
      - ".github/workflows/ig-m105-cp2-oidc-bridge-tests.yml"
permissions:
  contents: read
jobs:
  cp2-oidc-positive-and-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check exact OIDC caller and isolated Edge bridge types
        run: |
          deno check supabase/functions/lf-profiles-governance-caller-v1/caller.ts
          deno check supabase/functions/lf-profiles-governance-caller-v1/cp2_edge_bridge_test.ts
      - name: Verify exact OIDC identity negatives and CP2 Edge bridge positive/negative behavior
        run: |
          deno test --filter '^CP2:' supabase/functions/lf-profiles-governance-caller-v1/caller_test.ts
          deno test supabase/functions/lf-profiles-governance-caller-v1/cp2_edge_bridge_test.ts
      - name: Verify IG profile-ticket handoff and fail-closed negative cases
        run: |
          deno test --filter 'profile runtime ticket|legacy OIDC CONTEXT_PACK' supabase/functions/lf-profiles-governance-caller-v1/caller_test.ts
          python3 sandbox/lf_contract_gate_test/input_governance/test_ig_context_pack_ticket_source_parity_v1.py
