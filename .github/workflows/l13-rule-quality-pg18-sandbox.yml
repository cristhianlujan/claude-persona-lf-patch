name: L13 isolated rule quality PostgreSQL 18 sandbox

on:
  push:
    branches:
      - lf/issue-3779-lote13-family-lifecycle-v1
    paths:
      - sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/**
      - .github/workflows/l13-rule-quality-pg18-sandbox.yml

permissions:
  contents: read

concurrency:
  group: l13-isolated-pg18-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandbox-postgres18:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      pg18:
        image: postgres:18
        env:
          POSTGRES_DB: rule_quality_sbx
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sandbox_test_only
        options: >-
          --health-cmd "pg_isready -U postgres -d rule_quality_sbx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout candidate branch only (read-only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PostgreSQL 18 clean instance and reproducible tests
        shell: bash
        run: |
          set -euo pipefail
          CID='${{ job.services.pg18.id }}'
          BASE='sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1'
          docker exec "$CID" psql -U postgres -d rule_quality_sbx -X -At -c 'SHOW server_version;' | tee "$RUNNER_TEMP/pg18_version.txt"
          sha256sum "$BASE"/01_schema.sql "$BASE"/02_seed_synthetic.sql "$BASE"/03_test_cases.sql | tee "$RUNNER_TEMP/pg18_source_sha256.txt"
          for sql in 01_schema.sql 02_seed_synthetic.sql 03_test_cases.sql 04_birth_expiry_tests.sql; do
            printf '\n### Executing %s\n' "$sql" | tee -a "$RUNNER_TEMP/pg18_full.log"
            docker exec -i "$CID" psql -v ON_ERROR_STOP=1 -X -U postgres -d rule_quality_sbx < "$BASE/$sql" | tee -a "$RUNNER_TEMP/pg18_full.log"
          done
          docker exec "$CID" psql -X -U postgres -d rule_quality_sbx -At -c \
            "SELECT jsonb_build_object('status',CASE WHEN count(*)=28 AND bool_and(status='PASS') THEN 'SANDBOX_TESTS_OK' ELSE 'SANDBOX_TESTS_INCOMPLETE' END,'test_count',count(*),'cases',jsonb_agg(jsonb_build_object('id',test_id,'status',status,'expected',expected,'observed',observed) ORDER BY test_id))::text FROM rule_quality_l13.sandbox_test_results" \
            | tee "$RUNNER_TEMP/pg18_result.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["status"]=="SANDBOX_TESTS_OK" and d["test_count"]==28; print("CHECKED: 28/28 sandbox tests")' "$RUNNER_TEMP/pg18_result.json"
      - name: Retain real logs and test rows (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l13-postgres18-sandbox-evidence
          path: |
            ${{ runner.temp }}/pg18_version.txt
            ${{ runner.temp }}/pg18_source_sha256.txt
            ${{ runner.temp }}/pg18_full.log
            ${{ runner.temp }}/pg18_result.json
          if-no-files-found: warn
          retention-days: 14
