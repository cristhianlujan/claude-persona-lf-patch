name: Story Creator SC-M2.5 Structural Validator

on:
  pull_request:
    paths:
      - 'sandbox/lf_contract_gate_test/story_creator_implementation_package/**'
      - '.github/workflows/story-creator-sc-m2-5-structural-validator.yml'

permissions:
  contents: read

jobs:
  structural-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared structural dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Parse schema
        run: python -m json.tool sandbox/lf_contract_gate_test/story_creator_implementation_package/story_implementation_package_v1.schema.json >/dev/null
      - name: Positive and negative structural self-test
        run: python sandbox/lf_contract_gate_test/story_creator_implementation_package/validate_story_implementation_package_v1.py --self-test
