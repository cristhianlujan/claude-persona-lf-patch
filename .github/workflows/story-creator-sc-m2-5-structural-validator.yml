name: Story Creator Implementation Package Validators

on:
  workflow_dispatch:
  push:
    branches:
      - 'lf/story-creator-*'
    paths:
      - 'sandbox/lf_contract_gate_test/story_creator_implementation_package/**'
      - '.github/workflows/story-creator-sc-m2-5-structural-validator.yml'

permissions:
  contents: read

jobs:
  implementation-package-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared structural dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0
      - name: Parse contracts and fixtures
        run: |
          python -m json.tool sandbox/lf_contract_gate_test/story_creator_implementation_package/story_implementation_package_v1.schema.json >/dev/null
          python -m json.tool sandbox/lf_contract_gate_test/story_creator_implementation_package/fixtures/onb_004_authority_snapshot_20261002.json >/dev/null
          python -m json.tool sandbox/lf_contract_gate_test/story_creator_implementation_package/fixtures/onb_004_adversarial_cases_v1.json >/dev/null
          python -m json.tool sandbox/lf_contract_gate_test/story_creator_implementation_package/fixtures/transversal_capability_inventory_20261002.json >/dev/null
          python -m json.tool sandbox/lf_contract_gate_test/story_creator_implementation_package/programming_utility_judge_contract_v1.json >/dev/null
          python -m json.tool sandbox/lf_contract_gate_test/story_creator_implementation_package/fixtures/onb_004_implementation_package_v1_1.json >/dev/null
      - name: SC-M2.5 structural regression
        run: python sandbox/lf_contract_gate_test/story_creator_implementation_package/validate_story_implementation_package_v1.py --self-test
      - name: SC-M3.1 anti-invention and no-duplicate regression
        run: python sandbox/lf_contract_gate_test/story_creator_implementation_package/validate_story_implementation_package_v1.py --anti-invention-self-test
      - name: SC-M3.2 ONB_004 adversarial fixture suite
        run: python sandbox/lf_contract_gate_test/story_creator_implementation_package/test_onb_004_adversarial_suite_v1.py
      - name: SC-M3.3 no parallel transversal capability regression
        run: python sandbox/lf_contract_gate_test/story_creator_implementation_package/test_no_parallel_transversal_capability_v1.py
      - name: SC-M3.4 independent programming utility judge contract
        run: python sandbox/lf_contract_gate_test/story_creator_implementation_package/test_programming_utility_judge_contract_v1.py
      - name: SC-M3.5 context budget GOLD and overload probes
        run: python sandbox/lf_contract_gate_test/story_creator_implementation_package/test_context_budget_gate_v1.py
      - name: SC-M4.1 compiled ONB_004 package readback
        run: python sandbox/lf_contract_gate_test/story_creator_implementation_package/test_onb_004_compiled_package_v1.py
