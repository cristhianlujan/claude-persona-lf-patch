name: PE10 Planner to Dispatcher Regression

on:
  pull_request:
    paths:
      - 'skills/profile_creator/validators/plan_profile_evolution.py'
      - 'skills/profile_creator/validators/execute_profile_evolution_v02.py'
      - 'skills/profile_creator/validators/profile_evolution_trusted_readback_v1.py'
      - 'skills/profile_creator/evals/test_pe10_planner_dispatch_qualified_readback_v1.py'
      - 'skills/profile_creator/evals/test_execute_profile_evolution_v02.py'
      - '.github/workflows/pe10-planner-dispatch-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  planner-dispatch-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify planner/readback/dispatcher contract with positives and negatives
        run: |
          python3 -m unittest -v \
            skills.profile_creator.evals.test_pe10_planner_dispatch_qualified_readback_v1 \
            skills.profile_creator.evals.test_execute_profile_evolution_v02 \
            skills.profile_creator.evals.test_profile_evolution_trusted_readback_v1
