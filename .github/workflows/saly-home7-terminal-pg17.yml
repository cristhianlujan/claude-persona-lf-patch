name: SALY Home 7 Terminal PG17
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261123230000_lf_saly_creative_chat_terminal_home7_item10_v1.sql'
      - 'sandbox/creative_factory/order7_terminal_20261123/**'
      - '.github/workflows/saly-home7-terminal-pg17.yml'
  workflow_dispatch:
jobs:
  pg17:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_chat_terminal7_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_chat_terminal7_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: saly_chat_terminal7_test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-17
      - name: Positive and negative SQL tests
        run: bash sandbox/creative_factory/order7_terminal_20261123/test_pg17.sh
