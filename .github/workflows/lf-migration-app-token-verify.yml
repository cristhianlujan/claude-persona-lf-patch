name: LF Migration App Token Verify

on:
  push:
    branches:
      - verify/lf-migration-train-app-token-20261005

permissions:
  contents: read

jobs:
  verify-app-token:
    name: verify-app-token
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtain lf-migration-train App token with required permissions
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.LF_MIGRATION_TRAIN_APP_ID }}
          private-key: ${{ secrets.LF_MIGRATION_TRAIN_APP_PRIVATE_KEY }}
          owner: cristhianlujan
          repositories: claude-persona-lf-patch
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: read
          permission-checks: read

      - name: Report non-secret verification metadata
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "APP_TOKEN_OK"
          printf '%s\n' "app_slug=$APP_SLUG"
          printf '%s\n' "installation_id=$INSTALLATION_ID"
          printf '%s\n' "permissions=contents:write,pull_requests:write,issues:write,actions:read,checks:read"
