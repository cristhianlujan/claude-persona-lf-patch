name: Platform Adopt R02-D W0 Historical Matrix

on:
  push:
    branches:
      - lf/platform-adopt-langgraph-spike-001

jobs:
  r02d-w0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime and LangGraph
        run: |
          python -m pip install --upgrade pip
          pip install langgraph==1.2.11
      - name: Execute R02-D W0 historical direct-vs-functional parity matrix
        run: |
          python sandbox/lf_contract_gate_test/platform_adopt/langgraph_spike_001/run_r02d_w0_historical_matrix.py
