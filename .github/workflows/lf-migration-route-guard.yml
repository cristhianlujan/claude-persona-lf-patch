name: LF Migration Route Guard

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  classify-migration-route:
    name: lf-migration-route-classifier
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish PASS only for PRs without migration changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename')"
          if printf '%s\n' "$files" | grep -q '^supabase/migrations/'; then
            echo "MIGRATION_ROUTE_REQUIRES_TRAIN head=$HEAD_SHA"
            exit 0
          fi
          gh api --method POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state=success -f context='lf-migration-route-guard' \
            -f description='No migration paths modified' >/dev/null
          echo "MIGRATION_ROUTE_NO_MIGRATIONS_PASS head=$HEAD_SHA"
