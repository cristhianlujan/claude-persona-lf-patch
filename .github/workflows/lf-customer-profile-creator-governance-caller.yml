name: LF Customer Profile Creator Governance Caller

on:
  push:
    branches: [lf/profiles/profile-creator-customer-caller-20260902]
    paths: [.github/workflows/lf-customer-profile-creator-governance-caller.yml]
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options: [source_canary_only]

permissions:
  contents: read
  id-token: write

jobs:
  customer-profile-creator-governed-caller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exclusive source boundary
        run: python3 sandbox/lf_contract_gate_test/profile_creator_customer_caller_source_test.py
      - name: Reject non-OIDC caller
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error -o negative.json -w '%{http_code}' \
            -H 'Authorization: Bearer not-a-github-oidc-token' -H 'Content-Type: application/json' \
            -d '{"action":"profile_creator_init_v1","caller_request_id":"negative","target_code":"PERFIL-CUSTOMER-FINANCIAL-UX-DECISIONING","profile_slug":"customer_financial_ux_decisioning"}' \
            'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profile-creator-governance-caller-v1')
          cat negative.json; test "$code" = "401" || test "$code" = "404"
      - name: Obtain exact GitHub OIDC identity
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[CONTINUE_CUSTOMER_FINANCIAL_UX_CORE_7_6]')
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('lf-profile-creator-governance-caller-v1');
            core.setSecret(token); core.setOutput('token', token);
      - name: Confirm source-only authority boundary
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'source_canary_only'
        run: |
          echo 'SOURCE_CANARY_ONLY=true'
          echo 'NON_CANARY_PROFILE_CREATION_EXECUTED=false'
          echo 'RUNTIME_DEPLOYMENT_EXECUTED=false'
          echo 'PRODUCTION_AUTHORIZED=false'
      - name: Continue canonical Customer Financial UX gates
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[CONTINUE_CUSTOMER_FINANCIAL_UX_CORE_7_6]')
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          execution='EXEC-CREACION-PERFIL-LF-OIDC-5f133751-fd18-4176-af31-936d4324d338'
          endpoint='https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profile-creator-governance-caller-v1'
          token=os.environ['OIDC_TOKEN']
          generic=["generic_payload_rejected","pass_condition_met","required_evidence_keys_present","step_contract_present"]
          def base(**extra):
              p={"step_result":"STEP_CLEAN_PASS","blocking_codes":[],"assertions_checked":generic,"hard_fails_checked":[],"blocking_findings":[],"return_to_worker_reasons":[]}; p.update(extra); return p
          steps=[
            ("creator_asset","supabase://public/v_lf_fuente_operativa/ACT-0045/2026-09-02T23:34Z",base(act0045_checked={"codigo_activo":"ACT-0045","nombre_canonico":"SKILL_CREADORA_PERFILES_Y_CARDS_LF_v0.1_CANDIDATO","estado_documental":"APROBADO","estado_operativo":"APROBADO","nivel_control":"PRODUCCION_CONTROLADA","runtime_estado":"APROBADO_PRODUCCION_CONTROLADA_READ_ONLY","impacto_automatico":"BLOQUEADO","version":"v0.1"})),
            ("repo_matrix_read","supabase://public/v_lf_artifact_destination_registry/DEST_CREACION_PERFIL_LF_PROFILE_PACK_DEFAULT",base(matriz_repos_lf_yaml_read={"source":"public.v_lf_artifact_destination_registry","destination_code":"DEST_CREACION_PERFIL_LF_PROFILE_PACK_DEFAULT","artifact_type":"PROFILE_PACK","repo":"cristhianlujan/claude-persona-lf-patch","branch":"main","base_folder":"profiles","package_mode":"MULTI_FILE_PACK","template_code":"TPL_PROFILE_PACK_STANDARD_DEFAULT","status":"ACTIVE"})),
            ("contract_read","github://cristhianlujan/claude-persona-lf-patch/gobernanza/procedimientos/creacion_perfil_lf_steps_core.yaml@d77cc8ce53fab3dd1a5c5a19650740a217b5db93",base(contrato_perfil_lf_yaml_read={"path":"gobernanza/procedimientos/creacion_perfil_lf_steps_core.yaml","blob_sha":"d77cc8ce53fab3dd1a5c5a19650740a217b5db93","version":"v0.3","operation":"CREACION_PERFIL_LF","status":"CANDIDATO_READ_ONLY","source_model":"GIT_FIRST_YAML"})),
            ("repo_inventory_full","github://cristhianlujan/claude-persona-lf-patch/profiles/customer_financial_ux_decisioning@3f5d3eeea979c16a4bf1841e22cd5d7cc25a6277",base(repo_inventory_operational_report={"repo":"cristhianlujan/claude-persona-lf-patch","candidate_head":"3f5d3eeea979c16a4bf1841e22cd5d7cc25a6277","package_root":"profiles/customer_financial_ux_decisioning","observed_entries":["README.md","SKILL.md","contracts/","evals/","examples/","handoffs/","judges/","manifest.json","schemas/"],"skill_blob_sha":"d9ac5789d24585a3be5c106dbb33f7424bde119a","manifest_blob_sha":"3ad0ec97da4bfe1b222243494ca6f0e902abb47f"})),
            ("destination_validate","supabase://public/v_lf_artifact_destination_registry/DEST_CREACION_PERFIL_LF_PROFILE_PACK_DEFAULT",{"repo":"cristhianlujan/claude-persona-lf-patch","branch":"main","base_folder":"profiles","package_root":"profiles/customer_financial_ux_decisioning","artifact_type":"PERFIL","destination_source":"public.v_lf_artifact_destination_registry:DEST_CREACION_PERFIL_LF_PROFILE_PACK_DEFAULT","step_result":"STEP_CLEAN_PASS","blocking_codes":[],"assertions_checked":[],"hard_fails_checked":[],"blocking_findings":[],"return_to_worker_reasons":[]})
          ]
          for step_id,ref,payload in steps:
              body=json.dumps({"action":"profile_creator_record_step_v1","execution_id":execution,"step_id":step_id,"evidence_ref":ref,"evidence_payload":payload})
              r=subprocess.run(['curl','--silent','--show-error','-w','\n%{http_code}','-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','-d',body,endpoint],capture_output=True,text=True,check=True)
              text,code=r.stdout.rsplit('\n',1); print(step_id,text); d=json.loads(text)
              nested=((d.get('result') or {}).get('result') or {})
              if code!='200' or d.get('outcome')!='STEP_RECORDED' or nested.get('status')!='STEP_CLEAN_PASS': sys.exit(f'FAILED_{step_id}:{code}:{text}')
              print(f'GOVERNED_STEP_{step_id}=RECORDED')
          PY
          echo 'RUNTIME_DEPLOYMENT_EXECUTED=false'
          echo 'PRODUCTION_AUTHORIZED=false'

# Exact Customer allowlist retained by caller source:
# PERFIL-CUSTOMER-FINANCIAL-UX-DECISIONING
# PERFIL-CUSTOMER-TRUST-CLARITY-VULNERABILITY
# PERFIL-CUSTOMER-PAYMENTS-RECOVERY
# PERFIL-CUSTOMER-IDENTITY-CONSENT-PRIVACY
# profile_creator_record_step_v1 delegates only to run-creacion-perfil-lf in the caller implementation.
