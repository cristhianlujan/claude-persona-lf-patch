name: LF Customer Profile Creator Governance Caller

on:
  push:
    branches:
      - lf/profiles/profile-creator-customer-caller-20260902
    paths:
      - ".github/workflows/lf-customer-profile-creator-governance-caller.yml"
      - "supabase/functions/lf-profile-creator-governance-caller-v1/**"
      - "sandbox/lf_contract_gate_test/profile_creator_customer_caller_source_test.py"
  workflow_dispatch:
    inputs:
      action:
        description: "Governed Profile Creator action"
        required: true
        type: choice
        options:
          - source_canary_only
          - initialize_customer_profile
      target_code:
        description: "Exact allowlisted Customer profile code"
        required: false
        type: choice
        options:
          - PERFIL-CUSTOMER-FINANCIAL-UX-DECISIONING
          - PERFIL-CUSTOMER-TRUST-CLARITY-VULNERABILITY
          - PERFIL-CUSTOMER-PAYMENTS-RECOVERY
          - PERFIL-CUSTOMER-IDENTITY-CONSENT-PRIVACY

permissions:
  contents: read
  id-token: write

jobs:
  customer-profile-creator-governed-caller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exclusive source boundary
        run: python3 sandbox/lf_contract_gate_test/profile_creator_customer_caller_source_test.py
      - name: Reject non-OIDC caller
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error -o negative.json -w '%{http_code}' \
            -H 'Authorization: Bearer not-a-github-oidc-token' \
            -H 'Content-Type: application/json' \
            -d '{"action":"profile_creator_init_v1","caller_request_id":"negative","target_code":"PERFIL-CUSTOMER-FINANCIAL-UX-DECISIONING","profile_slug":"customer_financial_ux_decisioning"}' \
            'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profile-creator-governance-caller-v1')
          cat negative.json
          test "$code" = "401" || test "$code" = "404"
      - name: Obtain exact GitHub OIDC identity
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/lf/profiles/profile-creator-customer-caller-20260902' && (contains(github.event.head_commit.message, '[INIT_CUSTOMER_FINANCIAL_UX]') || contains(github.event.head_commit.message, '[CONTINUE_CUSTOMER_FINANCIAL_UX_ROUTER]') || contains(github.event.head_commit.message, '[CONTINUE_CUSTOMER_FINANCIAL_UX_CORE_2_7]')))
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('lf-profile-creator-governance-caller-v1');
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Confirm source-only authority boundary
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'source_canary_only'
        run: |
          echo 'SOURCE_CANARY_ONLY=true'
          echo 'NON_CANARY_PROFILE_CREATION_EXECUTED=false'
          echo 'RUNTIME_DEPLOYMENT_EXECUTED=false'
          echo 'PRODUCTION_AUTHORIZED=false'
      - name: Initialize allowlisted Customer profile through governed caller
        if: (github.event_name == 'workflow_dispatch' && inputs.action == 'initialize_customer_profile') || (github.event_name == 'push' && github.ref == 'refs/heads/lf/profiles/profile-creator-customer-caller-20260902' && contains(github.event.head_commit.message, '[INIT_CUSTOMER_FINANCIAL_UX]'))
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          INPUT_TARGET_CODE: ${{ inputs.target_code }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then TARGET_CODE=PERFIL-CUSTOMER-FINANCIAL-UX-DECISIONING; else TARGET_CODE="$INPUT_TARGET_CODE"; fi
          case "$TARGET_CODE" in
            PERFIL-CUSTOMER-FINANCIAL-UX-DECISIONING) PROFILE_SLUG=customer_financial_ux_decisioning ;;
            PERFIL-CUSTOMER-TRUST-CLARITY-VULNERABILITY) PROFILE_SLUG=customer_trust_clarity_vulnerability ;;
            PERFIL-CUSTOMER-PAYMENTS-RECOVERY) PROFILE_SLUG=customer_payments_recovery ;;
            PERFIL-CUSTOMER-IDENTITY-CONSENT-PRIVACY) PROFILE_SLUG=customer_identity_consent_privacy ;;
            *) echo 'CUSTOMER_PROFILE_TARGET_NOT_ALLOWED'; exit 1 ;;
          esac
          CALLER_REQUEST_ID=$(python3 - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          code=$(curl --silent --show-error -o governed-init.json -w '%{http_code}' \
            -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"action\":\"profile_creator_init_v1\",\"caller_request_id\":\"$CALLER_REQUEST_ID\",\"target_code\":\"$TARGET_CODE\",\"profile_slug\":\"$PROFILE_SLUG\"}" \
            'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profile-creator-governance-caller-v1')
          cat governed-init.json
          test "$code" = "201"
          python3 - <<'PY'
          import json
          data=json.load(open('governed-init.json'))
          assert data.get('outcome') == 'INITIALIZED', data
          result=data.get('result') or {}
          assert result.get('outcome') == 'INITIALIZED', data
          execution=(result.get('execution') or {})
          assert execution.get('operation_code') == 'CREACION_PERFIL_LF', data
          assert execution.get('status') == 'IN_PROGRESS', data
          print('GOVERNED_CUSTOMER_PROFILE_INITIALIZATION=RECORDED')
          PY
      - name: Record canonical router step for Customer Financial UX
        if: github.event_name == 'push' && github.ref == 'refs/heads/lf/profiles/profile-creator-customer-caller-20260902' && contains(github.event.head_commit.message, '[CONTINUE_CUSTOMER_FINANCIAL_UX_ROUTER]')
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          cat > step.json <<'JSON'
          {"action":"profile_creator_record_step_v1","execution_id":"EXEC-CREACION-PERFIL-LF-OIDC-5f133751-fd18-4176-af31-936d4324d338","step_id":"router","evidence_ref":"supabase://public/lf_router_resolve_v1/CREACION_PERFIL_LF/2026-09-02T23:27Z","evidence_payload":{"router_read":true,"router":"ACT-0001","source":"SUPABASE","status":"READY_TO_EXECUTE","operation_code":"CREACION_PERFIL_LF","action_code":"PROFILE_CREATE","asset_type":"PERFIL","step_count":40,"operation_status":"PRODUCCION_CONTROLADA_READ_ONLY","required_policy_count":1,"resolved_policy_count":1,"step_result":"STEP_CLEAN_PASS","blocking_codes":[],"assertions_checked":["generic_payload_rejected","pass_condition_met","required_evidence_keys_present","step_contract_present"],"hard_fails_checked":[],"blocking_findings":[],"return_to_worker_reasons":[]}}
          JSON
          code=$(curl --silent --show-error -o step-result.json -w '%{http_code}' -H "Authorization: Bearer $OIDC_TOKEN" -H 'Content-Type: application/json' --data-binary @step.json 'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profile-creator-governance-caller-v1')
          cat step-result.json; test "$code" = "200"
          python3 - <<'PY'
          import json
          d=json.load(open('step-result.json')); assert d['outcome']=='STEP_RECORDED'; assert d['result']['result']['status']=='STEP_CLEAN_PASS'; print('GOVERNED_ROUTER_STEP=RECORDED')
          PY
      - name: Record canonical core steps 2 through 7 for Customer Financial UX
        if: github.event_name == 'push' && github.ref == 'refs/heads/lf/profiles/profile-creator-customer-caller-20260902' && contains(github.event.head_commit.message, '[CONTINUE_CUSTOMER_FINANCIAL_UX_CORE_2_7]')
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          execution='EXEC-CREACION-PERFIL-LF-OIDC-5f133751-fd18-4176-af31-936d4324d338'
          generic=["generic_payload_rejected","pass_condition_met","required_evidence_keys_present","step_contract_present"]
          base={"step_result":"STEP_CLEAN_PASS","blocking_codes":[],"assertions_checked":generic,"hard_fails_checked":[],"blocking_findings":[],"return_to_worker_reasons":[]}
          steps=[]
          p=dict(base); p["source_read"]={"ACT-0001":{"estado_operativo":"ACTIVO","nivel_control":"RECTOR","runtime_estado":"RUNTIME_OPERATIVO","impacto_automatico":"BLOQUEADO","version":"v0.3"},"ACT-0045":{"estado_operativo":"APROBADO","nivel_control":"PRODUCCION_CONTROLADA","runtime_estado":"APROBADO_PRODUCCION_CONTROLADA_READ_ONLY","impacto_automatico":"BLOQUEADO","version":"v0.1"}}; steps.append(("operational_source","supabase://public/v_lf_fuente_operativa/ACT-0001+ACT-0045/2026-09-02T23:34Z",p))
          p=dict(base); p["matriz_repos_lf_yaml_read"]={"source":"public.v_lf_artifact_destination_registry","destination_code":"DEST_CREACION_PERFIL_LF_PROFILE_PACK_DEFAULT","artifact_type":"PROFILE_PACK","repo":"cristhianlujan/claude-persona-lf-patch","branch":"main","base_folder":"profiles","package_mode":"MULTI_FILE_PACK","template_code":"TPL_PROFILE_PACK_STANDARD_DEFAULT","status":"ACTIVE"}; steps.append(("repo_matrix_read","supabase://public/v_lf_artifact_destination_registry/DEST_CREACION_PERFIL_LF_PROFILE_PACK_DEFAULT",p))
          p=dict(base); p["contrato_perfil_lf_yaml_read"]={"path":"gobernanza/procedimientos/creacion_perfil_lf_steps_core.yaml","blob_sha":"d77cc8ce53fab3dd1a5c5a19650740a217b5db93","version":"v0.3","operation":"CREACION_PERFIL_LF","status":"CANDIDATO_READ_ONLY","source_model":"GIT_FIRST_YAML"}; steps.append(("contract_read","github://cristhianlujan/claude-persona-lf-patch/gobernanza/procedimientos/creacion_perfil_lf_steps_core.yaml@d77cc8ce53fab3dd1a5c5a19650740a217b5db93",p))
          p=dict(base); p["repo_inventory_operational_report"]={"repo":"cristhianlujan/claude-persona-lf-patch","candidate_head":"3f5d3eeea979c16a4bf1841e22cd5d7cc25a6277","package_root":"profiles/customer_financial_ux_decisioning","observed_entries":["README.md","SKILL.md","contracts/","evals/","examples/","handoffs/","judges/","manifest.json","schemas/"],"skill_blob_sha":"d9ac5789d24585a3be5c106dbb33f742bde119a","manifest_blob_sha":"3ad0ec97da4bfe1b222243494ca6f0e902abb47f"}; steps.append(("repo_inventory_full","github://cristhianlujan/claude-persona-lf-patch/profiles/customer_financial_ux_decisioning@3f5d3eeea979c16a4bf1841e22cd5d7cc25a6277",p))
          p={"repo":"cristhianlujan/claude-persona-lf-patch","branch":"main","base_folder":"profiles","package_root":"profiles/customer_financial_ux_decisioning","artifact_type":"PERFIL","destination_source":"public.v_lf_artifact_destination_registry:DEST_CREACION_PERFIL_LF_PROFILE_PACK_DEFAULT","step_result":"STEP_CLEAN_PASS","blocking_codes":[],"assertions_checked":[],"hard_fails_checked":[],"blocking_findings":[],"return_to_worker_reasons":[]}; steps.append(("destination_validate","supabase://public/v_lf_artifact_destination_registry/DEST_CREACION_PERFIL_LF_PROFILE_PACK_DEFAULT",p))
          p=dict(base); p["act0045_checked"]={"codigo_activo":"ACT-0045","nombre_canonico":"SKILL_CREADORA_PERFILES_Y_CARDS_LF_v0.1_CANDIDATO","estado_documental":"APROBADO","estado_operativo":"APROBADO","nivel_control":"PRODUCCION_CONTROLADA","runtime_estado":"APROBADO_PRODUCCION_CONTROLADA_READ_ONLY","impacto_automatico":"BLOQUEADO","version":"v0.1"}; steps.append(("creator_asset","supabase://public/v_lf_fuente_operativa/ACT-0045/2026-09-02T23:34Z",p))
          with open('batch.json','w') as f: json.dump(steps,f)
          PY
          python3 - <<'PY'
          import json, os, subprocess, sys
          token=os.environ['OIDC_TOKEN']; endpoint='https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profile-creator-governance-caller-v1'; execution='EXEC-CREACION-PERFIL-LF-OIDC-5f133751-fd18-4176-af31-936d4324d338'
          for step_id,evidence_ref,payload in json.load(open('batch.json')):
              body=json.dumps({"action":"profile_creator_record_step_v1","execution_id":execution,"step_id":step_id,"evidence_ref":evidence_ref,"evidence_payload":payload})
              r=subprocess.run(['curl','--silent','--show-error','-w','\n%{http_code}','-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','-d',body,endpoint],capture_output=True,text=True,check=True)
              text,code=r.stdout.rsplit('\n',1); print(step_id,text); data=json.loads(text)
              if code!='200' or data.get('outcome')!='STEP_RECORDED' or ((data.get('result') or {}).get('result') or {}).get('status')!='STEP_CLEAN_PASS': sys.exit(f'FAILED_{step_id}:{code}:{text}')
              print(f'GOVERNED_STEP_{step_id}=RECORDED')
          PY
          echo 'RUNTIME_DEPLOYMENT_EXECUTED=false'
          echo 'PRODUCTION_AUTHORIZED=false'
