name: LF Customer Profile Creator Governance Caller

on:
  push:
    branches: [lf/profiles/profile-creator-customer-caller-20260902]
    paths: [.github/workflows/lf-customer-profile-creator-governance-caller.yml]
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options: [source_canary_only]

permissions:
  contents: read
  id-token: write

jobs:
  customer-profile-creator-governed-caller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify exclusive source boundary
        run: python3 sandbox/lf_contract_gate_test/profile_creator_customer_caller_source_test.py
      - name: Reject non-OIDC caller
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error -o negative.json -w '%{http_code}' -H 'Authorization: Bearer not-a-github-oidc-token' -H 'Content-Type: application/json' -d '{"action":"profile_creator_init_v1","caller_request_id":"negative","target_code":"PERFIL-CUSTOMER-FINANCIAL-UX-DECISIONING","profile_slug":"customer_financial_ux_decisioning"}' 'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profile-creator-governance-caller-v1')
          cat negative.json; test "$code" = "401" || test "$code" = "404"
      - name: Obtain exact GitHub OIDC identity
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[CONTINUE_CUSTOMER_FINANCIAL_UX_31_38]')
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('lf-profile-creator-governance-caller-v1');
            core.setSecret(token); core.setOutput('token', token);
      - name: Confirm source-only authority boundary
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'source_canary_only'
        run: |
          echo 'SOURCE_CANARY_ONLY=true'
          echo 'NON_CANARY_PROFILE_CREATION_EXECUTED=false'
          echo 'RUNTIME_DEPLOYMENT_EXECUTED=false'
          echo 'PRODUCTION_AUTHORIZED=false'
      - name: Continue canonical Customer Financial UX depth gates
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[CONTINUE_CUSTOMER_FINANCIAL_UX_31_38]')
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          execution='EXEC-CREACION-PERFIL-LF-OIDC-5f133751-fd18-4176-af31-936d4324d338'; endpoint='https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profile-creator-governance-caller-v1'; token=os.environ['OIDC_TOKEN']
          generic=["generic_payload_rejected","pass_condition_met","required_evidence_keys_present","step_contract_present"]
          def base(**extra):
              p={"step_result":"STEP_CLEAN_PASS","blocking_codes":[],"assertions_checked":generic,"hard_fails_checked":[],"blocking_findings":[],"return_to_worker_reasons":[]}; p.update(extra); return p
          candidate='3f5d3eeea979c16a4bf1841e22cd5d7cc25a6277'
          steps=[
            ('step_depth_validation','github+supabase://customer-financial-ux/depth/steps',base(step_has_depth_evidence_payload={"validated_steps":["intake","duplicate_check","classification","generic_vs_specific","research_pack","research_to_rules_matrix","decision_matrix","canonical_design","operational_evidence_pack_check"],"evidence_sources":["SKILL.md","contracts/main_contract.md","manifest.json","live operation contracts/judges"],"candidate_head":candidate,"behavioral_claim":"NOT_MADE"})),
            ('pack_internal_depth_validation','github://customer-financial-ux/pack-depth@'+candidate,base(pack_items_have_depth_matrix={"SKILL.md":{"depth":"workflow+invariants+failure+boundaries"},"contracts/main_contract.md":{"depth":"input+evidence+output+failure+authority"},"schemas/output.schema.json":{"depth":"closed modes+conditional requirements+evidence map"},"judges/mini_judge.md":{"depth":"schema+grounding+comparability+autonomy+boundary"},"judges/score_rubric.md":{"depth":"5 criteria+thresholds+hard blocks"},"evals/eval_matrix.json":{"depth":"10 positive/negative/adversarial/equivalence/handoff cases"},"examples":{"depth":"good and deliberately invalid financial claim example"},"handoff":{"depth":"Quality Pack route present"}})),
            ('examples_depth_validation','github://customer-financial-ux/examples@'+candidate,base(examples_are_robust_and_testable={"good_example":{"blob":"11e5720a14182eb23848391b8850eb0717eb327c","authority_refs_present":True,"comparable_basis_present":True,"guardrail_present":True},"bad_example":{"blob":"f05fa1095a600337f71ee4aebb1854c272536859","unsupported_discount":"50%","invented_debt_closure":True,"invented_credit_improvement":True,"authority_refs_empty":True},"expected_negative_routes":["BLOCK_UNSUPPORTED_FINANCIAL_CLAIM","RETURN_OR_BLOCK_INCOMPARABLE_BASIS","BLOCK_OR_RETURN_PRESSURE_LANGUAGE"]})),
            ('evals_depth_validation','github://customer-financial-ux/evals/eval_matrix.json@59e7f3e5d2d1a952191881f436d7e2c39b1d4e0c',base(evals_are_executable_with_expected_result={"schema_version":"PROFILE_EVAL_MATRIX_V2_EXECUTABLE","case_count":10,"families":["positive","negative","adversarial","equivalence","handoff"],"each_case_has_expected_status":True,"each_case_has_assertions":True,"behavioral_execution_status":"NOT_EXECUTED","deterministic_pack_validation":{"run_id":33668349402,"conclusion":"success"}})),
            ('judge_depth_validation','github://customer-financial-ux/judges@'+candidate,base(judges_have_fail_if_thresholds_and_overrides={"mini_judge_blob":"bc9c39b25e59b338ef17dd592ce02586862fa08f","rubric_blob":"1637dee15aec2f68dd4df4751ea12e78a416fa64","verdicts":["PASS","NEEDS_REPAIR","BLOCK"],"semantic_pass_threshold":">=22/25, no criterion below 4, validator PASS, zero blocking safety defects","hard_fail_examples":["invented savings/eligibility/debt closure/payment/legal effect","dropped material term","false comparability","coercion","fabricated evidence","missing authority","lossy handoff"]})),
            ('schema_depth_validation','github://customer-financial-ux/schemas/output.schema.json@e2c283e3c7559ba050a150aca604ef7b2b75714c',base(schemas_require_non_generic_evidence={"additionalProperties":False,"required_root":["output_type","status","evidence_map","self_verdict"],"closed_output_types":["CUSTOMER_FINANCIAL_DECISION_SPEC","MISSING_MATERIAL_FINANCIAL_INPUT","BLOCKED_UNSUPPORTED_FINANCIAL_CLAIM"],"evidence_map_min_items":1,"evidence_item_requires":["source_ref","supports"],"decision_option_requires":["option_id","terms","customer_consequence","timing","monetary_basis","key_tradeoff","authority_refs"],"conditional_requirements_present":True})),
            ('output_modes_validation','github://customer-financial-ux/SKILL.md@d9ac5789d24585a3be5c106dbb33f7424bde119a',base(closed_output_modes_and_templates_present={"modes":["CUSTOMER_FINANCIAL_DECISION_SPEC","MISSING_MATERIAL_FINANCIAL_INPUT","BLOCKED_UNSUPPORTED_FINANCIAL_CLAIM"],"status_enum":["READY_FOR_REVIEW","NEEDS_INPUT","BLOCKED","NEEDS_REPAIR"],"schema_enforces_modes":True,"normal_spec_required_fields":["decision_id","decision_question","comparison_basis","options","must_understand","uncertainties","claim_guardrails","handoff_to_next"]})),
            ('blocking_overrides_validation','github://customer-financial-ux/contracts+judges@'+candidate,base(blocking_overrides_prevent_weak_depth_close={"blocks":["unsupported strengthened financial claim","missing material financial truth","invented savings/closure/credit effect","incomparable options presented equivalent","pressure/coercion","fabricated evidence","cross-domain authority","runtime/production authorization"],"repairable_only":"structural defects not requiring new authority","deterministic_pass_not_semantic_pass":True,"behavioral_proof_status":"NOT_EXECUTED"}))
          ]
          for step_id,ref,payload in steps:
              body=json.dumps({"action":"profile_creator_record_step_v1","execution_id":execution,"step_id":step_id,"evidence_ref":ref,"evidence_payload":payload})
              r=subprocess.run(['curl','--silent','--show-error','-w','\n%{http_code}','-H',f'Authorization: Bearer {token}','-H','Content-Type: application/json','-d',body,endpoint],capture_output=True,text=True,check=True)
              text,code=r.stdout.rsplit('\n',1); print(step_id,text); d=json.loads(text); nested=((d.get('result') or {}).get('result') or {})
              if code!='200' or d.get('outcome')!='STEP_RECORDED' or nested.get('status')!='STEP_CLEAN_PASS': sys.exit(f'FAILED_{step_id}:{code}:{text}')
              print(f'GOVERNED_STEP_{step_id}=RECORDED')
          PY
          echo 'BEHAVIORAL_PASS_CLAIMED=false'
          echo 'LATENCY_PASS_CLAIMED=false'
          echo 'PRODUCTION_AUTHORIZED=false'

# Exact Customer allowlist retained by caller source:
# PERFIL-CUSTOMER-FINANCIAL-UX-DECISIONING
# PERFIL-CUSTOMER-TRUST-CLARITY-VULNERABILITY
# PERFIL-CUSTOMER-PAYMENTS-RECOVERY
# PERFIL-CUSTOMER-IDENTITY-CONSENT-PRIVACY
# profile_creator_record_step_v1 delegates only to run-creacion-perfil-lf in the caller implementation.
