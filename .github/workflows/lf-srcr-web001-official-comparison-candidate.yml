name: LF SRCR WEB001 Trusted Comparison Read-Only
on:
  push:
    branches: [lf/handoff-srcr-catalog-cascade-20261029]
    paths:
      - "profiles/systemic_root_cause_repair_lf/**"
      - "supabase/migrations/20261030211000_lf_srcr_n1_n2_existing_execution_ledger_gate_v1.sql"
      - ".github/workflows/lf-srcr-web001-official-comparison-candidate.yml"
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned trusted proof dependency
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Exact tree comparison using main-owned evaluator, no new judge
        env:
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin "$HEAD_SHA"
          base_sha="$(git rev-parse refs/remotes/origin/main)"
          mkdir -p "$RUNNER_TEMP/base" "$RUNNER_TEMP/candidate"
          git archive "$base_sha" profiles/systemic_root_cause_repair_lf | tar -x -C "$RUNNER_TEMP/base"
          git archive "$HEAD_SHA" profiles/systemic_root_cause_repair_lf | tar -x -C "$RUNNER_TEMP/candidate"
          set +e
          python skills/profile_creator/validators/compare_s26_profile_evolution_v1.py \
            systemic_root_cause_repair_lf "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/base/profiles/systemic_root_cause_repair_lf" \
            "$RUNNER_TEMP/candidate/profiles/systemic_root_cause_repair_lf" \
            > "$RUNNER_TEMP/srcr-evolution-proof.json"
          rc=$?
          set -e
          cat "$RUNNER_TEMP/srcr-evolution-proof.json"
          if [ "$rc" -ne 0 ]; then
            echo "SRCR_WEB001_OFFICIAL_COMPARISON_NOT_DEMONSTRATED" >&2
            exit 1
          fi
          echo "SRCR_WEB001_OFFICIAL_COMPARISON_PASS"
