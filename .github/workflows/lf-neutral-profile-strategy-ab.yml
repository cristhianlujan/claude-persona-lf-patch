name: LF Neutral Profile Strategy AB

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

jobs:
  neutral-profile-strategy-ab:
    if: >-
      github.event.issue.number == 244 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/lf-ab-neutral-run'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build pinned llama.cpp once
        env:
          LLAMA_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          git checkout --detach "$LLAMA_COMMIT"
          test "$(git rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build build --config Release -j 4 --target llama-cli
          test -x build/bin/llama-cli

      - name: Download and verify pinned model once
        env:
          MODEL_COMMIT: 5037fcf163dd95d1e41d1974465f0898ed108ca2
          MODEL_SHA256: d02fe9b69ad8cadbbd228e387667af66612c44bed29ffc8eb1e7caf9ac486c12
          MMPROJ_SHA256: 980c9b2f78c04e6cff93d277ada09e768394f112d75db3b4e9dea8a69f9fb904
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lf-model"
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/${MODEL_COMMIT}/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf?download=true" \
            -o "$RUNNER_TEMP/lf-model/model.gguf"
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/${MODEL_COMMIT}/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf?download=true" \
            -o "$RUNNER_TEMP/lf-model/mmproj.gguf"
          echo "${MODEL_SHA256}  $RUNNER_TEMP/lf-model/model.gguf" | sha256sum -c -
          echo "${MMPROJ_SHA256}  $RUNNER_TEMP/lf-model/mmproj.gguf" | sha256sum -c -

      - name: Run neutral live A/B benchmark
        env:
          LF_REPOSITORY_VISIBILITY: public
          LF_RUNNER_LABEL: ubuntu-latest
          LF_LLAMA_SOURCE_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
          LF_LLAMA_CLI_PATH: ${{ runner.temp }}/llama.cpp/build/bin/llama-cli
          LF_MODEL_PATH: ${{ runner.temp }}/lf-model/model.gguf
          LF_MMPROJ_PATH: ${{ runner.temp }}/lf-model/mmproj.gguf
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_neutral_strategy_ab_live.py
