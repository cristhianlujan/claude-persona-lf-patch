name: LF Pilot SRCR G10 G11 Exact Head Probe

on:
  pull_request:
    paths:
      - '.github/workflows/lf-pilot-srcr-g11-exact-head-probe.yml'

permissions:
  contents: read

jobs:
  deterministic-g10-g11:
    name: Execute G10 + G11 exact-head deterministic regressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact rebased G11 candidate head
        uses: actions/checkout@v4
        with:
          ref: 6a77fd560b5216f9eb6a60106a554fe43d92e830
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify exact G11 over new G10
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6a77fd560b5216f9eb6a60106a554fe43d92e830"
          test "$(git rev-parse HEAD^)" = "01796b4dc0e8a28b179ec81503e93afe15408e49"
          echo "G10_EXACT_HEAD=$(git rev-parse HEAD^)"
          echo "G11_EXACT_HEAD=$(git rev-parse HEAD)"

      - name: Execute G10 deterministic regression
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/s30_pilot_srcr_g10/test_g10_retry_attempt_policy_candidate.py

      - name: Execute G11 deterministic acceptance regression
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/s30_pilot_srcr_g11/test_g11_failure_injection_247_acceptance_candidate.py
