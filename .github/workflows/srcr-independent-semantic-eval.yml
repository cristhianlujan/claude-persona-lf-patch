name: SRCR Independent Semantic Eval
on:
  push:
    branches:
      - eval/srcr-independent-semantic-20260920
permissions:
  contents: read
jobs:
  cloudflare-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe zero-cost Workers AI models
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CF_ACCOUNT_ID" && test -n "$CF_TOKEN"
          python3 - <<'PY'
          import json, os, urllib.request, sys
          account=os.environ['CF_ACCOUNT_ID']; token=os.environ['CF_TOKEN']
          headers={'Authorization':f'Bearer {token}','Content-Type':'application/json'}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  return json.loads(r.read().decode())
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/ai'
          data=get(base+'/models/search?per_page=100')
          print('MODELS_SEARCH_SUCCESS',data.get('success'))
          rows=data.get('result') or []
          names=[]
          for row in rows:
              name=row.get('name') or row.get('id')
              if name:
                  names.append(name)
                  print('MODEL',name,'props=',json.dumps(row.get('properties') or {},sort_keys=True)[:800])
          preferred=['@cf/openai/gpt-oss-120b','@cf/qwen/qwen3-30b-a3b-fp8','@cf/meta/llama-3.3-70b-instruct-fp8-fast','@cf/meta/llama-3.1-8b-instruct-fast','@cf/meta/llama-3.1-8b-instruct']
          candidates=preferred + [x for x in names if x not in preferred]
          def run(model):
              url=base+'/run/'+model
              payload=json.dumps({'messages':[{'role':'user','content':'Reply exactly with JSON: {"probe":"PASS"}'}],'max_tokens':32,'temperature':0}).encode()
              req=urllib.request.Request(url,data=payload,headers=headers,method='POST')
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.loads(r.read().decode())
          last=None
          for model in candidates[:20]:
              try:
                  res=run(model)
                  if res.get('success'):
                      print('SELECTED_MODEL',model)
                      print('PROBE_RESPONSE',json.dumps(res.get('result'),sort_keys=True)[:1500])
                      sys.exit(0)
              except Exception as exc:
                  last=str(exc)
                  print('PROBE_FAIL',model,type(exc).__name__,str(exc)[:300])
          raise SystemExit('NO_WORKERS_AI_MODEL_AVAILABLE:'+str(last))
          PY
