name: SRCR Independent Semantic Eval
on:
  push:
    branches:
      - eval/srcr-independent-semantic-20260920
permissions:
  contents: read
jobs:
  independent-semantic-judge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run independent semantic judge
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib,json,os,urllib.request,re,pathlib
          enc=''
          packet=json.loads(zlib.decompress(base64.b64decode(enc)))
          model='@cf/zai-org/glm-4.7-flash'
          prompt=(
            'You are the canonical INDEPENDENT Semantic Judge B for the supplied LF profile execution. '
            'You are not the producer. Use ONLY the supplied packet and current-source facts. '
            'Independently inspect the ENTIRE exact_candidate before reconciling producer declarations. '
            'Apply every rule in judge_instructions exactly. Do not accept handoff_ready, selected_alternative, implementation_delta, or research claims as evidence by themselves. '
            'Return ONLY one JSON object with exactly the required semantic-judge fields. '
            'candidate_sha256 MUST be '+packet['candidate_sha256']+' and scope_packet_sha256 MUST be '+packet['scope_packet_sha256']+'. '
            'For requirement_reconciliation, account for every ID in authorized_requirements, constraints, and forbidden_changes. '
            'For each observed change include change_id, action_class, target, candidate_paths, statement, materiality, evidence_refs. '
            'For every observed change include exactly one change_declaration_reconciliation and one scope_conformance_reconciliation row. '
            'All seven invariants must be present. If a material issue exists, do not PASS.\n\nPACKET:\n'+json.dumps(packet,ensure_ascii=False,separators=(',',':'))
          )
          body={'messages':[{'role':'system','content':'Return strict JSON only. No markdown fences, no prose outside JSON.'},{'role':'user','content':prompt}],'temperature':0,'max_tokens':7000,'response_format':{'type':'json_object'}}
          url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/ai/run/{model}"
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=300) as resp:
            envelope=json.loads(resp.read().decode())
          if not envelope.get('success'):
            raise SystemExit('CF_FAIL:'+json.dumps(envelope)[:2000])
          result=envelope.get('result') or {}
          content=None
          if isinstance(result,dict):
            choices=result.get('choices')
            if isinstance(choices,list) and choices:
              msg=choices[0].get('message') or {}
              content=msg.get('content')
            if content is None:
              content=result.get('response')
          if not isinstance(content,str) or not content.strip():
            raise SystemExit('MODEL_EMPTY_CONTENT:'+json.dumps(result)[:3000])
          s=content.strip()
          if s.startswith('```'):
            s=re.sub(r'^```(?:json)?\s*','',s)
            s=re.sub(r'\s*```$','',s)
          try:
            obj=json.loads(s)
          except Exception:
            a=s.find('{'); b=s.rfind('}')
            if a<0 or b<=a: raise
            obj=json.loads(s[a:b+1])
          pathlib.Path('/tmp/semantic_result.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          raw_b64=base64.b64encode(json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).decode()
          print('MODEL_ID='+model)
          print('JUDGE_RESULT_B64='+raw_b64)
          PY
      - name: Validate semantic judge result
        run: |
          python3 profiles/systemic_root_cause_repair_lf/validators/validate_semantic_judge_result.py /tmp/semantic_result.json
