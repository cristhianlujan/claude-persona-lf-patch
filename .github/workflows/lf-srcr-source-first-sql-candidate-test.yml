name: LF SRCR Source First SQL Candidate Test
on:
  push:
    branches: [lf/handoff-srcr-catalog-cascade-20261029]
    paths:
      - "docs/profile_updater/handoffs/SRCR_N1N2_SOURCE_FIRST_LEDGER_ATTEST_CANDIDATE_20261030.sql"
      - "docs/profile_updater/handoffs/test_srcr_n1n2_source_first_ledger_20261030.sql"
      - "docs/profile_updater/handoffs/test_srcr_n1n2_recorder_wiring_20261030.sql"
      - "supabase/migrations/20261030211000_lf_srcr_n1_n2_existing_execution_ledger_gate_v1.sql"
      - ".github/workflows/lf-srcr-source-first-sql-candidate-test.yml"
permissions:
  contents: read
jobs:
  verify-source-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: srcr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d srcr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute exact source SQL and negative cases on temporary PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source=Path("supabase/migrations/20261030211000_lf_srcr_n1_n2_existing_execution_ledger_gate_v1.sql").read_text()
          key="create or replace function public.lf_record_profile_execution_step_v1("
          stop="CREATE OR REPLACE FUNCTION public.lf_profile_execution_trust_validation_v2"
          assert source.count(key)==1 and source.count(stop)==1
          a=source.index(key);b=source.index(stop,a)
          assert b>a and 1500 < b-a < 6000
          target=Path("docs/profile_updater/handoffs/SRCR_N1N2_RECORDER_EXTRACTED_TEST_ONLY.sql")
          target.write_text(source[a:b],encoding="utf-8")
          print("RECORDER_EXACT_MIGRATION_SOURCE_EXTRACTED")
          PY
          psql -h 127.0.0.1 -U postgres -d srcr_test -v ON_ERROR_STOP=1 \
            -f docs/profile_updater/handoffs/test_srcr_n1n2_source_first_ledger_20261030.sql
          psql -h 127.0.0.1 -U postgres -d srcr_test -v ON_ERROR_STOP=1 \
            -f docs/profile_updater/handoffs/test_srcr_n1n2_recorder_wiring_20261030.sql
