name: Frontend Profile Contract Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'profiles/frontend_prototype_architect_lf/**'
      - '.github/workflows/frontend-profile-contract-check.yml'
  push:
    branches:
      - 'lf/frontend-artifact-provenance-hardening-20260827'
    paths:
      - 'profiles/frontend_prototype_architect_lf/**'
      - '.github/workflows/frontend-profile-contract-check.yml'

permissions:
  contents: read

jobs:
  frontend-profile-contract-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.25.1

      - name: Run frontend artifact/provenance adversarials
        run: python profiles/frontend_prototype_architect_lf/evals/audit_remediation_20260827/run_adversarial_checks.py
