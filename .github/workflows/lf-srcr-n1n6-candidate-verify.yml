name: LF SRCR N1-N6 Candidate Verification
on:
  push:
    branches:
      - lf/handoff-srcr-catalog-cascade-20261029
    paths:
      - "profiles/systemic_root_cause_repair_lf/**"
      - ".github/workflows/lf-srcr-n1n6-candidate-verify.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only schema dependency
        run: python -m pip install jsonschema
      - name: Compile SRCR candidate
        run: python -m compileall -q profiles/systemic_root_cause_repair_lf
      - name: N1/N2 quality, N3/N5 source trace, N6 terminality tests
        run: |
          python profiles/systemic_root_cause_repair_lf/evals/v09_exhausted_search_cases.py
          python profiles/systemic_root_cause_repair_lf/evals/v10_n1_n2_quality_gate_cases.py
      - name: Full SRCR pack regression
        run: python profiles/systemic_root_cause_repair_lf/validators/validate_pack.py profiles/systemic_root_cause_repair_lf
