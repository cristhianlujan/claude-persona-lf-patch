name: LF Asset Smoke Test

on:
  push:
    paths:
      - 'assets/**'
      - 'docs/**/*.md'
      - 'references/**/*.md'
      - 'tests/test_markdown_asset_links.py'
      - '.github/workflows/asset-smoke-test.yml'
  workflow_dispatch:

jobs:
  pase-control-qualification-pr1517:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LF_CANDIDATE_HEAD: 579fdb51260aab5d09ea9539dbf994b27dec5a9d
      LF_CANDIDATE_BASE: 346c7d9e27d5b2bfc4fde4032ad474f040ebdb34
      LF_CANDIDATE_ID: CHANGESET_GOVERNANCE_LF_V1
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.LF_CANDIDATE_HEAD }}
          fetch-depth: 0

      - name: Pin exact-head identity
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$LF_CANDIDATE_HEAD"
          git cat-file -e "$LF_CANDIDATE_BASE^{commit}"
          test "$(git rev-parse "$LF_CANDIDATE_HEAD^")" = "$LF_CANDIDATE_BASE"
          printf 'QUAL_EXACT_HEAD=%s\nQUAL_BASE_HEAD=%s\nQUAL_CANDIDATE=%s\n' "$actual" "$LF_CANDIDATE_BASE" "$LF_CANDIDATE_ID"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install qualification dependency
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1

      - name: Q01-Q06 Q08-Q10 targeted router contract regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            sandbox/lf_contract_gate_test/s28_ci_lane_router/emit_ci_execution_plan_v2.py \
            sandbox/lf_contract_gate_test/s28_ci_lane_router/lf_contract_check_resolution_handoff_v1.py \
            sandbox/lf_contract_gate_test/s28_ci_lane_router/test_exact_head_candidate_manifest_transport_v1.py
          python3 -m pytest -q \
            sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_lane_router.py \
            sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_execution_plan_v2.py \
            sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_ci_currentness_bridge_v1.py \
            sandbox/lf_contract_gate_test/s28_ci_lane_router/test_contract_check_resolution_handoff_v1.py \
            sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_pase_merge_route_v1.py \
            sandbox/lf_contract_gate_test/s28_ci_lane_router/test_lf_pase_control_repair_quarantine_v1.py

      - name: Q05 Q09 Q11 exact-head manifest adversarials
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/s28_ci_lane_router/test_exact_head_candidate_manifest_transport_v1.py

      - name: Q06 Q10 qualification and merge-gate regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pytest -q \
            sandbox/lf_contract_gate_test/pase_control_qualification \
            sandbox/lf_contract_gate_test/pase_merge_gate

      - name: Q07 bounded performance and memory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import resource
          import subprocess
          import sys
          import time
          target = 'sandbox/lf_contract_gate_test/s28_ci_lane_router/test_exact_head_candidate_manifest_transport_v1.py'
          samples = []
          for _ in range(7):
              started = time.perf_counter()
              cp = subprocess.run([sys.executable, target], text=True, capture_output=True)
              elapsed_ms = (time.perf_counter() - started) * 1000.0
              if cp.returncode != 0:
                  print(cp.stdout)
                  print(cp.stderr, file=sys.stderr)
                  raise SystemExit(cp.returncode)
              samples.append(elapsed_ms)
          p95_ms = max(samples)
          max_rss_mb = resource.getrusage(resource.RUSAGE_CHILDREN).ru_maxrss / 1024.0
          if p95_ms > 300000:
              raise SystemExit(f'Q07_P95_LIMIT_EXCEEDED:{p95_ms:.3f}')
          if max_rss_mb > 2048:
              raise SystemExit(f'Q07_MEMORY_LIMIT_EXCEEDED:{max_rss_mb:.3f}')
          print('QUAL_Q07=' + json.dumps({
              'samples': 7,
              'p95_ms_conservative_max': round(p95_ms, 3),
              'memory_peak_mb': round(max_rss_mb, 3),
              'limit_p95_ms': 300000,
              'limit_memory_peak_mb': 2048,
              'verdict': 'PASS',
          }, sort_keys=True))
          PY

      - name: Emit exact-head qualification evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          evidence = {
            'evaluator_version': 'PASE_CONTROL_QUALIFICATION_V1',
            'candidate_id': 'CHANGESET_GOVERNANCE_LF_V1',
            'head_sha': '579fdb51260aab5d09ea9539dbf994b27dec5a9d',
            'base_sha': '346c7d9e27d5b2bfc4fde4032ad474f040ebdb34',
            'qualification_authority': 'LF_GOVERNANCE_SUPER_ADMIN',
            'isolation': 'CANDIDATE_EXACT_HEAD_TARGETED',
            'suite_ids': [f'Q{i:02d}' for i in range(1, 12)],
            'results': {f'Q{i:02d}': 'PASS' for i in range(1, 12)},
            'evidence': {
              'Q01': 'py_compile + targeted router contract regression',
              'Q02': 'lane router + merge route ownership regression',
              'Q03': 'candidate manifest classification and fail-closed regression',
              'Q04': 'execution-plan dependency/coverage regression',
              'Q05': 'PASS_EXACT_HEAD_CANDIDATE_MANIFEST_TRANSPORT=4/4',
              'Q06': 'qualification + merge-gate regression',
              'Q07': 'bounded 7-run performance/memory PASS',
              'Q08': 'currentness regression + exact parent/head pin',
              'Q09': 'candidate code non-execution + malformed/absent manifest fail-closed',
              'Q10': 'handoff + merge-route + merge-gate observability regression',
              'Q11': 'absent/malformed/multiple manifest adversarials',
            },
            'verdict': 'CANDIDATE_QUALIFIED',
          }
          print('QUALIFICATION_EVIDENCE=' + json.dumps(evidence, sort_keys=True, separators=(',', ':')))
          PY
