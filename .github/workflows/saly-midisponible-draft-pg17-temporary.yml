name: SALY Mi Disponible Refinement Draft PG17 Temporary
on:
  push:
    branches:
      - fix/saly-home-mi-disponible-refinement-request-20261123
    paths:
      - 'supabase/migrations/20261123191500_lf_saly_home_midisponible_refinement_draft_v1.sql'
      - 'sandbox/creative_factory/midisponible_refinement_v01/**'
      - '.github/workflows/saly-midisponible-draft-pg17-temporary.yml'
permissions:
  contents: read
jobs:
  pg17-refinement:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_midisponible_refinement_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_midisponible_refinement_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify isolated PG17 exact migrations and negative tests
        run: |
          docker run --rm --network host \
            -v "$PWD:/repo:ro" -w /repo \
            -e PGHOST=127.0.0.1 -e PGPORT=5432 \
            -e PGDATABASE=saly_midisponible_refinement_test \
            -e PGUSER=postgres -e PGPASSWORD=postgres \
            postgres:17 bash sandbox/creative_factory/midisponible_refinement_v01/test_pg17.sh
