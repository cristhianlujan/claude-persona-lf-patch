name: L23 Curator stage PostgreSQL 18 isolated
on:
  push:
    branches:
      - lf/issue-3779-lote23-curator-stage-v1
    paths:
      - sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/15_l23_curator_stage_pg18.sql
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote23_curator_stage.py
      - .github/workflows/l23-curator-stage-pg18.yml
permissions:
  contents: read
jobs:
  curator-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres18:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PostgreSQL client and environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version
          psql -X -At -v ON_ERROR_STOP=1 -d postgres -c "SELECT current_setting('server_version');"
      - name: Curator L23 positive and negative cases (real PG18)
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote23_curator_stage.py | tee "$RUNNER_TEMP/l23_runtime_console.log"
          python3 - <<'PY'
          import json
          p='sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/lote23_runtime.json'
          d=json.load(open(p))
          assert d['global_status']=='NO_GO_UNVERIFIED'
          assert len(d['scenarios'])==3
          assert all(s['result']=='PASS' for s in d['scenarios'])
          assert all(s['curator_status']=='REAL_EN_SANDBOX' for s in d['scenarios'])
          assert d['gate_md5_before']==d['gate_md5_after']=={
            'apply':'86b0494984edf95cf0f9c0a0df67000b',
            'capture_record':'89cbfac4162dbc9f8ecca59f2c3ab4c3',
            'citation_verify':'773a62783baa5edbe967200cac66b8c3',
            'l8_guard':'522d12f0843be1da3c785cef3c0bf3fc'}
          expected={'N1_MISSING_VERDICT_BLOCKS_WRAPPER','N1B_LF_FROZEN_GATE_NEEDS_CURATOR','N2_EXACT_DUPLICATE',
            'N3_CONFLICTING_CONFIG','N4_FAMILY_NOT_FOUND','N5_WRONG_FAMILY_OWNER',
            'N6_TAMPERED_VERDICT_SEAL','N7_DIRECT_VERDICT_DML_DENIED',
            'N8_ACCEPTED_VERDICT_STALE_CANDIDATE'}
          assert expected <= {c['id'] for c in d['cases'] if c['status']=='PASS'}
          assert not d['supabase_auth_real'] and not d['real_step70']
          assert d['production_write_count']==0 and d['production_curator_status']=='NO_PROBADO'
          print('L23_CI_ASSERT_PASS',d['case_count'],sorted(expected))
          PY
      - name: Preserve raw evidence and exact source SHA256
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/l23_artifact"
          cp -f sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/lote23_runtime.json "$RUNNER_TEMP/l23_artifact/" 2>/dev/null || true
          cp -f "$RUNNER_TEMP/l23_runtime_console.log" "$RUNNER_TEMP/l23_artifact/" 2>/dev/null || true
          sha256sum sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/15_l23_curator_stage_pg18.sql sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote23_curator_stage.py > "$RUNNER_TEMP/l23_artifact/sources.sha256"
          git status --short > "$RUNNER_TEMP/l23_artifact/worktree.status.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l23-pg18-curator-raw-evidence
          path: ${{ runner.temp }}/l23_artifact/
          if-no-files-found: warn
          retention-days: 14
