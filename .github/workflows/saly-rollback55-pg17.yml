name: SALY 55 tokens ROLLBACK-only (no Supabase writes)
on:
  pull_request:
    paths:
      - 'sandbox/creative_factory/rollback55_v1/**'
      - '.github/workflows/saly-rollback55-pg17.yml'
  workflow_dispatch:
jobs:
  rollback-only:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_rollback55_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_rollback55_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: saly_rollback55_test
      PGUSER: postgres
      PGPASSWORD: postgres
      PGPORT: 5432
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Execute genuine BEGIN / ROLLBACK
        run: bash sandbox/creative_factory/rollback55_v1/test_pg17.sh
