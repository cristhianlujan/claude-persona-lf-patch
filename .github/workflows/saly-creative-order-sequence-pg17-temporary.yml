name: SALY Creative Order Sequence PG17 Temporary
on:
  push:
    branches:
      - feat/saly-creative-single-screen-order-chain-v1-20261123
    paths:
      - 'supabase/migrations/20261123104500_lf_saly_creative_single_screen_sequence_v1.sql'
      - 'sandbox/creative_factory/order_sequence_v01/**'
      - '.github/workflows/saly-creative-order-sequence-pg17-temporary.yml'
permissions:
  contents: read
jobs:
  pg17-isolated:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_creative_chain_test
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_creative_chain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify PostgreSQL 17 isolated (no production credentials)
        run: |
          docker run --rm --network host \
            -v "$PWD:/repo:ro" -w /repo \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGDATABASE=saly_creative_chain_test \
            -e PGUSER=postgres -e PGPASSWORD=postgres \
            postgres:17 bash sandbox/creative_factory/order_sequence_v01/test_pg17.sh
