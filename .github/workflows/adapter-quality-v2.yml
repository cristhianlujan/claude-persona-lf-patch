name: Adapter Quality V2
on:
  pull_request:
    paths:
      - 'adapters/**'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/**'
      - 'supabase/migrations/*lf_profile_runtime_adapter_resolution*'
      - 'supabase/migrations/*lf_adapter_quality_v2_registry_sync*'
      - '.github/workflows/adapter-quality-v2.yml'
  push:
    branches: ['feat/adapter-quality-gate-v2-clean']
    paths:
      - 'adapters/**'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/**'
      - 'supabase/migrations/*lf_profile_runtime_adapter_resolution*'
      - 'supabase/migrations/*lf_adapter_quality_v2_registry_sync*'
      - '.github/workflows/adapter-quality-v2.yml'
permissions:
  contents: read
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python adapters/adapter_quality_v2_check.py
      - run: python adapters/lf_shell_profile_adapter/evals/quality_v2/run_cases.py
      - run: python adapters/project_brand_mockup_render_lf/evals/quality_v2/run_cases.py
      - run: python adapters/marketplace_lf_ux/evals/quality_v2/run_cases.py
      - run: python adapters/marketplace_lf_cx_trust/evals/quality_v2/run_cases.py
      - run: python sandbox/lf_contract_gate_test/profile_execution_runtime/run_zero_cost_runtime_tests.py
