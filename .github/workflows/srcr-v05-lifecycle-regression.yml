name: SRCR V0.5 Lifecycle Regression

on:
  push:
    branches:
      - "lf/srcr-v05-lifecycle-regression-20260921"

permissions:
  contents: read

jobs:
  lifecycle-v05-first-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install schema validator
        run: python -m pip install --quiet jsonschema
      - name: Diagnose frozen candidate schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,gzip,hashlib,json
          from pathlib import Path
          from jsonschema import Draft7Validator
          root=Path('profiles/systemic_root_cause_repair_lf')
          td=Path('sandbox/lf_contract_gate_test/srcr_v05_lifecycle_regression')
          names=['candidate.part1.b64','candidate.part2.b64','candidate.part3.b64','candidate.part4a.b64','candidate.part4b.b64','candidate.part5.b64','candidate.part6.b64','candidate.part7.b64','candidate.part8.b64']
          raw=gzip.decompress(base64.b64decode(''.join((td/n).read_text().strip() for n in names)))
          sha=hashlib.sha256(raw).hexdigest()
          print('CANDIDATE_SHA256='+sha)
          if sha!='5236f4fa746290ee75b8d3892fa9a970b2e13adf9b3bf38e3b2d9352dac13c05': raise SystemExit(2)
          candidate=json.loads(raw)
          schema=json.loads((root/'schemas/output.schema.json').read_text())
          errs=sorted(Draft7Validator(schema).iter_errors(candidate),key=lambda e:list(e.path))
          print('SCHEMA_ERRORS='+str(len(errs)))
          def walk(e,depth=0):
              print('SUBERR depth='+str(depth)+' path='+json.dumps(list(e.absolute_path))+' schema_path='+json.dumps(list(e.absolute_schema_path))+' msg='+e.message)
              for x in e.context:
                  walk(x,depth+1)
          for e in errs:
              if list(e.path)==['implementation_package']:
                  walk(e)
          raise SystemExit('EXPECTED_SCHEMA_DIAGNOSTIC')
          PY
