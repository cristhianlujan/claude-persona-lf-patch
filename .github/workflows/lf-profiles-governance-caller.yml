name: LF Profiles Governance Caller

on:
  push:
    branches:
      - governance/profiles-unblock-secure-caller-20260901
    paths:
      - ".github/workflows/lf-profiles-governance-caller.yml"
      - "supabase/functions/lf-profiles-governance-caller-v1/**"
      - "supabase/functions/run-creacion-perfil-lf/**"

permissions:
  contents: read
  id-token: write

jobs:
  governed-profiles-caller-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject non-OIDC caller
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            -o negative.json -w '%{http_code}' \
            -H 'Authorization: Bearer not-a-github-oidc-token' \
            -H 'Content-Type: application/json' \
            -d '{"action":"input_readiness_screen_v1","codigo":"ONB_002"}' \
            'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profiles-governance-caller-v1')
          cat negative.json
          test "$code" = "401"

      - name: Request exact GitHub OIDC identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('lf-profiles-governance-caller-v1');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Materialize Input Governance readiness
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          : > readiness-results.jsonl
          for SCREEN in ONB_002 ONB_003 ONB_004 HOME_002; do
            code=$(curl --silent --show-error \
              -o "readiness-${SCREEN}.json" -w '%{http_code}' \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"action\":\"input_readiness_screen_v1\",\"codigo\":\"${SCREEN}\"}" \
              'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profiles-governance-caller-v1')
            cat "readiness-${SCREEN}.json"
            python3 - "$SCREEN" "$code" "readiness-${SCREEN}.json" >> readiness-results.jsonl <<'PY'
          import json,sys
          screen,http,path=sys.argv[1:]
          data=json.load(open(path,encoding='utf-8'))
          result=data.get('result') or {}
          print(json.dumps({
              'codigo': result.get('codigo'),
              'pantalla_id': result.get('pantalla_id'),
              'status': result.get('status'),
              'run_id': result.get('run_id'),
              'outcome': data.get('outcome'),
              'http_code': int(http),
              'requested_codigo': screen,
          },sort_keys=True))
          PY
          done
          python3 - <<'PY'
          import json
          rows=[json.loads(line) for line in open('readiness-results.jsonl',encoding='utf-8') if line.strip()]
          expected={'ONB_002','ONB_003','ONB_004','HOME_002'}
          codes={row.get('codigo') for row in rows}
          requested={row.get('requested_codigo') for row in rows}
          bad=[row for row in rows if row.get('http_code')!=200 or row.get('outcome')!='READY' or row.get('status')!='READY' or row.get('codigo')!=row.get('requested_codigo')]
          aggregate={
              'outcome':'READY' if not bad and codes==expected and requested==expected and len(rows)==4 else 'BLOCKED',
              'ready_count':sum(1 for row in rows if row.get('status')=='READY'),
              'required_count':4,
              'results':rows,
          }
          open('readiness.json','w',encoding='utf-8').write(json.dumps(aggregate,sort_keys=True))
          print(json.dumps(aggregate,sort_keys=True))
          if aggregate['outcome']!='READY' or aggregate['ready_count']!=4:
              raise SystemExit('FAIL_INPUT_READINESS_4_OF_4: '+json.dumps(aggregate,sort_keys=True))
          print('PASS_INPUT_READINESS_4_OF_4')
          PY

      - name: Materialize B2B-CARGA-001 Input Governance for issue 402
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error \
            -o readiness-b2b-402.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d '{"action":"input_readiness_b2b_402_v1","codigo":"B2B-CARGA-001"}' \
            'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profiles-governance-caller-v1')
          cat readiness-b2b-402.json
          python3 - "$code" <<'PY'
          import json,sys
          http=int(sys.argv[1])
          data=json.load(open('readiness-b2b-402.json',encoding='utf-8'))
          result=data.get('result') or {}
          checks={
            'http_governed': http in (200,409),
            'scope': data.get('scope')=='LF_EMPRESA_ISSUE_402',
            'outcome': data.get('outcome') in ('READY','BLOCKED'),
            'codigo': result.get('codigo')=='B2B-CARGA-001',
            'pantalla_id': result.get('pantalla_id')==43,
            'consumer': result.get('consumer')=='MANUAL',
            'status_present': isinstance(result.get('status'),str) and bool(result.get('status')),
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('FAIL_B2B_402_INPUT_GOVERNANCE_CALL:'+repr(failed)+':'+json.dumps(data,sort_keys=True)[:5000])
          print('PASS_B2B_402_INPUT_GOVERNANCE_CALL')
          print(json.dumps({
            'outcome':data.get('outcome'),
            'status':result.get('status'),
            'run_id':result.get('run_id'),
            'pantalla_id':result.get('pantalla_id'),
            'codigo':result.get('codigo'),
            'consumer':result.get('consumer'),
          },sort_keys=True))
          PY

      - name: Initialize canonical Profile Creator execution
        id: creator
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          REQUEST_ID=$(python3 - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )
          echo "request_id=$REQUEST_ID" >> "$GITHUB_OUTPUT"
          cat > creator-request.json <<EOF
          {"action":"profile_creator_init_v1","caller_request_id":"${REQUEST_ID}","target_code":"PERFIL-GOVERNED-CALLER-CANARY-20260901","profile_slug":"governed_caller_canary_20260901"}
          EOF
          code=$(curl --silent --show-error \
            -o creator.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @creator-request.json \
            'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profiles-governance-caller-v1')
          cat creator.json
          python3 - <<'PY'
          import json
          data=json.load(open('creator.json',encoding='utf-8'))
          result=data.get('result') or {}
          execution=result.get('execution') or {}
          step=result.get('init_step') or {}
          checks={
            'outer_outcome': data.get('outcome')=='INITIALIZED',
            'inner_outcome': result.get('outcome')=='INITIALIZED',
            'operation': execution.get('operation_code')=='CREACION_PERFIL_LF',
            'target_type': execution.get('target_type')=='PERFIL',
            'status': execution.get('status')=='IN_PROGRESS',
            'init_step': step.get('step_id')=='init_execution' and step.get('status')=='STEP_CLEAN_PASS',
            'no_github_write': result.get('github_write_executed') is False and result.get('write_executed') is False,
            'next_gate': result.get('next_gate')=='router',
          }
          failed=[k for k,v in checks.items() if not v]
          if failed:
              raise SystemExit('FAIL_PROFILE_CREATOR_GOV024_INIT:'+repr(failed)+':'+json.dumps(data,sort_keys=True)[:4000])
          print('PASS_PROFILE_CREATOR_GOV024_INIT')
          print('execution_id='+str(execution.get('execution_id')))
          PY
          test "$code" = "201"

      - name: Replay is idempotent
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          REQUEST_ID: ${{ steps.creator.outputs.request_id }}
        run: |
          set -euo pipefail
          cat > creator-replay-request.json <<EOF
          {"action":"profile_creator_init_v1","caller_request_id":"${REQUEST_ID}","target_code":"PERFIL-GOVERNED-CALLER-CANARY-20260901","profile_slug":"governed_caller_canary_20260901"}
          EOF
          code=$(curl --silent --show-error \
            -o replay.json -w '%{http_code}' \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary @creator-replay-request.json \
            'https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-profiles-governance-caller-v1')
          cat replay.json
          python3 - <<'PY'
          import json
          data=json.load(open('replay.json',encoding='utf-8'))
          result=data.get('result') or {}
          if result.get('outcome')!='INITIALIZED' or result.get('replay') is not True:
              raise SystemExit('FAIL_PROFILE_CREATOR_REPLAY:'+json.dumps(data,sort_keys=True)[:4000])
          if result.get('github_write_executed') is not False:
              raise SystemExit('FAIL_PROFILE_CREATOR_REPLAY_GITHUB_WRITE')
          print('PASS_PROFILE_CREATOR_REPLAY_IDEMPOTENT')
          PY
          test "$code" = "201"
