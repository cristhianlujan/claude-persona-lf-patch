name: S26 Manifest Continuation

on:
  pull_request:
    paths:
      - ".github/workflows/s26-manifest-continuation.yml"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_manifest_from_holdout_capture.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_ui_architect_semantic_obligation_manifest_v1.json"

permissions:
  contents: read
  actions: read

jobs:
  s26-manifest-continuation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLAMA_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
      PRIOR_RUN_ID: '34138388750'
      PRIOR_ARTIFACT_NAME: s26-holdout-manifest-34138388750
      PRIOR_RESULT_SHA256: 8213bc35bc0f59f650430f1a864d3dfb28b4ba3cd2702c89f1ad9b666f137a61
    steps:
      - name: Checkout exact PR merge ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and preflight canonical runtime dependency
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check jsonschema==4.26.0
          python3 - <<'PY'
          import importlib.metadata
          import jsonschema
          observed = importlib.metadata.version("jsonschema")
          if observed != "4.26.0":
              raise SystemExit(f"S26_JSONSCHEMA_VERSION_MISMATCH:{observed}")
          from jsonschema import Draft202012Validator, SchemaError
          print(f"S26_JSONSCHEMA_PREFLIGHT_PASS version={observed}")
          PY

      - name: Validate manifest continuation harness syntax
        run: |
          set -euo pipefail
          python3 -m py_compile \
            sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_primary_candidate_holdout_manifest.py \
            sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_manifest_from_holdout_capture.py
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_semantic_mini_judge_tests.py

      - name: Download exact prior frozen holdout artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.PRIOR_RUN_ID }}
          name: ${{ env.PRIOR_ARTIFACT_NAME }}
          path: prior-holdout-artifact

      - name: Bind exact prior durable result
        run: |
          set -euo pipefail
          result_path="$(find prior-holdout-artifact -type f -name 's26-primary-candidate-holdout-manifest-result.json' -print -quit)"
          test -n "$result_path"
          observed="$(sha256sum "$result_path" | awk '{print $1}')"
          test "$observed" = "$PRIOR_RESULT_SHA256"
          echo "PRIOR_RESULT_PATH=$result_path" >> "$GITHUB_ENV"
          echo "S26_PRIOR_HOLDOUT_RESULT_BINDING run_id=$PRIOR_RUN_ID sha256=$observed path=$result_path"

      - name: Build pinned llama.cpp server from source
        timeout-minutes: 10
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          git checkout --detach "$LLAMA_COMMIT"
          test "$(git rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build build --config Release -j 4 --target llama-server
          test -x build/bin/llama-server

      - name: Download and verify pinned independent semantic judge
        timeout-minutes: 20
        env:
          JUDGE_COMMIT: 508edd0afaa66bb9e9f40587acc2184f02daf1f6
          JUDGE_SHA256: 9258bf05b12686d097ff3b6b18d968ab393649780aa2b3cd67fec43d50554392
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lf-semantic-model"
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 \
            "https://huggingface.co/ggml-org/Qwen2.5-VL-7B-Instruct-GGUF/resolve/${JUDGE_COMMIT}/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf?download=true" \
            -o "$RUNNER_TEMP/lf-semantic-model/model.gguf"
          echo "${JUDGE_SHA256}  $RUNNER_TEMP/lf-semantic-model/model.gguf" | sha256sum -c -

      - name: Execute prebound semantic obligation manifest without candidate rerun
        timeout-minutes: 15
        env:
          LF_REPOSITORY_VISIBILITY: public
          LF_RUNNER_LABEL: ubuntu-latest
          LF_LLAMA_SOURCE_COMMIT: ${{ env.LLAMA_COMMIT }}
          LF_LLAMA_SERVER_PATH: ${{ runner.temp }}/llama.cpp/build/bin/llama-server
          LF_SEMANTIC_MODEL_PATH: ${{ runner.temp }}/lf-semantic-model/model.gguf
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_manifest_from_holdout_capture.py \
            --prior-result "$PRIOR_RESULT_PATH" \
            --result-path "$GITHUB_WORKSPACE/s26-manifest-continuation-result.json" \
            | tee "$RUNNER_TEMP/s26-manifest-continuation.log"

      - name: Upload durable manifest continuation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s26-manifest-continuation-${{ github.run_id }}
          path: |
            s26-manifest-continuation-result.json
            ${{ runner.temp }}/s26-manifest-continuation.log
          if-no-files-found: error
          retention-days: 30
