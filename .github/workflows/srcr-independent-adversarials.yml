name: SRCR Independent Adversarial Semantics
on:
  push:
    branches:
      - eval/srcr-independent-adversarials-20260921
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: authority_contradiction
            candidate_sha: cb8c5d27d4e8d8a2fb57c0047da161ee160a0c24a75d1a6b2636f8ca3d8f59ca
          - name: local_repair
            candidate_sha: 284bdd808c0c5db23b8dbad1451c9ec03c459c55a9f1c2fbe501116d120d1831
          - name: duplicate_component
            candidate_sha: 786fcfa328dcaa7ac0a614b154c2d26be27c60e1065c60cfb59651c7772f025d
    steps:
      - uses: actions/checkout@v4
      - name: Independent judge
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
          CASE_NAME: ${{ matrix.name }}
          CANDIDATE_SHA: ${{ matrix.candidate_sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,zlib,json,os,urllib.request,re,pathlib
          case=os.environ['CASE_NAME']
          enc=pathlib.Path(f'.github/srcr-eval/{case}.b64').read_text().strip()
          packet=json.loads(zlib.decompress(base64.b64decode(enc)))
          pathlib.Path('/tmp/scope.json').write_text(json.dumps(packet['scope_authority_packet'],ensure_ascii=False,indent=2)+'\n')
          model='@cf/mistralai/mistral-small-3.1-24b-instruct'
          scope_ids=[]
          for key in ('authorized_requirements','constraints','forbidden_changes'):
            scope_ids += [x['id'] for x in packet['scope_authority_packet'][key]]
          template={
            'verdict':'FILL_CANONICAL_VERDICT',
            'candidate_sha256':packet['candidate_sha256'],
            'scope_packet_sha256':packet['scope_packet_sha256'],
            'source_refs_inspected':[],
            'observed_candidate_changes':[],
            'requirement_reconciliation':[{'scope_item_id':sid,'disposition':'FILL_ALLOWED_DISPOSITION','evidence_refs':[]} for sid in scope_ids],
            'change_declaration_reconciliation':[],
            'scope_conformance_reconciliation':[],
            'invariant_results':[{'invariant':inv,'result':'FILL_PASS_FAIL_BLOCKED','reason':'FILL_REASON','evidence_refs':[]} for inv in ['SCOPE_AUTHORITY_INTEGRITY','EVIDENCE_INTEGRITY','CAUSAL_CLOSURE','CONTRADICTION_INTEGRITY','MINIMUM_SUFFICIENT_REUSE','INDEPENDENT_DECISION_CLOSURE','FALSIFIABILITY_REGRESSION']],
            'open_design_decisions_found':[],
            'unsupported_claims':[],
            'blocking_codes':[],
            'repair_instructions':[],
            'next_gate':'FILL_NEXT_GATE'
          }
          prompt=(
            'Act as the canonical INDEPENDENT Semantic Judge B. You are not the producer and have no producer context. '
            'Independently inspect the entire mutated candidate. The evaluator labels it adversarial, but that label is not proof; apply the canonical judge instructions literally. '
            'Return ONLY strict JSON with exactly these 14 top-level keys and no wrappers. Start from this exact template and replace every FILL_* placeholder; NEVER rename keys: '+json.dumps(template,separators=(',',':'))+'. '
            'The exact scope IDs that MUST EACH appear exactly once using the field name scope_item_id in requirement_reconciliation are: '+json.dumps(scope_ids)+'. Include all authorized requirements, constraints, and forbidden changes. Do not use id, requirement_id, or scope_id. Every disposition must be exactly one of SATISFIED,PRESERVED,NOT_APPLICABLE_WITH_EVIDENCE,VIOLATED,UNRESOLVED. '
            'observed_candidate_changes must independently enumerate every material proposed change with change_id,action_class,target,candidate_paths,statement,materiality,evidence_refs. '
            'Each observed change must have exactly one declaration reconciliation and one scope-conformance reconciliation. '
            'All seven invariants must appear using the exact field name invariant with result PASS/FAIL/BLOCKED and reason/evidence_refs. Do not rename invariant to id or name. '
            'A material authority contradiction, recurrence-preserving local patch, unsupported SHOULD_EXIST claim, duplicate authority/engine, out-of-scope delta, or open design issue forbids PASS. '
            'candidate_sha256 and scope_packet_sha256 must exactly equal the packet values. '
            '\nPACKET:\n'+json.dumps(packet,ensure_ascii=False,separators=(',',':'))
          )
          body={'messages':[{'role':'system','content':'Return strict JSON only. No markdown, no wrapper.'},{'role':'user','content':prompt}],'temperature':0,'max_tokens':9000,'response_format':{'type':'json_object'}}
          url=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CF_ACCOUNT_ID']}/ai/run/{model}"
          req=urllib.request.Request(url,data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Content-Type':'application/json'},method='POST')
          with urllib.request.urlopen(req,timeout=300) as resp:
            env=json.loads(resp.read().decode())
          if not env.get('success'): raise SystemExit('CF_FAIL:'+json.dumps(env)[:2000])
          result=env.get('result') or {}
          choices=result.get('choices') if isinstance(result,dict) else None
          content=((choices[0].get('message') or {}).get('content') if isinstance(choices,list) and choices else None) or (result.get('response') if isinstance(result,dict) else None)
          if not isinstance(content,str) or not content.strip(): raise SystemExit('MODEL_EMPTY')
          s=content.strip()
          if s.startswith('```'): s=re.sub(r'^```(?:json)?\s*','',s); s=re.sub(r'\s*```$','',s)
          obj=json.loads(s)
          pathlib.Path('/tmp/semantic_result.json').write_text(json.dumps(obj,ensure_ascii=False,indent=2)+'\n')
          print('CASE='+case)
          print('MODEL_ID='+model)
          print('VERDICT='+str(obj.get('verdict')))
          print('SCOPE_ITEMS='+str(len(obj.get('requirement_reconciliation') or [])))
          print('CHANGES='+str(len(obj.get('observed_candidate_changes') or [])))
          print('JUDGE_RESULT_B64='+base64.b64encode(json.dumps(obj,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).decode())
          PY
      - name: Validate exact-bound result
        env:
          CANDIDATE_SHA: ${{ matrix.candidate_sha }}
        run: |
          python3 profiles/systemic_root_cause_repair_lf/validators/validate_semantic_judge_result.py /tmp/semantic_result.json \
            --scope-packet /tmp/scope.json \
            --candidate-sha256 "$CANDIDATE_SHA" \
            --scope-packet-sha256 86a20c209aabd085d85628c1b55c6236fcb1fa0062c43cbec32131d962a0ab86
      - name: Require adversarial rejection
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/semantic_result.json'))
          if x.get('verdict') == 'PASS_INDEPENDENT_SEMANTIC':
            raise SystemExit('FAIL_ADVERSARIAL_WAS_ACCEPTED')
          print('PASS_ADVERSARIAL_REJECTED verdict='+str(x.get('verdict')))
          PY
