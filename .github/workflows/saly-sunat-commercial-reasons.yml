name: SALY SUNAT rejection breakdown (read-only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/saly-sunat-commercial-reasons.yml'
      - 'skills/ai_sales_discovery/tests/sunat_commercial_exclusion_reasons_v1.py'
      - 'skills/ai_sales_discovery/tests/test_sunat_commercial_exclusion_reasons_v1.py'
permissions:
  contents: read
jobs:
  verify-readonly-source-audit:
    if: contains(github.event.pull_request.title, 'SUNAT desagregar descartes v1')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: saly-sunat-reason-audit-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test all rejection paths and gate parity without network
        run: python3 skills/ai_sales_discovery/tests/test_sunat_commercial_exclusion_reasons_v1.py
      - name: Verify both pinned official ZIP archives and print aggregate only
        timeout-minutes: 27
        run: python3 skills/ai_sales_discovery/tests/sunat_commercial_exclusion_reasons_v1.py
