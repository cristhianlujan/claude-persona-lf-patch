name: H4 temporary EX6 v2 disposable Postgres and local Git readbacks
on:
  push:
    branches: [lf/h4-ex6-real-chain-evidence-20261109]
permissions:
  contents: read
jobs:
  local-only-pg12-pg13:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ex6-local-only
          POSTGRES_USER: postgres
          POSTGRES_DB: pg12_test_ex6
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pg12_test_ex6"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG12_TEST_DSN: postgresql://postgres:ex6-local-only@127.0.0.1:5432/pg12_test_ex6
      PG12_DISPOSABLE_DB: "YES"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install local psql client only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: EX6 real ZIP, N:M, PG12/PG13 v2 and disposable readbacks
        run: |
          set -euo pipefail
          python3 -m unittest discover -s sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tests -p 'test_ex6*.py' -v
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tools/ex6_one_pass_v1.py
