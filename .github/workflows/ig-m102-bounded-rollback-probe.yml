name: IG M10.2 Bounded Rollback Probe Temporary
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "supabase/migrations/*_lf_ig_m102_engineering_gate_alignment_v1.sql"
      - ".github/workflows/ig-m102-bounded-rollback-probe.yml"
permissions:
  contents: read
jobs:
  m102-sandbox-rollback:
    if: github.event.pull_request.number == 2419 && github.event.pull_request.head.repo.full_name == github.repository
    name: M10.2 positive/negative SQL rollback (no commit)
    runs-on: ubuntu-latest
    environment: lf-merge-train
    timeout-minutes: 10
    env:
      PGHOST: aws-1-us-east-1.pooler.supabase.com
      PGPORT: "5432"
      PGUSER: postgres.mhwmirqcgxxukpctffuv
      PGDATABASE: postgres
      PGSSLMODE: require
      PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Positive and negative rollback proof
        shell: bash
        run: |
          set -euo pipefail
          f=supabase/migrations/20261013170000_lf_ig_m102_engineering_gate_alignment_v1.sql
          test -s "$f"
          test -n "$PGPASSWORD"
          python3 -m unittest discover -s sandbox/lf_contract_gate_test/engineering_checkpoints/m10_2 -p test_m102_contract_alignment_v1.py -q
          python3 sandbox/lf_contract_gate_test/migration_source_parity/lf_migration_name_classification_check.py "$f"
          sha256sum "$f"
          q="SELECT CASE WHEN (SELECT version='1.0.0' FROM public.lf_capability_current WHERE capability_code='INPUT_GOVERNANCE') AND (SELECT count(*)=1 FROM public.lf_capability_version_registry WHERE capability_code='INPUT_GOVERNANCE') AND (SELECT count(*)=6 FROM programacion.engineering_work_checkpoints WHERE work_item_id=199 AND status='PENDING') AND (SELECT expected_result='switch reversible' FROM programacion.engineering_work_items WHERE id=199) AND NOT EXISTS (SELECT 1 FROM programacion.engineering_plan_units WHERE id=11 AND unit_metadata ? 'm10_2_contract_governance_v1') THEN 'BASELINE_PASS' ELSE 'BASELINE_FAIL' END"
          psql -X -At -v ON_ERROR_STOP=1 -c "$q" | grep -Fx BASELINE_PASS
          set +e
          {
            printf 'BEGIN;\n'
            printf "UPDATE programacion.engineering_work_items SET expected_result='INVALID_M102_NEGATIVE' WHERE id=199;\n"
            cat "$f"
          } | psql -X -v ON_ERROR_STOP=1 >/tmp/m102-negative.log 2>&1
          rc=$?
          set -e
          [ "$rc" -ne 0 ] || { echo FAIL_NEGATIVE_ACCEPTED; exit 1; }
          grep -Fq M102_PREFLIGHT_WORK_OR_CHECKPOINT_DRIFT /tmp/m102-negative.log || { grep 'ERROR:' /tmp/m102-negative.log || :; echo FAIL_NEGATIVE_WRONG_REASON; exit 1; }
          echo PASS_NEGATIVE_GUARD
          psql -X -At -v ON_ERROR_STOP=1 -c "$q" | grep -Fx BASELINE_PASS
          {
            printf 'BEGIN;\n'
            cat "$f"
            cat <<'SQL'
          SELECT CASE WHEN (SELECT unit_metadata#>>'{m10_2_contract_governance_v1,phase}' FROM programacion.engineering_plan_units WHERE id=11)='CONSTRUCTION_SANDBOX' AND (SELECT unit_metadata#>>'{action_specs_v1,SWITCH_ONLY_MIGRATION,action_kind}' FROM programacion.engineering_plan_units WHERE id=11)='READBACK_ONCE' AND (SELECT unit_metadata#>>'{action_specs_v1,RUNTIME_PREFLIGHT,status}' FROM programacion.engineering_plan_units WHERE id=11)='READY' AND (SELECT count(*)=6 FROM programacion.engineering_work_checkpoints WHERE work_item_id=199 AND status='PENDING') AND (SELECT version='1.0.0' FROM public.lf_capability_current WHERE capability_code='INPUT_GOVERNANCE') THEN 'POSITIVE_PASS' ELSE 'POSITIVE_FAIL' END;
          ROLLBACK;
          SQL
          } | psql -X -At -v ON_ERROR_STOP=1 | tee /tmp/m102-positive.log
          grep -Fx POSITIVE_PASS /tmp/m102-positive.log
          psql -X -At -v ON_ERROR_STOP=1 -c "$q" | grep -Fx BASELINE_PASS
          echo PASS_M102_ROLLBACK_ZERO_RESIDUE
