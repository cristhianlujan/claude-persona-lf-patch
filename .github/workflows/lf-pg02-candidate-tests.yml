name: LF PG-02 Candidate Contract Tests

# Candidate-only regression. NOT PG-01 admission, PG-00 catalog release or independent review.
on:
  pull_request:
    paths:
      - 'sandbox/lf_contract_gate_test/programming_agent_four_stage/pg02/**'
      - '.github/workflows/lf-pg02-candidate-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pg02-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head without stored credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute PG-02 candidate regressions
        run: |
          set -euo pipefail
          cd sandbox/lf_contract_gate_test/programming_agent_four_stage/pg02
          python3 test_pg02_classifier_v1.py
          python3 test_pg02_scope_isolation_v2.py
          python3 test_pg02_pg00_bridge_v1.py
          python3 test_pg02_classification_outcome_v1.py
      - name: Execute existing Wave 1 boundary regressions
        run: |
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/wave1_boundary_contracts/validate_wave1_boundary_contracts_v1.py --self-test
