name: LF Learning Run31 Persist

on:
  push:
    branches: [lf/learning-consumer-benchmark-gate-20260831]

permissions:
  contents: read

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
      EXECUTION_ID: LF-AUTOLEARN-RUN-20260831-031
    steps:
      - name: Persist read-only learning evidence
        env:
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST="$SUPABASE_POOLER_HOST" PGPORT=5432 PGUSER="postgres.${SUPABASE_PROJECT_ID}" PGDATABASE=postgres PGSSLMODE=require
          psql -X -v ON_ERROR_STOP=1 -v execution_id="$EXECUTION_ID" -v head_sha="$GITHUB_SHA" <<'SQL'
          begin;

          do $$
          declare
            v_exists boolean;
            v_backlog integer;
          begin
            select exists(select 1 from public.lf_operation_execution where execution_id='LF-AUTOLEARN-RUN-20260831-031') into v_exists;
            if v_exists then
              raise exception 'RUN31_ALREADY_EXISTS';
            end if;

            with processed as (
              select distinct entidad_codigo::uuid kb_id
              from public.lf_eventos
              where entidad_tipo='KNOWLEDGE'
                and payload->>'producer'='LF_APRENDIZAJE_AUTONOMO'
                and coalesce(payload->>'eligibility','') like '%PASS%'
            ), carded as (
              select distinct (manifest->>'source_kb_id')::uuid kb_id
              from public.lf_operation_execution
              where operation_code='CREACION_CARD_LF'
                and completed_at is not null
                and status not like 'BLOCKED%'
                and coalesce(manifest->>'source_kb_id','') <> ''
            )
            select count(*) into v_backlog
            from public.lf_knowledge_base k
            left join processed p using(kb_id)
            left join carded c using(kb_id)
            where k.kb_category='COMPETENCIA'
              and k.consumer_ready=true
              and k.grounding_status='GROUNDED'
              and k.decision_upstream='ALLOW_PROD_GATE'
              and p.kb_id is null and c.kb_id is null;

            if v_backlog <> 10 then
              raise exception 'BACKLOG_CHANGED expected=10 actual=%', v_backlog;
            end if;
          end $$;

          insert into public.lf_operation_execution(
            execution_id, operation_code, target_type, target_code, status,
            started_at, completed_at, manifest, created_by_execution_id, updated_by_execution_id
          ) values (
            'LF-AUTOLEARN-RUN-20260831-031',
            'LEARNING_BRIDGE_KB_CARD_LF',
            'OPERATION','LEARNING_BRIDGE_KB_CARD_LF',
            'CONSUMER_ROUTING_BENCHMARK_PASS_BEHAVIORAL_BLOCKED',
            now(),now(),
            jsonb_build_object(
              'evidence_schema_version','operational-event/v2',
              'router_first',true,
              'router_action','KNOWLEDGE_LEARNING_BRIDGE',
              'router_status','ACTIVE',
              'router_write_allowed',false,
              'source_branch','lf/learning-consumer-benchmark-gate-20260831',
              'source_pr',368,
              'source_head',:'head_sha',
              'batches_completed',2,
              'units_processed',10,
              'backlog_before',10,
              'consumer_id','PERFIL-PRODUCT-DIRECTOR-LF',
              'bindings_source_candidate',jsonb_build_array('NEGOCIACION_DEUDA','ALTERNATIVAS_FINANCIERAS','EDUCACION_CREDITICIA'),
              'champion_id','CHAMPION-PRODUCT-DIRECTOR-LF-NO-COMPETITIVE-CONTEXT-v1',
              'challenger_id','CHALLENGER-PRODUCT-DIRECTOR-LF-SELECTED-COMPETITIVE-CONTEXT-v1',
              'benchmark_cases',50,
              'benchmark_families',10,
              'routing_metrics',jsonb_build_object('tp',25,'tn',25,'fp',0,'fn',0,'precision',1.0,'recall',1.0,'specificity',1.0,'p50_ns',140,'p95_ns',250,'max_ns',600,'llm_calls',0,'round_trips',0,'context_pack_bytes',294),
              'behavioral_quality_status','INSUFFICIENT_EVIDENCE_RUNTIME_DISABLED',
              'provider_cost_status','ZERO_LLM_CALLS_ROUTING_LAYER_ONLY',
              'automatic_impact',false,
              'production_authorized',false,
              'acceptance_declared',false
            ),
            'LF-AUTOLEARN-RUN-20260831-031','LF-AUTOLEARN-RUN-20260831-031'
          );

          with units(kb_id,cluster_code,disposition,consumer_id,binding_id,binding_state,batch_no) as (values
            ('5500178a-d503-476c-be77-c99223b4d90c','NEGOCIACION_DEUDA','INSIGHT_ONLY_EXISTING_CARD_ENRICHMENT','PERFIL-PRODUCT-DIRECTOR-LF','BIND-LF-PD-NEGOCIACION-DEUDA-v1','SOURCE_BINDING_CANDIDATE',1),
            ('33e6970d-d19c-4300-8ed7-1784dd162d9d','ALTERNATIVAS_FINANCIERAS','MERGE_INTO_ALTERNATIVAS_CARD_CANDIDATE','PERFIL-PRODUCT-DIRECTOR-LF','BIND-LF-PD-ALTERNATIVAS-FINANCIERAS-v1','SOURCE_BINDING_CANDIDATE',1),
            ('7ffa83ea-c4ea-41a1-aaed-a76329c5c730','EDUCACION_CREDITICIA','MERGE_INTO_EDUCACION_CARD_CANDIDATE','PERFIL-PRODUCT-DIRECTOR-LF','BIND-LF-PD-EDUCACION-CREDITICIA-v1','SOURCE_BINDING_CANDIDATE',1),
            ('a6422c36-6e32-4b96-b861-c2a57d3d7016','BENCHMARK_PERIFERICO','INSIGHT_ONLY_MARKET_SIGNAL',null,null,'READY_FOR_BINDING',1),
            ('b7b073dc-2bbb-49be-bc23-a706da00b517','BENCHMARK_PERIFERICO','INSIGHT_ONLY_MARKET_SIGNAL',null,null,'READY_FOR_BINDING',1),
            ('7ebe6b67-9463-4753-82eb-f3fedfc2f72c','EDUCACION_CREDITICIA','MERGE_INTO_EDUCACION_CARD_CANDIDATE','PERFIL-PRODUCT-DIRECTOR-LF','BIND-LF-PD-EDUCACION-CREDITICIA-v1','SOURCE_BINDING_CANDIDATE',2),
            ('6b4efb50-6e61-4f4c-ac1e-7ec3b7eac985','ALTERNATIVAS_FINANCIERAS','MERGE_INTO_ALTERNATIVAS_CARD_CANDIDATE','PERFIL-PRODUCT-DIRECTOR-LF','BIND-LF-PD-ALTERNATIVAS-FINANCIERAS-v1','SOURCE_BINDING_CANDIDATE',2),
            ('0821f197-1141-4aae-9e1a-17e824a40e21','REINSERCION_FINANCIERA','INSIGHT_ONLY_EXISTING_CARD_ENRICHMENT',null,null,'READY_FOR_BINDING',2),
            ('3f4ca9bb-61f9-46e7-9850-59a2448b5277','EDUCACION_CREDITICIA','MERGE_INTO_EDUCACION_CARD_CANDIDATE','PERFIL-PRODUCT-DIRECTOR-LF','BIND-LF-PD-EDUCACION-CREDITICIA-v1','SOURCE_BINDING_CANDIDATE',2),
            ('55f1b6c0-e019-4744-ae60-64861863d5b5','BENCHMARK_PERIFERICO','INSIGHT_ONLY_MARKET_SIGNAL',null,null,'READY_FOR_BINDING',2)
          )
          insert into public.lf_eventos(evento_tipo,entidad_tipo,entidad_codigo,descripcion,severidad,payload,origen,created_by_execution_id,updated_by_execution_id)
          select
            'AUDIT_TRAIL_PIPELINE','KNOWLEDGE',u.kb_id,
            'LF Aprendizaje Autónomo Run31: unidad analizada y llevada hasta la frontera segura de binding/benchmark.',
            'INFO',
            jsonb_build_object(
              'evidence_schema_version','operational-event/v2',
              'producer','LF_APRENDIZAJE_AUTONOMO',
              'purpose','Persistir análisis, clustering, consumer-binding candidate y benchmark sin impacto automático.',
              'acceptance_declared',false,
              'occurred_at',now()::text,
              'execution_id','LF-AUTOLEARN-RUN-20260831-031',
              'eligibility','PASS',
              'cluster_code',u.cluster_code,
              'lifecycle_state','ANALIZADO',
              'disposition',u.disposition,
              'consumer_id',u.consumer_id,
              'binding_id',u.binding_id,
              'consumer_binding_state',u.binding_state,
              'champion_id','CHAMPION-PRODUCT-DIRECTOR-LF-NO-COMPETITIVE-CONTEXT-v1',
              'challenger_id','CHALLENGER-PRODUCT-DIRECTOR-LF-SELECTED-COMPETITIVE-CONTEXT-v1',
              'routing_benchmark','CHALLENGER_WINS_50_OF_50',
              'behavioral_quality_status','INSUFFICIENT_EVIDENCE_RUNTIME_DISABLED',
              'batch',u.batch_no,
              'automatic_impact',false,
              'production_authorized',false
            ),
            'LF_APRENDIZAJE_AUTONOMO','LF-AUTOLEARN-RUN-20260831-031','LF-AUTOLEARN-RUN-20260831-031'
          from units u;

          update public.lf_error_knowledge
          set frecuencia=frecuencia+2,
              ultima_vez=now(),
              updated_at=now(),
              evidencia=coalesce(evidencia,'{}'::jsonb) || jsonb_build_object(
                'run31_recovery',jsonb_build_object(
                  'execution_id','LF-AUTOLEARN-RUN-20260831-031',
                  'occurrences',2,
                  'root_cause','schema assumptions on v_lf_fuente_operativa and lf_operation_execution_steps',
                  'recovery','schema-first introspection plus to_jsonb full-row readback',
                  'source_pr',368,
                  'source_head',:'head_sha'
                )
              )
          where codigo='DB-001';

          insert into public.lf_eventos(evento_tipo,entidad_tipo,entidad_codigo,descripcion,severidad,payload,origen,created_by_execution_id,updated_by_execution_id)
          values(
            'GOVERNANCE_CLOSURE','OPERATION','LEARNING_BRIDGE_KB_CARD_LF',
            'Run31 cerró dos lotes read-only, bindings candidatos y benchmark de routing; conducta del perfil permanece bloqueada por runtime no habilitado.',
            'INFO',
            jsonb_build_object(
              'evidence_schema_version','operational-event/v2',
              'producer','LF_APRENDIZAJE_AUTONOMO',
              'purpose','Cierre durable del lote de consumer bindings y champion benchmark sin promoción ni producción.',
              'acceptance_declared',false,
              'occurred_at',now()::text,
              'execution_id','LF-AUTOLEARN-RUN-20260831-031',
              'batches_completed',2,
              'units_processed',10,
              'routing_benchmark','PASS_50_OF_50',
              'behavioral_quality_status','INSUFFICIENT_EVIDENCE_RUNTIME_DISABLED',
              'automatic_impact',false,
              'production_authorized',false,
              'authority_frontier','PROFILE_RUNTIME_NO_HABILITADO_AND_SOURCE_PR_NOT_MERGED'
            ),
            'LF_APRENDIZAJE_AUTONOMO','LF-AUTOLEARN-RUN-20260831-031','LF-AUTOLEARN-RUN-20260831-031'
          );

          commit;

          echo "RUN31_READBACK_BEGIN"
          psql -X -v ON_ERROR_STOP=1 -Atqc "select jsonb_build_object('execution_id',execution_id,'status',status,'completed_at',completed_at,'manifest',manifest) from public.lf_operation_execution where execution_id='LF-AUTOLEARN-RUN-20260831-031'"
          echo "RUN31_EVENTS=$(psql -X -v ON_ERROR_STOP=1 -Atqc "select count(*) from public.lf_eventos where payload->>'execution_id'='LF-AUTOLEARN-RUN-20260831-031'")"
          echo "DB001_FREQUENCY=$(psql -X -v ON_ERROR_STOP=1 -Atqc "select frecuencia from public.lf_error_knowledge where codigo='DB-001'")"
          echo "BACKLOG_AFTER=$(psql -X -v ON_ERROR_STOP=1 -Atqc "with p as (select distinct entidad_codigo::uuid kb_id from public.lf_eventos where entidad_tipo='KNOWLEDGE' and payload->>'producer'='LF_APRENDIZAJE_AUTONOMO' and coalesce(payload->>'eligibility','') like '%PASS%'), c as (select distinct (manifest->>'source_kb_id')::uuid kb_id from public.lf_operation_execution where operation_code='CREACION_CARD_LF' and completed_at is not null and status not like 'BLOCKED%' and coalesce(manifest->>'source_kb_id','') <> '') select count(*) from public.lf_knowledge_base k left join p using(kb_id) left join c using(kb_id) where k.kb_category='COMPETENCIA' and k.consumer_ready=true and k.grounding_status='GROUNDED' and k.decision_upstream='ALLOW_PROD_GATE' and p.kb_id is null and c.kb_id is null")"
          echo "RUN31_READBACK_END"
SQL
