name: SALY creative LF item27 semantic QA PG17

on:
  pull_request:
    paths:
      - 'supabase/migrations/*_lf_saly_creative_lf_item27_semantic_qa_v1.sql'
      - 'supabase/tests/saly_creative_item27_semantic_qa_v1_*'
      - '.github/workflows/saly-creative-item27-semantic-qa-pg17.yml'
  workflow_dispatch:

jobs:
  pg17-item27-semantic-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: lf_item27_semqa_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d lf_item27_semqa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: lf_item27_semqa_test
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Positive and negative exact-migration rollback tests
        run: bash supabase/tests/saly_creative_item27_semantic_qa_v1_pg17.sh
