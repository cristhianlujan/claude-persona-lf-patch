          createdb saly_accent_ci
          export PGDATABASE=saly_accent_ci
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA saly; CREATE SCHEMA extensions;
          CREATE EXTENSION btree_gist WITH SCHEMA extensions;
          CREATE TABLE saly.proyecto(id bigint PRIMARY KEY,codigo text);
          CREATE TABLE saly.decisiones(id bigint PRIMARY KEY);
          CREATE TABLE saly.identity_elements (
            id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            project_id bigint NOT NULL REFERENCES saly.proyecto(id) ON DELETE RESTRICT,
            code text NOT NULL,
            family text NOT NULL CHECK (family IN
              ('COLOR','TYPOGRAPHY','VOICE','LANGUAGE','PATTERN','MOTION','SPACING','LAYOUT','RULE')),
            value_type text NOT NULL CHECK (value_type IN
              ('COLOR','TEXT','NUMBER','BOOLEAN','JSON','ASSET_REF')),
            name text NOT NULL,
            description text,
            is_required boolean NOT NULL DEFAULT false,
            is_protected boolean NOT NULL DEFAULT false,
            status text NOT NULL DEFAULT 'DRAFT'
              CHECK (status IN ('DRAFT','ACTIVE','DEPRECATED')),
            decision_id bigint REFERENCES saly.decisiones(id) ON DELETE RESTRICT,
            metadata jsonb NOT NULL DEFAULT '{}'::jsonb
              CHECK (jsonb_typeof(metadata)='object'),
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now(),
            CONSTRAINT identity_elements_code_format_chk
              CHECK (code ~ '^[a-z][a-z0-9_.-]{1,127}$'),
            CONSTRAINT identity_elements_project_code_uk UNIQUE (project_id,code)
          );
          
          CREATE TABLE saly.identity_versions (
            id bigint GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            element_id bigint NOT NULL REFERENCES saly.identity_elements(id) ON DELETE RESTRICT,
            version_number integer NOT NULL CHECK (version_number > 0),
            channel_code text NOT NULL DEFAULT 'GLOBAL',
            audience_code text NOT NULL DEFAULT 'ALL',
            value_json jsonb NOT NULL,
            approval_status text NOT NULL DEFAULT 'DRAFT'
              CHECK (approval_status IN ('DRAFT','CANDIDATE','APPROVED','REVOKED')),
            valid_from timestamptz,
            valid_to timestamptz,
            decision_id bigint REFERENCES saly.decisiones(id) ON DELETE RESTRICT,
            approval_reference text,
            change_reason text,
            metadata jsonb NOT NULL DEFAULT '{}'::jsonb
              CHECK (jsonb_typeof(metadata)='object'),
            created_at timestamptz NOT NULL DEFAULT now(),
            updated_at timestamptz NOT NULL DEFAULT now(),
            CONSTRAINT identity_versions_context_chk CHECK (
              channel_code ~ '^[A-Z][A-Z0-9_]{1,31}$'
              AND audience_code ~ '^[A-Z][A-Z0-9_]{1,31}$'),
            CONSTRAINT identity_versions_value_chk CHECK (
              jsonb_typeof(value_json)='object' AND value_json ? 'value'),
            CONSTRAINT identity_versions_dates_chk CHECK (
              valid_to IS NULL OR (valid_from IS NOT NULL AND valid_to > valid_from)),
            CONSTRAINT identity_versions_approval_chk CHECK (
              approval_status <> 'APPROVED' OR
              (valid_from IS NOT NULL AND
               (decision_id IS NOT NULL OR nullif(btrim(approval_reference),'') IS NOT NULL))),
            CONSTRAINT identity_versions_number_uk UNIQUE
              (element_id, channel_code, audience_code, version_number)
          );
          
          CREATE UNIQUE INDEX identity_versions_open_approved_uk
          ON saly.identity_versions(element_id,channel_code,audience_code)
          WHERE approval_status='APPROVED' AND valid_to IS NULL;
          
          CREATE INDEX identity_versions_lookup_idx
          ON saly.identity_versions(element_id,channel_code,audience_code,valid_from DESC)
          WHERE approval_status='APPROVED';
          
          ALTER TABLE saly.identity_versions ADD CONSTRAINT identity_versions_no_overlap
          EXCLUDE USING gist (
            element_id extensions.gist_int8_ops WITH =,
            channel_code extensions.gist_text_ops WITH =,
            audience_code extensions.gist_text_ops WITH =,
            tstzrange(valid_from,valid_to,'[)') WITH &&
          ) WHERE (approval_status='APPROVED');
          
          CREATE VIEW saly.v_identity_current WITH (security_invoker=true) AS
          SELECT p.codigo AS project_code, e.code AS element_code, e.family, e.value_type,
                 v.id AS version_id, v.version_number, v.channel_code, v.audience_code,
                 v.value_json, v.valid_from, v.valid_to
          FROM saly.identity_elements e
          JOIN saly.proyecto p ON p.id=e.project_id
          JOIN saly.identity_versions v ON v.element_id=e.id
          WHERE e.status='ACTIVE' AND v.approval_status='APPROVED'
            AND v.valid_from<=now() AND (v.valid_to IS NULL OR now()<v.valid_to);
          SQL
          shopt -s nullglob
          files=(supabase/migrations/*_lf_saly_activate_three_accent_colors_v1.sql)
          test "${#files[@]}" -eq 1
          sed '/^BEGIN;$/d; /^COMMIT;$/d' "${files[0]}" > /tmp/saly_accent_candidate_body.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/saly_activate_three_accent_colors_v1_pg17_rollback.sql
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM saly.identity_elements')" = 0
          test "$(psql -XAt -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM saly.identity_versions')" = 0
          echo PASS_SALY_ACCENT_ROLLBACK
