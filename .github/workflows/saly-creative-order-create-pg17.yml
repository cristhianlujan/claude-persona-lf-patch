name: SALY Creative Order PG17 (isolated)
on:
  pull_request:
    paths:
      - 'supabase/migrations/*_lf_saly_activate_three_accent_colors_v1.sql'
      - 'supabase/tests/saly_activate_three_accent_colors_v1_pg17_rollback.sql'
      - 'supabase/migrations/*_lf_saly_creative_order_rico_intake_v1.sql'
      - 'supabase/tests/saly_creative_order_rico_intake_v1_pg17_rollback.sql'
      - '.github/workflows/saly-creative-order-create-pg17.yml'
      - 'supabase/migrations/*_lf_saly_creative_order_create_v1.sql'
      - 'supabase/tests/saly_creative_order_create_v1_pg17_rollback.sql'
permissions:
  contents: read
jobs:
  pg17-disposable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: saly_creative_order_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_creative_order_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGDATABASE: saly_creative_order_ci
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable substrate from live catalog snapshot
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'saly_creative_order_ci'
          test "$(psql -XAt -c 'SHOW server_version_num' | cut -c1-2)" = '17'
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA saly; CREATE SCHEMA extensions;
          CREATE TABLE saly.proyecto(id bigint PRIMARY KEY);
          CREATE TABLE saly.identity_versions(id bigint PRIMARY KEY);
          CREATE TABLE saly.creative_context_sets (
            id bigint GENERATED BY DEFAULT AS IDENTITY NOT NULL,
            project_id bigint NOT NULL,
            code text NOT NULL,
            version_label text NOT NULL,
            mode text DEFAULT 'EXPLORE'::text NOT NULL,
            state text DEFAULT 'DRAFT'::text NOT NULL,
            sealed_at timestamp with time zone,
            provenance text NOT NULL,
            created_at timestamp with time zone DEFAULT now() NOT NULL,
            CONSTRAINT creative_context_seal_chk CHECK (((state = 'SEALED'::text) = (sealed_at IS NOT NULL))),
            CONSTRAINT creative_context_sets_code_check CHECK ((code ~ '^[A-Z][A-Z0-9_-]{2,63}$'::text)),
            CONSTRAINT creative_context_sets_mode_check CHECK ((mode = 'EXPLORE'::text)),
            CONSTRAINT creative_context_sets_pkey PRIMARY KEY (id),
            CONSTRAINT creative_context_sets_project_id_code_version_label_key UNIQUE (project_id, code, version_label),
            CONSTRAINT creative_context_sets_project_id_fkey FOREIGN KEY (project_id) REFERENCES saly.proyecto(id) ON DELETE RESTRICT,
            CONSTRAINT creative_context_sets_provenance_check CHECK ((length(btrim(provenance)) > 0)),
            CONSTRAINT creative_context_sets_state_check CHECK ((state = ANY (ARRAY['DRAFT'::text, 'SEALED'::text]))),
            CONSTRAINT creative_context_sets_version_label_check CHECK ((length(btrim(version_label)) > 0))
          );
          CREATE TABLE saly.creative_context_tokens (
            context_set_id bigint NOT NULL,
            identity_version_id bigint NOT NULL,
            role text NOT NULL,
            value_sha256 text NOT NULL,
            created_at timestamp with time zone DEFAULT now() NOT NULL,
            CONSTRAINT creative_context_tokens_context_set_id_fkey FOREIGN KEY (context_set_id) REFERENCES saly.creative_context_sets(id) ON DELETE RESTRICT,
            CONSTRAINT creative_context_tokens_identity_version_id_fkey FOREIGN KEY (identity_version_id) REFERENCES saly.identity_versions(id) ON DELETE RESTRICT,
            CONSTRAINT creative_context_tokens_pkey PRIMARY KEY (context_set_id, identity_version_id),
            CONSTRAINT creative_context_tokens_role_check CHECK ((role = ANY (ARRAY['OFFICIAL'::text, 'EXISTING'::text, 'HOME'::text]))),
            CONSTRAINT creative_context_tokens_value_sha256_check CHECK ((value_sha256 ~ '^[0-9a-f]{64}$'::text))
          );
          CREATE TABLE saly.creative_orders (
            id bigint GENERATED BY DEFAULT AS IDENTITY NOT NULL,
            project_id bigint NOT NULL,
            code text NOT NULL,
            request_key text NOT NULL,
            title text NOT NULL,
            request_kind text DEFAULT 'APP_SCREEN_BATCH'::text NOT NULL,
            design_mode text DEFAULT 'EXPLORE'::text NOT NULL,
            requested_by text NOT NULL,
            scope_json jsonb DEFAULT '{}'::jsonb NOT NULL,
            identity_snapshot jsonb DEFAULT '{}'::jsonb NOT NULL,
            status text DEFAULT 'BORRADOR'::text NOT NULL,
            completed_at timestamp with time zone,
            created_at timestamp with time zone DEFAULT now() NOT NULL,
            updated_at timestamp with time zone DEFAULT now() NOT NULL,
            context_set_id bigint,
            CONSTRAINT creative_orders_closure_chk CHECK (((status = ANY (ARRAY['COMPLETADO'::text, 'TERMINADO'::text])) = (completed_at IS NOT NULL))),
            CONSTRAINT creative_orders_code_check CHECK ((code ~ '^[A-Z][A-Z0-9_-]{2,63}$'::text)),
            CONSTRAINT creative_orders_context_set_id_fkey FOREIGN KEY (context_set_id) REFERENCES saly.creative_context_sets(id) ON DELETE RESTRICT,
            CONSTRAINT creative_orders_design_mode_check CHECK ((design_mode = 'EXPLORE'::text)),
            CONSTRAINT creative_orders_identity_snapshot_check CHECK ((jsonb_typeof(identity_snapshot) = 'object'::text)),
            CONSTRAINT creative_orders_pkey PRIMARY KEY (id),
            CONSTRAINT creative_orders_project_id_code_key UNIQUE (project_id, code),
            CONSTRAINT creative_orders_project_id_fkey FOREIGN KEY (project_id) REFERENCES saly.proyecto(id) ON DELETE RESTRICT,
            CONSTRAINT creative_orders_project_id_request_key_key UNIQUE (project_id, request_key),
            CONSTRAINT creative_orders_request_key_check CHECK ((length(btrim(request_key)) > 0)),
            CONSTRAINT creative_orders_request_kind_check CHECK ((request_kind = ANY (ARRAY['APP_SCREEN_BATCH'::text, 'APP_SCREEN_SINGLE'::text]))),
            CONSTRAINT creative_orders_requested_by_check CHECK ((length(btrim(requested_by)) > 0)),
            CONSTRAINT creative_orders_scope_json_check CHECK ((jsonb_typeof(scope_json) = 'object'::text)),
            CONSTRAINT creative_orders_status_check CHECK ((status = ANY (ARRAY['BORRADOR'::text, 'PLANIFICADO'::text, 'EN_PROCESO'::text, 'EN_QA'::text, 'COMPLETADO'::text, 'BLOQUEADO'::text, 'CANCELADO'::text, 'TERMINADO'::text]))),
            CONSTRAINT creative_orders_title_check CHECK ((length(btrim(title)) > 0))
          );
          CREATE TABLE saly.creative_order_items (
            id bigint GENERATED BY DEFAULT AS IDENTITY NOT NULL,
            order_id bigint NOT NULL,
            code text NOT NULL,
            block_code text,
            ordinal integer NOT NULL,
            kind text NOT NULL,
            variant_of_item_id bigint,
            title text NOT NULL,
            required boolean DEFAULT true NOT NULL,
            acceptance_json jsonb DEFAULT '{}'::jsonb NOT NULL,
            context_json jsonb DEFAULT '{}'::jsonb NOT NULL,
            qa_receipt jsonb DEFAULT '{}'::jsonb NOT NULL,
            status text DEFAULT 'PENDIENTE'::text NOT NULL,
            approved_at timestamp with time zone,
            approved_by text,
            created_at timestamp with time zone DEFAULT now() NOT NULL,
            updated_at timestamp with time zone DEFAULT now() NOT NULL,
            CONSTRAINT creative_item_approval_chk CHECK ((((status = 'APROBADO'::text) = (approved_at IS NOT NULL)) AND ((status = 'APROBADO'::text) = (approved_by IS NOT NULL)))),
            CONSTRAINT creative_item_skip_chk CHECK ((NOT (required AND (status = 'OMITIDO'::text)))),
            CONSTRAINT creative_item_variant_chk CHECK (((variant_of_item_id IS NULL) OR ((kind = 'VARIANT'::text) AND (variant_of_item_id <> id)))),
            CONSTRAINT creative_order_items_acceptance_json_check CHECK ((jsonb_typeof(acceptance_json) = 'object'::text)),
            CONSTRAINT creative_order_items_code_check CHECK ((code ~ '^[A-Z][A-Z0-9_-]{1,63}$'::text)),
            CONSTRAINT creative_order_items_context_json_check CHECK ((jsonb_typeof(context_json) = 'object'::text)),
            CONSTRAINT creative_order_items_kind_check CHECK ((kind = ANY (ARRAY['SCREEN'::text, 'VARIANT'::text]))),
            CONSTRAINT creative_order_items_order_id_code_key UNIQUE (order_id, code),
            CONSTRAINT creative_order_items_order_id_fkey FOREIGN KEY (order_id) REFERENCES saly.creative_orders(id) ON DELETE RESTRICT,
            CONSTRAINT creative_order_items_order_id_id_key UNIQUE (order_id, id),
            CONSTRAINT creative_order_items_order_id_ordinal_key UNIQUE (order_id, ordinal),
            CONSTRAINT creative_order_items_order_id_variant_of_item_id_fkey FOREIGN KEY (order_id, variant_of_item_id) REFERENCES saly.creative_order_items(order_id, id) ON DELETE RESTRICT,
            CONSTRAINT creative_order_items_ordinal_check CHECK ((ordinal > 0)),
            CONSTRAINT creative_order_items_pkey PRIMARY KEY (id),
            CONSTRAINT creative_order_items_qa_receipt_check CHECK ((jsonb_typeof(qa_receipt) = 'object'::text)),
            CONSTRAINT creative_order_items_status_check CHECK ((status = ANY (ARRAY['PENDIENTE'::text, 'LISTO'::text, 'PRODUCIENDO'::text, 'EN_QA'::text, 'APROBADO'::text, 'BLOQUEADO'::text, 'OMITIDO'::text, 'TERMINADO'::text]))),
            CONSTRAINT creative_order_items_title_check CHECK ((length(btrim(title)) > 0))
          );
          CREATE TABLE saly.creative_order_sequence_v1 (
            id bigint GENERATED BY DEFAULT AS IDENTITY NOT NULL,
            project_id bigint NOT NULL,
            order_id bigint NOT NULL,
            depends_on_order_id bigint NOT NULL,
            created_at timestamp with time zone DEFAULT now() NOT NULL,
            CONSTRAINT creative_order_sequence_v1_check CHECK ((order_id <> depends_on_order_id)),
            CONSTRAINT creative_order_sequence_v1_depends_on_order_id_fkey FOREIGN KEY (depends_on_order_id) REFERENCES saly.creative_orders(id) ON DELETE RESTRICT,
            CONSTRAINT creative_order_sequence_v1_depends_on_order_id_key UNIQUE (depends_on_order_id),
            CONSTRAINT creative_order_sequence_v1_order_id_fkey FOREIGN KEY (order_id) REFERENCES saly.creative_orders(id) ON DELETE RESTRICT,
            CONSTRAINT creative_order_sequence_v1_order_id_key UNIQUE (order_id),
            CONSTRAINT creative_order_sequence_v1_pkey PRIMARY KEY (id),
            CONSTRAINT creative_order_sequence_v1_project_id_fkey FOREIGN KEY (project_id) REFERENCES saly.proyecto(id) ON DELETE RESTRICT
          );
          CREATE OR REPLACE FUNCTION saly.creative_intake_semantic_gate_v1()
           RETURNS trigger
           LANGUAGE plpgsql
           SET search_path TO 'pg_catalog', 'saly', 'extensions', 'pg_temp'
          AS $function$
          BEGIN
            IF NEW.request_kind IS DISTINCT FROM 'APP_SCREEN_SINGLE' THEN RETURN NEW; END IF;
            IF NEW.status='BORRADOR' THEN RETURN NEW; END IF;
            IF nullif(btrim(NEW.scope_json->>'literal_request'),'') IS NULL
            THEN RAISE EXCEPTION 'CREATIVE_INTAKE_ORIGINAL_VISUAL_LITERAL_MISSING'; END IF;
            RETURN NEW;
          END $function$
          ;
          CREATE OR REPLACE FUNCTION saly.creative_item_guard_l1()
           RETURNS trigger
           LANGUAGE plpgsql
           SET search_path TO 'pg_catalog', 'saly'
          AS $function$
          DECLARE v_order_status text; v_run record; v_run_id text;
          BEGIN
           SELECT status INTO v_order_status FROM saly.creative_orders WHERE id=NEW.order_id FOR UPDATE;
           IF v_order_status IN ('COMPLETADO','CANCELADO')
           THEN RAISE EXCEPTION 'CREATIVE_CLOSED_ORDER_IMMUTABLE_ITEMS'; END IF;
           IF TG_OP='UPDATE' AND OLD.status='APROBADO'
           THEN RAISE EXCEPTION 'CREATIVE_APPROVED_ITEM_IMMUTABLE'; END IF;
           -- Original input and interpretation cannot be silently replaced after capture.
           IF TG_OP='UPDATE' AND OLD.acceptance_json ? 'semantic_qa'
              AND NEW.acceptance_json->'semantic_qa' IS DISTINCT FROM OLD.acceptance_json->'semantic_qa'
           THEN RAISE EXCEPTION 'CREATIVE_SEMANTIC_CONTRACT_IMMUTABLE'; END IF;
           IF TG_OP='UPDATE' AND OLD.status='TERMINADO' AND NEW.status='APROBADO' THEN
             IF NEW.approved_at IS NULL OR NEW.approved_by IS DISTINCT FROM auth.uid()::text
                OR auth.uid() IS NULL
                OR NOT EXISTS (SELECT 1 FROM saly.creative_owner_decisions_v1 d
                    WHERE d.item_id=NEW.id AND d.owner_uid=auth.uid() AND d.decision='APROBADO')
                OR NOT EXISTS (SELECT 1 FROM saly.creative_owner_accounts_v1 a
                    JOIN saly.creative_orders o ON o.requested_by=a.requested_by
                    WHERE o.id=NEW.order_id AND a.owner_uid=auth.uid())
             THEN RAISE EXCEPTION 'SALY_OWNER_APPROVAL_NOT_AUTHORIZED'; END IF;
             RETURN NEW;
           END IF;
           IF NEW.status IN ('TERMINADO','APROBADO')
           AND (TG_OP='INSERT' OR OLD.status IS DISTINCT FROM NEW.status) THEN
             IF TG_OP='INSERT' OR OLD.status<>'EN_QA'
             THEN RAISE EXCEPTION 'CREATIVE_ITEM_NOT_IN_QA'; END IF;
             IF EXISTS (
                SELECT 1 FROM saly.creative_item_dependencies d
                JOIN saly.creative_order_items prereq ON prereq.id=d.depends_on_item_id
                WHERE d.order_id=NEW.order_id AND d.item_id=NEW.id AND prereq.status NOT IN ('TERMINADO','APROBADO')
             ) THEN RAISE EXCEPTION 'CREATIVE_DEPENDENCY_NOT_APPROVED'; END IF;
             v_run_id:=NEW.qa_receipt->>'run_id';
             IF v_run_id IS NULL OR v_run_id !~ '^[0-9]+$'
                OR (NEW.qa_receipt->>'verdict') IS DISTINCT FROM 'PASS'
                OR jsonb_typeof(NEW.qa_receipt->'reviewer_ref') IS DISTINCT FROM 'string'
                OR nullif(btrim(NEW.qa_receipt->>'reviewer_ref'),'') IS NULL
             THEN RAISE EXCEPTION 'CREATIVE_QA_RECEIPT_MISSING'; END IF;
             SELECT r.id,r.worker_ref,r.input_snapshot,r.output_evidence INTO v_run
             FROM saly.creative_runs r
             WHERE r.id=v_run_id::bigint AND r.item_id=NEW.id AND r.order_id=NEW.order_id
               AND r.state='EXITOSO' AND nullif(r.output_evidence->>'artifact_ref','') IS NOT NULL
               AND NOT EXISTS (SELECT 1 FROM saly.creative_runs newer
                 WHERE newer.item_id=r.item_id AND newer.attempt_number>r.attempt_number);
             IF NEW.status='TERMINADO' AND NOT EXISTS (
               SELECT 1 FROM saly.creative_run_detection_v1 d
               WHERE d.run_id=v_run_id::bigint AND d.item_id=NEW.id AND d.order_id=NEW.order_id
                 AND d.artifact_sha256=v_run.output_evidence->>'sha256'
             ) THEN RAISE EXCEPTION 'SALY_ITEM_TERMINADO_REQUIRES_TIMER_DETECTION'; END IF;
             IF NOT FOUND OR lower(btrim(NEW.qa_receipt->>'reviewer_ref'))=lower(btrim(v_run.worker_ref))
                OR (NEW.status='TERMINADO' AND (NEW.approved_by IS NOT NULL OR NEW.approved_at IS NOT NULL))
                OR (NEW.status='APROBADO' AND NEW.approved_by IS DISTINCT FROM NEW.qa_receipt->>'reviewer_ref')
             THEN RAISE EXCEPTION 'CREATIVE_QA_NOT_INDEPENDENT_OR_RUN_MISSING'; END IF;
             IF NEW.acceptance_json ? 'semantic_qa' THEN
               IF v_run.input_snapshot#>'{visual_contract,qa_checks}' IS DISTINCT FROM
                  saly.creative_item_visual_contract_l3b(NEW.id)#>'{contract,qa_checks}'
               THEN RAISE EXCEPTION 'CREATIVE_TECHNICAL_CHECK_EXPECTATIONS_MISMATCH'; END IF;
               PERFORM saly.creative_assert_dual_qa_l3c(
                  NEW.acceptance_json,NEW.qa_receipt,v_run.input_snapshot,v_run.output_evidence);
             END IF;
           END IF;
           RETURN NEW;
          END $function$
          ;
          CREATE OR REPLACE FUNCTION saly.creative_order_close_guard_l1()
           RETURNS trigger
           LANGUAGE plpgsql
           SET search_path TO 'pg_catalog', 'saly'
          AS $function$
          BEGIN
           IF NEW.status='COMPLETADO' AND (TG_OP='INSERT' OR OLD.status IS DISTINCT FROM NEW.status) THEN
             IF EXISTS(SELECT 1 FROM saly.creative_runs r WHERE r.order_id=NEW.id
                AND r.state IN ('EN_COLA','EJECUTANDO'))
             THEN RAISE EXCEPTION 'CREATIVE_ORDER_CLOSURE_WITH_ACTIVE_RUNS'; END IF;
             IF NOT EXISTS (SELECT 1 FROM saly.creative_order_items i
                            WHERE i.order_id=NEW.id AND i.required)
                OR EXISTS (SELECT 1 FROM saly.creative_order_items i WHERE i.order_id=NEW.id
                           AND (i.status NOT IN ('TERMINADO','APROBADO','OMITIDO')
                            OR (i.required AND i.status NOT IN ('TERMINADO','APROBADO'))))
             THEN RAISE EXCEPTION 'CREATIVE_ORDER_CLOSURE_WITH_INCOMPLETE_DETAILS'; END IF;
           END IF;
           IF TG_OP='UPDATE' AND OLD.status='COMPLETADO'
           THEN RAISE EXCEPTION 'CREATIVE_COMPLETED_ORDER_IMMUTABLE'; END IF;
           RETURN NEW;
          END $function$
          ;
          CREATE OR REPLACE FUNCTION saly.creative_order_context_guard_l2a()
           RETURNS trigger
           LANGUAGE plpgsql
           SET search_path TO 'pg_catalog', 'saly'
          AS $function$
          DECLARE v_context record; v_tokens jsonb;
          BEGIN
           IF TG_OP='UPDATE' THEN
             IF OLD.status<>'BORRADOR'
                AND (NEW.context_set_id IS DISTINCT FROM OLD.context_set_id
                 OR NEW.identity_snapshot IS DISTINCT FROM OLD.identity_snapshot)
             THEN RAISE EXCEPTION 'CREATIVE_ORDER_CONTEXT_FROZEN'; END IF;
           END IF;
           IF NEW.status<>'BORRADOR' THEN
            SELECT project_id,mode,state INTO v_context FROM saly.creative_context_sets
            WHERE id=NEW.context_set_id;
            IF NOT FOUND OR v_context.project_id<>NEW.project_id
             OR v_context.mode<>NEW.design_mode OR v_context.state<>'SEALED'
            THEN RAISE EXCEPTION 'CREATIVE_ORDER_CONTEXT_NOT_SEALED'; END IF;
            IF TG_OP='INSERT' THEN
              SELECT jsonb_agg(jsonb_build_object('version_id',identity_version_id,
                'sha256',value_sha256,'role',role) ORDER BY identity_version_id)
              INTO v_tokens
              FROM saly.creative_context_tokens WHERE context_set_id=NEW.context_set_id;
              NEW.identity_snapshot:=jsonb_build_object('context_set_id',NEW.context_set_id,
                'selected_versions',v_tokens);
            ELSIF OLD.status='BORRADOR' THEN
              SELECT jsonb_agg(jsonb_build_object('version_id',identity_version_id,
                'sha256',value_sha256,'role',role) ORDER BY identity_version_id)
              INTO v_tokens
              FROM saly.creative_context_tokens WHERE context_set_id=NEW.context_set_id;
              NEW.identity_snapshot:=jsonb_build_object('context_set_id',NEW.context_set_id,
                'selected_versions',v_tokens);
            END IF;
           END IF;
           RETURN NEW;
          END $function$
          ;
          CREATE OR REPLACE FUNCTION saly.creative_order_sequence_start_guard_v1()
           RETURNS trigger
           LANGUAGE plpgsql
           SET search_path TO 'pg_catalog', 'saly', 'pg_temp'
          AS $function$
          DECLARE target_id bigint; entering boolean;
          BEGIN
           IF TG_TABLE_NAME='creative_orders' THEN
            target_id:=NEW.id;
            entering:=NEW.status IN ('EN_PROCESO','EN_QA','COMPLETADO','TERMINADO')
              AND (TG_OP='INSERT' OR NEW.status IS DISTINCT FROM OLD.status);
           ELSE
            target_id:=NEW.order_id;
            entering:=NEW.state IN ('EN_COLA','EJECUTANDO','EXITOSO');
           END IF;
           IF entering AND EXISTS(SELECT 1 FROM saly.creative_order_sequence_v1 seq
             JOIN saly.creative_orders prior ON prior.id=seq.depends_on_order_id
             WHERE seq.order_id=target_id AND prior.status<>'TERMINADO')
           THEN RAISE EXCEPTION 'CREATIVE_ORDER_PREREQUISITE_NOT_TERMINADO'; END IF;
           RETURN NEW;
          END $function$
          ;
          CREATE OR REPLACE FUNCTION saly.creative_single_screen_item_guard_v1()
           RETURNS trigger
           LANGUAGE plpgsql
           SET search_path TO 'pg_catalog', 'saly', 'pg_temp'
          AS $function$
          DECLARE kind_of_order text;
          BEGIN
           SELECT request_kind INTO kind_of_order FROM saly.creative_orders
           WHERE id=NEW.order_id FOR UPDATE;
           IF kind_of_order IS DISTINCT FROM 'APP_SCREEN_SINGLE' THEN RETURN NEW; END IF;
           IF NEW.kind IS DISTINCT FROM 'SCREEN' OR NEW.ordinal IS DISTINCT FROM 1
           OR NEW.variant_of_item_id IS NOT NULL
           THEN RAISE EXCEPTION 'CREATIVE_SINGLE_SCREEN_ITEM_SHAPE'; END IF;
           IF TG_OP='UPDATE' AND (NEW.id IS DISTINCT FROM OLD.id
            OR NEW.order_id IS DISTINCT FROM OLD.order_id
            OR NEW.code IS DISTINCT FROM OLD.code)
           THEN RAISE EXCEPTION 'CREATIVE_SINGLE_SCREEN_ITEM_BINDING_IMMUTABLE'; END IF;
           IF TG_OP='INSERT' AND EXISTS (SELECT 1 FROM saly.creative_order_items
             WHERE order_id=NEW.order_id)
           THEN RAISE EXCEPTION 'CREATIVE_SINGLE_SCREEN_MULTIPLE_ITEMS'; END IF;
           RETURN NEW;
          END $function$
          ;
          CREATE TRIGGER trg_creative_00_intake_semantic_gate_v1 BEFORE INSERT OR UPDATE OF status, scope_json ON saly.creative_orders FOR EACH ROW EXECUTE FUNCTION saly.creative_intake_semantic_gate_v1();
          CREATE TRIGGER trg_creative_00_order_sequence_start_guard_v1 BEFORE UPDATE OF status ON saly.creative_orders FOR EACH ROW EXECUTE FUNCTION saly.creative_order_sequence_start_guard_v1();
          CREATE TRIGGER trg_creative_order_close_guard_l1 BEFORE INSERT OR UPDATE ON saly.creative_orders FOR EACH ROW EXECUTE FUNCTION saly.creative_order_close_guard_l1();
          CREATE TRIGGER trg_creative_order_context_guard_l2a BEFORE INSERT OR UPDATE ON saly.creative_orders FOR EACH ROW EXECUTE FUNCTION saly.creative_order_context_guard_l2a();
          CREATE TRIGGER trg_creative_00_single_screen_item_guard_v1 BEFORE INSERT OR UPDATE ON saly.creative_order_items FOR EACH ROW EXECUTE FUNCTION saly.creative_single_screen_item_guard_v1();
          CREATE TRIGGER trg_creative_item_guard_l1 BEFORE INSERT OR UPDATE ON saly.creative_order_items FOR EACH ROW EXECUTE FUNCTION saly.creative_item_guard_l1();
          SQL
      - name: Apply governed function migration
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*_lf_saly_creative_order_create_v1.sql)
          test "${#files[@]}" -eq 1
          psql -X -v ON_ERROR_STOP=1 -f "${files[0]}"
      - name: Positive and negative rollback
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/saly_creative_order_create_v1_pg17_rollback.sql
      - name: Verify empty tables
        shell: bash
        run: |
          set -euo pipefail
          for t in creative_context_sets creative_context_tokens creative_orders creative_order_items creative_order_sequence_v1; do
            test "$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM saly.$t")" = 0
          done
          echo PASS_SALY_CREATIVE_ORDER_PG17_DISPOSABLE
      - name: Test exact new order migration body with rollback
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*_lf_saly_creative_order_rico_intake_v1.sql)
          test "${#files[@]}" -eq 1
          sed '/^BEGIN;$/d; /^COMMIT;$/d' "${files[0]}" > /tmp/saly_creative_rico_candidate_body.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/saly_creative_order_rico_intake_v1_pg17_rollback.sql
          for table in creative_context_sets creative_context_tokens creative_orders creative_order_items creative_order_sequence_v1; do
            test "$(psql -XAt -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM saly.$table")" = 0
          done
          echo PASS_SALY_RICO_ROLLBACK
      - name: Three SALY accent colors rollback with live identity DDL
        shell: bash
        run: |
