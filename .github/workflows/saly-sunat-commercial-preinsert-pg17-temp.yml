name: SALY SUNAT commercial preinsert PG17 temporary
on:
  push:
    branches: [saly/sunat-commercial-preinsert-guard-20261123]
    paths:
      - '.github/workflows/saly-sunat-commercial-preinsert-pg17-temp.yml'
      - 'supabase/migrations/20261123011000_lf_saly_sunat_commercial_preinsert_guard_v1.sql'
      - 'supabase/tests/saly_sunat_commercial_preinsert_pg17.sql'
permissions:
  contents: read
jobs:
  disposable-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_sunat_commercial_guard_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_sunat_commercial_guard_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saly_sunat_commercial_guard_test
    steps:
      - uses: actions/checkout@v4
      - name: Isolated PG17 validation
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = saly_sunat_commercial_guard_test
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num;' | cut -c1-2)" = 17
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/saly_sunat_commercial_preinsert_pg17.sql 2>&1 | tee /tmp/saly_pg17_sunat_guard.log
          grep -q PASS_SUNAT_EARLY_AND_DB_COMMERCIAL_GUARD_PTE_SAFE_50_VALID_49_NULL_BAD_STATUS_NO_HABIDO_DUPLICATE_OLD_RUN /tmp/saly_pg17_sunat_guard.log
          grep -q PASS_SUNAT_COMMERCIAL_PREINSERT_PG17_ROLLBACK /tmp/saly_pg17_sunat_guard.log
          echo PASS_COMMERCIAL_SUNAT_PREINSERT_GUARD_PG17
