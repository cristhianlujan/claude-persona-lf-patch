name: TEMP PG17 queue binding isolated test
on:
  pull_request:
    paths:
      - 'sandbox/creative_factory/queue_v02/**'
      - '.github/workflows/saly-creative-queue-pg17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  binding-pg17:
    runs-on: ubuntu-latest
    container:
      image: postgres:17
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_queue_test
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saly_queue_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -X -v ON_ERROR_STOP=1 -At -c "show server_version" | grep '^17\\.'
      - run: bash sandbox/creative_factory/queue_v02/test_pg17.sh
