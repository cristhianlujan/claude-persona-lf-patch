name: LF GitHub Reconciliation V3

on:
  workflow_run:
    workflows: ["lf-contract-check"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: lf-github-reconcile-v3-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Download authoritative audit artifact
        uses: actions/download-artifact@v4
        with:
          name: r8-continuous-audit-${{ github.event.workflow_run.id }}
          path: .reconciliation-audit
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Capture source run, merged PR and branch protection
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            const pullsResponse = await github.request(
              'GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls',
              {
                owner,
                repo,
                commit_sha: run.head_sha,
                headers: { accept: 'application/vnd.github+json' },
              },
            );
            const mergedPr = pullsResponse.data.find(
              (pr) => Boolean(pr.merged_at) && pr.merge_commit_sha === run.head_sha,
            ) ?? null;

            let branchProtectionStatus = 'NOT_AUDITABLE_EXTERNAL';
            let branchProtectionDetails = {};
            try {
              const rulesResponse = await github.request(
                'GET /repos/{owner}/{repo}/rules/branches/{branch}',
                {
                  owner,
                  repo,
                  branch: 'main',
                  headers: { accept: 'application/vnd.github+json' },
                },
              );
              const rules = Array.isArray(rulesResponse.data) ? rulesResponse.data : [];
              const requiredChecks = new Set();
              const requiredWorkflowPaths = new Set();
              let strictStatusChecks = false;
              const pullRequestRules = [];

              for (const rule of rules) {
                const parameters = rule.parameters ?? {};
                if (rule.type === 'required_status_checks') {
                  strictStatusChecks ||= parameters.strict_required_status_checks_policy === true;
                  for (const check of parameters.required_status_checks ?? []) {
                    if (check?.context) requiredChecks.add(check.context);
                  }
                }
                if (rule.type === 'workflows') {
                  for (const workflow of parameters.workflows ?? []) {
                    if (workflow?.path) requiredWorkflowPaths.add(workflow.path);
                  }
                }
                if (rule.type === 'pull_request') {
                  pullRequestRules.push(rule);
                }
              }

              const rulesetIds = [...new Set(
                rules
                  .map((rule) => Number(rule.ruleset_id ?? 0))
                  .filter((rulesetId) => rulesetId > 0),
              )];
              let bypassActorsAuditable = rulesetIds.length > 0;
              const bypassActors = [];
              const rulesetReadback = [];
              for (const rulesetId of rulesetIds) {
                try {
                  const rulesetResponse = await github.request(
                    'GET /repos/{owner}/{repo}/rulesets/{ruleset_id}',
                    {
                      owner,
                      repo,
                      ruleset_id: rulesetId,
                      includes_parents: true,
                      headers: { accept: 'application/vnd.github+json' },
                    },
                  );
                  const ruleset = rulesetResponse.data;
                  if (!Array.isArray(ruleset.bypass_actors)) {
                    bypassActorsAuditable = false;
                  } else {
                    bypassActors.push(...ruleset.bypass_actors);
                  }
                  rulesetReadback.push({
                    id: Number(ruleset.id),
                    name: ruleset.name,
                    enforcement: ruleset.enforcement,
                    source_type: ruleset.source_type,
                    bypass_actor_count: Array.isArray(ruleset.bypass_actors)
                      ? ruleset.bypass_actors.length
                      : null,
                  });
                } catch (error) {
                  bypassActorsAuditable = false;
                  rulesetReadback.push({
                    id: rulesetId,
                    error_status: error?.status ?? 0,
                    error_message: String(error?.message ?? error).slice(0, 300),
                  });
                }
              }

              const lfContractCheckRequired =
                requiredChecks.has('lf-contract-check') ||
                [...requiredWorkflowPaths].some(
                  (path) => path === '.github/workflows/lf-contract-check.yml',
                );
              const soloBuilderReviewPolicy =
                pullRequestRules.length > 0 &&
                pullRequestRules.every(
                  (rule) =>
                    Number(rule.parameters?.required_approving_review_count ?? -1) === 0,
                );
              const criteria = {
                active_rules_present: rules.length > 0,
                lf_contract_check_required: lfContractCheckRequired,
                strict_status_checks: strictStatusChecks,
                solo_builder_review_policy: soloBuilderReviewPolicy,
                non_fast_forward: rules.some((rule) => rule.type === 'non_fast_forward'),
                deletions_blocked: rules.some((rule) => rule.type === 'deletion'),
                bypass_actors_auditable: bypassActorsAuditable,
                bypass_actors_empty: bypassActorsAuditable && bypassActors.length === 0,
              };

              if (rules.length === 0) {
                branchProtectionStatus = 'NOT_CONFIGURED';
              } else if (!bypassActorsAuditable) {
                branchProtectionStatus = 'NOT_AUDITABLE_EXTERNAL';
              } else {
                branchProtectionStatus = Object.values(criteria).every(Boolean)
                  ? 'VERIFIED'
                  : 'FAILED';
              }
              branchProtectionDetails = {
                source: 'GET /repos/{owner}/{repo}/rules/branches/{branch}',
                criteria,
                required_checks: [...requiredChecks].sort(),
                required_workflow_paths: [...requiredWorkflowPaths].sort(),
                review_policy: {
                  model: 'SOLO_BUILDER',
                  required_approving_review_count: 0,
                },
                active_rule_types: [...new Set(rules.map((rule) => rule.type))].sort(),
                ruleset_readback: rulesetReadback,
              };
            } catch (error) {
              const status = error?.status ?? 0;
              branchProtectionStatus = status === 404 ? 'NOT_CONFIGURED' : 'NOT_AUDITABLE_EXTERNAL';
              branchProtectionDetails = {
                source: 'GET /repos/{owner}/{repo}/rules/branches/{branch}',
                http_status: status,
                message: String(error?.message ?? error).slice(0, 500),
              };
            }

            const metadata = {
              source: {
                id: Number(run.id),
                name: run.name,
                event: run.event,
                head_sha: run.head_sha,
                head_branch: run.head_branch,
                conclusion: run.conclusion,
                updated_at: run.updated_at,
                html_url: run.html_url,
              },
              pull_request: mergedPr
                ? {
                    number: Number(mergedPr.number),
                    state: 'MERGED',
                    merged: true,
                    merge_commit_sha: mergedPr.merge_commit_sha,
                  }
                : {
                    number: null,
                    state: 'UNKNOWN',
                    merged: false,
                    merge_commit_sha: null,
                  },
              branch_protection_status: branchProtectionStatus,
              branch_protection_details: branchProtectionDetails,
            };
            fs.writeFileSync('github-metadata.json', JSON.stringify(metadata));

      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('lf-supabase-github-reconcile-v3');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Fetch governed artifact inventory
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"inventory"}' \
            "https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-github-reconcile-v3" \
            -o governed-inventory.json
          jq '{repository, artifact_count: (.inventory | length)}' governed-inventory.json

      - name: Build reconciliation request
        env:
          RECONCILIATION_WORKFLOW_RUN_ID: ${{ github.run_id }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          audit_root = pathlib.Path('.reconciliation-audit')
          manifests = list(audit_root.rglob('reconciliation-manifest-v3.json'))
          if len(manifests) != 1:
              raise SystemExit(f'expected exactly one reconciliation manifest, found {len(manifests)}')
          manifest_path = manifests[0]
          manifest_bytes = manifest_path.read_bytes()
          manifest = json.loads(manifest_bytes)
          metadata = json.loads(pathlib.Path('github-metadata.json').read_text())
          inventory_response = json.loads(pathlib.Path('governed-inventory.json').read_text())
          inventory = inventory_response['inventory']

          source_head_sha = os.environ['SOURCE_HEAD_SHA']
          source_run_id = int(os.environ['SOURCE_WORKFLOW_RUN_ID'])
          if manifest.get('schema_version') != 'lf-reconciliation-manifest/v3':
              raise SystemExit('unexpected reconciliation manifest schema')
          if manifest.get('commit_sha') != source_head_sha:
              raise SystemExit('manifest commit does not match source workflow head SHA')
          if int(manifest.get('workflow_run_id', -1)) != source_run_id:
              raise SystemExit('manifest workflow run ID does not match source workflow')
          if manifest.get('workflow_event') != 'push':
              raise SystemExit('manifest was not produced by a push workflow')

          touched = set(
              subprocess.check_output(
                  ['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', '--first-parent', source_head_sha],
                  text=True,
              ).splitlines()
          )
          manifest_files = manifest.get('files', {})
          artifacts = []
          for item in inventory:
              artifact_id = int(item['artifact_id'])
              relative_path = item['relative_path']
              skill_code = item['skill_code']
              repository_path = (
                  relative_path
                  if relative_path.startswith('skills/')
                  else f'skills/{skill_code}/{relative_path}'
              )
              evidence = manifest_files.get(repository_path)
              expected_sha = item['current_content_sha256']
              audit_covered = bool(
                  evidence
                  and evidence.get('sha256') == expected_sha
                  and isinstance(evidence.get('git_blob'), str)
                  and len(evidence.get('git_blob')) == 40
              )
              artifacts.append(
                  {
                      'artifact_id': artifact_id,
                      'relative_path': relative_path,
                      'repository_path': repository_path,
                      'sha256': evidence.get('sha256') if evidence else None,
                      'git_blob': evidence.get('git_blob') if evidence else None,
                      'file_touched_by_merge': repository_path in touched,
                      'audit_covered': audit_covered,
                  }
              )

          request = {
              'action': 'reconcile',
              'reconciliation_workflow_run_id': int(os.environ['RECONCILIATION_WORKFLOW_RUN_ID']),
              **metadata,
              'audit_artifact_name': f'r8-continuous-audit-{source_run_id}',
              'audit_manifest_sha256': hashlib.sha256(manifest_bytes).hexdigest(),
              'artifacts': artifacts,
          }
          pathlib.Path('reconciliation-request.json').write_text(
              json.dumps(request, sort_keys=True, separators=(',', ':')),
              encoding='utf-8',
          )
          print(
              json.dumps(
                  {
                      'artifacts': len(artifacts),
                      'audit_covered': sum(1 for artifact in artifacts if artifact['audit_covered']),
                      'touched': sum(1 for artifact in artifacts if artifact['file_touched_by_merge']),
                      'branch_protection_status': metadata['branch_protection_status'],
                      'merged_pr': metadata['pull_request']['merged'],
                  },
                  sort_keys=True,
              )
          )
          PY

      - name: Persist reconciliation and test evidence
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @reconciliation-request.json \
            "https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/lf-github-reconcile-v3" \
            -o reconciliation-response.json
          jq '{execution_id, artifacts_expected, artifacts_reported, pass_count, fail_count, promoted_artifact_ids, promotion_pending_artifact_ids}' reconciliation-response.json
