name: IG M10.5 CP2 Producer Logic
on:
  pull_request:
    paths:
      - 'sandbox/lf_contract_gate_test/engineering_checkpoints/m10_5/dispatch_vnext_cohort.py'
      - 'sandbox/lf_contract_gate_test/engineering_checkpoints/m10_5/test_dispatch_vnext_cohort.py'
      - '.github/workflows/ig-m105-cp2-producer-tests.yml'
      - 'sandbox/lf_contract_gate_test/engineering_checkpoints/m10_5/new_runs_vnext.py'
      - 'sandbox/lf_contract_gate_test/engineering_checkpoints/m10_5/test_new_runs_vnext_live.py'
permissions:
  contents: read
jobs:
  cp2-bounded-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Run positive and negative CP2 transport logic tests
        run: python3 -m unittest discover -s sandbox/lf_contract_gate_test/engineering_checkpoints/m10_5 -p 'test_*vnext*.py' -v
