name: S26 Cloudflare Active Route Qualification

on:
  pull_request:
    paths:
      - ".github/workflows/s26-holdout-manifest.yml"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_model_download_guard.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_fresh_qualification.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_cloudflare_fresh_canonical_plan_v1.json"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/s26_runtime_route_v1.json"

permissions:
  contents: read

jobs:
  s26-cloudflare-active-route:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S26_AUTHORITY_REF: fcc2b0d57e36a31c26f38acc2510b193aac988c8
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_AI_CANARY_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
      LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
      LF_S26_CLOUDFLARE_PLAN: WORKERS_FREE_ZERO_COST_ONLY
      LF_S26_PAID_FALLBACK: DISABLED
      LF_S26_LOCAL_FALLBACK: DISABLED
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enforce S26 remote-runtime no-download guard
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_model_download_guard.py --repo-root .

      - name: Checkout frozen S26 authority
        uses: actions/checkout@v4
        with:
          ref: ${{ env.S26_AUTHORITY_REF }}
          path: s26-authority
          fetch-depth: 1

      - name: Preflight canonical dependency
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
          python3 - <<'PY'
          import importlib.metadata
          observed=importlib.metadata.version('jsonschema')
          if observed!='4.26.0':
              raise SystemExit('S26_JSONSCHEMA_VERSION_MISMATCH:'+observed)
          from jsonschema import Draft202012Validator
          print('S26_JSONSCHEMA_PREFLIGHT_PASS version='+observed)
          PY

      - name: Execute fresh one-shot Cloudflare qualification
        env:
          S26_AUTHORITY_ROOT: ${{ github.workspace }}/s26-authority
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_fresh_qualification.py \
            --result-path "$GITHUB_WORKSPACE/s26-cloudflare-fresh-result.json"

      - name: Verify active-route safety markers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          p=json.load(open('s26-cloudflare-fresh-result.json',encoding='utf-8'))
          if p.get('provider')!='cloudflare_workers_ai': raise SystemExit('FAIL_PROVIDER')
          if p.get('paid_fallback_used') is not False: raise SystemExit('FAIL_PAID_FALLBACK')
          if p.get('local_model_fallback_used') is not False: raise SystemExit('FAIL_LOCAL_FALLBACK')
          if p.get('primary_floor_pass') is not True: raise SystemExit('FAIL_PRIMARY_FLOOR')
          if p.get('promotion_authorized') is not False: raise SystemExit('FAIL_SCOPE_PROMOTION')
          if p.get('production_mutation') is not False: raise SystemExit('FAIL_SCOPE_PRODUCTION')
          print('CLOUDFLARE_ROUTE_ACTIVE=PASS')
          print('CLOUDFLARE_FREE_ONLY=PASS')
          print('S26_MODEL_DOWNLOAD_GUARD=PASS')
          print('ACTIVE_S26_GGUF_DOWNLOAD_PATHS=0')
          print('LOCAL_GGUF_FALLBACK_DISABLED=PASS')
          print('PAID_FALLBACK_DISABLED=PASS')
          print('FRESH_CONTRACT_GATE=PASS')
          print('FRESH_SEMANTIC_GATE=PASS')
          print('INDEPENDENT_JUDGE=PENDING_NO_DOWNLOAD_PATH')
          PY

      - name: Upload durable Cloudflare qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s26-cloudflare-active-route-${{ github.run_id }}
          path: s26-cloudflare-fresh-result.json
          if-no-files-found: error
          retention-days: 30
