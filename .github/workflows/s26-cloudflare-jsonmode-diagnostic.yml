name: S26 Cloudflare JSON-mode diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsonmode-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_AI_CANARY_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S26_AUTHORITY_REF: fcc2b0d57e36a31c26f38acc2510b193aac988c8
    steps:
      - name: Checkout diagnostic branch
        uses: actions/checkout@v4

      - name: Checkout pinned S26 authority read-only
        uses: actions/checkout@v4
        with:
          repository: cristhianlujan/claude-persona-lf-patch
          ref: ${{ env.S26_AUTHORITY_REF }}
          path: s26-authority

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Preflight dependencies and syntax
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_AI_CANARY_TOKEN}" || { echo 'Missing CLOUDFLARE_AI_CANARY_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
          python3 -m py_compile \
            sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_jsonmode_diagnostic.py \
            sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_holdout_manifest.py \
            s26-authority/sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_primary_candidate_holdout_manifest.py

      - name: Repeat exact frozen payment holdout three times without tuning
        shell: bash
        env:
          S26_AUTHORITY_ROOT: ${{ github.workspace }}/s26-authority
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_jsonmode_diagnostic.py \
            --result-path "$GITHUB_WORKSPACE/s26-cloudflare-jsonmode-diagnostic-result.json" \
            | tee "$RUNNER_TEMP/s26-cloudflare-jsonmode-diagnostic.log"

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s26-cloudflare-jsonmode-diagnostic-${{ github.run_id }}
          path: |
            s26-cloudflare-jsonmode-diagnostic-result.json
            ${{ runner.temp }}/s26-cloudflare-jsonmode-diagnostic.log
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          if [[ -f s26-cloudflare-jsonmode-diagnostic-result.json ]]; then
            {
              echo '## S26 Cloudflare JSON-mode diagnostic'
              echo ''
              echo "- Initial JSON valid: $(jq -r '.summary.initial_json_valid' s26-cloudflare-jsonmode-diagnostic-result.json)/3"
              echo "- Final JSON valid: $(jq -r '.summary.final_json_valid' s26-cloudflare-jsonmode-diagnostic-result.json)/3"
              echo "- Initial semantic PASS: $(jq -r '.summary.initial_semantic_pass' s26-cloudflare-jsonmode-diagnostic-result.json)/3"
              echo "- Final semantic PASS: $(jq -r '.summary.final_semantic_pass' s26-cloudflare-jsonmode-diagnostic-result.json)/3"
              echo "- Prompt tuning: $(jq -r '.prompt_tuning_applied' s26-cloudflare-jsonmode-diagnostic-result.json)"
              echo '- Promotion evidence: NO'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
