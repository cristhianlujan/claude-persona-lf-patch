name: Profile C3 Python Selector Pilot

on:
  pull_request:
    paths:
      - '.github/workflows/profile-c3-python-selector-pilot.yml'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/run_c3_context_selector_pilot.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/run_c3_context_selector_pilot_v2.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/run_c3_core_cases.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/run_c3_core_cases_v2.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/run_c3_core_cases_v3.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/run_c3_family_cases.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/run_c3_family_cases_v2.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/run_structured_output_smoke.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/github_actions_local_runtime.py'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/profile_runtime_runner.py'
      - 'profiles/ui_architect/SKILL.md'
      - 'profiles/ui_architect/validators/validate_ui_architect_output.py'

permissions:
  contents: read

concurrency:
  group: profile-c3-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LLAMA_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
  MODEL_COMMIT: 5037fcf163dd95d1e41d1974465f0898ed108ca2
  MODEL_SHA256: d02fe9b69ad8cadbbd228e387667af66612c44bed29ffc8eb1e7caf9ac486c12
  MMPROJ_SHA256: 980c9b2f78c04e6cff93d277ada09e768394f112d75db3b4e9dea8a69f9fb904
  LLAMA_CACHE_DIR: /home/runner/.cache/lf-c3/llama/925e1179947ea0c0ebfb0032df18af3a729822be
  MODEL_CACHE_DIR: /home/runner/.cache/lf-c3/model/5037fcf163dd95d1e41d1974465f0898ed108ca2

jobs:
  prepare-c3-runtime:
    name: prepare-c3-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact-head readback
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          echo "ACTUAL_HEAD=$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
      - name: Restore pinned llama.cpp cache
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LLAMA_CACHE_DIR }}
          key: c3-llama-${{ runner.os }}-${{ runner.arch }}-${{ env.LLAMA_COMMIT }}-gcc13-release-nocurl
      - name: Restore pinned model cache
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.MODEL_CACHE_DIR }}
          key: c3-model-${{ env.MODEL_COMMIT }}-${{ env.MODEL_SHA256 }}-${{ env.MMPROJ_SHA256 }}
      - name: Prepare and verify pinned runtime/model
        run: |
          set -euo pipefail
          START="$(date +%s)"
          echo "LLAMA_CACHE_HIT=${{ steps.llama-cache.outputs.cache-hit }}"
          echo "MODEL_CACHE_HIT=${{ steps.model-cache.outputs.cache-hit }}"
          if [ ! -x "$LLAMA_CACHE_DIR/build/bin/llama-cli" ]; then
            rm -rf "$LLAMA_CACHE_DIR"
            mkdir -p "$(dirname "$LLAMA_CACHE_DIR")"
            git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$LLAMA_CACHE_DIR"
            cd "$LLAMA_CACHE_DIR"
            git checkout --detach "$LLAMA_COMMIT"
            test "$(git rev-parse HEAD)" = "$LLAMA_COMMIT"
            cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
            cmake --build build --config Release -j 4 --target llama-cli
            cd "$GITHUB_WORKSPACE"
          fi
          test -x "$LLAMA_CACHE_DIR/build/bin/llama-cli"
          test "$(git -C "$LLAMA_CACHE_DIR" rev-parse HEAD)" = "$LLAMA_COMMIT"

          mkdir -p "$MODEL_CACHE_DIR"
          if [ ! -s "$MODEL_CACHE_DIR/model.gguf" ]; then
            curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 --continue-at - \
              "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/${MODEL_COMMIT}/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf?download=true" \
              -o "$MODEL_CACHE_DIR/model.gguf"
          fi
          if [ ! -s "$MODEL_CACHE_DIR/mmproj.gguf" ]; then
            curl -L --fail --retry 5 --retry-all-errors --retry-delay 2 --continue-at - \
              "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/${MODEL_COMMIT}/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf?download=true" \
              -o "$MODEL_CACHE_DIR/mmproj.gguf"
          fi
          echo "${MODEL_SHA256}  $MODEL_CACHE_DIR/model.gguf" | sha256sum -c -
          echo "${MMPROJ_SHA256}  $MODEL_CACHE_DIR/mmproj.gguf" | sha256sum -c -
          END="$(date +%s)"
          echo "PREP_SECONDS=$((END-START))"
      - name: Structured-output smoke on prepared runtime
        env:
          LF_LLAMA_CLI_PATH: ${{ env.LLAMA_CACHE_DIR }}/build/bin/llama-cli
          LF_MODEL_PATH: ${{ env.MODEL_CACHE_DIR }}/model.gguf
          LF_MMPROJ_PATH: ${{ env.MODEL_CACHE_DIR }}/mmproj.gguf
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_structured_output_smoke.py

  c3-family-real-runtime:
    name: c3-family-${{ matrix.family }}
    needs: prepare-c3-runtime
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        family:
          - OFFER_PRICING
          - INSTALLMENTS_LIFECYCLE
          - IDENTITY_AUTH
          - CONSENT_CHANNELS
          - DOCUMENTS_EVIDENCE
          - TEMPORAL_CONDITIONAL
          - ALTERNATIVES_CARDINALITY
          - NEGATIVE_CONSTRAINTS
          - STATES_RECOVERY
          - MULTI_DOMAIN_COMPLEX
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact-head readback
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          echo "ACTUAL_HEAD=$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
      - name: Restore prepared llama.cpp
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LLAMA_CACHE_DIR }}
          key: c3-llama-${{ runner.os }}-${{ runner.arch }}-${{ env.LLAMA_COMMIT }}-gcc13-release-nocurl
          fail-on-cache-miss: true
      - name: Restore prepared model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODEL_CACHE_DIR }}
          key: c3-model-${{ env.MODEL_COMMIT }}-${{ env.MODEL_SHA256 }}-${{ env.MMPROJ_SHA256 }}
          fail-on-cache-miss: true
      - name: Cache/hash readback
        run: |
          set -euo pipefail
          echo "LLAMA_CACHE_HIT=${{ steps.llama-cache.outputs.cache-hit }}"
          echo "MODEL_CACHE_HIT=${{ steps.model-cache.outputs.cache-hit }}"
          test "${{ steps.llama-cache.outputs.cache-hit }}" = "true"
          test "${{ steps.model-cache.outputs.cache-hit }}" = "true"
          test -x "$LLAMA_CACHE_DIR/build/bin/llama-cli"
          test "$(git -C "$LLAMA_CACHE_DIR" rev-parse HEAD)" = "$LLAMA_COMMIT"
          echo "${MODEL_SHA256}  $MODEL_CACHE_DIR/model.gguf" | sha256sum -c -
          echo "${MMPROJ_SHA256}  $MODEL_CACHE_DIR/mmproj.gguf" | sha256sum -c -
      - name: Run C3 family 5 cases
        env:
          C3_FAMILY: ${{ matrix.family }}
          LF_REPOSITORY_VISIBILITY: public
          LF_RUNNER_LABEL: ubuntu-latest
          LF_LLAMA_SOURCE_COMMIT: ${{ env.LLAMA_COMMIT }}
          LF_LLAMA_CLI_PATH: ${{ env.LLAMA_CACHE_DIR }}/build/bin/llama-cli
          LF_MODEL_PATH: ${{ env.MODEL_CACHE_DIR }}/model.gguf
          LF_MMPROJ_PATH: ${{ env.MODEL_CACHE_DIR }}/mmproj.gguf
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_c3_family_cases_v2.py

  c3-core-50-gate:
    name: c3-core-50-gate
    if: always()
    needs: c3-family-real-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate 50-case family gate
        env:
          MATRIX_RESULT: ${{ needs.c3-family-real-runtime.result }}
        run: |
          set -euo pipefail
          echo "C3_FAMILIES=10"
          echo "C3_CASES_TOTAL=50"
          if [ "$MATRIX_RESULT" = "success" ]; then
            echo "C3_CORE_50_VERDICT=CORE_50_OF_50_PASS"
          else
            echo "C3_CORE_50_VERDICT=NO_MASSIFY"
            exit 2
          fi

  c3-authoritative-core-case:
    name: c3-authoritative-${{ matrix.case_id }}
    needs:
      - prepare-c3-runtime
      - c3-core-50-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        case_id: [CASE1, CASE2, CASE3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Exact-head readback
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          echo "EXPECTED_HEAD=$EXPECTED_HEAD"
          echo "ACTUAL_HEAD=$ACTUAL_HEAD"
          test "$ACTUAL_HEAD" = "$EXPECTED_HEAD"
      - name: Restore prepared llama.cpp
        id: llama-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.LLAMA_CACHE_DIR }}
          key: c3-llama-${{ runner.os }}-${{ runner.arch }}-${{ env.LLAMA_COMMIT }}-gcc13-release-nocurl
          fail-on-cache-miss: true
      - name: Restore prepared model
        id: model-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MODEL_CACHE_DIR }}
          key: c3-model-${{ env.MODEL_COMMIT }}-${{ env.MODEL_SHA256 }}-${{ env.MMPROJ_SHA256 }}
          fail-on-cache-miss: true
      - name: Cache/hash readback
        run: |
          set -euo pipefail
          test "${{ steps.llama-cache.outputs.cache-hit }}" = "true"
          test "${{ steps.model-cache.outputs.cache-hit }}" = "true"
          test -x "$LLAMA_CACHE_DIR/build/bin/llama-cli"
          test "$(git -C "$LLAMA_CACHE_DIR" rev-parse HEAD)" = "$LLAMA_COMMIT"
          echo "${MODEL_SHA256}  $MODEL_CACHE_DIR/model.gguf" | sha256sum -c -
          echo "${MMPROJ_SHA256}  $MODEL_CACHE_DIR/mmproj.gguf" | sha256sum -c -
      - name: Run authoritative CORE case
        env:
          C3_CORE_CASE: ${{ matrix.case_id }}
          LF_REPOSITORY_VISIBILITY: public
          LF_RUNNER_LABEL: ubuntu-latest
          LF_LLAMA_SOURCE_COMMIT: ${{ env.LLAMA_COMMIT }}
          LF_LLAMA_CLI_PATH: ${{ env.LLAMA_CACHE_DIR }}/build/bin/llama-cli
          LF_MODEL_PATH: ${{ env.MODEL_CACHE_DIR }}/model.gguf
          LF_MMPROJ_PATH: ${{ env.MODEL_CACHE_DIR }}/mmproj.gguf
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_c3_core_cases_v3.py
      - name: Emit exact case receipt
        env:
          CASE_ID: ${{ matrix.case_id }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          mkdir -p .c3-core-receipts
          printf '{"case_id":"%s","head":"%s","status":"PASS"}\n' "$CASE_ID" "$EXPECTED_HEAD" > ".c3-core-receipts/${CASE_ID}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: c3-core-${{ matrix.case_id }}-${{ github.event.pull_request.head.sha }}
          path: .c3-core-receipts/${{ matrix.case_id }}.json
          if-no-files-found: error
          retention-days: 7

  c3-authoritative-core-3-gate:
    name: c3-authoritative-core-3-gate
    if: always()
    needs: c3-authoritative-core-case
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        if: ${{ needs.c3-authoritative-core-case.result == 'success' }}
        with:
          pattern: c3-core-*-${{ github.event.pull_request.head.sha }}
          path: .c3-core-receipts
          merge-multiple: true
      - name: Aggregate exact CORE case IDs
        env:
          MATRIX_RESULT: ${{ needs.c3-authoritative-core-case.result }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$MATRIX_RESULT" != "success" ]; then
            echo "C3_AUTHORITATIVE_CORE_VERDICT=NO_MASSIFY"
            exit 2
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('.c3-core-receipts')
          expected = {'CASE1','CASE2','CASE3'}
          rows = [json.loads(p.read_text()) for p in sorted(root.glob('*.json'))]
          ids = {r.get('case_id') for r in rows}
          head = os.environ['EXPECTED_HEAD']
          assert ids == expected, (ids, expected)
          assert len(rows) == 3, len(rows)
          assert all(r.get('status') == 'PASS' and r.get('head') == head for r in rows), rows
          print('C3_CORE_CASE_IDS=' + ','.join(sorted(ids)))
          print('C3_AUTHORITATIVE_CORE_VERDICT=CORE_3_OF_3_PASS')
          PY
