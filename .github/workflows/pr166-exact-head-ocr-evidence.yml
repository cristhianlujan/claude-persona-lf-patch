name: PR166 Exact Head OCR Evidence

on:
  push:
    branches:
      - "lf/p0-masked-structured-guard"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-head-ocr-evidence:
    name: exact-head-ocr-evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Attest executed checkout identity
        shell: bash
        run: |
          set -euo pipefail
          executed_head_sha="$(git rev-parse HEAD)"
          if [ "$executed_head_sha" != "$GITHUB_SHA" ]; then
            echo "FAIL_EXACT_BRANCH_HEAD_CHECKOUT expected=$GITHUB_SHA executed=$executed_head_sha"
            exit 1
          fi
          mkdir -p .audit-output/pr166-exact-head
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          executed = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          expected = os.environ["GITHUB_SHA"]
          if executed != expected:
              raise SystemExit(f"FAIL_EXACT_BRANCH_HEAD_CHECKOUT expected={expected} executed={executed}")
          receipt = {
              "schema_version": "pr166-exact-head-evidence/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow_event": os.environ["GITHUB_EVENT_NAME"],
              "github_ref": os.environ["GITHUB_REF"],
              "github_sha": expected,
              "executed_head_sha": executed,
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "classification": "EXACT_BRANCH_HEAD_CI",
              "production_authorized": False,
              "real_corpus_credit": 0,
              "p0_5_credit": 0,
              "sealed_holdout_accessed": False,
          }
          path = pathlib.Path(".audit-output/pr166-exact-head/executed-head-receipt.json")
          path.write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Provision governed P0 visual regression runtime
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            -r sandbox/story_creator_p0_visual/v1.1/requirements-p0-visual-quality.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-spa

      - name: Run exact-head V6 regression
        working-directory: sandbox/lf_contract_gate_test
        run: |
          set +e
          output="$GITHUB_WORKSPACE/.audit-output/pr166-exact-head/v6-output.jsonl"
          python3 P0_MULTISCREEN_STRUCTURAL_GENERALIZATION_REGRESSION_V6.py >"$output" 2>&1
          rc=$?
          cat "$output"
          if [ "$rc" -ne 0 ]; then
            failed="$(python3 - "$output" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          failed = []
          for line in path.read_text(encoding='utf-8', errors='replace').splitlines():
              try:
                  obj = json.loads(line)
              except Exception:
                  continue
              if isinstance(obj, dict) and obj.get('failed'):
                  failed = obj.get('failed')
          print(','.join(str(x) for x in failed) if failed else '')
          PY
          )"
            if [ -z "$failed" ]; then
              detail="$(tail -c 1800 "$output" | tr '\n\r' '  ' | sed 's/%/%25/g')"
              echo "::error title=PR166 V6 regression crash::detail=$detail"
            else
              echo "::error title=PR166 V6 regression failed::failed_checks=$failed"
            fi
            exit "$rc"
          fi

      - name: Upload exact-head receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr166-exact-head-ocr-${{ github.run_id }}
          path: .audit-output/pr166-exact-head
          if-no-files-found: error
          retention-days: 7
