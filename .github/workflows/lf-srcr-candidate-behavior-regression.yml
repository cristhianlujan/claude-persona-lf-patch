name: LF SRCR Candidate Behavioral Regression
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'profiles/systemic_root_cause_repair_lf/**'
      - '.github/workflows/lf-srcr-candidate-behavior-regression.yml'
permissions:
  contents: read
jobs:
  srcr-behavioral-candidate:
    if: github.event.pull_request.number == 3359
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema dependency
        run: python -m pip install --disable-pip-version-check --no-input jsonschema==4.26.0
      - name: Run existing whole-profile validator and every declared functional test
        run: python profiles/systemic_root_cause_repair_lf/validators/validate_pack.py profiles/systemic_root_cause_repair_lf
      - name: Independently execute N1/N2 negative cases
        if: always()
        run: |
          python profiles/systemic_root_cause_repair_lf/evals/v09_exhausted_search_cases.py
          python profiles/systemic_root_cause_repair_lf/evals/v10_n1_n2_quality_gate_cases.py
      - name: Replay existing WEB-001 actual runs with trusted evaluator
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from skills.profile_creator.validators.operational_coverage_v1 import evaluate_check
          root=Path('skills/profile_creator/operational_cases/systemic_root_cause_repair_lf')
          case=json.loads((root/'WEB-001.case.json').read_text())
          for name,expected in [('RUN-WEB001-BASE-20261029.json',4),('RUN-WEB001-CANDIDATE-20261029.json',9)]:
            run=json.loads((root/'runs'/name).read_text())
            doc={'output':run['output'],'validator':run['validator']}
            passed=sum(evaluate_check(doc,c) for c in case['checks'])
            assert passed==expected,(name,passed,expected)
            material=[u for u in run['output'].get('current_uncertainties',[]) if u.get('impact')=='DESIGN_BLOCKING']
            n12=sum(1 for u in material if all(any(q.get('level')==lev and q.get('readback') for q in u.get('cascade',{}).get('catalog_queries',[])) for lev in ['N1','N2']))
            print(f'WEB001_REPLAY {name} {passed}/{len(case["checks"])} material={len(material)} n1n2_proven={n12}')
          print('WEB001_REPLAY_PASS_EXISTING_CASE_NO_NEW_MODEL_RUN')
          PY

      - name: Validate real ChatGPT-current-chat WEB-001 source-readback with adversarial mutations
        run: |
          python - <<'PY'
          import json,copy,sys
          from pathlib import Path
          sys.path.insert(0,"profiles/systemic_root_cause_repair_lf/validators")
          from producer_depth import validate_producer_depth,_catalog_receipt_errors
          packet=json.loads(Path("docs/profile_updater/handoffs/WEB001_GPT_NATIVE_CURRENT_CHAT_N1N2_READBACK_20261030.json").read_text())
          raw=packet["raw_output"]
          manifest=packet["evidence_manifest"]
          assert packet["case_id"]=="WEB-001" and packet["producer"]=="GPT_NATIVE_CURRENT_CHAT"
          assert packet["independent_semantic_review"] is False and packet["provider_attested"] is False
          assert raw["status"]=="NEEDS_MORE_EVIDENCE"
          errors=validate_producer_depth(raw,manifest)
          assert not errors,errors
          row=raw["current_uncertainties"][0]
          q=row["cascade"]["catalog_queries"]
          assert [x["level"] for x in q]==["N1","N2"]
          assert all(x["readback"]["row_count"]==1 for x in q)
          assert all(x["readback"]["sample_records"][0]["owner_name"] is None for x in q)
          assert q[0]["readback"]["sample_records"]==q[1]["readback"]["sample_records"]
          print("WEB001_NATIVE_CURRENT_CHAT_SOURCE_BOUND=PASS")
          def codes(candidate,evidence=manifest):
            return {x["code"] for x in validate_producer_depth(candidate,evidence)}
          broken=copy.deepcopy(raw); broken["current_uncertainties"][0]["cascade"]["catalog_queries"].pop()
          assert "GAP_CATALOG_N1_N2_MISSING" in codes(broken)
          broken=copy.deepcopy(raw); broken["current_uncertainties"][0]["cascade"]["catalog_queries"][0]["readback"]["sample_records"][0]["owner_name"]="FAKE_OWNER"
          assert "GAP_CATALOG_READBACK_DIGEST_MISMATCH" in codes(broken)
          broken=copy.deepcopy(raw); broken["current_uncertainties"][0]["cascade"]["catalog_queries"][0]["datum_id"]="OTHER"
          assert "GAP_CATALOG_DATUM_MISMATCH" in codes(broken)
          broken=copy.deepcopy(raw); broken["current_uncertainties"][0]["cascade"]["catalog_queries"][1]["readback"]["result_kind"]="EMPTY"
          assert "GAP_CATALOG_RESULT_INCONSISTENT" in codes(broken)
          print("WEB001_NATIVE_CURRENT_CHAT_FALSIFIERS=4/4")
          print("WEB001_NATIVE_CURRENT_CHAT_NO_PROVIDER_ATTESTATION_NO_OFFICIAL_EVOLUTION_PASS")
          PY
