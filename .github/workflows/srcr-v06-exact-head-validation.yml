name: SRCR V0.6 Exact-Head Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate-srcr-v06:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact V0.6 candidate
        uses: actions/checkout@v4
        with:
          ref: 4ef451ac7f9649ebc4709fb1ec7ebdcf8be47fba
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install canonical deterministic pack-validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4ef451ac7f9649ebc4709fb1ec7ebdcf8be47fba"
          echo "PASS_EXACT_HEAD=4ef451ac7f9649ebc4709fb1ec7ebdcf8be47fba"

      - name: Run canonical pack validation against exact candidate
        id: pack_validation
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: be1ffbf8e5790d01bc19b376e35a99f72ce52fe1
          HEAD_SHA: 4ef451ac7f9649ebc4709fb1ec7ebdcf8be47fba
        run: |
          set -euo pipefail
          CHANGED_PATHS_JSON="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | python3 -c 'import json,sys; print(json.dumps([line.strip() for line in sys.stdin if line.strip()]))')"
          python3 sandbox/lf_contract_gate_test/pack_validation_contract/run_pack_validation_flow_v1.py \
            --repo-root . \
            --validation-contract gobernanza/contratos/pack_validation_define_contract_v1.json \
            --discovery-contract gobernanza/contratos/pack_discovery_resolve_affected_packs_v1.json \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --changed-paths-json "$CHANGED_PATHS_JSON" \
            --output-dir .lf_pack_validation \
            --timeout-seconds 120

      - name: Publish exact-head validation readback
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          test -f .lf_pack_validation/result.json
          test -f .lf_pack_validation/summary.json
          {
            echo '### SRCR V0.6 exact-head validation readback'
            echo
            echo '- candidate: `4ef451ac7f9649ebc4709fb1ec7ebdcf8be47fba`'
            echo '- base: `be1ffbf8e5790d01bc19b376e35a99f72ce52fe1`'
            echo '- runner dependency: `jsonschema==4.23.0` (canonical staged Pack Validation Core)'
            echo '- carrier only; no merge/apply/runtime activation'
            echo
            echo '```json'
            cat .lf_pack_validation/result.json
            echo '```'
            echo
            echo '```json'
            cat .lf_pack_validation/summary.json
            echo '```'
          } > /tmp/readback.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/readback.md

      - name: Assert SRCR pack PASS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('.lf_pack_validation/summary.json').read_text())
          assert summary['status']=='PASS', summary
          assert summary['affected_pack_count'] >= 1, summary
          assert summary['executed_pack_count'] >= 1, summary
          assert summary['pass_count'] >= 1, summary
          assert summary['fail_count']==0, summary
          print('PASS_SRCR_V06_EXACT_HEAD_PACK_VALIDATION', summary)
          PY
