name: L29 Real Login B2B 49-rule Curator PG18 read-only-origin experiment
on:
  push:
    branches: [lf/issue-3779-lote29-e2e-gap-report-v1]
    paths:
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote29_actual_login_b2b_49.py
      - docs/rule-quality-lote29/05_login_b2b_reglas_origen_49.json
      - docs/rule-quality-lote29/06_politicas_centrales_mfa_origen.json
      - docs/rule-quality-lote29/07_login_b2b_matriz_diffs_51.json
      - .github/workflows/l29-ig-e2e-gaps-pg18.yml
permissions:
  contents: read
concurrency:
  group: l29-actual-login-b2b-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      pg18:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PostgreSQL 18 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -X -A -t -v ON_ERROR_STOP=1 -d postgres -c "SELECT current_setting('server_version');"
      - name: Review ONLY 49 actual B2B rules in sandbox copies
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote29_actual_login_b2b_49.py | tee "$RUNNER_TEMP/l29_actual_console.log"
          python3 - <<'PY'
          import json
          p="docs/rule-quality-lote29/l29_login_b2b_actual_runtime.json"
          x=json.load(open(p))
          assert x["source_server_sha256"]=="4959cfd6d9319ea26b60f9a21a1751c674e06c4417fb4d589f3665424d539bd3"
          assert x["rules_requested"]==51 and x["rules_read"]==49
          assert x["metrics"]["missing"]==2 and x["policy_read"]==4
          assert len(x["results"])==51
          assert x["metrics"]["formal_approvals"]==x["metrics"]["promoted"]==0
          assert x["owner_signatures"]==0 and x["production_writes"]==0 and x["run_modifications"]==0
          assert x["production"]=="NO_GO_UNVERIFIED" and x["blockers_closed"]==0 and x["blockers_total"]==14
          assert len(x["board"])==49*12
          assert sum(x["board_counts"].values())==49*12
          assert x["frozen_gates"]["source_files_untouched"]
          assert x["frozen_gates"]["md5_reexecuted_in_actual_rules_review"] is False
          assert x["scope"]=="CURATOR_AND_DIFF_COPY_PG18_NOT_NATIVE_IG_E2E"
          print("L29_ACTUAL_CI_ASSERT_PASS",json.dumps(x["metrics"],sort_keys=True))
          PY
      - name: Preserve original PG18 evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l29_actual"
          cp docs/rule-quality-lote29/l29_login_b2b_actual_runtime.json "$RUNNER_TEMP/l29_actual/" 2>/dev/null || true
          cp "$RUNNER_TEMP/l29_actual_console.log" "$RUNNER_TEMP/l29_actual/" 2>/dev/null || true
          sha256sum docs/rule-quality-lote29/05_login_b2b_reglas_origen_49.json docs/rule-quality-lote29/06_politicas_centrales_mfa_origen.json docs/rule-quality-lote29/07_login_b2b_matriz_diffs_51.json sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote29_actual_login_b2b_49.py > "$RUNNER_TEMP/l29_actual/sources.sha256"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l29-login-b2b-real-source-pg18-review
          path: ${{ runner.temp }}/l29_actual/
          retention-days: 14
          if-no-files-found: warn
