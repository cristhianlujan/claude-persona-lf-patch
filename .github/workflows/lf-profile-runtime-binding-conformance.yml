name: LF Profile Runtime Binding Fleet Conformance
on:
  pull_request:
    paths:
      - 'profiles/**/contracts/runtime_binding.json'
      - 'profiles/product_director_lf/validators/runtime_semantic_utility.py'
      - 'services/profile_runtime_api/profile_runtime_api/repository.py'
      - 'services/profile_runtime_api/profile_runtime_api/runtime_schema_selection.py'
      - 'services/profile_runtime_api/tests/test_runtime_binding_fleet_conformance.py'
      - 'scripts/lf_profile_native_resume.py'
      - '.github/workflows/lf-profile-runtime-binding-conformance.yml'
  workflow_dispatch:
jobs:
  fleet-conformance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Real binding and dual-consumer conformance (no profile runs)
        env:
          PYTHONPATH: services/profile_runtime_api
        run: python -m unittest discover -s services/profile_runtime_api/tests -p 'test_runtime_binding_fleet_conformance.py' -v
