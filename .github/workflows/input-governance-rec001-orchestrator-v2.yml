# verification rerun after governed safe-autofix PostgREST wrapper
name: Input Governance REC001 Orchestrator V2

on:
  push:
    branches:
      - lf/input-gov-rec001-semantic-resolution-v2-20260825
    paths:
      - .github/workflows/input-governance-rec001-orchestrator-v2.yml

permissions:
  contents: read

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: mhwmirqcgxxukpctffuv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Invoke governed Input Governance orchestrator
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          keys="$(curl -fsSL \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "https://api.supabase.com/v1/projects/${PROJECT_REF}/api-keys?reveal=true")"
          service_key="$(printf '%s' "$keys" | jq -r 'map(select((.type // "") == "secret" or (.name // "") == "secret")) | .[0] | (.api_key // .value // .key // empty)')"
          test -n "$service_key"
          http_status="$(curl -sS -o orchestrator-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${service_key}" \
            -H "apikey: ${service_key}" \
            -H 'Content-Type: application/json' \
            --data '{"pantalla_id":58,"consumer":"STORY_CREATOR"}' \
            "https://${PROJECT_REF}.supabase.co/functions/v1/input-governance-agent-v1")"
          echo "ORCHESTRATOR_HTTP_STATUS=${http_status}"
          cat orchestrator-response.json
          echo
          test "$http_status" = "200"
