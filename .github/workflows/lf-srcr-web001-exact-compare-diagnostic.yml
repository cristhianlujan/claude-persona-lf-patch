name: LF SRCR WEB001 Exact Compare Diagnostic
on:
  push:
    branches:
      - lf/handoff-srcr-catalog-cascade-20261029
    paths:
      - ".github/workflows/lf-srcr-web001-exact-compare-diagnostic.yml"
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned trusted evaluator dependency
        run: python -m pip install --disable-pip-version-check --no-input 'jsonschema==4.26.0'
      - name: Materialize exact trusted and candidate trees, no zip
        shell: bash
        env:
          BASE_SHA: 52c0f68ad243d2a98f959db8f3a935179b5681aa
          CAND_SHA: 3d2b0966d2ed4285da2b747392b0d63ef5c1bd6a
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git fetch --no-tags --depth=1 origin "$CAND_SHA"
          mkdir -p "$RUNNER_TEMP/trusted" "$RUNNER_TEMP/base" "$RUNNER_TEMP/candidate"
          git archive "$BASE_SHA" skills/profile_creator | tar -x -C "$RUNNER_TEMP/trusted"
          git archive "$BASE_SHA" profiles/systemic_root_cause_repair_lf | tar -x -C "$RUNNER_TEMP/base"
          git archive "$CAND_SHA" profiles/systemic_root_cause_repair_lf | tar -x -C "$RUNNER_TEMP/candidate"
      - name: Run trusted Group1 Group2 exact comparison, do not claim promotion
        shell: bash
        run: |
          set +e
          python "$RUNNER_TEMP/trusted/skills/profile_creator/validators/compare_s26_profile_evolution_v1.py" systemic_root_cause_repair_lf "$RUNNER_TEMP/trusted" "$RUNNER_TEMP/base/profiles/systemic_root_cause_repair_lf" "$RUNNER_TEMP/candidate/profiles/systemic_root_cause_repair_lf" > "$RUNNER_TEMP/exact-proof.json"
          rc=$?
          cat "$RUNNER_TEMP/exact-proof.json"
          python - "$RUNNER_TEMP/exact-proof.json" "$rc" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1], encoding='utf8'))
          op=d.get('operational') or {}
          print("WEB001_EXACT_DIAGNOSTIC="+json.dumps({
            "comparator_exit":int(sys.argv[2]),
            "verdict":d.get("verdict"),
            "base_score":d.get("base_score"),
            "candidate_score":d.get("candidate_score"),
            "base_tree":op.get("base_tree_sha256"),
            "candidate_tree":op.get("candidate_tree_sha256"),
            "status":op.get("status"),
            "checks_total":op.get("checks_total"),
            "cases_unmeasured":op.get("cases_unmeasured"),
            "improved_checks":op.get("improved_checks"),
            "regressed_checks":op.get("regressed_checks"),
            "problems":op.get("problems")
          },sort_keys=True))
          assert d.get("verdict") in ("EVOLUTION_DEMONSTRATED","REGRESSION","NO_DEMONSTRATED_IMPROVEMENT","BLOCKED")
          PY
