name: LF Bootstrap Reproducibility Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "agent/pr93-*"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: lf-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  feedback-tier-router:
    name: feedback-tier-router
    runs-on: ubuntu-latest
    outputs:
      bootstrap_controls_json: ${{ steps.classify.outputs.bootstrap_controls_json }}
      required_controls_json: ${{ steps.classify.outputs.required_controls_json }}
      plan_sha256: ${{ steps.classify.outputs.plan_sha256 }}
      applicability_sha256: ${{ steps.classify.outputs.applicability_sha256 }}
      evidence_sha256: ${{ steps.classify.outputs.evidence_sha256 }}
      currentness_decision: ${{ steps.classify.outputs.currentness_decision }}
      authority_current_revision: ${{ steps.context.outputs.authority_current_revision }}
      full_regression: ${{ steps.classify.outputs.full_regression }}
      changed_paths_json: ${{ steps.classify.outputs.changed_paths_json }}
      base_sha: ${{ steps.context.outputs.base_sha }}
      head_sha: ${{ steps.context.outputs.head_sha }}
    steps:
      - name: Checkout exact source for applicability
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve exact applicability context
        id: context
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            git fetch --no-tags origin "$base" "$head"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${GITHUB_SHA}"
            if [[ -n "$base" && "$base" != "0000000000000000000000000000000000000000" ]]; then
              git fetch --no-tags origin "$base" "$head"
            fi
          else
            base=""
            head="$(git rev-parse HEAD)"
          fi
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          authority_current="$(git rev-parse refs/remotes/origin/main)"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head" >> "$GITHUB_OUTPUT"
          echo "authority_current_revision=$authority_current" >> "$GITHUB_OUTPUT"

      - name: Build unified CI applicability plan
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lf_ci
          args=(
            --repo-root .
            --base "${{ steps.context.outputs.base_sha }}"
            --head "${{ steps.context.outputs.head_sha }}"
            --authority-current-revision "${{ steps.context.outputs.authority_current_revision }}"
            --event-name "${GITHUB_EVENT_NAME}"
            --event-action "${{ github.event.action }}"
            --ref-name "${GITHUB_REF_NAME:-}"
            --output-json .lf_ci/lf_ci_execution_plan_v2.json
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            args+=(--force-full --force-full-reason WORKFLOW_DISPATCH_FULL_REGRESSION)
          fi
          python3 sandbox/lf_contract_gate_test/s28_ci_lane_router/emit_ci_execution_plan_v2.py "${args[@]}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path(".lf_ci/lf_ci_execution_plan_v2.json").read_text())
          assert p["coverage_complete"] is True
          assert p["plan_sha256"]
          assert p["source_authority"]["ready"] is True
          print(
              "BOOTSTRAP_UNIFIED_PLAN",
              p["plan_sha256"],
              p["evidence_sha256"],
              p["source_authority"]["decision"],
              p["carrier_controls"].get("LF_BOOTSTRAP_REPRODUCIBILITY", []),
          )
          PY

      - name: Persist unified CI applicability plan
        uses: actions/upload-artifact@v4
        with:
          name: lf-ci-applicability-plan-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: .lf_ci/lf_ci_execution_plan_v2.json
          if-no-files-found: error
          retention-days: 30

  schema-bootstrap-probe:
    name: schema-bootstrap-probe
    needs: feedback-tier-router
    if: contains(fromJSON(needs.feedback-tier-router.outputs.bootstrap_controls_json), 'REMOTE_SCHEMA_REPRODUCIBILITY')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com

    steps:
      - name: Detect encrypted sandbox credentials
        id: credentials
        shell: bash
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Schema bootstrap probe skipped: encrypted sandbox credentials are not configured." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout exact source
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.feedback-tier-router.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up pinned Supabase CLI
        if: steps.credentials.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Export sandbox schema without data or roles
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export PGHOST="$SUPABASE_POOLER_HOST"
          export PGPORT=5432
          export PGUSER="postgres.${SUPABASE_PROJECT_ID}"
          export PGDATABASE=postgres
          export PGSSLMODE=require
          export EXCLUDED_SCHEMAS='information_schema|pg_*|_analytics|_realtime|_supavisor|auth|etl|extensions|pgbouncer|realtime|storage|supabase_functions|supabase_migrations|cron|dbdev|graphql|graphql_public|net|pgmq|pgsodium|pgsodium_masks|pgtle|repack|tiger|tiger_data|timescaledb_*|_timescaledb_*|topology|vault'

          docker run --rm \
            -e PGHOST \
            -e PGPORT \
            -e PGUSER \
            -e PGPASSWORD \
            -e PGDATABASE \
            -e PGSSLMODE \
            -e EXCLUDED_SCHEMAS \
            postgres:17.6 \
            pg_dump \
              --schema-only \
              --no-owner \
              --no-privileges \
              --quote-all-identifiers \
              --role postgres \
              --exclude-schema "$EXCLUDED_SCHEMAS" \
          | sed -E 's/^\\(un)?restrict .*$/-- &/' \
          | sed -E 's/^CREATE SCHEMA "/CREATE SCHEMA IF NOT EXISTS "/' \
          | sed -E 's/^CREATE TABLE "/CREATE TABLE IF NOT EXISTS "/' \
          | sed -E 's/^CREATE SEQUENCE "/CREATE SEQUENCE IF NOT EXISTS "/' \
          | sed -E 's/^CREATE VIEW "/CREATE OR REPLACE VIEW "/' \
          | sed -E 's/^CREATE FUNCTION "/CREATE OR REPLACE FUNCTION "/' \
          | sed -E 's/^CREATE TRIGGER "/CREATE OR REPLACE TRIGGER "/' \
          | sed -E 's/^CREATE PUBLICATION "supabase_realtime/-- &/' \
          | sed -E 's/^CREATE EVENT TRIGGER /-- &/' \
          | sed -E 's/^         WHEN TAG IN /-- &/' \
          | sed -E 's/^   EXECUTE FUNCTION /-- &/' \
          | sed -E 's/^ALTER EVENT TRIGGER /-- &/' \
          | sed -E 's/^ALTER PUBLICATION "supabase_realtime_/-- &/' \
          | sed -E 's/^ALTER FOREIGN DATA WRAPPER (.+) OWNER TO /-- &/' \
          | sed -E 's/^ALTER DEFAULT PRIVILEGES FOR ROLE "supabase_admin"/-- &/' \
          | sed -E 's/^GRANT ALL ON FOREIGN DATA WRAPPER (.+) TO "postgres" WITH GRANT OPTION/-- &/' \
          | sed -E "s/^GRANT (.+) ON (.+) \"(${EXCLUDED_SCHEMAS})\"/-- &/" \
          | sed -E "s/^REVOKE (.+) ON (.+) \"(${EXCLUDED_SCHEMAS})\"/-- &/" \
          | sed -E 's/^(CREATE EXTENSION IF NOT EXISTS "pg_tle").+/\1;/' \
          | sed -E 's/^(CREATE EXTENSION IF NOT EXISTS "pgsodium").+/\1;/' \
          | sed -E 's/^(CREATE EXTENSION IF NOT EXISTS "pgmq").+/\1;/' \
          | sed -E 's/^COMMENT ON EXTENSION (.+)/-- &/' \
          | sed -E 's/^CREATE POLICY "cron_job_/-- &/' \
          | sed -E 's/^ALTER TABLE "cron"/-- &/' \
          | sed -E 's/^SET transaction_timeout = 0;/-- &/' \
          | sed -E '/^--/d' \
          > "$RUNNER_TEMP/lf-remote-schema.sql"
          test -s "$RUNNER_TEMP/lf-remote-schema.sql"

      - name: Export custom roles without passwords or managed roles
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          export PGHOST="$SUPABASE_POOLER_HOST"
          export PGPORT=5432
          export PGUSER="postgres.${SUPABASE_PROJECT_ID}"
          export PGDATABASE=postgres
          export PGSSLMODE=require
          export RESERVED_ROLES='anon|authenticated|authenticator|cli_login_.*|dashboard_user|pgbouncer|postgres|service_role|supabase_.*|pgsodium_keyholder|pgsodium_keyiduser|pgsodium_keymaker|pgtle_admin'

          # Mirrors Supabase CLI role-only filtering while keeping the database
          # password in PGPASSWORD instead of a connection URI/argv.
          docker run --rm \
            -e PGHOST \
            -e PGPORT \
            -e PGUSER \
            -e PGPASSWORD \
            -e PGDATABASE \
            -e PGSSLMODE \
            postgres:17.6 \
            pg_dumpall \
              --roles-only \
              --role postgres \
              --quote-all-identifiers \
              --no-role-passwords \
              --no-comments \
          | sed -E 's/^\\(un)?restrict .*$/-- &/' \
          | sed -E "s/^CREATE ROLE \"(${RESERVED_ROLES})\"/-- &/" \
          | sed -E "s/^ALTER ROLE \"(${RESERVED_ROLES})\"/-- &/" \
          | sed -E 's/ (NOSUPERUSER|NOREPLICATION)//g' \
          | sed -E "s/GRANT \".*\" TO \"(${RESERVED_ROLES})\"/-- &/" \
          | sed -E '/^--/d' \
          | uniq \
          > "$RUNNER_TEMP/lf-roles.sql"
          test -s "$RUNNER_TEMP/lf-roles.sql"

      - name: Rebuild exported schema in disposable local Supabase
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          probe="$RUNNER_TEMP/lf-bootstrap-probe"
          mkdir -p "$probe"
          cd "$probe"
          supabase init
          mkdir -p supabase/migrations
          cp "$RUNNER_TEMP/lf-roles.sql" supabase/roles.sql
          cp "$RUNNER_TEMP/lf-remote-schema.sql" \
            supabase/migrations/20260807000000_remote_schema_probe.sql
          supabase db start
          trap 'supabase stop --no-backup || true' EXIT
          supabase db reset

          schema_sha="$(sha256sum "$RUNNER_TEMP/lf-remote-schema.sql" | cut -d' ' -f1)"
          schema_lines="$(wc -l < "$RUNNER_TEMP/lf-remote-schema.sql")"
          {
            echo "### LF bootstrap reproducibility probe"
            echo "- project: \`$SUPABASE_PROJECT_ID\`"
            echo "- source: custom roles (no passwords) + schema-only linked dump; no dump artifact uploaded"
            echo "- local reset: PASS"
            echo "- schema sha256: \`$schema_sha\`"
            echo "- schema lines: \`$schema_lines\`"
          } >> "$GITHUB_STEP_SUMMARY"

  v7-runtime-apply-rollback:
    name: v7-runtime-apply-rollback
    needs: feedback-tier-router
    if: contains(fromJSON(needs.feedback-tier-router.outputs.bootstrap_controls_json), 'V7_RUNTIME_REGRESSION')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: lf_ci_cluster_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lf_ci_cluster_admin -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.feedback-tier-router.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify migration manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="sandbox/lf_contract_gate_test/PR93_V7_RUNTIME_MIGRATIONS.txt"
          count=0
          previous=""
          while IFS= read -r migration || [ -n "$migration" ]; do
            [ -n "$migration" ] || continue
            case "$migration" in \#*) continue ;; esac
            [ -f "$migration" ]
            if [ -n "$previous" ] && [[ "$migration" < "$previous" ]]; then
              echo "Migration manifest is not ordered: $migration"
              exit 1
            fi
            previous="$migration"
            count=$((count + 1))
          done < "$manifest"
          [ "$count" -eq 19 ]

      - name: Bootstrap non-superuser PostgreSQL 17 boundary
        id: v7-bootstrap
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RUNTIME_DB: lf_v7_runtime
        run: |
          set -euo pipefail

          server_version="$(
            docker exec "$POSTGRES_CONTAINER" \
              psql -X -U lf_ci_cluster_admin -d postgres -Atqc "show server_version"
          )"
          server_major="${server_version%%.*}"
          [ "$server_major" = "17" ]

          docker exec -i "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 \
              -U lf_ci_cluster_admin -d postgres <<'SQL'
          create role postgres superuser createrole createdb login inherit nobypassrls;
          SQL

          docker exec "$POSTGRES_CONTAINER" \
            createdb -U lf_ci_cluster_admin -O postgres "$RUNTIME_DB"

          docker exec -i "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 \
              -U lf_ci_cluster_admin -d "$RUNTIME_DB" \
            < sandbox/lf_contract_gate_test/PR93_V7_RUNTIME_BASE.sql

          postgres_is_super="$(
            docker exec "$POSTGRES_CONTAINER" \
              psql -X -U postgres -d "$RUNTIME_DB" -Atqc \
                "select rolsuper from pg_roles where rolname='postgres'"
          )"
          [ "$postgres_is_super" = "f" ]

          docker exec "$POSTGRES_CONTAINER" \
            pg_dump -U lf_ci_cluster_admin -d "$RUNTIME_DB" \
              --format=custom --file=/tmp/pr93-v7-pre.dump

          read -r pre_hash _ < <(
            docker exec "$POSTGRES_CONTAINER" \
              pg_dump -U lf_ci_cluster_admin -d "$RUNTIME_DB" \
                --schema-only --no-owner --no-privileges \
            | sed -E \
                -e '/^\\(un)?restrict /d' \
                -e '/^-- Dumped /d' \
                -e '/^-- Started /d' \
                -e '/^-- Completed /d' \
            | sha256sum
          )
          printf '%s\n' "$pre_hash" > "$RUNNER_TEMP/pr93-v7-pre.sha256"
          echo "server_version=$server_version" >> "$GITHUB_OUTPUT"

      - name: Apply complete V7 source package
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RUNTIME_DB: lf_v7_runtime
        run: |
          set -euo pipefail
          manifest="sandbox/lf_contract_gate_test/PR93_V7_RUNTIME_MIGRATIONS.txt"
          applied=0
          while IFS= read -r migration || [ -n "$migration" ]; do
            [ -n "$migration" ] || continue
            case "$migration" in \#*) continue ;; esac
            docker exec -i "$POSTGRES_CONTAINER" \
              psql -X -v ON_ERROR_STOP=1 \
                -U postgres -d "$RUNTIME_DB" \
              < "$migration"
            applied=$((applied + 1))
          done < "$manifest"
          [ "$applied" -eq 19 ]

      - name: Read back apply and consume a valid proof
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RUNTIME_DB: lf_v7_runtime
        run: |
          set -euo pipefail
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 \
              -U lf_ci_cluster_admin -d "$RUNTIME_DB" \
            < sandbox/lf_contract_gate_test/PR93_V7_RUNTIME_APPLY_READBACK.sql

      - name: Execute restore rollback and compare pre-V7 state
        shell: bash
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          RUNTIME_DB: lf_v7_runtime
        run: |
          set -euo pipefail

          docker exec "$POSTGRES_CONTAINER" \
            dropdb -U lf_ci_cluster_admin "$RUNTIME_DB"
          docker exec -i "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 \
              -U lf_ci_cluster_admin -d postgres <<'SQL'
          drop role if exists lf_writer_verifier_v7;
          SQL
          docker exec "$POSTGRES_CONTAINER" \
            createdb -U lf_ci_cluster_admin -O postgres "$RUNTIME_DB"
          docker exec "$POSTGRES_CONTAINER" \
            pg_restore -U lf_ci_cluster_admin -d "$RUNTIME_DB" \
              --exit-on-error /tmp/pr93-v7-pre.dump

          read -r expected_hash < "$RUNNER_TEMP/pr93-v7-pre.sha256"
          read -r restored_hash _ < <(
            docker exec "$POSTGRES_CONTAINER" \
              pg_dump -U lf_ci_cluster_admin -d "$RUNTIME_DB" \
                --schema-only --no-owner --no-privileges \
            | sed -E \
                -e '/^\\(un)?restrict /d' \
                -e '/^-- Dumped /d' \
                -e '/^-- Started /d' \
                -e '/^-- Completed /d' \
            | sha256sum
          )
          [ "$restored_hash" = "$expected_hash" ]

          docker exec -i "$POSTGRES_CONTAINER" \
            psql -X -v ON_ERROR_STOP=1 \
              -U lf_ci_cluster_admin -d "$RUNTIME_DB" \
            < sandbox/lf_contract_gate_test/PR93_V7_RUNTIME_ROLLBACK_READBACK.sql

      - name: Publish non-secret runtime summary
        if: success()
        shell: bash
        env:
          SERVER_VERSION: ${{ steps.v7-bootstrap.outputs.server_version }}
        run: |
          {
            echo "### PR93 V7 runtime migration gate"
            echo "- PostgreSQL server: \`$SERVER_VERSION\`"
            echo "- source migrations executed: \`19\`"
            echo "- apply readback: \`MATCHED\`"
            echo "- valid proof consumed and replay rejected: \`true\`"
            echo "- restore rollback readback: \`MATCHED\`"
          } >> "$GITHUB_STEP_SUMMARY"

  candidate-migration-apply-rollback:
    name: candidate-migration-apply-rollback
    needs: feedback-tier-router
    if: contains(fromJSON(needs.feedback-tier-router.outputs.bootstrap_controls_json), 'DB_CANDIDATE_APPLY_ROLLBACK')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.feedback-tier-router.outputs.head_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare exact changed migration rollback probe
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .lf_ci/db_candidate
          args=(
            --repo-root .
            --base "${{ needs.feedback-tier-router.outputs.base_sha }}"
            --head "${{ needs.feedback-tier-router.outputs.head_sha }}"
            --sql-out .lf_ci/db_candidate/candidate_rollback.sql
            --manifest-out .lf_ci/db_candidate/candidate_manifest.json
          )
          controls='${{ needs.feedback-tier-router.outputs.bootstrap_controls_json }}'
          if python3 -c 'import json,sys; raise SystemExit(0 if "POLICY_RESOLVER_REGRESSION" in json.loads(sys.argv[1]) else 1)' "$controls"; then
            args+=(--probe-sql sandbox/lf_contract_gate_test/s28_ci_lane_router/policy_resolver_post_apply_probe_v1.sql)
          fi
          python3 sandbox/lf_contract_gate_test/s28_ci_lane_router/run_changed_migrations_rollback_v1.py "${args[@]}"
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path(".lf_ci/db_candidate/candidate_manifest.json").read_text())
          if m["migration_count"] < 1 or m["transaction_escape_scan"] != "PASS":
              raise SystemExit("BLOCK_DB_CANDIDATE_MANIFEST_INVALID")
          print("DB_CANDIDATE_MANIFEST_PASS", m["migration_count"], m["combined_sql_sha256"])
          PY

      - name: Execute candidate rollback or verify already-applied exact source
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "${PGPASSWORD:-}" ]]; then
            echo "BLOCK_DB_CANDIDATE_DB_PASSWORD_MISSING" >&2
            exit 1
          fi
          export PGHOST="$SUPABASE_POOLER_HOST"
          export PGPORT=5432
          export PGUSER="postgres.${SUPABASE_PROJECT_ID}"
          export PGDATABASE=postgres
          export PGSSLMODE=require

          docker run --rm \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE \
            postgres:17.6 \
            psql -X -v ON_ERROR_STOP=1 -At -c \
              "select count(*)::text||':'||coalesce(max(version),'') from supabase_migrations.schema_migrations" \
            > .lf_ci/db_candidate/ledger_before.txt

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          manifest=json.loads(Path(".lf_ci/db_candidate/candidate_manifest.json").read_text())
          rows=manifest.get("migrations") or []
          if not rows:
              raise SystemExit("BLOCK_DB_CANDIDATE_MANIFEST_EMPTY")
          values=[]
          for row in rows:
              version=row.get("migration_version","")
              name=row.get("migration_name","")
              blob=row.get("source_git_blob_sha1","")
              if not re.fullmatch(r"\d{14}",version):
                  raise SystemExit(f"BLOCK_DB_CANDIDATE_VERSION_INVALID:{version}")
              if not re.fullmatch(r"[a-z0-9_]+",name):
                  raise SystemExit(f"BLOCK_DB_CANDIDATE_NAME_INVALID:{name}")
              if not re.fullmatch(r"[0-9a-f]{40}",blob):
                  raise SystemExit(f"BLOCK_DB_CANDIDATE_GIT_BLOB_INVALID:{blob}")
              values.append(f"('{version}','{name}','{blob}')")
          sql=f"""
          with expected(version,name,git_blob) as (
            values {','.join(values)}
          )
          select
            e.version,
            e.name,
            e.git_blob,
            case
              when m.version is null then 'UNAPPLIED'
              when g.receipt is not null then 'APPLIED_EXACT'
              else 'APPLIED_UNVERIFIED'
            end as source_state,
            coalesce(g.execution_id,''),
            coalesce(g.source_head,''),
            coalesce(g.write_readback,'')
          from expected e
          left join supabase_migrations.schema_migrations m
            on m.version=e.version
           and m.name=e.name
          left join lateral (
            select
              og.execution_id,
              og.receipt,
              og.receipt->>'source_head' as source_head,
              og.receipt->>'write_readback' as write_readback
            from public.lf_operation_effect_guard og
            where og.effect_scope='SUPABASE_MIGRATION:'||e.version
              and og.state='SUCCEEDED'
              and og.receipt->>'migration_version'=e.version
              and og.receipt->>'migration_name'=e.name
              and og.receipt->>'source_blob'=e.git_blob
              and og.receipt->>'write_readback'='PASS'
            order by og.resolved_at desc nulls last
            limit 1
          ) g on true
          order by e.version;
          """
          Path(".lf_ci/db_candidate/provenance_query.sql").write_text(sql)
          PY

          docker run --rm -i \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE \
            postgres:17.6 \
            psql -X -v ON_ERROR_STOP=1 -At -F 
      - name: Persist exact candidate rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-db-candidate-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lf_ci/db_candidate/candidate_manifest.json
            .lf_ci/db_candidate/execution_mode.json
            .lf_ci/db_candidate/provenance.tsv
            .lf_ci/db_candidate/provenance_query.sql
            .lf_ci/db_candidate/candidate_readback.sql
            .lf_ci/db_candidate/ledger_before.txt
            .lf_ci/db_candidate/ledger_after.txt
            .lf_ci/db_candidate/candidate_rollback.log
          if-no-files-found: error
          retention-days: 30

\t' \
            < .lf_ci/db_candidate/provenance_query.sql \
            > .lf_ci/db_candidate/provenance.tsv

          mode="$(python3 - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path(".lf_ci/db_candidate/candidate_manifest.json").read_text())
          expected={(r["migration_version"],r["migration_name"],r["source_git_blob_sha1"]) for r in manifest["migrations"]}
          actual=[]
          for line in Path(".lf_ci/db_candidate/provenance.tsv").read_text().splitlines():
              if not line.strip():
                  continue
              parts=line.split("\t")
              if len(parts)!=7:
                  raise SystemExit(f"BLOCK_DB_CANDIDATE_PROVENANCE_SHAPE:{line}")
              actual.append(parts)
          if len(actual)!=len(expected):
              raise SystemExit("BLOCK_DB_CANDIDATE_PROVENANCE_COUNT_MISMATCH")
          states=set()
          evidence=[]
          for version,name,blob,state,execution_id,source_head,write_readback in actual:
              if (version,name,blob) not in expected:
                  raise SystemExit(f"BLOCK_DB_CANDIDATE_PROVENANCE_IDENTITY_MISMATCH:{version}:{name}:{blob}")
              states.add(state)
              evidence.append({
                  "migration_version":version,
                  "migration_name":name,
                  "source_git_blob_sha1":blob,
                  "state":state,
                  "execution_id":execution_id or None,
                  "source_head":source_head or None,
                  "write_readback":write_readback or None,
              })
          if states=={"UNAPPLIED"}:
              mode="UNAPPLIED_CANDIDATE_ROLLBACK"
          elif states=={"APPLIED_EXACT"}:
              mode="APPLIED_EXACT_SOURCE_READBACK"
          elif "APPLIED_UNVERIFIED" in states:
              raise SystemExit("BLOCK_DB_CANDIDATE_APPLIED_SOURCE_UNVERIFIED")
          else:
              raise SystemExit(f"BLOCK_DB_CANDIDATE_MIXED_APPLIED_STATE:{sorted(states)}")
          Path(".lf_ci/db_candidate/execution_mode.json").write_text(
              json.dumps({"mode":mode,"provenance":evidence},indent=2,sort_keys=True)+"\n"
          )
          print(mode)
          PY
          )"
          echo "DB_CANDIDATE_EXECUTION_MODE=$mode"

          if [[ "$mode" == "UNAPPLIED_CANDIDATE_ROLLBACK" ]]; then
            sql_file=.lf_ci/db_candidate/candidate_rollback.sql
            required_marker=LF_DB_CANDIDATE_ALL_APPLIED_BEFORE_ROLLBACK
          elif [[ "$mode" == "APPLIED_EXACT_SOURCE_READBACK" ]]; then
            python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          manifest=json.loads(Path(".lf_ci/db_candidate/candidate_manifest.json").read_text())
          chunks=[
              "\\set ON_ERROR_STOP on",
              "BEGIN;",
              "SET LOCAL statement_timeout = '120s';",
              "SET LOCAL lock_timeout = '15s';",
          ]
          for probe in manifest.get("post_apply_probes",[]):
              path=Path(probe["path"])
              raw=path.read_bytes()
              digest=hashlib.sha256(raw).hexdigest()
              if digest != probe["source_sha256"]:
                  raise SystemExit(f"BLOCK_DB_CANDIDATE_PROBE_SOURCE_DRIFT:{path}")
              chunks += [
                  f"\\echo LF_DB_APPLIED_EXACT_PROBE_BEGIN {path} sha256={digest}",
                  raw.decode("utf-8"),
                  f"\\echo LF_DB_APPLIED_EXACT_PROBE_PASS {path} sha256={digest}",
              ]
          chunks += [
              "SELECT 'LF_DB_APPLIED_EXACT_READBACK_BEFORE_ROLLBACK' AS probe_result;",
              "ROLLBACK;",
              "SELECT 'LF_DB_CANDIDATE_ROLLBACK_COMPLETE' AS probe_result;",
          ]
          Path(".lf_ci/db_candidate/candidate_readback.sql").write_text("\n".join(chunks)+"\n")
          PY
            sql_file=.lf_ci/db_candidate/candidate_readback.sql
            required_marker=LF_DB_APPLIED_EXACT_READBACK_BEFORE_ROLLBACK
          else
            echo "BLOCK_DB_CANDIDATE_UNKNOWN_EXECUTION_MODE:$mode" >&2
            exit 1
          fi

          docker run --rm -i \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE \
            postgres:17.6 \
            psql -X -v ON_ERROR_STOP=1 \
            < "$sql_file" \
            | tee .lf_ci/db_candidate/candidate_rollback.log

          grep -q "$required_marker" .lf_ci/db_candidate/candidate_rollback.log
          grep -q "LF_DB_CANDIDATE_ROLLBACK_COMPLETE" .lf_ci/db_candidate/candidate_rollback.log
          controls='${{ needs.feedback-tier-router.outputs.bootstrap_controls_json }}'
          if python3 -c 'import json,sys; raise SystemExit(0 if "POLICY_RESOLVER_REGRESSION" in json.loads(sys.argv[1]) else 1)' "$controls"; then
            grep -q "POLICY_RESOLVER_REGRESSION_PASS" .lf_ci/db_candidate/candidate_rollback.log
          fi

          docker run --rm \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE \
            postgres:17.6 \
            psql -X -v ON_ERROR_STOP=1 -At -c \
              "select count(*)::text||':'||coalesce(max(version),'') from supabase_migrations.schema_migrations" \
            > .lf_ci/db_candidate/ledger_after.txt

          cmp -s .lf_ci/db_candidate/ledger_before.txt .lf_ci/db_candidate/ledger_after.txt || {
            echo "BLOCK_DB_CANDIDATE_LEDGER_RESIDUE" >&2
            diff -u .lf_ci/db_candidate/ledger_before.txt .lf_ci/db_candidate/ledger_after.txt || true
            exit 1
          }
          echo "DB_CANDIDATE_CONTROL_PASS mode=$mode"

      - name: Persist exact candidate rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lf-db-candidate-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .lf_ci/db_candidate/candidate_manifest.json
            .lf_ci/db_candidate/ledger_before.txt
            .lf_ci/db_candidate/ledger_after.txt
            .lf_ci/db_candidate/candidate_rollback.log
          if-no-files-found: error
          retention-days: 30

