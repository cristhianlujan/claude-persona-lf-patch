name: IG M10.7 Projection Candidate CI
on:
  pull_request:
    paths:
      - 'supabase/functions/_shared/ig_snapshot_reader_v1.mjs'
      - 'supabase/functions/_shared/ig_snapshot_projection_provider_v2.mjs'
      - 'sandbox/lf_contract_gate_test/input_governance_runtime_candidate_judge/test_m107_snapshot_reader_v1.mjs'
      - 'sandbox/lf_contract_gate_test/input_governance_runtime_candidate_judge/test_m107_projection_provider_v2.mjs'
      - '.github/workflows/ig-m107-projection-candidate-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Node unit tests (candidate only, no DB or secrets)
        run: |
          node --test \
            sandbox/lf_contract_gate_test/input_governance_runtime_candidate_judge/test_m107_snapshot_reader_v1.mjs \
            sandbox/lf_contract_gate_test/input_governance_runtime_candidate_judge/test_m107_projection_provider_v2.mjs
