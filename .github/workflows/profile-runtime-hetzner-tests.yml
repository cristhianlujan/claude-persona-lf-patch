name: Profile Runtime Hetzner Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "services/profile_runtime_api/**"
      - "sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/**"
      - "supabase/migrations/20260902195500_lf_profile_runtime_hetzner_target_v1.sql"
      - ".github/workflows/profile-runtime-hetzner-tests.yml"
  push:
    branches:
      - "lf/profile-runtime-hetzner-main-port-20260903"
    paths:
      - "services/profile_runtime_api/**"
      - "sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/**"
      - "supabase/migrations/20260902195500_lf_profile_runtime_hetzner_target_v1.sql"
      - ".github/workflows/profile-runtime-hetzner-tests.yml"

permissions:
  contents: read

jobs:
  profile-runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r services/profile_runtime_api/requirements-dev.in

      - name: Test persistent Profile Runtime API
        env:
          PYTHONPATH: services/profile_runtime_api
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest services/profile_runtime_api/tests
