name: LF Rule Child PG17 Isolated

# Auxiliary evidence only. No production credentials, database or deploy actions.
on:
  pull_request:
    paths:
      - 'supabase/migrations/*lf_profile_rule_update_child_execution_v1.sql'
      - 'sandbox/lf_contract_gate_test/db_write_transport/lf_rule_child_pg17_original_source_fixture_v1.sql'
      - 'sandbox/lf_contract_gate_test/db_write_transport/lf_rule_child_pg17_seed_v1.sql'
      - 'sandbox/lf_contract_gate_test/db_write_transport/test_lf_rule_child_pg17_isolated.py'
      - '.github/workflows/lf-rule-child-pg17-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rule-child-isolated:
    name: rule-child-core-writer-pg17-isolated
    runs-on: ubuntu-latest
    timeout-minutes: 7
    services:
      pg:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: isolated-rule-child-only
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout exact candidate without credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply and test governed rule child using canonical writer and recorder
        env:
          PG_CONTAINER: ${{ job.services.pg.id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PG_CONTAINER}"
          python3 -m py_compile sandbox/lf_contract_gate_test/db_write_transport/test_lf_rule_child_pg17_isolated.py
          python3 sandbox/lf_contract_gate_test/db_write_transport/test_lf_rule_child_pg17_isolated.py
