name: P0 V4 Closed Loop Synthetic

on:
  pull_request:
    paths:
      - 'sandbox/story_creator_p0_visual/v1.1/**'
      - '.github/workflows/p0-v4-closed-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-v4-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract validator dependency
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Contracts
        run: python sandbox/story_creator_p0_visual/v1.1/scripts/validate_p0_v4_closed_loop.py
      - name: Graders
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_visual_discovery_v4_suite.py
      - name: Grader coverage
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_visual_grader_coverage_v4.py
      - name: Closed loop engine
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_visual_closed_loop_v4_suite.py
      - name: Durable state
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_visual_durable_state_v4.py
      - name: Known failure regressions
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_visual_known_failure_regression_v4.py
      - name: Forward adversarial
        run: python sandbox/story_creator_p0_visual/v1.1/evals/p0_visual_forward_adversarial_v4.py
