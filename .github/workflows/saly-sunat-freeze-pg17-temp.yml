name: SALY SUNAT freeze for purge temporary PG17
on:
  push:
    branches: [saly/sunat-freeze-before-delete-20261122]
    paths:
      - '.github/workflows/saly-sunat-freeze-pg17-temp.yml'
      - 'supabase/migrations/20261123001500_lf_saly_sunat_ingest_freeze_for_purge_v1.sql'
      - 'supabase/tests/saly_sunat_freeze_for_purge_pg17.sql'
permissions:
  contents: read
jobs:
  pg17-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_sunat_freeze_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_sunat_freeze_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saly_sunat_freeze_test
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated PG17 only
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = saly_sunat_freeze_test
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num;' | cut -c1-2)" = 17
      - name: Verify exact freeze migration and negative replay
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/saly_sunat_freeze_for_purge_pg17.sql 2>&1 | tee /tmp/saly_sunat_freeze.log
          grep -q 'PASS_SUNAT_FREEZE_POLICY_FALSE_RUN_HOLD_CATALOG_DISABLED_ORIGINAL_OPERATION_UNTOUCHED' /tmp/saly_sunat_freeze.log
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess
          s=Path('supabase/migrations/20261123001500_lf_saly_sunat_ingest_freeze_for_purge_v1.sql').read_text()
          d=s[s.index('DO $freeze$'):s.index('END $freeze$;')+len('END $freeze$;')]
          p=subprocess.run(['psql','-X','-v','ON_ERROR_STOP=1','-c',d],env=os.environ,capture_output=True,text=True)
          assert p.returncode!=0 and 'SUNAT_FREEZE_POLICY_DRIFT' in p.stderr,(p.returncode,p.stderr)
          print('PASS_FREEZE_REPLAY_FAILS_CLOSED_NO_DUPLICATE_POLICY')
          PY
