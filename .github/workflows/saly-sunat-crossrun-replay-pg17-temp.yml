name: SALY commercial RUN scoped replay PG17 isolated temporary
on:
  push:
    branches: [saly/sunat-commercial-crossrun-replay-fix-20261123]
    paths:
      - '.github/workflows/saly-sunat-crossrun-replay-pg17-temp.yml'
      - 'supabase/migrations/20261123024000_lf_saly_sunat_commercial_crossrun_replay_v1.sql'
      - 'skills/ai_sales_discovery/tests/sunat_commercial_crossrun_pg17.py'
permissions:
  contents: read
jobs:
  pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_pte_writer_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_pte_writer_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saly_pte_writer_ci
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated PostgreSQL 17 synthetic SALY substrate
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = saly_pte_writer_ci
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num;' | cut -c1-2)" = 17
          psql -X -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN; CREATE ROLE service_role NOLOGIN; CREATE ROLE supabase_read_only_user NOLOGIN;"
          psql -X -v ON_ERROR_STOP=1 -c "CREATE SCHEMA saly; CREATE TABLE saly.proyecto(codigo text PRIMARY KEY, estado text NOT NULL); INSERT INTO saly.proyecto VALUES ('SALY-001','ACTIVO');"
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121012002_lf_saly_ventas_discovery_staging_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121014653_lf_saly_ventas_discovery_coverage_fk_v1.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261121030300_lf_saly_ventas_pte_writer_core_v1.sql
          python3 - <<'PY'
          from pathlib import Path
          src=Path("supabase/migrations/20261121092501_lf_saly_ventas_pte_snapshot_unique_v1.sql").read_text()
          p=src.index("CREATE UNIQUE INDEX saly_pte_source_batch_once_v1")
          Path("/tmp/pte_unique.sql").write_text(src[p:src.index(";",p)+1]+"\n")
          PY
          psql -X -v ON_ERROR_STOP=1 -f /tmp/pte_unique.sql
      - name: Test legacy two-session replay and exact commercial RUN-specific variant
        run: |
          set -euo pipefail
          python3 skills/ai_sales_discovery/tests/sunat_commercial_crossrun_pg17.py 2>&1 | tee /tmp/saly_pg17_replay.log
          grep -q PASS_SUNAT_PG17_ROLLBACK_NEGATIVE_CROSS_RUN_LOCK_REPLAY_1_BATCH_2_COMPANIES /tmp/saly_pg17_replay.log
          grep -q PASS_SALY_SUNAT_PG17_LEGACY_CROSSRUN_REPLAY_UNCHANGED_COMMERCIAL_RUN_SCOPED_4_COMPANIES /tmp/saly_pg17_replay.log
          echo PASS_PG17_COMMERCIAL_RUN_SCOPED_SOURCE_REPLAY
