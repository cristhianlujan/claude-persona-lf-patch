name: SALY SUNAT physical DELETE PG17 isolated
on:
  push:
    branches:
      - saly/sunat-bulk-delete-20261122
    paths:
      - '.github/workflows/saly-sunat-bulk-delete-pg17.yml'
      - 'supabase/migrations/20261122191500_lf_saly_sunat_commercial_filter_v1.sql'
      - 'supabase/migrations/20261122222000_lf_saly_sunat_bulk_delete_v1.sql'
      - 'supabase/tests/saly_sunat_bulk_delete_v1_pg17_rollback.sql'
  pull_request:
    branches:
      - saly/sunat-elegibilidad-comercial-v1-20261122
    paths:
      - '.github/workflows/saly-sunat-bulk-delete-pg17.yml'
      - 'supabase/migrations/20261122191500_lf_saly_sunat_commercial_filter_v1.sql'
      - 'supabase/migrations/20261122222000_lf_saly_sunat_bulk_delete_v1.sql'
      - 'supabase/tests/saly_sunat_bulk_delete_v1_pg17_rollback.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  delete-rollback:
    name: Disposable PG17 negative/positive and ROLLBACK
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_sunat_delete_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_sunat_delete_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saly_sunat_delete_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Verify isolated server version and forbid external DB
        shell: bash
        run: |
          set -euo pipefail
          test "$PGHOST" = '127.0.0.1'
          test "$PGDATABASE" = 'saly_sunat_delete_test'
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num;' | cut -c1-2)" = '17'
      - name: Test exact migrations and physical DELETE with database ROLLBACK
        shell: bash
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/saly_sunat_bulk_delete_v1_pg17_rollback.sql 2>&1 | tee /tmp/saly_sunat_delete_pg17.log
          grep -q PASS_INSTALL_AND_VIEW_5_ROWS_1_ELIGIBLE_4_REJECTED /tmp/saly_sunat_delete_pg17.log
          grep -q PASS_PREPARE_ONCE_4_REJECTED /tmp/saly_sunat_delete_pg17.log
          grep -q PASS_BULK_DELETE_4_REJECTED_1_ELIGIBLE_MANIFEST_INTACT /tmp/saly_sunat_delete_pg17.log
          grep -q PASS_PG17_DISPOSABLE_ROLLBACK_5_ORIGINAL_ROWS /tmp/saly_sunat_delete_pg17.log
          echo PASS_SALY_SUNAT_PHYSICAL_DELETE_PG17_DISPOSABLE
