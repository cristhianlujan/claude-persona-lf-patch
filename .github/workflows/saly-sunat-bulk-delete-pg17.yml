name: SALY SUNAT bulk delete temporary PG17 verification
on:
  push:
    branches: [saly/sunat-bulk-delete-20261122]
    paths:
      - '.github/workflows/saly-sunat-bulk-delete-pg17.yml'
      - 'supabase/migrations/20261122191500_lf_saly_sunat_commercial_filter_v1.sql'
      - 'supabase/migrations/20261122222000_lf_saly_sunat_bulk_delete_v1.sql'
      - 'supabase/tests/saly_sunat_bulk_delete_v1_pg17_rollback.sql'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saly_sunat_delete_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d saly_sunat_delete_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: saly_sunat_delete_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Validate isolated DB and source test Python syntax
        run: |
          set -euo pipefail
          test "$PGHOST" = 127.0.0.1
          test "$PGDATABASE" = saly_sunat_delete_test
          test "$(psql -X -qAt -v ON_ERROR_STOP=1 -c 'SHOW server_version_num;' | cut -c1-2)" = 17
          python3 -m py_compile skills/ai_sales_discovery/tests/sunat_governed_batch_pg17.py skills/ai_sales_discovery/tests/test_sunat_bulk_delete_source_v1.py
          python3 skills/ai_sales_discovery/tests/test_sunat_bulk_delete_source_v1.py
      - name: Apply exact migrations, 50/51 dynamic policy, delete and rollback
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/saly_sunat_bulk_delete_v1_pg17_rollback.sql 2>&1 | tee /tmp/saly_pg17.log
          grep -q PASS_INSTALL_AND_VIEW_5_ROWS_1_ELIGIBLE_4_REJECTED /tmp/saly_pg17.log
          grep -q PASS_DYNAMIC_COMMERCIAL_THRESHOLD_50_TO_51_TO_50 /tmp/saly_pg17.log
          grep -q PASS_BULK_DELETE_4_REJECTED_1_ELIGIBLE_MANIFEST_INTACT /tmp/saly_pg17.log
          grep -q PASS_PG17_DISPOSABLE_ROLLBACK_5_ORIGINAL_ROWS /tmp/saly_pg17.log
          echo PASS_SALY_BULK_DELETE_PG17_EXACT_SOURCE
