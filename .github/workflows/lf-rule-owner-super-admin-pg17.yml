name: LF rule SUPER_ADMIN owner metadata | isolated PG17

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-super-admin-578-pg17:
    name: Owner/creator metadata 578 | positive, negative, hashes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure Postgres client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Execute frozen 578-rule owner backfill and integrity tests
        run: python3 sandbox/lf_contract_gate_test/rules_owner_super_admin_v1/test_pg17_owner_backfill.py
