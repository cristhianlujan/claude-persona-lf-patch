name: Validate LF Packs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "lf/**"

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce S26 Cloudflare no-download guard
        env:
          LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
        shell: bash
        run: |
          set -euo pipefail
          route="sandbox/lf_contract_gate_test/profile_execution_runtime/s26_runtime_route_v1.json"
          guard="sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_model_download_guard.py"
          if [[ -e "$route" || -e "$guard" ]]; then
            test -f "$route"
            test -f "$guard"
            python3 "$guard" --repo-root .
          else
            echo "S26_CLOUDFLARE_GUARD=SKIP_ROUTE_NOT_PRESENT"
          fi

      - name: Preflight S26 remote judge transport probe
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 559
        run: |
          python3 -m py_compile sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_judge_challenger_calibration.py
          python3 -m py_compile sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_judge_transport_probe.py

      - name: Execute one-call S26 remote judge transport probe
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 559
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_CANARY_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_cloudflare_judge_transport_probe.py \
            --result-path s26-remote-judge-transport-shape.json

      - name: Upload S26 remote judge transport evidence
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 559
        uses: actions/upload-artifact@v4
        with:
          name: s26-remote-judge-transport-${{ github.run_id }}
          path: s26-remote-judge-transport-shape.json
          if-no-files-found: warn
          retention-days: 30

      - name: Install Profile Runtime API test dependencies
        run: python -m pip install --disable-pip-version-check -r services/profile_runtime_api/requirements-dev.in

      - name: Test persistent Profile Runtime API
        env:
          PYTHONPATH: services/profile_runtime_api
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest services/profile_runtime_api/tests

      - name: Validate profile template pack
        run: python profiles/_template/validators/validate_pack.py profiles/_template

      - name: Validate skill template pack
        run: python skills/_template/validators/validate_pack.py skills/_template

      - name: Validate skill creator pack
        run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator

      - name: Validate profile creator pack
        run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator

      - name: Validate learning engine pack
        run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine

      - name: Validate PROFILE_RUNTIME V3 quality and lineage gates
        env:
          LF_PERSISTENT_RUNTIME_SCOPE: ISOLATED_CANDIDATE
          LF_LLAMA_SOURCE_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/test_*.py)
          if (( ${#tests[@]} == 0 )); then
            echo "PROFILE_RUNTIME_V3_TESTS_MISSING"
            exit 1
          fi
          printf 'PROFILE_RUNTIME_V3_TEST_COUNT=%s\n' "${#tests[@]}"
          failures=0
          for test_file in "${tests[@]}"; do
            echo "RUNNING=${test_file}"
            if python "${test_file}"; then
              echo "RESULT=PASS TEST=${test_file}"
            else
              rc=$?
              echo "RESULT=FAIL RC=${rc} TEST=${test_file}"
              failures=$((failures+1))
            fi
          done
          echo "PROFILE_RUNTIME_V3_FAILURE_COUNT=${failures}"
          if (( failures > 0 )); then
            exit 1
          fi
