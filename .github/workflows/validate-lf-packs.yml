name: Validate LF Packs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "lf/**"

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate profile template pack
        run: python profiles/_template/validators/validate_pack.py profiles/_template

      - name: Validate skill template pack
        run: python skills/_template/validators/validate_pack.py skills/_template

      - name: Validate skill creator pack
        run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator

      - name: Validate profile creator pack
        run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator

      - name: Validate learning engine pack
        run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine

      - name: Validate learning engine semantic support contract
        run: python skills/learning_engine/validators/validate_semantic_support.py skills/learning_engine/evals/semantic_support_matrix.json

  semantic-support-live-judge:
    name: Qwen7B package semantic support judge
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build pinned llama.cpp server from source
        env:
          LLAMA_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          git checkout --detach "$LLAMA_COMMIT"
          test "$(git rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build build --config Release -j 4 --target llama-server
          test -x build/bin/llama-server

      - name: Download and verify pinned Qwen2.5-VL-7B semantic judge
        env:
          MODEL_COMMIT: 508edd0afaa66bb9e9f40587acc2184f02daf1f6
          MODEL_SHA256: 9258bf05b12686d097ff3b6b18d968ab393649780aa2b3cd67fec43d50554392
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lf-semantic-model"
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://huggingface.co/ggml-org/Qwen2.5-VL-7B-Instruct-GGUF/resolve/${MODEL_COMMIT}/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf?download=true" \
            -o "$RUNNER_TEMP/lf-semantic-model/model.gguf"
          echo "${MODEL_SHA256}  $RUNNER_TEMP/lf-semantic-model/model.gguf" | sha256sum -c -

      - name: Execute independent Learning Engine package semantic judge
        env:
          LF_REPOSITORY_VISIBILITY: public
          LF_RUNNER_LABEL: ubuntu-latest
          LF_LLAMA_SOURCE_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
          LF_LLAMA_SERVER_PATH: ${{ runner.temp }}/llama.cpp/build/bin/llama-server
          LF_SEMANTIC_MODEL_PATH: ${{ runner.temp }}/lf-semantic-model/model.gguf
        run: |
          set -euo pipefail
          python skills/learning_engine/validators/run_semantic_support_live_judge.py
