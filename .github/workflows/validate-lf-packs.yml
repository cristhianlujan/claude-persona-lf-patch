name: Validate LF Packs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main
      - "lf/**"
  workflow_call:
    inputs:
      base_sha:
        description: "Exact diff base supplied by the pass orchestrator"
        required: false
        type: string
      head_sha:
        description: "Exact candidate head supplied by the pass orchestrator"
        required: false
        type: string
      changed_paths_json:
        description: "Exact repository-relative changed path array supplied by the pass orchestrator"
        required: false
        type: string
      timeout_seconds:
        description: "Per-pack local validator timeout"
        required: false
        default: 120
        type: number

permissions:
  contents: read

jobs:
  pack-context:
    name: Resolve exact Pack Validation context
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.context.outputs.base_sha }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      changed_paths_json: ${{ steps.context.outputs.changed_paths_json }}
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}

      - name: Resolve exact Pack Validation context
        id: context
        env:
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_CHANGED_PATHS_JSON: ${{ inputs.changed_paths_json }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          base="${INPUT_BASE_SHA:-${EVENT_BASE_SHA:-}}"
          head="${INPUT_HEAD_SHA:-${EVENT_HEAD_SHA:-}}"
          [[ "$base" =~ ^[0-9a-f]{40}$ ]] || { echo "BLOCK_PACK_VALIDATION_BASE_SHA" >&2; exit 1; }
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "BLOCK_PACK_VALIDATION_HEAD_SHA" >&2; exit 1; }
          git fetch --no-tags origin "$base" "$head"

          if [[ -n "${INPUT_CHANGED_PATHS_JSON:-}" ]]; then
            changed_paths_json="$INPUT_CHANGED_PATHS_JSON"
          else
            changed_paths_json="$(git diff --name-only "$base" "$head" -- | python3 -c 'import json,sys; print(json.dumps([line.rstrip("\n") for line in sys.stdin if line.rstrip("\n")],separators=(",",":")))')"
          fi

          {
            echo "base_sha=$base"
            echo "head_sha=$head"
            echo "changed_paths_json=$changed_paths_json"
          } >> "$GITHUB_OUTPUT"

  pack-validation:
    name: Execute PACK_VALIDATION
    needs: pack-context
    uses: ./.github/workflows/lf-pack-validation-core.yml
    with:
      base_sha: ${{ needs.pack-context.outputs.base_sha }}
      head_sha: ${{ needs.pack-context.outputs.head_sha }}
      changed_paths_json: ${{ needs.pack-context.outputs.changed_paths_json }}
      timeout_seconds: ${{ inputs.timeout_seconds || 120 }}
