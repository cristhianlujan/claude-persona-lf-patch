name: Validate LF Packs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "lf/**"]

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python profiles/_template/validators/validate_pack.py profiles/_template
      - run: python skills/_template/validators/validate_pack.py skills/_template
      - run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator
      - run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator
      - run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine
      - name: Validate learning consumer champion benchmark
        run: python sandbox/lf_contract_gate_test/validate_learning_consumer_benchmark.py

  readback-lf-learning-state:
    name: Read LF learning state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
    steps:
      - name: Detect sandbox credentials
        id: credentials
        env: {SUPABASE_DB_PASSWORD: "${{ secrets.LF_SUPABASE_DB_PASSWORD }}"}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_PASSWORD:-}"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Reconcile Router, processed KB and consumers
        if: steps.credentials.outputs.ready == 'true'
        env: {PGPASSWORD: "${{ secrets.LF_SUPABASE_DB_PASSWORD }}"}
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST="$SUPABASE_POOLER_HOST" PGPORT=5432 PGUSER="postgres.${SUPABASE_PROJECT_ID}" PGDATABASE=postgres PGSSLMODE=require
          q() { psql -X -v ON_ERROR_STOP=1 -Atqc "$1"; }
          echo "READBACK_TS=$(q "select now()")"
          echo "ROUTER_REGISTRY_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select * from public.lf_router_action_registry where operation_code='LEARNING_BRIDGE_KB_CARD_LF' or action_code='KNOWLEDGE_LEARNING_BRIDGE' order by updated_at desc) x"
          echo "ROUTER_REGISTRY_END"
          echo "RUN30_STEPS_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select * from public.lf_operation_execution_steps where execution_id='LF-AUTOLEARN-RUN-20260831-030' order by step_order,created_at) x"
          echo "RUN30_STEPS_END"
          echo "RUN30_EVENTS_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select id,evento_tipo,entidad_tipo,entidad_codigo,descripcion,severidad,payload,created_at from public.lf_eventos where id between 9683 and 9700 order by id) x"
          echo "RUN30_EVENTS_END"
          echo "ELIGIBLE_COUNT_BEGIN"
          q "select count(*) from public.lf_knowledge_base where kb_category='COMPETENCIA' and consumer_ready=true and grounding_status='GROUNDED' and decision_upstream='ALLOW_PROD_GATE'"
          echo "ELIGIBLE_COUNT_END"
          echo "RUN30_MARKED_KB_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select kb_id,kb_subcategory,topic,competitor,quality_score,source_url,evidence_event_id,updated_by_execution_id from public.lf_knowledge_base where updated_by_execution_id='LF-AUTOLEARN-RUN-20260831-030' order by quality_score desc nulls last) x"
          echo "RUN30_MARKED_KB_END"
          echo "ASSET_STATUS_DISTRIBUTION_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select tipo_activo,estado_operativo,runtime_estado,count(*) n from public.v_lf_fuente_operativa where tipo_activo in ('PERFIL','PROFILE','AGENT','SKILL','ADAPTER','OPERATION') group by 1,2,3 order by 1,2,3) x"
          echo "ASSET_STATUS_DISTRIBUTION_END"
          echo "CONSUMER_CANDIDATES_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select codigo_activo,nombre_canonico,tipo_activo,subtipo_activo,estado_documental,estado_operativo,runtime_estado,version_normalizada from public.v_lf_fuente_operativa where tipo_activo in ('PERFIL','PROFILE','AGENT','SKILL','ADAPTER','OPERATION') and (nombre_canonico ilike '%cliente%' or nombre_canonico ilike '%ui%' or nombre_canonico ilike '%deuda%' or nombre_canonico ilike '%oferta%' or nombre_canonico ilike '%pago%' or nombre_canonico ilike '%learning%' or nombre_canonico ilike '%aprendiz%' or codigo_activo in ('ACT-0046','ACT-0012')) order by tipo_activo,codigo_activo limit 100) x"
          echo "CONSUMER_CANDIDATES_END"
          echo "CARD_FACTORY_ROUTER_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select * from public.lf_router_action_registry where operation_code='CREACION_CARD_LF' order by updated_at desc) x"
          echo "CARD_FACTORY_ROUTER_END"
          echo "CARD_FACTORY_EXECUTIONS_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select execution_id,status,target_type,target_code,started_at,completed_at,manifest from public.lf_operation_execution where operation_code='CREACION_CARD_LF' order by created_at desc limit 8) x"
          echo "CARD_FACTORY_EXECUTIONS_END"
          echo "READBACK_STATUS=PASS"
