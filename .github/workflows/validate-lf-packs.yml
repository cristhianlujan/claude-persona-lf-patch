name: Validate LF Packs

on:
  pull_request:
    branches:
      - main
      - "lf/s26-ci-matrix-base-20260910"
  push:
    branches:
      - main
      - "lf/**"

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: S30 self-governance regression and fresh receipt gate
        shell: bash
        run: |
          set -euo pipefail
          python gobernanza/judges/validate_s30_self_governance_gate.py --self-test
          S30_CI_SCOPE="RUN"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            S30_CI_SCOPE="$(python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          payload = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          pr = payload.get("pull_request") or {}
          base = ((pr.get("base") or {}).get("sha") or "").strip()
          head = ((pr.get("head") or {}).get("sha") or "").strip()
          if len(base) != 40 or len(head) != 40:
              print("RUN")
              raise SystemExit(0)
          subprocess.run(["git", "fetch", "origin", base, head, "--depth=1"], check=True, capture_output=True, text=True)
          changed = set(subprocess.run(["git", "diff", "--name-only", base, head], check=True, capture_output=True, text=True).stdout.splitlines())
          direct = {
              "gobernanza/contratos/s30_self_governance_gate_v1.json",
              "gobernanza/judges/validate_s30_self_governance_gate.py",
              "sandbox/lf_contract_gate_test/s30_self_governance/s30_a_prewrite_receipt.json",
          }
          if changed.intersection(direct):
              print("RUN")
              raise SystemExit(0)
          workflow = ".github/workflows/validate-lf-packs.yml"
          if workflow not in changed:
              print("SKIP")
              raise SystemExit(0)

          def show(ref: str) -> list[str]:
              return subprocess.run(["git", "show", f"{ref}:{workflow}"], check=True, capture_output=True, text=True).stdout.splitlines()

          def s30_block(lines: list[str]) -> str | None:
              marker = "- name: S30 self-governance regression and fresh receipt gate"
              start = next((i for i, line in enumerate(lines) if line.strip() == marker), None)
              if start is None:
                  return None
              indent = len(lines[start]) - len(lines[start].lstrip())
              out: list[str] = []
              for line in lines[start:]:
                  current_indent = len(line) - len(line.lstrip())
                  if out and current_indent == indent and line.strip().startswith("- name:"):
                      break
                  out.append(line.rstrip())
              return "\n".join(out)

          before = s30_block(show(base))
          after = s30_block(show(head))
          print("RUN" if before is None or after is None or before != after else "SKIP")
          PY
            )"
          fi
          if [[ "${S30_CI_SCOPE}" == "RUN" ]]; then
            python gobernanza/judges/validate_s30_self_governance_gate.py \
              --ci-auto \
              --ci-receipt sandbox/lf_contract_gate_test/s30_self_governance/s30_a_prewrite_receipt.json
          else
            echo "S30_CI_AUTO_SKIPPED_UNRELATED_SHARED_WORKFLOW_CHANGE"
          fi

      - name: S26-E governance EKB applicability and card fallback gate
        run: |
          python gobernanza/judges/validate_s26_governance_ekb_gate_strict.py \
            --self-test \
            --input sandbox/lf_contract_gate_test/s26_governance_ekb/s26_e_preexecution_receipt.json

      - name: Install Profile Runtime API test dependencies
        run: python -m pip install --disable-pip-version-check -r services/profile_runtime_api/requirements-dev.in

      - name: Test persistent Profile Runtime API
        env:
          PYTHONPATH: services/profile_runtime_api
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest services/profile_runtime_api/tests

      - name: Validate profile template pack
        run: python profiles/_template/validators/validate_pack.py profiles/_template

      - name: Validate skill template pack
        run: python skills/_template/validators/validate_pack.py skills/_template

      - name: Validate skill creator pack
        run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator

      - name: Validate profile creator pack
        run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator

      - name: Validate learning engine pack
        run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine

      - name: Validate S26 semantic-to-render binding regressions
        run: python sandbox/lf_contract_gate_test/profile_execution_runtime/run_semantic_binding_validator_tests.py

      - name: Validate strict independent receipt-to-bundle binding regressions
        run: python profiles/quality_pack/evals/run_independent_review_bundle_binding_tests.py

      - name: Validate PROFILE_RUNTIME V3 quality and lineage gates
        env:
          LF_PERSISTENT_RUNTIME_SCOPE: ISOLATED_CANDIDATE
          LF_LLAMA_SOURCE_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/test_*.py)
          if (( ${#tests[@]} == 0 )); then
            echo "PROFILE_RUNTIME_V3_TESTS_MISSING"
            exit 1
          fi
          printf 'PROFILE_RUNTIME_V3_TEST_COUNT=%s\n' "${#tests[@]}"
          failures=0
          for test_file in "${tests[@]}"; do
            echo "RUNNING=${test_file}"
            if python "${test_file}"; then
              echo "RESULT=PASS TEST=${test_file}"
            else
              rc=$?
              echo "RESULT=FAIL RC=${rc} TEST=${test_file}"
              failures=$((failures+1))
            fi
          done
          echo "PROFILE_RUNTIME_V3_FAILURE_COUNT=${failures}"
          if (( failures > 0 )); then
            exit 1
          fi
