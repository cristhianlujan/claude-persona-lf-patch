name: Validate LF Packs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "lf/**"

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce S26 Cloudflare no-download guard
        env:
          LF_S26_PRIMARY_RUNTIME: CLOUDFLARE_WORKERS_AI
        shell: bash
        run: |
          set -euo pipefail
          route="sandbox/lf_contract_gate_test/profile_execution_runtime/s26_runtime_route_v1.json"
          guard="sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_model_download_guard.py"
          if [[ -e "$route" || -e "$guard" ]]; then
            test -f "$route"
            test -f "$guard"
            python3 "$guard" --repo-root .
          else
            echo "S26_CLOUDFLARE_GUARD=SKIP_ROUTE_NOT_PRESENT"
          fi

      - name: Execute one-call S26 DeepSeek judge challenger preflight
        id: deepseek_judge_preflight
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 559
        continue-on-error: true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_CANARY_TOKEN: ${{ secrets.CLOUDFLARE_AI_CANARY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.error, urllib.request
          from pathlib import Path

          model = "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b"
          primary = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
          case = {
              "id": "DEEPSEEK_JUDGE_PREFLIGHT_CONFIRMATION_COPY",
              "expected": "CONTRADICTS",
              "rule": "The selected treatment must preserve the existing confirmation copy and must not remove it.",
              "evidence": "Remove the existing confirmation copy entirely and leave only the action control.",
          }
          schema = {
              "type": "object",
              "additionalProperties": False,
              "properties": {
                  "verdict": {"type": "string", "enum": ["COMPLIES", "CONTRADICTS", "UNCERTAIN"]},
                  "reason_code": {"type": "string", "minLength": 2, "maxLength": 80},
              },
              "required": ["verdict", "reason_code"],
          }
          system = (
              "You are a narrow semantic compliance classifier, not a task solver. "
              "Judge only whether EVIDENCE complies with RULE. Do not rewrite or repair it. "
              "Return exactly the constrained JSON verdict. Use UNCERTAIN only when the evidence "
              "is insufficient to establish compliance or contradiction."
          )
          result = {
              "schema": "S26_DEEPSEEK_REMOTE_JUDGE_PREFLIGHT_V1",
              "strategy": "S26",
              "provider": "cloudflare_workers_ai",
              "model": model,
              "primary_model": primary,
              "case_id": case["id"],
              "case_sha256": hashlib.sha256(json.dumps(case, sort_keys=True).encode()).hexdigest(),
              "expected": case["expected"],
              "max_tokens": 512,
              "authority_changed": False,
              "canonical_judge_authority": "QWEN2_5_VL_7B_Q4_K_M_UNCHANGED",
              "promotion_authorized": False,
              "production_mutation": False,
              "model_download_executed": False,
              "local_model_fallback_used": False,
              "paid_fallback_used": False,
              "provider_infrastructure_shared": True,
              "full_independent_authority_proven": False,
          }
          payload = {
              "messages": [
                  {"role": "system", "content": system},
                  {"role": "user", "content": json.dumps({"rule": case["rule"], "evidence": case["evidence"]}, sort_keys=True)},
              ],
              "response_format": {"type": "json_schema", "json_schema": schema},
              "stream": False,
              "temperature": 0,
              "top_p": 1,
              "seed": 42,
              "max_tokens": 512,
          }
          account = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_AI_CANARY_TOKEN"]
          req = urllib.request.Request(
              f"https://api.cloudflare.com/client/v4/accounts/{account}/ai/run/{model}",
              data=json.dumps(payload).encode(),
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json", "Accept": "application/json"},
              method="POST",
          )
          started = time.monotonic()
          rc = 2
          try:
              with urllib.request.urlopen(req, timeout=90) as response:
                  envelope = json.loads(response.read().decode())
              result["elapsed_s"] = round(time.monotonic() - started, 3)
              if not isinstance(envelope, dict) or envelope.get("success") is not True:
                  raise RuntimeError("CLOUDFLARE_ENVELOPE_FAILURE")
              model_result = envelope.get("result")
              if not isinstance(model_result, dict):
                  raise RuntimeError("CLOUDFLARE_RESULT_INVALID")
              value = model_result.get("response")
              if isinstance(value, dict) and value:
                  parsed = value
                  raw = json.dumps(value, sort_keys=True)
                  result["provider_response_shape"] = "object:" + ",".join(sorted(value))
                  result["fenced_output"] = False
              elif isinstance(value, str) and value.strip():
                  raw = value.strip()
                  result["provider_response_shape"] = f"string:{len(raw)}"
                  result["fenced_output"] = raw.startswith("```")
                  parsed = json.loads(raw)
              else:
                  raise RuntimeError("FINAL_CONTENT_EMPTY")
              result["raw_output_sha256"] = hashlib.sha256(raw.encode()).hexdigest()
              if not isinstance(parsed, dict) or set(parsed) != {"verdict", "reason_code"}:
                  raise RuntimeError("FINAL_JSON_SHAPE_INVALID")
              verdict = parsed.get("verdict")
              reason = parsed.get("reason_code")
              if verdict not in {"COMPLIES", "CONTRADICTS", "UNCERTAIN"}:
                  raise RuntimeError("FINAL_VERDICT_INVALID")
              if not isinstance(reason, str) or not 2 <= len(reason) <= 80:
                  raise RuntimeError("FINAL_REASON_CODE_INVALID")
              usage = model_result.get("usage") if isinstance(model_result.get("usage"), dict) else {}
              result["usage"] = {str(k): v for k, v in usage.items() if isinstance(v, (int, float, bool)) or v is None}
              result["observed"] = verdict
              result["reason_code"] = reason
              result["matches_expected"] = verdict == case["expected"]
              result["status"] = "PREFLIGHT_PASS_CHALLENGER_ONLY" if result["matches_expected"] and not result["fenced_output"] else "FAIL_CLOSED"
              rc = 0 if result["status"] == "PREFLIGHT_PASS_CHALLENGER_ONLY" else 2
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace")[-500:].replace("\n", " ")
              result["elapsed_s"] = round(time.monotonic() - started, 3)
              result["status"] = "FAIL_CLOSED"
              result["error"] = f"CLOUDFLARE_HTTP_{exc.code}:{detail}"
          except Exception as exc:
              result["elapsed_s"] = round(time.monotonic() - started, 3)
              result["status"] = "FAIL_CLOSED"
              result["error"] = f"{type(exc).__name__}:{str(exc)[:500]}"
          Path("s26-deepseek-judge-preflight.json").write_text(json.dumps(result, indent=2, sort_keys=True) + "\n")
          print("S26_DEEPSEEK_JUDGE_PREFLIGHT=" + json.dumps(result, sort_keys=True))
          raise SystemExit(rc)
          PY

      - name: Upload S26 DeepSeek judge challenger evidence
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.number == 559
        uses: actions/upload-artifact@v4
        with:
          name: s26-deepseek-judge-preflight-${{ github.run_id }}
          path: s26-deepseek-judge-preflight.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce S26 DeepSeek judge challenger preflight result
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 559 && steps.deepseek_judge_preflight.outcome != 'success'
        run: |
          echo "S26_DEEPSEEK_JUDGE_PREFLIGHT=FAIL_CLOSED"
          exit 1

      - name: Install Profile Runtime API test dependencies
        run: python -m pip install --disable-pip-version-check -r services/profile_runtime_api/requirements-dev.in

      - name: Test persistent Profile Runtime API
        env:
          PYTHONPATH: services/profile_runtime_api
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest services/profile_runtime_api/tests

      - name: Validate profile template pack
        run: python profiles/_template/validators/validate_pack.py profiles/_template

      - name: Validate skill template pack
        run: python skills/_template/validators/validate_pack.py skills/_template

      - name: Validate skill creator pack
        run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator

      - name: Validate profile creator pack
        run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator

      - name: Validate learning engine pack
        run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine

      - name: Validate PROFILE_RUNTIME V3 quality and lineage gates
        env:
          LF_PERSISTENT_RUNTIME_SCOPE: ISOLATED_CANDIDATE
          LF_LLAMA_SOURCE_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/test_*.py)
          if (( ${#tests[@]} == 0 )); then
            echo "PROFILE_RUNTIME_V3_TESTS_MISSING"
            exit 1
          fi
          printf 'PROFILE_RUNTIME_V3_TEST_COUNT=%s\n' "${#tests[@]}"
          failures=0
          for test_file in "${tests[@]}"; do
            echo "RUNNING=${test_file}"
            if python "${test_file}"; then
              echo "RESULT=PASS TEST=${test_file}"
            else
              rc=$?
              echo "RESULT=FAIL RC=${rc} TEST=${test_file}"
              failures=$((failures+1))
            fi
          done
          echo "PROFILE_RUNTIME_V3_FAILURE_COUNT=${failures}"
          if (( failures > 0 )); then
            exit 1
          fi
