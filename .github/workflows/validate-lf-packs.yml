name: Validate LF Packs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "lf/**"]

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python profiles/_template/validators/validate_pack.py profiles/_template
      - run: python skills/_template/validators/validate_pack.py skills/_template
      - run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator
      - run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator
      - run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine
      - name: Validate learning consumer champion benchmark
        run: python sandbox/lf_contract_gate_test/validate_learning_consumer_benchmark.py

  readback-lf-learning-state:
    name: Read LF learning state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
    steps:
      - name: Detect sandbox credentials
        id: credentials
        env: {SUPABASE_DB_PASSWORD: "${{ secrets.LF_SUPABASE_DB_PASSWORD }}"}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_DB_PASSWORD:-}"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Compute effective backlog and consumer inventory
        if: steps.credentials.outputs.ready == 'true'
        env: {PGPASSWORD: "${{ secrets.LF_SUPABASE_DB_PASSWORD }}"}
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST="$SUPABASE_POOLER_HOST" PGPORT=5432 PGUSER="postgres.${SUPABASE_PROJECT_ID}" PGDATABASE=postgres PGSSLMODE=require
          q() { psql -X -v ON_ERROR_STOP=1 -Atqc "$1"; }
          echo "READBACK_TS=$(q "select now()")"
          echo "ROUTER_REGISTRY_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select * from public.lf_router_action_registry where operation_code='LEARNING_BRIDGE_KB_CARD_LF' or action_code='KNOWLEDGE_LEARNING_BRIDGE' order by updated_at desc) x"
          echo "ROUTER_REGISTRY_END"
          echo "PROCESSED_KB_IDS_BEGIN"
          q "select coalesce(jsonb_agg(distinct e.entidad_codigo)::text,'[]') from public.lf_eventos e where e.entidad_tipo='KNOWLEDGE' and (e.payload->>'producer')='LF_APRENDIZAJE_AUTONOMO' and coalesce(e.payload->>'eligibility','') like '%PASS%'"
          echo "PROCESSED_KB_IDS_END"
          echo "EFFECTIVE_BACKLOG_COUNT_BEGIN"
          q "with p as (select distinct entidad_codigo::uuid kb_id from public.lf_eventos where entidad_tipo='KNOWLEDGE' and payload->>'producer'='LF_APRENDIZAJE_AUTONOMO' and coalesce(payload->>'eligibility','') like '%PASS%') select count(*) from public.lf_knowledge_base k left join p using(kb_id) where k.kb_category='COMPETENCIA' and k.consumer_ready=true and k.grounding_status='GROUNDED' and k.decision_upstream='ALLOW_PROD_GATE' and p.kb_id is null"
          echo "EFFECTIVE_BACKLOG_COUNT_END"
          echo "EFFECTIVE_BACKLOG_BEGIN"
          q "with p as (select distinct entidad_codigo::uuid kb_id from public.lf_eventos where entidad_tipo='KNOWLEDGE' and payload->>'producer'='LF_APRENDIZAJE_AUTONOMO' and coalesce(payload->>'eligibility','') like '%PASS%') select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select k.kb_id,k.kb_subcategory,k.topic,k.competitor,k.quality_score,k.source_url,k.evidence_pack,k.kb_enriched from public.lf_knowledge_base k left join p using(kb_id) where k.kb_category='COMPETENCIA' and k.consumer_ready=true and k.grounding_status='GROUNDED' and k.decision_upstream='ALLOW_PROD_GATE' and p.kb_id is null order by k.quality_score desc nulls last,k.updated_at desc limit 25) x"
          echo "EFFECTIVE_BACKLOG_END"
          echo "ALL_CONSUMER_ASSETS_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select codigo_activo,nombre_canonico,tipo_activo,subtipo_activo,estado_documental,estado_operativo,runtime_estado,version_normalizada,url from public.v_lf_fuente_operativa where tipo_activo in ('PERFIL','PROFILE','AGENT','SKILL','ADAPTER','OPERATION') order by tipo_activo,codigo_activo) x"
          echo "ALL_CONSUMER_ASSETS_END"
          echo "CARDS_CURRENT_BEGIN"
          q "select coalesce(jsonb_agg(to_jsonb(x))::text,'[]') from (select id_card,nombre_card,estado,decision,observaciones,raw_payload,created_by_execution_id,updated_by_execution_id from public.lf_cards where id_card ilike '%LEARN%' or nombre_card ilike '%aprendiz%' or nombre_card ilike '%deuda%' or nombre_card ilike '%oferta%' or nombre_card ilike '%pago%' order by updated_at desc limit 50) x"
          echo "CARDS_CURRENT_END"
          echo "READBACK_STATUS=PASS"
