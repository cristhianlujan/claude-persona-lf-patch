name: Validate LF Packs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "lf/**"

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate profile template pack
        run: python profiles/_template/validators/validate_pack.py profiles/_template

      - name: Validate skill template pack
        run: python skills/_template/validators/validate_pack.py skills/_template

      - name: Validate skill creator pack
        run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator

      - name: Validate profile creator pack
        run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator

      - name: Validate learning engine pack
        run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine

      - name: Install story maturity audit dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            PyYAML==6.0.2 \
            jsonschema==4.23.0

      - name: Execute story maturity external fixtures
        run: |
          set -euo pipefail
          ROOT="skills/creating-integral-user-stories"

          python "$ROOT/scripts/assess_evidence_tier.py" --self-test
          python "$ROOT/scripts/validate_screen_ingestion.py" \
            "$ROOT/evals/fixtures/screen_ingestion_dense.json" \
            --evidence-ref fixture://screen_ingestion_dense
          python "$ROOT/scripts/validate_screen_ingestion.py" --self-test

          J02_SHA="$(sha256sum "$ROOT/scripts/validate_screen_decomposition_v08.py" | awk '{print $1}')"
          REG="candidate://creating-integral-user-stories/ART_SCRIPT_VALIDATE_SCREEN_DECOMPOSITION_V08"

          LF_EXECUTOR_IDENTITY=CI_EXTERNAL_FIXTURE \
          LF_JUDGE_VERSION=v0.8 \
          python "$ROOT/scripts/validate_screen_decomposition_v08.py" \
            "$ROOT/evals/fixtures/j02_external_positive.json" \
            --evidence-ref fixture://j02_external_positive \
            --expected-validator-sha256 "$J02_SHA" \
            --registration-ref "$REG"

          set +e
          LF_EXECUTOR_IDENTITY=CI_EXTERNAL_FIXTURE \
          LF_JUDGE_VERSION=v0.8 \
          python "$ROOT/scripts/validate_screen_decomposition_v08.py" \
            "$ROOT/evals/fixtures/j02_source_omission.json" \
            --evidence-ref fixture://j02_source_omission \
            --expected-validator-sha256 "$J02_SHA" \
            --registration-ref "$REG"
          omission_rc=$?
          set -e

          if [ "$omission_rc" -ne 1 ]; then
            echo "FAIL_J02_SOURCE_OMISSION_NOT_REJECTED: rc=$omission_rc"
            exit 1
          fi

          LF_EXECUTOR_IDENTITY=CI_EXTERNAL_FIXTURE \
          LF_JUDGE_VERSION=v0.8 \
          python "$ROOT/scripts/validate_screen_decomposition_v08.py" --self-test
