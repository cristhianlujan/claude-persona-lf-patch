name: Validate LF Packs

on:
  pull_request:
    branches:
      - main
      - "lf/**"
  push:
    branches:
      - main
      - "lf/**"

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Profile Runtime API test dependencies
        run: python -m pip install --disable-pip-version-check -r services/profile_runtime_api/requirements-dev.in

      - name: Test persistent Profile Runtime API
        env:
          PYTHONPATH: services/profile_runtime_api
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest services/profile_runtime_api/tests

      - name: Validate profile template pack
        run: python profiles/_template/validators/validate_pack.py profiles/_template

      - name: Validate skill template pack
        run: python skills/_template/validators/validate_pack.py skills/_template

      - name: Validate skill creator pack
        run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator

      - name: Validate profile creator pack
        run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator

      - name: Validate learning engine pack
        run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine

      - name: Validate S26 semantic-to-render binding regressions
        run: python sandbox/lf_contract_gate_test/profile_execution_runtime/run_semantic_binding_validator_tests.py

      - name: Build and certify real S26 frozen review bundle
        env:
          S26_C_BASE_SHA: "9632cab4acde619ac7c5b68a3259e31acf5c557d"
          S26_C_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/s26-real"
          python sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_real_bundle_certification_ci.py \
            --out-dir "${RUNNER_TEMP}/s26-real/unpacked" \
            --zip "${RUNNER_TEMP}/s26-real/S26_Run_E_Certified_Review_Bundle.zip" \
            --receipt-out "${RUNNER_TEMP}/s26-real/certification_receipt.json"
          test -s "${RUNNER_TEMP}/s26-real/S26_Run_E_Certified_Review_Bundle.zip"
          test -s "${RUNNER_TEMP}/s26-real/certification_receipt.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "s26-real"
          receipt = json.loads((root / "certification_receipt.json").read_text(encoding="utf-8"))
          metadata = json.loads((root / "unpacked" / "run_metadata.json").read_text(encoding="utf-8"))
          expected_head = os.environ["S26_C_HEAD_SHA"]
          actual_head = metadata.get("head_sha")
          assert actual_head == expected_head, (
              f"FAIL_S26_C_REAL_BUNDLE_HEAD_SHA: expected={expected_head} actual={actual_head}"
          )
          assert receipt["status"] == "PASS", receipt
          assert receipt["fresh_unpack_pass"] is True, receipt
          assert receipt["replay_pass"] is True, receipt
          assert receipt["manifest_reconciled"] is True, receipt
          assert receipt["hashes_verified"] is True, receipt
          assert receipt["cross_run_refs_blocked"] is True, receipt
          print(f"S26_REAL_BUNDLE_CERTIFICATION_PASS head_sha={actual_head}")
          PY

      - name: Upload certified real S26 bundle evidence
        uses: actions/upload-artifact@v4
        with:
          name: s26-c-certified-real-bundle
          path: |
            ${{ runner.temp }}/s26-real/S26_Run_E_Certified_Review_Bundle.zip
            ${{ runner.temp }}/s26-real/certification_receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Validate strict independent receipt-to-bundle binding regressions
        run: python profiles/quality_pack/evals/run_independent_review_bundle_binding_tests.py

      - name: Validate PROFILE_RUNTIME V3 quality and lineage gates
        env:
          LF_PERSISTENT_RUNTIME_SCOPE: ISOLATED_CANDIDATE
          LF_LLAMA_SOURCE_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/test_*.py)
          if (( ${#tests[@]} == 0 )); then
            echo "PROFILE_RUNTIME_V3_TESTS_MISSING"
            exit 1
          fi
          printf 'PROFILE_RUNTIME_V3_TEST_COUNT=%s\n' "${#tests[@]}"
          failures=0
          for test_file in "${tests[@]}"; do
            echo "RUNNING=${test_file}"
            if python "${test_file}"; then
              echo "RESULT=PASS TEST=${test_file}"
            else
              rc=$?
              echo "RESULT=FAIL RC=${rc} TEST=${test_file}"
              failures=$((failures+1))
            fi
          done
          echo "PROFILE_RUNTIME_V3_FAILURE_COUNT=${failures}"
          if (( failures > 0 )); then
            exit 1
          fi
