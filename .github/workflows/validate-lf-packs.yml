name: Validate LF Packs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "lf/**"

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deterministic learning validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2

      - name: Validate profile template pack
        run: python profiles/_template/validators/validate_pack.py profiles/_template

      - name: Validate skill template pack
        run: python skills/_template/validators/validate_pack.py skills/_template

      - name: Validate skill creator pack
        run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator

      - name: Validate profile creator pack
        run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator

      - name: Validate learning engine pack
        run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine

      - name: Validate learning cluster consumer coverage
        run: python sandbox/lf_contract_gate_test/validate_learning_cluster_consumer_coverage_v1.py

      - name: Validate learning READ_ONLY Product Director route
        run: python sandbox/lf_contract_gate_test/validate_product_director_learning_suite_v1.py

      - name: Validate learning READ_ONLY UI Architect route
        run: python sandbox/lf_contract_gate_test/validate_ui_architect_learning_suite_v1.py
