name: Validate LF Packs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "lf/**"]

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python profiles/_template/validators/validate_pack.py profiles/_template
      - run: python skills/_template/validators/validate_pack.py skills/_template
      - run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator
      - run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator
      - run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine
      - name: Validate learning consumer champion benchmark
        run: python sandbox/lf_contract_gate_test/validate_learning_consumer_benchmark.py
      - name: Run learning consumer routing champion challenger
        run: python sandbox/lf_contract_gate_test/run_learning_consumer_routing_benchmark.py

  readback-lf-learning-state:
    name: Read LF learning state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
    steps:
      - name: Final Run31 durable readback
        env:
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST="$SUPABASE_POOLER_HOST" PGPORT=5432 PGUSER="postgres.${SUPABASE_PROJECT_ID}" PGDATABASE=postgres PGSSLMODE=require
          q() { psql -X -v ON_ERROR_STOP=1 -Atqc "$1"; }
          echo "ROUTER=$(q "select jsonb_build_object('action_code',action_code,'operation_code',operation_code,'status',status,'write_allowed',write_allowed) from public.lf_router_action_registry where action_code='KNOWLEDGE_LEARNING_BRIDGE' and operation_code='LEARNING_BRIDGE_KB_CARD_LF' limit 1")"
          echo "RUN31=$(q "select jsonb_build_object('execution_id',execution_id,'status',status,'started_at',started_at,'completed_at',completed_at,'manifest',manifest) from public.lf_operation_execution where execution_id='LF-AUTOLEARN-RUN-20260831-031'")"
          echo "RUN31_EVENTS=$(q "select count(*) from public.lf_eventos where payload->>'execution_id'='LF-AUTOLEARN-RUN-20260831-031'")"
          echo "RUN31_KB_RECEIPTS=$(q "select count(*) from public.lf_eventos where entidad_tipo='KNOWLEDGE' and payload->>'execution_id'='LF-AUTOLEARN-RUN-20260831-031' and payload->>'eligibility'='PASS'")"
          echo "RUN31_BINDING_RECEIPTS=$(q "select count(*) from public.lf_eventos where entidad_tipo='KNOWLEDGE' and payload->>'execution_id'='LF-AUTOLEARN-RUN-20260831-031' and payload->>'consumer_binding_state'='SOURCE_BINDING_CANDIDATE'")"
          echo "RUN31_READY_FOR_BINDING=$(q "select count(*) from public.lf_eventos where entidad_tipo='KNOWLEDGE' and payload->>'execution_id'='LF-AUTOLEARN-RUN-20260831-031' and payload->>'consumer_binding_state'='READY_FOR_BINDING'")"
          echo "RUN31_CLUSTERS=$(q "select coalesce(jsonb_object_agg(cluster_code,n),'{}') from (select payload->>'cluster_code' cluster_code,count(*) n from public.lf_eventos where entidad_tipo='KNOWLEDGE' and payload->>'execution_id'='LF-AUTOLEARN-RUN-20260831-031' group by 1 order by 1) x")"
          echo "DB001=$(q "select jsonb_build_object('frequency',frecuencia,'state',estado,'last_seen',ultima_vez,'evidence',evidencia->'run31_recovery') from public.lf_error_knowledge where codigo='DB-001'")"
          echo "BACKLOG_AFTER=$(q "with p as (select distinct entidad_codigo::uuid kb_id from public.lf_eventos where entidad_tipo='KNOWLEDGE' and payload->>'producer'='LF_APRENDIZAJE_AUTONOMO' and coalesce(payload->>'eligibility','') like '%PASS%'), c as (select distinct (manifest->>'source_kb_id')::uuid kb_id from public.lf_operation_execution where operation_code='CREACION_CARD_LF' and completed_at is not null and status not like 'BLOCKED%' and coalesce(manifest->>'source_kb_id','') <> '') select count(*) from public.lf_knowledge_base k left join p using(kb_id) left join c using(kb_id) where k.kb_category='COMPETENCIA' and k.consumer_ready=true and k.grounding_status='GROUNDED' and k.decision_upstream='ALLOW_PROD_GATE' and p.kb_id is null and c.kb_id is null")"
