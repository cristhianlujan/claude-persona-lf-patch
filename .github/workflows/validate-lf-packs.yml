name: Validate LF Packs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "lf/**"

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate profile template pack
        run: python profiles/_template/validators/validate_pack.py profiles/_template

      - name: Validate skill template pack
        run: python skills/_template/validators/validate_pack.py skills/_template

      - name: Validate skill creator pack
        run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator

      - name: Validate profile creator pack
        run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator

      - name: Validate learning engine pack
        run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine

  invoke-input-governance-rec001:
    name: Invoke governed REC_001 runtime
    if: startsWith(github.ref_name, 'lf/input-gov-rec001-runtime-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

    steps:
      - name: Resolve service role inside runner and invoke Edge runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          project = os.environ["SUPABASE_PROJECT_ID"]
          access_token = os.environ.get("SUPABASE_ACCESS_TOKEN", "").strip()
          if not access_token:
              raise SystemExit("FAIL_SUPABASE_ACCESS_TOKEN_MISSING")

          keys_req = urllib.request.Request(
              f"https://api.supabase.com/v1/projects/{project}/api-keys?reveal=true",
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Accept": "application/json",
                  "User-Agent": "lf-input-governance-rec001-runtime",
              },
          )
          try:
              with urllib.request.urlopen(keys_req, timeout=30) as response:
                  keys = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"FAIL_SUPABASE_API_KEY_READBACK:{type(exc).__name__}") from exc

          records = keys if isinstance(keys, list) else keys.get("keys", []) if isinstance(keys, dict) else []
          service_role = None
          metadata = []
          for item in records:
              if not isinstance(item, dict):
                  continue
              name = str(item.get("name", ""))
              key_type = str(item.get("type", ""))
              metadata.append({"name": name, "type": key_type})
              if name == "service_role":
                  service_role = item.get("api_key") or item.get("key") or item.get("value")
          if not service_role:
              print("AVAILABLE_KEY_METADATA=" + json.dumps(metadata, sort_keys=True))
              raise SystemExit("FAIL_SERVICE_ROLE_KEY_NOT_RESOLVED")

          body = json.dumps({"pantalla_id": 58, "consumer": "STORY_CREATOR"}).encode("utf-8")
          invoke_req = urllib.request.Request(
              f"https://{project}.supabase.co/functions/v1/input-governance-agent-v1",
              data=body,
              method="POST",
              headers={
                  "Authorization": f"Bearer {service_role}",
                  "Content-Type": "application/json",
                  "User-Agent": "lf-input-governance-rec001-runtime",
              },
          )
          try:
              with urllib.request.urlopen(invoke_req, timeout=120) as response:
                  raw = response.read().decode("utf-8")
                  status = response.status
          except urllib.error.HTTPError as exc:
              raw = exc.read().decode("utf-8", errors="replace")
              print("EDGE_HTTP_STATUS=" + str(exc.code))
              print("EDGE_RESPONSE=" + raw)
              raise SystemExit("FAIL_INPUT_GOVERNANCE_EDGE_INVOCATION") from exc

          payload = json.loads(raw) if raw else None
          print("EDGE_HTTP_STATUS=" + str(status))
          print("EDGE_RESPONSE=" + json.dumps(payload, sort_keys=True))
          if status < 200 or status >= 300:
              raise SystemExit("FAIL_INPUT_GOVERNANCE_EDGE_STATUS")
          PY
