name: Validate LF Packs

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "lf/**"

permissions:
  contents: read

jobs:
  validate-lf-packs:
    name: Run LF pack validators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Profile Runtime API test dependencies
        run: python -m pip install --disable-pip-version-check -r services/profile_runtime_api/requirements-dev.in

      - name: Test persistent Profile Runtime API
        env:
          PYTHONPATH: services/profile_runtime_api
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest services/profile_runtime_api/tests

      - name: Validate profile template pack
        run: python profiles/_template/validators/validate_pack.py profiles/_template

      - name: Validate skill template pack
        run: python skills/_template/validators/validate_pack.py skills/_template

      - name: Validate skill creator pack
        run: python skills/skill_creator/validators/validate_pack.py skills/skill_creator

      - name: Validate profile creator pack
        run: python skills/profile_creator/validators/validate_pack.py skills/profile_creator

      - name: Validate learning engine pack
        run: python skills/learning_engine/validators/validate_pack.py skills/learning_engine

      - name: Validate PROFILE_RUNTIME V3 quality and lineage gates
        env:
          LF_PERSISTENT_RUNTIME_SCOPE: ISOLATED_CANDIDATE
          LF_LLAMA_SOURCE_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
        shell: bash
        run: |
          set -uo pipefail
          shopt -s nullglob
          tests=(sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/test_*.py)
          if (( ${#tests[@]} == 0 )); then
            echo "PROFILE_RUNTIME_V3_TESTS_MISSING"
            exit 1
          fi
          printf 'PROFILE_RUNTIME_V3_TEST_COUNT=%s\n' "${#tests[@]}"
          failures=0
          for test_file in "${tests[@]}"; do
            echo "RUNNING=${test_file}"
            if python "${test_file}"; then
              echo "RESULT=PASS TEST=${test_file}"
            else
              rc=$?
              echo "RESULT=FAIL RC=${rc} TEST=${test_file}"
              failures=$((failures+1))
            fi
          done
          echo "PROFILE_RUNTIME_V3_FAILURE_COUNT=${failures}"
          if (( failures > 0 )); then
            exit 1
          fi

  s28-governed-exact-version-canary:
    name: S28 governed exact-version canary
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 565 &&
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'lf/s28-governed-canary-runner-v1-20260907'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LF_CANARY_DIR: sandbox/lf_contract_gate_test/governed_canary_runner_v1
      LF_CANARY_WORK: /tmp/lf-governed-canary-ig006-ig007-v2

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Static fail-closed source and rollback guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(supabase --version)" = "2.116.0"
          python3 -m py_compile \
            "$LF_CANARY_DIR/lf_governed_canary_runner.py" \
            "$LF_CANARY_DIR/input_governance_ig006_ig007_adapter.py" \
            "$LF_CANARY_DIR/input_governance_ig006_ig007_exact_v2_adapter.py" \
            "$LF_CANARY_DIR/input_governance_ig006_ig007_exact_v2_recovery.py"
          python3 "$LF_CANARY_DIR/test_lf_governed_canary_runner.py"
          test "$(git hash-object supabase/migrations/20260907193711_lf_input_governance_ig006_ig007_generic_runner_forward_v1.sql)" = "d806d88176e21bcee1de7545c65e776a6e051899"
          test "$(git hash-object supabase/migrations/20260907193712_lf_input_governance_ig006_ig007_generic_runner_rollback_v1.sql)" = "290ff2e1c50ca7d0bf2167a9f424380450de0c93"
          grep -q "ROLLBACK_PRESTATE_INVALID" "$LF_CANARY_DIR/input_governance_ig006_ig007_exact_v2_adapter.py"
          grep -q "RECOVERY_UNSUPPORTED_STATE" "$LF_CANARY_DIR/input_governance_ig006_ig007_exact_v2_recovery.py"
          grep -q "safety_restore" "$LF_CANARY_DIR/input_governance_ig006_ig007_exact_v2_recovery.py"
          echo "STATIC_GOVERNED_EXACT_VERSION_PASS"

      - name: Execute generic governed runner
        id: generic_runner
        shell: bash
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${LF_SUPABASE_DB_PASSWORD:-}"
          mkdir -p "$LF_CANARY_WORK"
          python3 "$LF_CANARY_DIR/input_governance_ig006_ig007_exact_v2_adapter.py" \
            --phase run --workdir "$LF_CANARY_WORK"

      - name: Independent rollback and recovery finalizer
        if: always()
        shell: bash
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${LF_SUPABASE_DB_PASSWORD:-}"
          mkdir -p "$LF_CANARY_WORK"
          python3 "$LF_CANARY_DIR/input_governance_ig006_ig007_exact_v2_recovery.py" \
            --workdir "$LF_CANARY_WORK"

      - name: Independent final ledger runtime and residue readback
        if: always()
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          PGHOST: aws-1-us-east-1.pooler.supabase.com
          PGPORT: '5432'
          PGUSER: postgres.mhwmirqcgxxukpctffuv
          PGDATABASE: postgres
          PGSSLMODE: require
        run: |
          set -euo pipefail
          test -n "${PGPASSWORD:-}"
          docker run --rm \
            -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE \
            postgres:17.6 psql -X -qAt -v ON_ERROR_STOP=1 -c "
              select json_build_object(
                'forward',(select count(*) from supabase_migrations.schema_migrations where version='20260907193711'),
                'rollback',(select count(*) from supabase_migrations.schema_migrations where version='20260907193712'),
                'candidate_count',(select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='programacion' and p.proname in ('fn_guard_input_family_assessment_insert_baseline_ig007_v1','fn_input_rebind_assertion_cached_v1','fn_input_v58_build_assertions_cached_v1','fn_input_governance_curator_rebind_candidate_v1')),
                'test_residue',(select count(*) from programacion.input_readiness_runs where curator_identity like 'INPUT_CURATOR:EDGE:input-governance-curator-v1:S28IGEXACT_%' or validator_identity like 'INPUT_VALIDATOR:EDGE:input-governance-validator-v1:S28IGEXACT_%'),
                'guard_sha',encode(extensions.digest(convert_to(pg_get_functiondef('programacion.fn_guard_input_family_assessment_insert()'::regprocedure),'UTF8'),'sha256'),'hex'),
                'execute_sha',encode(extensions.digest(convert_to(pg_get_functiondef('programacion.fn_input_governance_execute(integer,text)'::regprocedure),'UTF8'),'sha256'),'hex')
              )::text;" > "$RUNNER_TEMP/final-readback.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'final-readback.json')
          d=json.load(open(p,encoding='utf-8'))
          expected={
            'forward':1,
            'rollback':1,
            'candidate_count':0,
            'test_residue':0,
            'guard_sha':'d000493dce8f7d25139c20c75025a0a0c6dd5041547f6469aecf6d373acad574',
            'execute_sha':'3290e752c27a46a089ed93d9a15769b7b9ca416f00d389c681431fde977da588',
          }
          if d != expected:
            raise SystemExit('FAIL_FINAL_READBACK:'+json.dumps(d,sort_keys=True))
          print('FINAL_LEDGER_RUNTIME_ZERO_RESIDUE_PASS')
          PY

      - name: Publish sanitized canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s28-governed-canary-exact-version-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/lf-governed-canary-ig006-ig007-v2/runner_evidence.json
            /tmp/lf-governed-canary-ig006-ig007-v2/metrics.json
            /tmp/lf-governed-canary-ig006-ig007-v2/post_readback.json
            ${{ runner.temp }}/final-readback.json
