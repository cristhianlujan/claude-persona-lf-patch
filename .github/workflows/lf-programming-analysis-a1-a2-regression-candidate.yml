name: Programming Analysis A1 A2 Candidate Regression
on:
  push:
    branches:
      - agent/programming-analysis-a1-a2-candidate-20261105
    paths:
      - 'skills/programming_analysis/**'
      - 'sandbox/lf_contract_gate_test/programming_agent_four_stage/wave1_boundary_contracts/**'
      - '.github/workflows/lf-programming-analysis-a1-a2-regression-candidate.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'skills/programming_analysis/**'
      - '.github/workflows/lf-programming-analysis-a1-a2-regression-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: programming-analysis-a1-a2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-regression:
    name: Exact-HEAD A1 A2 regression (source-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Python 3.12
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
      - name: Install test-only dependencies
        run: |
          python -m pip install --disable-pip-version-check 'jsonschema==4.23.0' 'coverage==7.6.10'
      - name: Compile current programming analysis sources
        run: |
          python -m compileall -q skills/programming_analysis
      - name: A1 source and semantic unit regressions
        run: |
          python -m coverage run --branch --source=skills/programming_analysis/steps/a1/semantic,skills/programming_analysis/steps/a1/validators,skills/programming_analysis/steps/a1/judges -m unittest discover -s skills/programming_analysis/steps/a1/evals -p 'test_*.py' -v
          python -m coverage report -m
      - name: A2 source, business scope, and A2-A3 handoff regressions
        run: |
          python -m unittest discover -s skills/programming_analysis/steps/a2/evals -p 'test_*.py' -v
      - name: Record exact tested tree
        if: always()
        run: |
          printf 'candidate_ref=%s\nsource_head_sha=%s\n' "${{ github.ref }}" "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
          git status --porcelain
