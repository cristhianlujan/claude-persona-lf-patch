name: LF Contract Check C0 Core Baseline

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/lf-contract-check-c0-core-baseline.yml"
      - "sandbox/lf_contract_gate_test/c0_contract_check/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c0-contract-core-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Demonstrate intrinsic LF contract core baseline
        run: |
          set -euo pipefail
          python sandbox/lf_contract_gate_test/c0_contract_check/contract_check_c0_core_baseline_v2.py

      - name: Read back exact C0 evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path('.lf_gate_diagnostics/lf_contract_check/c0_contract_core/contract_check_c0_core_baseline_v2.json')
          if not path.is_file():
              raise SystemExit('FAIL_C0_CORE_EVIDENCE_MISSING')
          payload = json.loads(path.read_text(encoding='utf-8'))
          if payload.get('capability') != 'LF_CONTRACT_CORE':
              raise SystemExit('FAIL_C0_CORE_CAPABILITY_MISMATCH')
          if payload.get('scope', {}).get('executes_only') != ['validate_contract']:
              raise SystemExit('FAIL_C0_CORE_SCOPE_NOT_ISOLATED')
          excluded = set(payload.get('scope', {}).get('excluded_from_c0_execution', []))
          required_excluded = {
              'router', 'applicability_plan', 'migration_parity', 'validate_lf_packs',
              'db_regression', 'profile_runtime', 'p0', 'assurance', 'supabase_control_plane'
          }
          if not required_excluded.issubset(excluded):
              raise SystemExit('FAIL_C0_CORE_EXTERNAL_SCOPE_LEAK')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f'C0_CONTRACT_CORE_EXACT_READBACK_SHA256={digest}')
          print('C0_CONTRACT_CORE_EXTERNAL_DEPENDENCIES=0')
          PY

      - name: Persist C0 contract-core evidence
        uses: actions/upload-artifact@v4
        with:
          name: lf-contract-check-c0-core-${{ github.event.pull_request.head.sha || github.sha }}
          path: .lf_gate_diagnostics/lf_contract_check/c0_contract_core/contract_check_c0_core_baseline_v2.json
          if-no-files-found: error
          retention-days: 14
