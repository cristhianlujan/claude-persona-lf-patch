name: L24 verifiable owner closure receipt PG18 plus all regressions
on:
  push:
    branches:
      - lf/issue-3779-lote24-closure-receipt-v1
    paths:
      - sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/**
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote11b_mechanical_positive.py
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote14_quality_wrapper.py
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote17_actor_identity_adapter.py
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote18_integrated_cycle.py
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote20_source_sync.py
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote24_closure_receipt.py
      - .github/workflows/l24-closure-receipt-pg18.yml
permissions:
  contents: read
concurrency:
  group: l24-pg18-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres18:
        image: postgres:18
        env:
          POSTGRES_DB: rule_quality_sbx
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rule_quality_sbx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install PG client for test_pg18 scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql --version
      - name: L13 28 regression tests in separate PG18 database
        shell: bash
        run: |
          set -euo pipefail
          ROOT='sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1'
          for src in 01_schema.sql 02_seed_synthetic.sql 03_test_cases.sql 04_birth_expiry_tests.sql; do
            psql -X -v ON_ERROR_STOP=1 -d rule_quality_sbx -f "$ROOT/$src" > "$RUNNER_TEMP/l13_$src.log"
          done
          psql -X -At -v ON_ERROR_STOP=1 -d rule_quality_sbx -c \
            "SELECT jsonb_build_object('tests',count(*),'passes',count(*) FILTER(WHERE status='PASS'),'result',CASE WHEN count(*)=28 AND bool_and(status='PASS') THEN 'SANDBOX_VERIFIED' ELSE 'UNVERIFIED' END)::text FROM rule_quality_l13.sandbox_test_results;" \
            | tee "$RUNNER_TEMP/l13_28_summary.json"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); assert x["tests"]==28 and x["passes"]==28 and x["result"]=="SANDBOX_VERIFIED"' "$RUNNER_TEMP/l13_28_summary.json"
      - name: All existing and new test_pg18_* scripts against isolated PG18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l14_test_logs"
          find sandbox/lf_contract_gate_test -type f -name 'test_pg18_*.py' | sort > "$RUNNER_TEMP/l14_test_inventory.txt"
          : > "$RUNNER_TEMP/l14_test_results.jsonl"
          while IFS= read -r script; do
            log="$RUNNER_TEMP/l14_test_logs/$(basename "$script").log"
            printf 'L14_TEST_START %s\n' "$script"
            # Every legacy test must bootstrap its own clean DB; L4/L4B share names.
            psql -X -At -v ON_ERROR_STOP=1 -d postgres -c \
              "SELECT format('DROP DATABASE IF EXISTS %I WITH (FORCE);',datname)
                 FROM pg_database WHERE datname LIKE 'lf_3779_%';" \
               | psql -X -q -v ON_ERROR_STOP=1 -d postgres
            if timeout 300s python3 "$script" > "$log" 2>&1; then
              status=PASS
            else
              status=FAIL
            fi
            python3 - "$script" "$status" "$log" >> "$RUNNER_TEMP/l14_test_results.jsonl" <<'PY'
          import json,sys,hashlib
          path,status,log=sys.argv[1:]
          raw=open(log,'rb').read()
          print(json.dumps({"path":path,"status":status,"log_sha256":hashlib.sha256(raw).hexdigest(),"log_size":len(raw)}))
          PY
            printf 'L14_TEST_RESULT %s %s\n' "$status" "$script"
            tail -n 4 "$log" || true
          done < "$RUNNER_TEMP/l14_test_inventory.txt"
          python3 - "$RUNNER_TEMP/l14_test_results.jsonl" <<'PY'
          import json,sys
          rows=[json.loads(x) for x in open(sys.argv[1]) if x.strip()]
          fail=[r for r in rows if r["status"]!="PASS"]
          summary={"tested":len(rows),"passed":len(rows)-len(fail),"failed":len(fail),"scripts":rows}
          print("RAW_L14_LEGACY_SUITE_SUMMARY "+json.dumps(summary,sort_keys=True))
          open(sys.argv[1]+".summary.json","w").write(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          assert len(rows)==19 and not fail, "NOT_ALL_PREVIOUS_PG18_TESTS_PASSED"
          PY
      - name: Verify four exact gate MD5 from L14 executable report
        shell: bash
        run: |
          set -euo pipefail
          REPORT=sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/lote14_runtime.json
          cp "$REPORT" "$RUNNER_TEMP/l14_wrapper_runtime.json"
          python3 - "$REPORT" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          frozen={"apply":"86b0494984edf95cf0f9c0a0df67000b",
            "capture_record":"89cbfac4162dbc9f8ecca59f2c3ab4c3",
            "citation_verify":"773a62783baa5edbe967200cac66b8c3",
            "l8_guard":"522d12f0843be1da3c785cef3c0bf3fc"}
          assert data["gate_md5_before"]==frozen==data["gate_md5_after"]
          assert data["case_count"]>=15 and all(x["status"]=="PASS" for x in data["cases"])
          print("L14_MD5_GATE_FROZEN_CONFIRMED")
          print("L14_RUNTIME_CASES",data["case_count"])
          PY
      - name: Verify L17 signed PostgREST identity and 4 frozen gate MD5
        shell: bash
        run: |
          set -euo pipefail
          REPORT=sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/lote17_runtime.json
          cp "$REPORT" "$RUNNER_TEMP/l17_runtime.json"
          python3 - "$REPORT" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1]))
          frozen={"apply":"86b0494984edf95cf0f9c0a0df67000b",
            "capture_record":"89cbfac4162dbc9f8ecca59f2c3ab4c3",
            "citation_verify":"773a62783baa5edbe967200cac66b8c3",
            "l8_guard":"522d12f0843be1da3c785cef3c0bf3fc"}
          assert x["frozen_gate_md5_before"]==x["frozen_gate_md5_after"]==frozen
          assert x["case_count"]>=23 and all(c["status"]=="PASS" for c in x["cases"])
          assert x["native_supabase_auth"] is False and x["native_step70"] is False
          print("L17_ACTOR_ADAPTER_TESTS_OK",x["case_count"])
          print("L17_GATE_MD5_UNCHANGED",json.dumps(frozen,sort_keys=True))
          PY
      - name: Verify L18 integrated 3-scenario stage boards and 6 negatives
        shell: bash
        run: |
          set -euo pipefail
          REPORT=sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/lote18_integrated_runtime.json
          cp "$REPORT" "$RUNNER_TEMP/l18_runtime.json"
          python3 - "$REPORT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          frozen={"apply":"86b0494984edf95cf0f9c0a0df67000b",
           "capture_record":"89cbfac4162dbc9f8ecca59f2c3ab4c3",
           "citation_verify":"773a62783baa5edbe967200cac66b8c3",
           "l8_guard":"522d12f0843be1da3c785cef3c0bf3fc"}
          assert d["gate_md5_before"]==d["gate_md5_after"]==frozen
          stages=["Router","Perfil","RUN","IG","Curator","Validator","Retorno perfil",
                  "Ejecucion","Promocion","VIGENTE","Readback","Cierre"]
          assert len(d["scenarios"])==3
          for scenario in d["scenarios"]:
           board=scenario["board"]
           assert [x["stage"] for x in board]==stages
           assert all(x["status"] in {"REAL_EN_SANDBOX","SINTETICO","NO_PROBADO"} for x in board)
          required={"N1_NO_FAMILY","N2_EXACT_CITATION_1_CHAR_TAMPER",
              "N3_JWT_BAD_SIGNATURE","N4_OWNER_EQUALS_IG_DENIED",
              "N5_SUPER_ADMIN_CANNOT_APPROVE","N6_DIRECT_DML_FORBIDDEN"}
          assert required <= {c["id"] for c in d["cases"]}
          assert all(c["status"]=="PASS" for c in d["cases"])
          assert d["step70_native"] is False and d["profile_run_native"] is False
          assert d["live_supabase_writes"]==0 and d["full_sandbox_scenarios_rollback"]
          print("L18_THREE_SCENARIOS_PASS "+",".join(x["scenario"] for x in d["scenarios"]))
          print("L18_SIX_NEGATIVES_PASS")
          print("L18_STAGE_BOARDS_12_EACH_PASS")
          print("L18_FROZEN_MD5_PASS",json.dumps(frozen,sort_keys=True))
          print("L18_COUNTS",len(d["cases"]))
          PY
      - name: Verify L20 LF/SALY atomic sync and source-column draft reversibility
        shell: bash
        run: |
          set -euo pipefail
          REPORT=sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/lote20_runtime.json
          cp "$REPORT" "$RUNNER_TEMP/l20_runtime.json"
          python3 - "$REPORT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          md5={"apply":"86b0494984edf95cf0f9c0a0df67000b",
             "capture_record":"89cbfac4162dbc9f8ecca59f2c3ab4c3",
             "citation_verify":"773a62783baa5edbe967200cac66b8c3",
             "l8_guard":"522d12f0843be1da3c785cef3c0bf3fc"}
          assert d["gate_md5_before"]==d["gate_md5_after"]==md5
          assert d["global_status"]=="NO_GO_UNVERIFIED"
          assert d["source_sync_atomic"] and d["all_scenarios_rollback"]
          assert d["production_write_count"]==0 and not d["native_owner_or_oidc"]
          assert len(d["scenarios"])==3 and all(s["status"]=="PASS" for s in d["scenarios"])
          required=["N1_NO_OWNER_DECISION","N2_SUPER_ADMIN_JWT",
            "N3_SUCCESSOR_NOT_VIGENTE","N4_FORCED_MID_TRANSACTION_ROLLBACK",
            "N5_DIRECT_SOURCE_DML_DENIED","N6_IDEMPOTENT_SECOND_SYNC_NO_MUTATION",
            "FORCED_FAILURE_ATOMIC_ROLLBACK_READBACK",
            "MIGRATION_DRAFT_UP_DOWN_REVERSIBLE",
            "READ_ONLY_DETECTOR_SEES_DIVERGENCE_BEFORE_SYNC"]
          observed={c["id"] for c in d["cases"] if c["status"]=="PASS"}
          assert set(required) <= observed
          assert all(c["status"]=="PASS" for c in d["cases"])
          print("L20_SANDBOX_CASES_PASS",d["case_count"])
          print("L20_THREE_SCENARIOS_AND_SIX_NEGATIVES_PASS")
          print("L20_MIGRATION_REVERSAL_PASS_AND_LIVE_NO_GO")
          print("L20_FROZEN_GATE_MD5_PASS",json.dumps(md5,sort_keys=True))
          PY
      - name: Verify L24 closure receipts: 3 scenarios, forged identity, append-only and hash tamper
        shell: bash
        run: |
          set -euo pipefail
          REPORT=sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/lote24_runtime.json
          cp "$REPORT" "$RUNNER_TEMP/l24_runtime.json"
          python3 - "$REPORT" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          frozen={"apply":"86b0494984edf95cf0f9c0a0df67000b",
            "capture_record":"89cbfac4162dbc9f8ecca59f2c3ab4c3",
            "citation_verify":"773a62783baa5edbe967200cac66b8c3",
            "l8_guard":"522d12f0843be1da3c785cef3c0bf3fc"}
          assert d["gate_md5_before"]==d["gate_md5_after"]==frozen
          assert d["production"]=="NO_GO_UNVERIFIED"
          assert len(d["scenarios"])==3 and all(x["status"]=="PASS" for x in d["scenarios"])
          assert all(x["receipt"]["status"]=="CLOSED_VERIFIABLE_SANDBOX" for x in d["scenarios"])
          assert all(x["verification"]["status"]=="VERIFIED_CLOSURE_HASH" for x in d["scenarios"])
          stages=["Router","Perfil","RUN","IG","Curator","Validator",
                  "Retorno perfil","Ejecucion","Promocion","VIGENTE","Readback","Cierre"]
          for s in d["scenarios"]:
            assert [x["stage"] for x in s["board"]]==stages
            assert s["board"][-1]["status"]=="REAL_EN_SANDBOX"
            assert s["board"][0]["status"] in ("SINTETICO","NO_PROBADO")
          required={"N1_NO_READBACK_READY","N2_L13_SOURCE_DIVERGENCE",
            "N3_BAD_JWT_SIGNATURE","N3B_MISSING_JWT",
            "N4_SUPER_ADMIN_CANNOT_CLOSE","N5_APP_ROLE_DIRECT_DML_DENIED",
            "N6_APPEND_ONLY_UPDATE","N6_APPEND_ONLY_DELETE",
            "N7_IDEMPOTENT_DUPLICATE_NOOP","N8_HASH_TAMPER_DETECTED",
            "N9_FAIL_MIDWAY_ROLLBACK","N9B_ATOMIC_POST_FAILURE_READBACK"}
          passed={x["id"] for x in d["cases"] if x["status"]=="PASS"}
          assert required <= passed
          assert all(x["status"]=="PASS" for x in d["cases"])
          assert not any(d[k] for k in ("native_supabase_auth","native_step70","native_receiver","independent_judge"))
          assert d["live_supabase_writes"]==0 and d["frozen_gate_edits"]==0
          print("L24_CASE_COUNT",d["case_count"])
          print("L24_3_MECHANICAL_CLOSURES_AND_ADVERSARIAL_TESTS_PASS")
          print("L24_12_STAGE_BOARDS_STRICT_PASS")
          print("L24_FROZEN_MD5",json.dumps(frozen,sort_keys=True))
          PY
      - name: SHA256 sources and scope
        if: always()
        shell: bash
        run: |
          sha256sum sandbox/lf_contract_gate_test/rule_quality_lifecycle_v1/15_l24_verifiable_closure_pg18.sql sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote24_closure_receipt.py sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_lote14_quality_wrapper.py > "$RUNNER_TEMP/l14_source_sha256.txt" || true
          git status --short > "$RUNNER_TEMP/l14_worktree_status.txt"
      - name: Publish actual logs and source hashes including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l24-pg18-evidence
          path: |
            ${{ runner.temp }}/l14_test_logs
            ${{ runner.temp }}/l14_test_inventory.txt
            ${{ runner.temp }}/l14_test_results.jsonl
            ${{ runner.temp }}/l14_test_results.jsonl.summary.json
            ${{ runner.temp }}/l14_wrapper_runtime.json
            ${{ runner.temp }}/l17_runtime.json
            ${{ runner.temp }}/l18_runtime.json
            ${{ runner.temp }}/l20_runtime.json
            ${{ runner.temp }}/l24_runtime.json
            ${{ runner.temp }}/l14_source_sha256.txt
            ${{ runner.temp }}/l13_28_summary.json
            ${{ runner.temp }}/l13_*.log
          if-no-files-found: warn
          retention-days: 14
