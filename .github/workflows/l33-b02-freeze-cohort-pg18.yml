name: L33 B02 G01 frozen 235 PG18 replica
on:
  push:
    branches: [lf/issue-3779-lote33-b02-freeze-asof-pr3803-g01-v1]
    paths:
      - audits/rule-quality-lote33/**
      - sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_l33_freeze_cohort.py
      - .github/workflows/l33-b02-freeze-cohort-pg18.yml
permissions:
  contents: read
concurrency:
  group: l33-b02-freeze-pg18-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-pg18:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      pg18:
        image: postgres:18
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: PostgreSQL 18 client availability
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -X -A -t -v ON_ERROR_STOP=1 -d postgres -c "SHOW server_version;"
      - name: Replay frozen PG17 canonical bytes + membership + negative tests in disposable PG18
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_l33_freeze_cohort.py | tee "$RUNNER_TEMP/l33-pg18.log"
          python3 - <<'PY'
          import json
          p='audits/rule-quality-lote33/06_pg18_execution_result_runtime.json'
          x=json.load(open(p,encoding='utf-8'))
          assert x['frozen']==235
          assert x['pr3803_candidate']==61
          assert x['b02']=='OPEN_PENDING_OPS_SIGNATURE'
          assert x['b03']=='OPEN_PENDING_EFFECTS_AND_LIVENESS'
          assert x['passes']>=12 and all(y['status']=='PASS' for y in x['tests'])
          print('L33_PG18_CI_ASSERT_PASS',x['passes'])
          PY
      - name: Save source and runtime checksums
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/l33"
          cp "$RUNNER_TEMP/l33-pg18.log" "$RUNNER_TEMP/l33/" 2>/dev/null || true
          cp audits/rule-quality-lote33/06_pg18_execution_result_runtime.json "$RUNNER_TEMP/l33/" 2>/dev/null || true
          sha256sum audits/rule-quality-lote33/01_supabase_freeze_snapshot_raw.json audits/rule-quality-lote33/02_cohorte_frozen_ids.csv audits/rule-quality-lote33/03_pr3803_61_candidate_runs.csv audits/rule-quality-lote33/05_reference_cohorts_for_pg18.json sandbox/lf_contract_gate_test/rule_promotion_v1/test_pg18_l33_freeze_cohort.py > "$RUNNER_TEMP/l33/source_sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l33-b02-freeze-cohort-pg18-raw
          path: ${{ runner.temp }}/l33/
          retention-days: 30
          if-no-files-found: warn
