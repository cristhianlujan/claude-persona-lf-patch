name: Platform Adopt LangGraph Spike

on:
  pull_request:
    paths:
      - "sandbox/lf_contract_gate_test/platform_adopt/langgraph_spike_001/**"
      - ".github/workflows/platform-adopt-langgraph-spike.yml"

permissions:
  contents: read

jobs:
  deterministic-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned LangGraph
        run: |
          python -m pip install --disable-pip-version-check "langgraph==1.2.11"
          python -m pip check
      - name: Run StateGraph parity contract
        working-directory: sandbox/lf_contract_gate_test/platform_adopt/langgraph_spike_001
        run: python test_langgraph_profile_spike.py
      - name: Run Functional API parity contract
        working-directory: sandbox/lf_contract_gate_test/platform_adopt/langgraph_spike_001
        run: python test_langgraph_functional_spike.py
      - name: Compare StateGraph and Functional API
        working-directory: sandbox/lf_contract_gate_test/platform_adopt/langgraph_spike_001
        run: python run_benchmark.py
