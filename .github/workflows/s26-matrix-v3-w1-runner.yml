name: S26 Matrix v3 W1 Probe

on:
  push:
    branches:
      - "lf/s26-matrix-v3-w1-runner-20260912"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  w1-probe:
    name: Exact candidate deterministic probe
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      S26_FINAL_CANDIDATE_SHA: 9823681a7174d68b826bcdaac91b038e7fb007a4
      S26_MATRIX_OUT_DIR: .audit-output/s26-matrix-v3-w1
    steps:
      - name: Checkout runner branch with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Initialize evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${S26_MATRIX_OUT_DIR}"
          printf '%s\n' \
            'S26 Matrix v3 W1 deterministic probe' \
            'Scope: evidence-only; no Gate G, Golden, production, Supabase write, model call, or paid fallback.' \
            > "${S26_MATRIX_OUT_DIR}/harness_scope.txt"

      - name: Verify frozen candidate identity
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${S26_FINAL_CANDIDATE_SHA}^{commit}"
          observed="$(git rev-parse "${S26_FINAL_CANDIDATE_SHA}^{commit}")"
          test "$observed" = "$S26_FINAL_CANDIDATE_SHA"
          echo "FINAL_CANDIDATE_SHA=$observed" | tee "${S26_MATRIX_OUT_DIR}/candidate_identity.txt"

      - name: Validate Matrix prebuild contracts
        shell: bash
        run: |
          set -euo pipefail
          matrix_dir="sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/s26_family_objective_matrix_v3"
          (
            cd "$matrix_dir"
            python validate_coverage_inventory.py
            python validate_missing_objectives_plan.py
            python build_w0_execution_recipes.py > "$GITHUB_WORKSPACE/${S26_MATRIX_OUT_DIR}/w0_execution_recipes.json"
          ) 2>&1 | tee "${S26_MATRIX_OUT_DIR}/prebuild_validation.log"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["S26_MATRIX_OUT_DIR"]) / "w0_execution_recipes.json"
          doc = json.loads(path.read_text(encoding="utf-8"))
          assert doc["status"] == "PREBUILD_READY_FINAL_EXECUTION_DISABLED"
          assert doc["recipe_count"] > 0
          assert doc["execution_enabled_count"] == 0
          assert all(r["final_candidate_sha"] is None for r in doc["recipes"])
          print(f"W0_PREBUILD_VALID recipe_count={doc['recipe_count']} execution_enabled_count={doc['execution_enabled_count']}")
          PY

      - name: Execute W1 exact-candidate probe
        shell: bash
        run: |
          set -euo pipefail
          python sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/s26_family_objective_matrix_v3/run_w1_candidate_probe.py

      - name: Execute W1 extension probes
        shell: bash
        run: |
          set -euo pipefail
          python sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/s26_family_objective_matrix_v3/run_w1_extension_probe.py

      - name: Execute remaining W1 probes and aggregate closure
        shell: bash
        run: |
          set -euo pipefail
          python sandbox/lf_contract_gate_test/profile_runtime_structural_context_v3/s26_family_objective_matrix_v3/run_w1_remaining_probe.py

      - name: Upload W1 probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s26-matrix-v3-w1-probe-${{ github.run_id }}
          path: .audit-output/s26-matrix-v3-w1/
          if-no-files-found: error
          retention-days: 14