name: F04 Q11 Source Fidelity Qualification Replay

on:
  push:
    branches:
      - lf/f04-q11-source-fidelity-replay-20261003

permissions:
  contents: read

jobs:
  q11-source-fidelity-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact qualification head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Bind exact Source Fidelity blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "QUALIFICATION_HEAD=$GITHUB_SHA"
          git rev-parse HEAD:sandbox/lf_contract_gate_test/profile_execution_runtime/profile_execution_contract.py
          git rev-parse HEAD:sandbox/lf_contract_gate_test/profile_execution_runtime/run_native_execution_contract_tests.py
      - name: Execute Source Fidelity positive and fail-closed semantic negatives
        shell: bash
        run: |
          set -euo pipefail
          cd sandbox/lf_contract_gate_test/profile_execution_runtime
          python run_native_execution_contract_tests.py
