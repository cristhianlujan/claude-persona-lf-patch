name: LF Operational Executor PostgreSQL RBAC Sandbox
on:
  pull_request:
    paths:
      - 'supabase/migrations/*_lf_operational_executor_lane_v1.sql'
      - 'sandbox/lf_contract_gate_test/operational_executor/test_postgres_principal_rbac_v1.py'
      - 'sandbox/lf_contract_gate_test/operational_executor/test_pg_plpgsql_compile_v1.py'
      - 'sandbox/lf_contract_gate_test/operational_executor/test_pg17_decision_slice_rollback_v1.py'
      - 'sandbox/lf_contract_gate_test/operational_executor/test_upstream_source_dependencies_v1.py'
      - 'sandbox/lf_contract_gate_test/operational_executor/test_baseline_catalog_observation_v1.py'
      - 'sandbox/lf_contract_gate_test/operational_executor/baseline_catalog_observation_v1.json'
      - 'sandbox/lf_contract_gate_test/operational_executor/baseline_catalog_readback_v1.sql'
      - 'sandbox/lf_contract_gate_test/operational_executor/baseline_fk_closure_observation_v1.json'
      - 'sandbox/lf_contract_gate_test/operational_executor/baseline_fk_closure_readback_v1.sql'
      - 'sandbox/lf_contract_gate_test/operational_executor/baseline_extra_fk_catalog_readback_v1.sql'
      - 'sandbox/lf_contract_gate_test/operational_executor/baseline_extra_fk_catalog_observation_v1.json'
      - 'sandbox/lf_contract_gate_test/operational_executor/baseline_trigger_source_observation_v1.json'
      - 'sandbox/lf_contract_gate_test/operational_executor/test_pg17_baseline_16_relation_replay_v1.py'
      - '.github/workflows/lf-operational-executor-postgres-rbac.yml'
permissions:
  contents: read
jobs:
  operational-principal-real-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci_ephemeral_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_ephemeral_test_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare PostgreSQL 17 client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Verify canonical upstream LF source dependency coverage
        run: python3 sandbox/lf_contract_gate_test/operational_executor/test_upstream_source_dependencies_v1.py
      - name: Validate current-scope LF catalog evidence and FK closure
        run: python3 sandbox/lf_contract_gate_test/operational_executor/test_baseline_catalog_observation_v1.py
      - name: Replay LF sixteen-relation FK baseline and rollback in PostgreSQL 17
        run: python3 sandbox/lf_contract_gate_test/operational_executor/test_pg17_baseline_16_relation_replay_v1.py
      - name: Compile exact PLpgSQL bodies and reject corrupted admission
        run: python3 sandbox/lf_contract_gate_test/operational_executor/test_pg_plpgsql_compile_v1.py
      - name: Apply exact LF decision-catalogue slice with rollback
        run: python3 sandbox/lf_contract_gate_test/operational_executor/test_pg17_decision_slice_rollback_v1.py
      - name: Real PostgreSQL principal RBAC negatives and rollback
        run: python3 sandbox/lf_contract_gate_test/operational_executor/test_postgres_principal_rbac_v1.py
