name: Story Agent Evidence Verifier

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/story-agent-evidence-verifier.yml"
      - "supabase/functions/story-agent-evidence-verifier-v1/**"
      - "supabase/migrations/*programacion_agent_task_external_evidence_verifier_v1.sql"
  pull_request:
    paths:
      - ".github/workflows/story-agent-evidence-verifier.yml"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/semantic_mini_judge.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/github_actions_semantic_judge.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_semantic_mini_judge_tests.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_semantic_mini_judge_live_smoke.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/evaluate_profile_strategy_ab.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/runtime_optimization_contract.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/github_actions_batch_queue_worker.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_profile_runtime_optimization_tests.py"
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: read

jobs:
  verify-agent-task-worker-receipt:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request dedicated GitHub OIDC identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('story-agent-evidence-verifier-v1');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify pending HU-HMO-001 worker evidence
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"verify_pending_agent_task_v1","task_id":21}' \
            "https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/story-agent-evidence-verifier-v1" \
            -o verifier-response.json
          python3 - <<'PY'
          import json
          data=json.load(open('verifier-response.json',encoding='utf-8'))
          if data.get('outcome')!='VERIFIED':
              raise SystemExit('FAIL_EXTERNAL_EVIDENCE_VERIFIER: '+json.dumps(data,sort_keys=True))
          probes=data.get('negative_probes') or {}
          required={'wrong_head','wrong_evidence_sha','wrong_source_system','wrong_source_ref','self_verification'}
          if set(k for k,v in probes.items() if v=='PASS') != required:
              raise SystemExit('FAIL_EXTERNAL_EVIDENCE_NEGATIVE_PROBES: '+json.dumps(probes,sort_keys=True))
          result=data.get('result') or {}
          print('PASS_EXTERNAL_EVIDENCE_VERIFIER')
          print('execution_id='+str(result.get('execution_id')))
          print('evidence_id='+str(result.get('evidence_id')))
          print('authority_receipt_id='+str(result.get('authority_receipt_id')))
          print('evidence_verification_id='+str(result.get('evidence_verification_id')))
          PY

  semantic-mini-judge-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run deterministic mini-judge regressions
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_semantic_mini_judge_tests.py

      - name: Build pinned llama.cpp server from source
        env:
          LLAMA_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          git checkout --detach "$LLAMA_COMMIT"
          test "$(git rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build build --config Release -j 4 --target llama-server
          test -x build/bin/llama-server

      - name: Download and verify pinned semantic judge model
        env:
          MODEL_COMMIT: 508edd0afaa66bb9e9f40587acc2184f02daf1f6
          MODEL_SHA256: 9258bf05b12686d097ff3b6b18d968ab393649780aa2b3cd67fec43d50554392
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lf-semantic-model"
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://huggingface.co/ggml-org/Qwen2.5-VL-7B-Instruct-GGUF/resolve/${MODEL_COMMIT}/Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf?download=true" \
            -o "$RUNNER_TEMP/lf-semantic-model/model.gguf"
          echo "${MODEL_SHA256}  $RUNNER_TEMP/lf-semantic-model/model.gguf" | sha256sum -c -

      - name: Run real zero-cost semantic smoke
        env:
          LF_REPOSITORY_VISIBILITY: public
          LF_RUNNER_LABEL: ubuntu-latest
          LF_LLAMA_SOURCE_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
          LF_LLAMA_SERVER_PATH: ${{ runner.temp }}/llama.cpp/build/bin/llama-server
          LF_SEMANTIC_MODEL_PATH: ${{ runner.temp }}/lf-semantic-model/model.gguf
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_semantic_mini_judge_live_smoke.py

  runtime-optimization-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run profile runtime optimization regressions
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_profile_runtime_optimization_tests.py

  run-zero-cost-profile-runtime:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 244 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lf-profile-runtime ')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse opaque request id
        id: request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os,re
          body=os.environ.get('COMMENT_BODY','').strip()
          match=re.fullmatch(r'/lf-profile-runtime ([0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12})',body,re.I)
          if not match:
              raise SystemExit('BLOCK_PROFILE_RUNTIME_COMMENT_FORMAT')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('request_id='+match.group(1).lower()+'\n')
          PY

      - name: Build pinned llama.cpp from source
        env:
          LLAMA_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          git checkout --detach "$LLAMA_COMMIT"
          test "$(git rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build build --config Release -j 4 --target llama-cli
          test -x build/bin/llama-cli

      - name: Download and verify pinned multimodal model
        env:
          MODEL_COMMIT: 5037fcf163dd95d1e41d1974465f0898ed108ca2
          MODEL_SHA256: d02fe9b69ad8cadbbd228e387667af66612c44bed29ffc8eb1e7caf9ac486c12
          MMPROJ_SHA256: 980c9b2f78c04e6cff93d277ada09e768394f112d75db3b4e9dea8a69f9fb904
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lf-model"
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/${MODEL_COMMIT}/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf?download=true" \
            -o "$RUNNER_TEMP/lf-model/model.gguf"
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/${MODEL_COMMIT}/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf?download=true" \
            -o "$RUNNER_TEMP/lf-model/mmproj.gguf"
          echo "${MODEL_SHA256}  $RUNNER_TEMP/lf-model/model.gguf" | sha256sum -c -
          echo "${MMPROJ_SHA256}  $RUNNER_TEMP/lf-model/mmproj.gguf" | sha256sum -c -

      - name: Execute private queued profile request
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
          LF_REPOSITORY_VISIBILITY: public
          LF_RUNNER_LABEL: ubuntu-latest
          LF_LLAMA_SOURCE_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
          LF_LLAMA_CLI_PATH: ${{ runner.temp }}/llama.cpp/build/bin/llama-cli
          LF_MODEL_PATH: ${{ runner.temp }}/lf-model/model.gguf
          LF_MMPROJ_PATH: ${{ runner.temp }}/lf-model/mmproj.gguf
          REQUEST_ID: ${{ steps.request.outputs.request_id }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_zero_cost_runtime_tests.py
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/github_actions_queue_worker.py \
            --request-id "$REQUEST_ID" \
            --comment-id "$COMMENT_ID" \
            --repo-root .

  run-zero-cost-profile-batch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 244 &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/lf-profile-runtime-batch ')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CACHE_NAMESPACE: lf-profile-runtime-v4-20260901
      LLAMA_COMMIT: 925e1179947ea0c0ebfb0032df18af3a729822be
      LLAMA_RELEASE: b7100
      MODEL_CACHE_ID: qwen25-vl-3b-q4km
      MODEL_COMMIT: 5037fcf163dd95d1e41d1974465f0898ed108ca2
      MODEL_SHA256: d02fe9b69ad8cadbbd228e387667af66612c44bed29ffc8eb1e7caf9ac486c12
      MMPROJ_SHA256: 980c9b2f78c04e6cff93d277ada09e768394f112d75db3b4e9dea8a69f9fb904
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Parse opaque batch request ids
        id: request
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os,re
          body=os.environ.get('COMMENT_BODY','').strip()
          prefix='/lf-profile-runtime-batch '
          if not body.startswith(prefix):
              raise SystemExit('BLOCK_PROFILE_RUNTIME_BATCH_COMMENT_FORMAT')
          ids=[x.strip().lower() for x in body[len(prefix):].strip().split(',') if x.strip()]
          pat=re.compile(r'^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$',re.I)
          if not 1 <= len(ids) <= 3 or len(set(ids)) != len(ids) or any(not pat.fullmatch(x) for x in ids):
              raise SystemExit('BLOCK_PROFILE_RUNTIME_BATCH_COMMENT_FORMAT')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              f.write('request_ids='+','.join(ids)+'\n')
          PY

      - name: Record preparation start and toolchain fingerprint
        id: toolchain
        run: |
          set -euo pipefail
          echo "LF_RUNTIME_PREPARE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"
          fp="$( { cmake --version; c++ --version; } | sha256sum | awk '{print $1}')"
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"

      - name: Restore pinned llama.cpp runtime bundle
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lf-cache/llama
          key: ${{ env.CACHE_NAMESPACE }}-llama-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ env.LLAMA_COMMIT }}-${{ env.LLAMA_RELEASE }}

      - name: Build pinned llama.cpp runtime bundle on cache miss
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          rm -rf "$RUNNER_TEMP/llama.cpp" "$RUNNER_TEMP/lf-cache/llama"
          git clone --filter=blob:none https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          cd "$RUNNER_TEMP/llama.cpp"
          git checkout --detach "$LLAMA_COMMIT"
          test "$(git rev-parse HEAD)" = "$LLAMA_COMMIT"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLAMA_CURL=OFF
          cmake --build build --config Release -j 4 --target llama-cli
          mkdir -p "$RUNNER_TEMP/lf-cache/llama/bin"
          cp -a build/bin/. "$RUNNER_TEMP/lf-cache/llama/bin/"
          test -x "$RUNNER_TEMP/lf-cache/llama/bin/llama-cli"
          cli_sha=$(sha256sum "$RUNNER_TEMP/lf-cache/llama/bin/llama-cli" | awk '{print $1}')
          printf 'llama_commit=%s\nllama_release=%s\nllama_cli_sha256=%s\n' "$LLAMA_COMMIT" "$LLAMA_RELEASE" "$cli_sha" > "$RUNNER_TEMP/lf-cache/llama/manifest.txt"
          echo "LF_LLAMA_BUILD_MS=$(( $(date +%s%3N) - start ))" >> "$GITHUB_ENV"

      - name: Verify cached llama.cpp runtime bundle
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/lf-cache/llama/bin/llama-cli"
          test -x "$cli"
          grep -Fx "llama_commit=$LLAMA_COMMIT" "$RUNNER_TEMP/lf-cache/llama/manifest.txt"
          grep -Fx "llama_release=$LLAMA_RELEASE" "$RUNNER_TEMP/lf-cache/llama/manifest.txt"
          expected=$(awk -F= '$1=="llama_cli_sha256"{print $2}' "$RUNNER_TEMP/lf-cache/llama/manifest.txt")
          test "$expected" = "$(sha256sum "$cli" | awk '{print $1}')"
          LD_LIBRARY_PATH="$RUNNER_TEMP/lf-cache/llama/bin" "$cli" --version >/dev/null

      - name: Restore pinned model assets
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lf-cache/model
          key: ${{ env.CACHE_NAMESPACE }}-model-${{ runner.os }}-${{ runner.arch }}-${{ env.MODEL_CACHE_ID }}-${{ env.MODEL_COMMIT }}-${{ env.MODEL_SHA256 }}-${{ env.MMPROJ_SHA256 }}

      - name: Download pinned model on cache miss
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          start=$(date +%s%3N)
          rm -rf "$RUNNER_TEMP/lf-cache/model"
          mkdir -p "$RUNNER_TEMP/lf-cache/model"
          curl -L --fail --retry 3 --retry-delay 2 "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/${MODEL_COMMIT}/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf?download=true" -o "$RUNNER_TEMP/lf-cache/model/model.gguf"
          curl -L --fail --retry 3 --retry-delay 2 "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/${MODEL_COMMIT}/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf?download=true" -o "$RUNNER_TEMP/lf-cache/model/mmproj.gguf"
          echo "LF_MODEL_DOWNLOAD_MS=$(( $(date +%s%3N) - start ))" >> "$GITHUB_ENV"

      - name: Verify assets and expose runtime metrics
        run: |
          set -euo pipefail
          echo "$MODEL_SHA256  $RUNNER_TEMP/lf-cache/model/model.gguf" | sha256sum -c -
          echo "$MMPROJ_SHA256  $RUNNER_TEMP/lf-cache/model/mmproj.gguf" | sha256sum -c -
          ready_ms=$(date +%s%3N)
          echo "LF_RUNTIME_READY_AT=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_ENV"
          echo "LF_RUNTIME_PREPARE_MS=$(( ready_ms - LF_RUNTIME_PREPARE_START_MS ))" >> "$GITHUB_ENV"
          echo "LF_CACHE_HIT_RUNTIME=${{ steps.llama-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"
          echo "LF_CACHE_HIT_MODEL=${{ steps.model-cache.outputs.cache-hit == 'true' }}" >> "$GITHUB_ENV"
          if [ "${{ steps.model-cache.outputs.cache-hit }}" = "true" ]; then echo "LF_MODEL_DOWNLOAD_MS=0" >> "$GITHUB_ENV"; fi
          if [ "${{ steps.llama-cache.outputs.cache-hit }}" = "true" ]; then echo "LF_LLAMA_BUILD_MS=0" >> "$GITHUB_ENV"; fi

      - name: Execute queued profiles on shared prepared runtime
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
          LF_REPOSITORY_VISIBILITY: public
          LF_RUNNER_LABEL: ubuntu-latest
          LF_LLAMA_SOURCE_COMMIT: ${{ env.LLAMA_COMMIT }}
          LF_LLAMA_CLI_PATH: ${{ runner.temp }}/lf-cache/llama/bin/llama-cli
          LF_MODEL_PATH: ${{ runner.temp }}/lf-cache/model/model.gguf
          LF_MMPROJ_PATH: ${{ runner.temp }}/lf-cache/model/mmproj.gguf
          LD_LIBRARY_PATH: ${{ runner.temp }}/lf-cache/llama/bin
          REQUEST_IDS: ${{ steps.request.outputs.request_ids }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/github_actions_batch_queue_worker.py \
            --request-ids "$REQUEST_IDS" \
            --comment-id "$COMMENT_ID" \
            --parallelism 2 \
            --repo-root .

  evaluate-profile-strategy-ab:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 244 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/lf-ab-evaluate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Evaluate synthetic A/B corpus
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/evaluate_profile_strategy_ab.py
