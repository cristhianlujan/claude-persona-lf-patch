name: Story Agent Evidence Verifier

# Historical local-model execution paths were retired by the S26 ZERO_DOWNLOAD cutover.
# Their prior definitions remain available in Git history; this active carrier must not
# build local inference toolchains or acquire model weights.

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/story-agent-evidence-verifier.yml"
      - "supabase/functions/story-agent-evidence-verifier-v1/**"
      - "supabase/migrations/*programacion_agent_task_external_evidence_verifier_v1.sql"
  pull_request:
    paths:
      - ".github/workflows/story-agent-evidence-verifier.yml"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/runtime_optimization_contract.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/github_actions_batch_queue_worker.py"
      - "sandbox/lf_contract_gate_test/profile_execution_runtime/run_profile_runtime_optimization_tests.py"
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write
  issues: read

jobs:
  verify-agent-task-worker-receipt:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request dedicated GitHub OIDC identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('story-agent-evidence-verifier-v1');
            core.setSecret(token);
            core.setOutput('token', token);

      - name: Verify pending HU-HMO-001 worker evidence
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"action":"verify_pending_agent_task_v1","task_id":21}' \
            "https://mhwmirqcgxxukpctffuv.supabase.co/functions/v1/story-agent-evidence-verifier-v1" \
            -o verifier-response.json
          python3 - <<'PY'
          import json
          data=json.load(open('verifier-response.json',encoding='utf-8'))
          if data.get('outcome')!='VERIFIED':
              raise SystemExit('FAIL_EXTERNAL_EVIDENCE_VERIFIER: '+json.dumps(data,sort_keys=True))
          probes=data.get('negative_probes') or {}
          required={'wrong_head','wrong_evidence_sha','wrong_source_system','wrong_source_ref','self_verification'}
          if set(k for k,v in probes.items() if v=='PASS') != required:
              raise SystemExit('FAIL_EXTERNAL_EVIDENCE_NEGATIVE_PROBES: '+json.dumps(probes,sort_keys=True))
          result=data.get('result') or {}
          print('PASS_EXTERNAL_EVIDENCE_VERIFIER')
          print('execution_id='+str(result.get('execution_id')))
          print('evidence_id='+str(result.get('evidence_id')))
          print('authority_receipt_id='+str(result.get('authority_receipt_id')))
          print('evidence_verification_id='+str(result.get('evidence_verification_id')))
          PY

  runtime-optimization-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run profile runtime optimization regressions
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/run_profile_runtime_optimization_tests.py

  evaluate-profile-strategy-ab:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 244 &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == '/lf-ab-evaluate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Evaluate synthetic A/B corpus
        env:
          LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
          SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'psycopg[binary]==3.2.9'
          python3 sandbox/lf_contract_gate_test/profile_execution_runtime/evaluate_profile_strategy_ab.py
