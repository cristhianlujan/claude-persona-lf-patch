name: S26 Strong Authority Canary

on:
  push:
    branches:
      - lf/s26-sandbox-hybrid-semantic-routing-20260905
    paths:
      - '.github/workflows/s26-strong-authority-canary.yml'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_strong_authority_canary.py'
      - 'profiles/ui_architect/**'
      - 'cards/marketplace_lf/decision_product_experience/**'
      - 'adapters/lf_shell_profile_adapter/**'
      - 'services/profile_runtime_api/profile_runtime_api/validation.py'
      - 'services/profile_runtime_api/profile_runtime_api/repository.py'

permissions:
  contents: read

jobs:
  strong-authority-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_PROFILE_RUNTIME_MODEL: gpt-5.6-terra
    steps:
      - name: Checkout exact sandbox branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check -q jsonschema==4.26.0

      - name: Fail closed if provider credential is unavailable
        shell: bash
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo 'BLOCK OPENAI_API_KEY_MISSING'
            exit 2
          fi

      - name: Run one live sandbox semantic canary
        run: python sandbox/lf_contract_gate_test/profile_execution_runtime/run_s26_strong_authority_canary.py

      - name: Upload canary evidence
        if: always() && hashFiles('s26_strong_authority_canary_result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: s26-strong-authority-canary-evidence
          path: s26_strong_authority_canary_result.json
          retention-days: 7
