name: S26 Cloudflare Workers AI read-only preflight

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/s26-cloudflare-workers-ai-readonly-preflight.yml'

permissions:
  contents: read

concurrency:
  group: s26-cloudflare-workers-ai-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify token and Qwen model availability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_MODEL: '@cf/qwen/qwen3-30b-a3b-fp8'
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Verify API token
        shell: bash
        run: |
          set -euo pipefail
          token_json="$(curl --silent --show-error --fail-with-body \
            'https://api.cloudflare.com/client/v4/user/tokens/verify' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          jq -e '.success == true and .result.status == "active"' <<<"${token_json}" >/dev/null
          echo 'Cloudflare API token: ACTIVE'

      - name: Verify Qwen model availability without inference
        shell: bash
        run: |
          set -euo pipefail
          models_json="$(curl --silent --show-error --fail-with-body --get \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/models/search" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-urlencode 'search=qwen3-30b-a3b-fp8' \
            --data-urlencode 'hide_experimental=true' \
            --data-urlencode 'include_deprecated=false')"
          jq -e '.success == true and (.result | length > 0)' <<<"${models_json}" >/dev/null
          model_count="$(jq '.result | length' <<<"${models_json}")"
          echo "Workers AI model search: PASS (${model_count} result(s))"
          echo "Target: ${TARGET_MODEL}"

      - name: Write governed evidence summary
        shell: bash
        run: |
          {
            echo '## S26 Cloudflare Workers AI read-only preflight'
            echo ''
            echo '- Token status: PASS'
            echo '- Model search: PASS'
            echo '- Target: `@cf/qwen/qwen3-30b-a3b-fp8`'
            echo '- Inference executed: NO'
            echo '- Worker deployed: NO'
            echo '- Cloudflare resources modified: NO'
          } >> "${GITHUB_STEP_SUMMARY}"
