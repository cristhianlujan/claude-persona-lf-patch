name: LF Material Currentness

on:
  pull_request:
    paths:
      - 'sandbox/lf_contract_gate_test/material_currentness/**'
      - '.github/workflows/lf-material-currentness.yml'
  workflow_dispatch:
    inputs:
      binding_path:
        description: Repository path to LF_MATERIAL_CURRENTNESS_BINDING_V1 JSON
        required: true
        type: string
  workflow_call:
    inputs:
      binding_path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  regression:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Material-currentness regressions
        run: python -m pytest -q sandbox/lf_contract_gate_test/material_currentness/test_lf_material_currentness_v1.py

  evaluate-current:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve moving authority once
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          echo "current_revision=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"
      - name: Evaluate declared materials offline
        shell: bash
        env:
          BINDING_PATH: ${{ inputs.binding_path }}
          CURRENT_REVISION: ${{ steps.authority.outputs.current_revision }}
        run: |
          set -euo pipefail
          test -f "$BINDING_PATH" || { echo "BLOCK_MATERIAL_CURRENTNESS_BINDING_MISSING=$BINDING_PATH" >&2; exit 2; }
          python sandbox/lf_contract_gate_test/material_currentness/lf_material_currentness_v1.py \
            --repo . \
            --binding "$BINDING_PATH" \
            --current-revision "$CURRENT_REVISION" \
            --output /tmp/lf_material_currentness_receipt.json
          cat /tmp/lf_material_currentness_receipt.json
