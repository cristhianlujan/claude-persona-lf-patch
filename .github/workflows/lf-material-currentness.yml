name: LF Currentness Authority

# PASE repair-window boundary:
# - this workflow remains an explicit/currentness evaluator via workflow_dispatch/workflow_call;
# - it is no longer an independent pull_request entrypoint;
# - its deterministic PR regression sources remain in the repository and may return
#   to automatic execution only through a qualified PASE owner-runner cutover.
on:
  workflow_dispatch:
    inputs:
      binding_path:
        description: Repository path to LF_MATERIAL_CURRENTNESS_BINDING_V1 JSON
        required: true
        type: string
  workflow_call:
    inputs:
      binding_path:
        required: true
        type: string

permissions:
  contents: read

jobs:
  evaluate-current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve moving authority once
        id: authority
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --no-tags
          echo "current_revision=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"
      - name: Evaluate declared materials offline
        shell: bash
        env:
          BINDING_PATH: ${{ inputs.binding_path }}
          CURRENT_REVISION: ${{ steps.authority.outputs.current_revision }}
        run: |
          set -euo pipefail
          test -f "$BINDING_PATH" || { echo "BLOCK_MATERIAL_CURRENTNESS_BINDING_MISSING=$BINDING_PATH" >&2; exit 2; }
          python sandbox/lf_contract_gate_test/material_currentness/lf_currentness_authority_v1.py \
            --repo . \
            --binding "$BINDING_PATH" \
            --current-revision "$CURRENT_REVISION" \
            --output /tmp/lf_currentness_authority_receipt.json
          cat /tmp/lf_currentness_authority_receipt.json
      - name: Attest resolved authority once for offline reuse
        shell: bash
        env:
          BINDING_PATH: ${{ inputs.binding_path }}
          CURRENT_REVISION: ${{ steps.authority.outputs.current_revision }}
        run: |
          set -euo pipefail
          python sandbox/lf_contract_gate_test/material_currentness/lf_source_attestation_v1.py create \
            --repo . \
            --repo-identity github://cristhianlujan/claude-persona-lf-patch \
            --authority-ref refs/heads/main \
            --resolved-revision "$CURRENT_REVISION" \
            --binding "$BINDING_PATH" \
            --output /tmp/lf_source_attestation.json
          python sandbox/lf_contract_gate_test/material_currentness/lf_source_attestation_v1.py verify \
            --repo . \
            --receipt /tmp/lf_source_attestation.json \
            --expected-repo-identity github://cristhianlujan/claude-persona-lf-patch \
            --expected-authority-ref refs/heads/main \
            --binding "$BINDING_PATH"
