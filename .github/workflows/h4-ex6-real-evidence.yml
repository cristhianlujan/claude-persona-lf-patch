name: LF H4 EX6 Real Evidence (advisory)
on:
  pull_request:
    paths:
      - "sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/**"
      - ".github/workflows/h4-ex6-real-evidence.yml"
permissions:
  contents: read
jobs:
  ex6-real-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout untrusted PR code without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify EX6 original immutable ZIP evidence and negative cases
        run: |
          python3 -m unittest discover \
            -s sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tests \
            -p "test_ex6_evidence_v1.py" -v
      - name: Print strictly source-only EX6 identity matrix
        run: |
          python3 sandbox/lf_contract_gate_test/programming_agent_four_stage/ex6_real_chain_candidate/tools/ex6_real_world_v1.py
