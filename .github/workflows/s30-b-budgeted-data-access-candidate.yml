name: S30-B Budgeted Data Access Candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - "sandbox/lf_contract_gate_test/s30_data_access_candidate/data_access_registry_v2.json"
      - "sandbox/lf_contract_gate_test/s30_data_access_candidate/lf_data_access.py"
      - "sandbox/lf_contract_gate_test/s30_data_access_candidate/test_s30_data_access_v2.py"
      - "sandbox/lf_contract_gate_test/s30_data_access_candidate/data_access_budget_profiles_v1.json"
      - "sandbox/lf_contract_gate_test/s30_data_access_candidate/lf_data_access_budgeted.py"
      - "sandbox/lf_contract_gate_test/s30_data_access_candidate/test_s30_data_access_budget_v1.py"
      - ".github/workflows/s30-b-budgeted-data-access-candidate.yml"

permissions:
  contents: read

jobs:
  bounded-data-access:
    name: S30-B bounded data access regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Preserve S30-B v2 denominator
        run: python sandbox/lf_contract_gate_test/s30_data_access_candidate/test_s30_data_access_v2.py

      - name: Enforce bounded-read hardening
        run: python sandbox/lf_contract_gate_test/s30_data_access_candidate/test_s30_data_access_budget_v1.py
