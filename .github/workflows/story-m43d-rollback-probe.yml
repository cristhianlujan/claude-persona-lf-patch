name: Story M4.3D Rollback Probe

on:
  push:
    branches:
      - story-m43d-rollback-probe-20261003
    paths:
      - ".github/workflows/story-m43d-rollback-probe.yml"
      - "sandbox/lf_contract_gate_test/transversal_assets/independent_assurance/story_m43d_rollback_probe_v1.sql"

permissions:
  contents: read

jobs:
  rollback-requalification-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LF_SUPABASE_DB_PASSWORD: ${{ secrets.LF_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: mhwmirqcgxxukpctffuv
      SUPABASE_POOLER_HOST: aws-1-us-east-1.pooler.supabase.com
      EXPECTED_MAIN_SHA: fc1415c664fae0d50de74d6f4b1af955826cebd5
      SOURCE_BASE_SHA: b345ce4f3d5e4a695dec3a97d388491128e6bda7
      SOURCE_HEAD_SHA: 653383ac9eaa5595ef42d1e802a0c3421064ad04
      MIGRATION_1_SHA256: 2a6e39d9ba3a18dbe3ffa82777796097d6d90a7bb7ab36a9320e551e4e7f2220
      MIGRATION_2_SHA256: a35c9e9f1266cd2b97f6c0034d7cccb2d5b97a6c2f7a824e3a03d3d4c159776e
    steps:
      - name: Checkout probe carrier branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail closed on source currentness and preserve probe
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_MAIN_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$CURRENT_MAIN_SHA" = "$EXPECTED_MAIN_SHA" || { echo "BLOCK_SC_M43D_MAIN_DRIFT expected=$EXPECTED_MAIN_SHA actual=$CURRENT_MAIN_SHA"; exit 2; }
          cp sandbox/lf_contract_gate_test/transversal_assets/independent_assurance/story_m43d_rollback_probe_v1.sql /tmp/story_m43d_rollback_probe_v1.sql
          for path in \
            supabase/migrations/20261003213000_operation_requalification_multisubject_scope_v2.sql \
            supabase/migrations/20261003213100_independent_assurance_subject_extension_v2.sql
          do
            main_sha="$(git show "$CURRENT_MAIN_SHA:$path" | sha256sum | awk '{print $1}')"
            source_sha="$(git show "$SOURCE_HEAD_SHA:$path" | sha256sum | awk '{print $1}')"
            test "$main_sha" = "$source_sha" || { echo "BLOCK_SC_M43D_SOURCE_DRIFT path=$path main=$main_sha source=$source_sha"; exit 2; }
            echo "PASS_SC_M43D_SOURCE_CURRENT path=$path sha256=$main_sha"
          done

      - name: Checkout exact source candidate and restore probe-only assertion
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$SOURCE_HEAD_SHA"
          cp /tmp/story_m43d_rollback_probe_v1.sql sandbox/lf_contract_gate_test/transversal_assets/independent_assurance/story_m43d_rollback_probe_v1.sql

      - name: Build exact-source rollback payload
        shell: bash
        run: |
          set -euo pipefail
          python3 sandbox/lf_contract_gate_test/s28_ci_lane_router/run_changed_migrations_rollback_v1.py \
            --repo-root . \
            --base "$SOURCE_BASE_SHA" \
            --head "$SOURCE_HEAD_SHA" \
            --sql-out /tmp/sc-m43d-rollback.sql \
            --manifest-out /tmp/sc-m43d-manifest.json \
            --probe-sql sandbox/lf_contract_gate_test/transversal_assets/independent_assurance/story_m43d_rollback_probe_v1.sql
          python3 - <<'PY'
          import json, os
          m=json.load(open('/tmp/sc-m43d-manifest.json',encoding='utf-8'))
          expected=[
            ('supabase/migrations/20261003213000_operation_requalification_multisubject_scope_v2.sql',os.environ['MIGRATION_1_SHA256']),
            ('supabase/migrations/20261003213100_independent_assurance_subject_extension_v2.sql',os.environ['MIGRATION_2_SHA256']),
          ]
          got=[(r['path'],r.get('sha256')) for r in m.get('migrations',[])]
          if m.get('status')!='READY' or m.get('transaction_escape_scan')!='PASS' or got!=expected:
              raise SystemExit('BLOCK_SC_M43D_EXACT_SOURCE_MANIFEST:'+json.dumps(m,sort_keys=True))
          print('PASS_SC_M43D_EXACT_SOURCE_MANIFEST '+json.dumps(m,sort_keys=True))
          PY

      - name: Inject governed provenance actor in rollback harness only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/sc-m43d-rollback.sql')
          s=p.read_text(encoding='utf-8')
          needle="SET LOCAL lock_timeout = '15s';\n"
          if s.count(needle) != 1:
              raise SystemExit('BLOCK_SC_M43D_HARNESS_INSERTION_POINT_NOT_EXACT')
          actor="""\echo SC_M43D_GOVERNED_ACTOR_BOOTSTRAP_BEGIN
          DO $sc_m43d_actor$
          DECLARE
            r jsonb;
          BEGIN
            r:=public.fn_lf_operation_reserve_execution_v1(
              'CHATGPT-T-INDEP-PAULO-035-20261002',
              'REVISION_INDEPENDIENTE_ESTRATEGIA_LF',
              'OPERATION',
              'REVISION_INDEPENDIENTE_ESTRATEGIA_LF',
              'ci:t-indep:paulo-035:actor-bootstrap:exact-source:20261004',
              'a35c9e9f1266cd2b97f6c0034d7cccb2d5b97a6c2f7a824e3a03d3d4c159776e',
              'CHATGPT-T-INDEP-PAULO-035-20261002',
              null,
              'supabase/migrations/20261003213100_independent_assurance_subject_extension_v2.sql',
              jsonb_build_object(
                'mode','T_INDEP_MIGRATION_GOVERNED_ACTOR',
                'ci_candidate_rollback_actor',true,
                'exact_source_migrations',true,
                'runtime_activation',false,
                'production_activation',false,
                'promotion_authorized',false
              )
            );
            IF r->>'result' NOT IN ('RESERVED_NEW_EXECUTION','REPLAY_EXISTING_EXECUTION') THEN
              RAISE EXCEPTION 'BLOCK_SC_M43D_HARNESS_ACTOR_BOOTSTRAP:%',r;
            END IF;
          END
          $sc_m43d_actor$;
          \echo PASS_SC_M43D_GOVERNED_ACTOR_BOOTSTRAP
          """
          p.write_text(s.replace(needle,needle+actor,1),encoding='utf-8')
          print('PASS_SC_M43D_HARNESS_ONLY_ACTOR_INJECTED')
          PY

      - name: Capture baseline effect manifest
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST="$SUPABASE_POOLER_HOST" PGPORT=5432 PGUSER="postgres.$SUPABASE_PROJECT_ID" PGPASSWORD="$LF_SUPABASE_DB_PASSWORD" PGDATABASE=postgres PGSSLMODE=require
          psql -X -At -v ON_ERROR_STOP=1 <<'SQL' > /tmp/sc-m43d-before.json
          select jsonb_build_object(
            'current',(select to_jsonb(c) from public.lf_capability_current c where capability_code='INDEPENDENT_ASSURANCE'),
            'v2_count',(select count(*) from public.lf_capability_version_registry where capability_code='INDEPENDENT_ASSURANCE' and version='2.0.0'),
            'operation',(select jsonb_build_object('applies_to_asset_type',applies_to_asset_type,'revision_sha256',public.lf_operation_revision_sha256_v1(operation_code),'qualification_current',public.lf_qualification_current_v1('OPERATION',operation_code,public.lf_operation_revision_sha256_v1(operation_code))) from public.lf_operation_registry where operation_code='REVISION_INDEPENDIENTE_ESTRATEGIA_LF'),
            'judge_count',(select count(*) from public.lf_operation_judges where operation_code='REVISION_INDEPENDIENTE_ESTRATEGIA_LF' and status='ACTIVE_ENFORCEMENT'),
            'generic_begin_exists',to_regprocedure('public.lf_independent_review_begin_v2(text,text,text,text,text,uuid,text,text,text,uuid,text,text,text,jsonb)') is not null,
            'generic_recorder_exists',to_regprocedure('public.lf_record_independent_review_step_v2(text,text,text,jsonb,text,text)') is not null,
            'source_actor_exec_count',(select count(*) from public.lf_operation_execution where execution_id='CHATGPT-T-INDEP-PAULO-035-20261002'),
            'probe_exec_count',(select count(*) from public.lf_operation_execution where execution_id='SC-M4.3D-ROLLBACK-PROBE-20261003'),
            'probe_event_count',(select count(*) from public.lf_eventos where created_by_execution_id='SC-M4.3D-ROLLBACK-PROBE-20261003' or updated_by_execution_id='SC-M4.3D-ROLLBACK-PROBE-20261003' or payload::text like '%SC-M4.3D-ROLLBACK-PROBE-20261003%'),
            'trigger_digest',(select coalesce(md5(string_agg(n.nspname||'.'||c.relname||':'||t.tgname||':'||pg_get_triggerdef(t.oid),E'\n' order by n.nspname,c.relname,t.tgname)),'') from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname in ('public','private') and c.relname in ('lf_operation_registry','lf_operation_contracts','lf_operation_step_contracts','lf_operation_step_judge_bindings','lf_operation_judges','lf_capability_registry','lf_capability_version_registry','lf_capability_current','lf_operation_execution','lf_operation_execution_steps'))
          );
          SQL
          cat /tmp/sc-m43d-before.json

      - name: Execute exact-source rollback-only probe
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST="$SUPABASE_POOLER_HOST" PGPORT=5432 PGUSER="postgres.$SUPABASE_PROJECT_ID" PGPASSWORD="$LF_SUPABASE_DB_PASSWORD" PGDATABASE=postgres PGSSLMODE=require
          psql -X -v ON_ERROR_STOP=1 -f /tmp/sc-m43d-rollback.sql 2>&1 | tee /tmp/sc-m43d-probe.log
          grep -q 'PASS_SC_M43D_GOVERNED_ACTOR_BOOTSTRAP' /tmp/sc-m43d-probe.log
          grep -q 'BLOCK_T_INDEP_OPERATION_REQUALIFICATION_REQUIRED:76434cd11e53f62f821b34c547091daf0a28c99ef5c51f40f3c267cd90bd1e1' /tmp/sc-m43d-probe.log
          grep -q 'LF_DB_CANDIDATE_ROLLBACK_COMPLETE' /tmp/sc-m43d-probe.log

      - name: Prove exact-source transaction rolled back
        shell: bash
        run: |
          set -euo pipefail
          export PGHOST="$SUPABASE_POOLER_HOST" PGPORT=5432 PGUSER="postgres.$SUPABASE_PROJECT_ID" PGPASSWORD="$LF_SUPABASE_DB_PASSWORD" PGDATABASE=postgres PGSSLMODE=require
          psql -X -At -v ON_ERROR_STOP=1 <<'SQL' > /tmp/sc-m43d-after.json
          select jsonb_build_object(
            'current',(select to_jsonb(c) from public.lf_capability_current c where capability_code='INDEPENDENT_ASSURANCE'),
            'v2_count',(select count(*) from public.lf_capability_version_registry where capability_code='INDEPENDENT_ASSURANCE' and version='2.0.0'),
            'operation',(select jsonb_build_object('applies_to_asset_type',applies_to_asset_type,'revision_sha256',public.lf_operation_revision_sha256_v1(operation_code),'qualification_current',public.lf_qualification_current_v1('OPERATION',operation_code,public.lf_operation_revision_sha256_v1(operation_code))) from public.lf_operation_registry where operation_code='REVISION_INDEPENDIENTE_ESTRATEGIA_LF'),
            'judge_count',(select count(*) from public.lf_operation_judges where operation_code='REVISION_INDEPENDIENTE_ESTRATEGIA_LF' and status='ACTIVE_ENFORCEMENT'),
            'generic_begin_exists',to_regprocedure('public.lf_independent_review_begin_v2(text,text,text,text,text,uuid,text,text,text,uuid,text,text,text,jsonb)') is not null,
            'generic_recorder_exists',to_regprocedure('public.lf_record_independent_review_step_v2(text,text,text,jsonb,text,text)') is not null,
            'source_actor_exec_count',(select count(*) from public.lf_operation_execution where execution_id='CHATGPT-T-INDEP-PAULO-035-20261002'),
            'probe_exec_count',(select count(*) from public.lf_operation_execution where execution_id='SC-M4.3D-ROLLBACK-PROBE-20261003'),
            'probe_event_count',(select count(*) from public.lf_eventos where created_by_execution_id='SC-M4.3D-ROLLBACK-PROBE-20261003' or updated_by_execution_id='SC-M4.3D-ROLLBACK-PROBE-20261003' or payload::text like '%SC-M4.3D-ROLLBACK-PROBE-20261003%'),
            'trigger_digest',(select coalesce(md5(string_agg(n.nspname||'.'||c.relname||':'||t.tgname||':'||pg_get_triggerdef(t.oid),E'\n' order by n.nspname,c.relname,t.tgname)),'') from pg_trigger t join pg_class c on c.oid=t.tgrelid join pg_namespace n on n.oid=c.relnamespace where not t.tgisinternal and n.nspname in ('public','private') and c.relname in ('lf_operation_registry','lf_operation_contracts','lf_operation_step_contracts','lf_operation_step_judge_bindings','lf_operation_judges','lf_capability_registry','lf_capability_version_registry','lf_capability_current','lf_operation_execution','lf_operation_execution_steps'))
          );
          SQL
          cat /tmp/sc-m43d-after.json
          cmp -s /tmp/sc-m43d-before.json /tmp/sc-m43d-after.json || { echo 'BLOCK_SC_M43D_EXACT_SOURCE_ROLLBACK_MATERIAL_DELTA'; diff -u /tmp/sc-m43d-before.json /tmp/sc-m43d-after.json || true; exit 2; }
          echo 'PASS_SC_M43D_EXACT_SOURCE_ZERO_MATERIAL_DELTA'
