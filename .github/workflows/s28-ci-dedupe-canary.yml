name: S28 CI Dedupe Canary

on:
  workflow_dispatch:
  push:
    branches:
      - "lf/**"
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  dedupe-classifier:
    name: s28-ci-dedupe-classifier
    runs-on: ubuntu-latest
    steps:
      - name: Classify same-SHA PR coverage
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -u

          decision="RUN_DEEP"
          reason="NOT_APPLICABLE"
          pr_number=""
          exact_count="0"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            reason="PR_EVENT_AUTHORITATIVE"
          elif [[ "$EVENT_NAME" == "push" && "$REF_NAME" == lf/* ]]; then
            reason="NO_EXACT_OPEN_PR_FAIL_DEEP"
            set +e
            response="$(gh api -X GET \
              "repos/${GH_REPO}/pulls" \
              -f state=open \
              -f base=main \
              -f head="${REPO_OWNER}:${REF_NAME}" \
              -f per_page=100 2>"$RUNNER_TEMP/s28-dedupe-gh.err")"
            api_rc=$?
            set -e

            if [[ "$api_rc" -eq 0 ]]; then
              matches="$(jq -c --arg sha "$HEAD_SHA" '[.[] | select(.head.sha == $sha)]' <<<"$response")"
              exact_count="$(jq -r 'length' <<<"$matches")"
              if [[ "$exact_count" == "1" ]]; then
                decision="SKIP_DUPLICATE_PUSH"
                reason="EXACT_OPEN_PR_COVERS_SHA"
                pr_number="$(jq -r '.[0].number' <<<"$matches")"
              elif [[ "$exact_count" -gt 1 ]]; then
                reason="AMBIGUOUS_EXACT_OPEN_PR_FAIL_DEEP"
              fi
            else
              reason="PR_LOOKUP_FAILED_FAIL_DEEP"
            fi
          elif [[ "$EVENT_NAME" == "push" ]]; then
            reason="NON_LF_PUSH_FAIL_DEEP"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            reason="MANUAL_RUN_DEEP"
          fi

          {
            echo "decision=$decision"
            echo "reason=$reason"
            echo "pr_number=$pr_number"
            echo "exact_count=$exact_count"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Strategy 28 CI duplicate classifier canary"
            echo "- event: \`$EVENT_NAME\`"
            echo "- ref: \`$REF_NAME\`"
            echo "- sha: \`$HEAD_SHA\`"
            echo "- decision: \`$decision\`"
            echo "- reason: \`$reason\`"
            echo "- exact open PR matches: \`$exact_count\`"
            if [[ -n "$pr_number" ]]; then
              echo "- covering PR: \`#$pr_number\`"
            fi
            echo "- fail-safe: any lookup failure/ambiguity => RUN_DEEP"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "S28_DEDUPE decision=$decision reason=$reason exact_count=$exact_count pr=${pr_number:-none}"

      - name: Assert canary safety contract
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DECISION: ${{ steps.classify.outputs.decision }}
          REASON: ${{ steps.classify.outputs.reason }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" && "$DECISION" != "RUN_DEEP" ]]; then
            echo "FAIL_S28_PR_EVENT_MUST_RUN_DEEP"
            exit 1
          fi
          if [[ "$DECISION" == "SKIP_DUPLICATE_PUSH" && "$REASON" != "EXACT_OPEN_PR_COVERS_SHA" ]]; then
            echo "FAIL_S28_SKIP_WITHOUT_EXACT_PR_PROOF"
            exit 1
          fi
          echo "PASS_S28_DEDUPE_SAFETY_CONTRACT"
