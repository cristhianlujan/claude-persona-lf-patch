name: Learning Consumer Read-Only Benchmark

on:
  pull_request:
    paths:
      - 'sandbox/lf_contract_gate_test/learning_consumer_*'
      - 'sandbox/lf_contract_gate_test/learning_read_only_context_*'
      - 'sandbox/lf_contract_gate_test/learning_read_only_consumer_*'
      - 'sandbox/lf_contract_gate_test/learning_context_to_profile_authority_v1.py'
      - 'sandbox/lf_contract_gate_test/validate_learning_context_to_profile_authority_v1.py'
      - 'sandbox/lf_contract_gate_test/validate_learning_read_only_*'
      - '.github/workflows/learning-consumer-read-only-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-read-only-consumer-path:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Exact-head readback
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'pyyaml==6.0.3'
      - name: Validate binding contract and 50-case matrix
        run: python3 sandbox/lf_contract_gate_test/validate_learning_consumer_benchmark.py
      - name: Validate exact-bound context pack v2
        run: python3 sandbox/lf_contract_gate_test/validate_learning_consumer_context_pack_v2.py
      - name: Validate deterministic bounded read-only selector v2
        working-directory: sandbox/lf_contract_gate_test
        run: python3 validate_learning_read_only_context_selector_v2.py
      - name: Validate reusable exact-binding reader CLI
        run: python3 sandbox/lf_contract_gate_test/validate_learning_read_only_context_reader_cli_v1.py
      - name: Validate reader across all exact bindings
        run: python3 sandbox/lf_contract_gate_test/validate_learning_read_only_context_reader_all_bindings_v1.py
      - name: Validate router-bound read-only usage contract
        run: python3 sandbox/lf_contract_gate_test/validate_learning_read_only_consumer_usage_contract_v1.py
      - name: Validate downstream consumer request envelope
        working-directory: sandbox/lf_contract_gate_test
        run: python3 validate_learning_consumer_request_envelope_v1.py
      - name: Validate upstream constraints authority bridge
        working-directory: sandbox/lf_contract_gate_test
        run: python3 validate_learning_context_to_profile_authority_v1.py
      - name: Run champion vs challenger routing benchmark v2
        run: python3 sandbox/lf_contract_gate_test/run_learning_consumer_routing_benchmark_v2.py
