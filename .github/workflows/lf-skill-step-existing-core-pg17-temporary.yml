name: LF skill-step existing-core PG17 temporary isolated test

on:
  pull_request:
    paths:
      - 'supabase/migrations/*lf_skill_update_child_step_existing_core_v1.sql'
      - 'sandbox/lf_contract_gate_test/profile_execution_runtime/fixtures/skill_update_continuation_pg17_*.sql'
      - '.github/workflows/lf-skill-step-existing-core-pg17-temporary.yml'

permissions:
  contents: read

jobs:
  isolated-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Start isolated PostgreSQL 17
        run: |
          docker run -d --name lf-skill-step-pg17 -e POSTGRES_PASSWORD=test-only postgres:17.6
          for i in $(seq 1 40); do
            docker exec lf-skill-step-pg17 pg_isready -U postgres >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1
      - name: Apply exact new SQL and execute adversarial controls
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -name '*_lf_skill_update_child_step_existing_core_v1.sql' > /tmp/newmigration
          test "$(wc -l </tmp/newmigration)" -eq 1
          docker exec -i lf-skill-step-pg17 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < sandbox/lf_contract_gate_test/profile_execution_runtime/fixtures/skill_update_continuation_pg17_fixture.sql
          docker exec -i lf-skill-step-pg17 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$(cat /tmp/newmigration)"
          docker exec -i lf-skill-step-pg17 psql -U postgres -d postgres -v ON_ERROR_STOP=1 < sandbox/lf_contract_gate_test/profile_execution_runtime/fixtures/skill_update_continuation_pg17_assert.sql
