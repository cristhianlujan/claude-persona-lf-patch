judge_id: JUDGE_MARKETPLACE_LF_UX_ADAPTER_V2
assurance_revision: v2
pass_threshold: 22
max_score: 25
criteria:
  authority_preservation:
    weight: 5
    pass_condition: No product, financial, eligibility, payment or UI authority is invented or strengthened.
  marketplace_context_fidelity:
    weight: 5
    pass_condition: The binding preserves the current Marketplace asset, user objective, expected action and supplied constraints/evidence.
  ux_actionability:
    weight: 5
    pass_condition: Frictions and proposed improvements are concrete, prioritized and clearly distinguish canonical facts from proposals.
  invocation_governance:
    weight: 5
    pass_condition: Invocation is Router-bound, exactly once when applied, uses the compact capsule and adds no second model call.
  downstream_safety:
    weight: 5
    pass_condition: Protected constraints, blockers and owner dependencies survive handoff without authority drift.
automatic_fail:
  - direct_or_profile_self_invocation
  - duplicate_or_missing_invocation_evidence
  - unsupported_financial_or_product_claim
  - protected_constraint_loss
  - capsule_budget_exceeded
  - standalone_adapter_model_call
  - runtime_or_production_promotion_claim
