version: v0.1
judge_id: JUDGE_LF_SHELL_PROFILE_ADAPTER
max_score: 25
pass_score: 22
criteria:
  - id: shell_resolution
    score: 5
    require: [screen_module_shell_chain_resolved, shell_version_and_status_bound, canonical_source_refs_present]
  - id: authority_boundaries
    score: 5
    require: [profile_authority_respected, shell_locked_targets_not_executed, missing_material_authority_escalated]
  - id: ui_contract_fidelity
    score: 5
    require: [ui_architect_structured_decisions_preserved, precision_provenance_preserved, router_direct_consistency_preserved]
  - id: downstream_executability
    score: 5
    require: [writable_targets_identified, profile_delta_target_bound, handoff_scope_explicit]
  - id: governance_safety
    score: 5
    require: [no_drive_authority_fallback, no_candidate_to_vigente_promotion, no_runtime_or_production_enablement]
hard_fail:
  - unresolved_shell_marked_bound
  - shell_locked_change_executed
  - invented_token_marked_canonical
  - profile_authority_expanded_by_adapter
  - frontend_invents_product_or_visual_hierarchy
  - direct_router_material_divergence_with_same_context
  - runtime_enabled
  - production_enabled
verdicts:
  pass: PASS_CANDIDATO_READ_ONLY
  repair: RETURN_TO_WORKER
  fail: FAIL_ADAPTER_CONTRACT
  blocked: BLOCKED
